報酬=(1.06/1.04)-1≈1.92%，不能只看名目報酬。\n其他選項：選項2把報酬與通膨相加；選項3忽略名目成長；選項4公式與單位錯誤","source":"貨幣與通膨講義","official":"","concept":"費雪方程近似","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F323","topic":"退休現金流","q":"退休夫妻每月基本支出4.8萬元，固定年金合計3萬元，另有基金每年配息20萬元但配息可能變動。評估退休安全性時，最合理的作法是？","options":["將基金配息視為保證且永遠不變","先估計每月缺口、預留流動資金，並對配息下降與長壽情境壓力測試","只看基金去年殖利率","因有自住房就不需估算醫療費"],"answer":1,"explain":"正解：固定收入與支出差額1.8萬元/月，配息有波動與本金變化風險，須做壓力測試。\n其他選項：選項1把不確定收入當保證；選項3忽略總報酬與風險；選項4忽略醫療及照護","source":"退休規劃與投資","official":"","concept":"現金流缺口+壓力測試","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F324","topic":"理專適合度與風險","q":"75歲客戶需兩年內支付長照費，理專推薦六年期且提前解約成本高的商品，理由是「預期報酬較高」。最關鍵的評估為何？","options":["是否符合客戶資金用途、流動性需求及風險承受能力","理專的銷售排名","商品廣告色彩是否吸引人","只要預期報酬高就可忽略到期限制"],"answer":0,"explain":"正解：適合度評估須對應客戶目標與資金使用期限，不能僅依預期報酬推薦。\n其他選項：選項2是銷售者指標；選項3與適合度無關；選項4忽略提前解約成本","source":"理專十誡與公平待客","official":"","concept":"高齡客戶適合度","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F325","topic":"跨主題決策","q":"一名自由工作者有20萬元預備金、信用卡循環欠款8萬元、下月確定稅款6萬元，朋友推薦高波動加密資產投資。何者最合理？","options":["先保留稅款與必要預備金，評估優先償還高成本債務後再考慮投資","先把20萬元全部投入加密資產以爭取高報酬","稅款可以等投資獲利後再支付","信用卡循環欠款只要按最低應繳就沒有成本"],"answer":0,"explain":"正解：確定義務與高成本債務優先於投機性資產，且自由工作收入不穩更需流動性。\n其他選項：選項2放大短期資金風險；選項3忽略法定支付期限；選項4忽略循環利息","source":"財務規劃與金融科技","official":"","concept":"流動性+高息債+投資風險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F326","topic":"投資與匯率","q":"學生一年後需付美元學費，現有新臺幣存款，考慮把全部換成美元高波動股票基金。哪項分析較周全？","options":["美元資產就一定與美元學費金額同步","區分匯率曝險與股票市場曝險，學費資金宜優先降低到期金額不確定性","股票基金名稱有美元就不會虧損","只看基金配息率即可判斷足夠繳學費"],"answer":1,"explain":"正解：美元計價基金仍有淨值波動；資產幣別匹配不等於消除市場風險。\n其他選項：選項1忽略淨值波動；選項3混淆計價幣別與本金保障；選項4配息不等於總報酬","source":"金融商品分類與投資風險","official":"","concept":"幣別匹配+市場風險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F327","topic":"防詐與數位帳戶","q":"詐騙集團假冒銀行發簡訊稱「帳戶即將凍結」，附網址要求輸入帳密及簡訊驗證碼。學生已點入網址但尚未輸入。哪項最適當？","options":["關閉頁面，改由銀行官方App或自行查得的客服管道確認","在簡訊網址輸入帳密但不輸入驗證碼","轉傳給同學請大家一起測試網址","回覆簡訊要求詐騙者提供工作證"],"answer":0,"explain":"正解：釣魚連結可能仿冒官方網站，應由獨立可信管道核實，不應在可疑頁面輸入憑證。\n其他選項：選項2仍暴露帳密；選項3擴散風險；選項4無法建立可信身分","source":"防詐與數位金融","official":"","concept":"釣魚連結應變","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F328","topic":"資產配置與相關性","q":"市場大跌時，甲組合有三檔同產業股票基金；乙組合含不同資產類別，且各資產風險來源不完全相同。哪個推論最合理？","options":["乙的分散效果可能較佳，但仍不能保證不虧損","甲持有三檔基金必定比乙分散","乙因資產不同而保證正報酬","基金檔數就是風險分散的唯一指標"],"answer":0,"explain":"正解：分散效果取決於資產風險來源與相關性，而非商品數量；市場系統性風險仍存在。\n其他選項：選項2只看數量；選項3把分散誤當保本；選項4忽略相關性","source":"金融商品分類與風險管理","official":"","concept":"相關性與分散","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F329","topic":"保險與退休","q":"退休者已有醫療實支實付保單，但照護機構每月生活照護費不一定屬於住院醫療費用。最適合的評估是？","options":["檢查醫療險理賠範圍，另估算長期照護現金流與相關保障缺口","認定實支實付會支付所有照護費","因已有醫療險就無需準備任何現金","只看保單名稱有「醫療」即可確認理賠"],"answer":0,"explain":"正解：醫療費用補償與長照日常支出性質不同，須以契約條款與實際需求核對。\n其他選項：選項2混淆保障事故與費用；選項3忽略現金需求；選項4忽略條款細節","source":"保險與高齡照護","official":"","concept":"醫療險與長照缺口","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F330","topic":"信託與受益安排","q":"家長為身心障礙成年子女設立信託，希望按月支付生活費並避免一次領走。哪個條款最值得明確約定？","options":["受益給付的金額、用途、條件及受託人報告方式","只寫「將來再討論」而不訂給付原則","由理專個人持有所有金融密碼","完全不指定受益人與財產範圍"],"answer":0,"explain":"正解：明確契約條款才能讓財產管理與受益目的可執行、可查核。\n其他選項：選項2不利執行；選項3增加挪用與安全風險；選項4缺乏必要安排","source":"信託2.0講義","official":"","concept":"受益給付條款","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F331","topic":"貨幣政策與債券","q":"中央銀行升息後，學生觀察到定存新利率上升、手中長天期固定票息債券市價下跌。何者最能同時解釋？","options":["新存款利率與既有債券市價受市場利率變化影響，但方向可能不同","升息必然讓所有金融資產價格同時上漲","債券票息固定表示市價固定","定存利率與債券價格都與利率無關"],"answer":0,"explain":"正解：市場利率上升時新存款條件可能提高；既有固定票息債券折現價值通常下降。\n其他選項：選項2忽略不同資產特性；選項3混淆票息與交易價格；選項4否認利率傳導","source":"中央銀行與金融市場","official":"","concept":"利率傳導","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP001","topic":"貨幣政策與總體金融","q":"景氣連續低迷、失業率升高且物價漲幅溫和。央行希望增加市場流動性，哪個政策組合較一致？","options":["提高存款準備率並賣出債券","降低重貼率並公開市場買入債券","提高重貼率但買入債券","降低重貼率並提高存款準備率"],"answer":1,"explain":"正解：降低重貼率與買入債券均偏向擴張性貨幣政策，有助增加流動性。\n錯誤選項解析：（1）兩者均偏緊縮，方向相反；（3）重貼率與公開市場操作方向互相抵銷；（4）降低重貼率偏寬鬆，但提高準備率偏緊縮。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP002","topic":"貨幣政策與總體金融","q":"物價持續快速上漲，央行決定公開市場賣出政府債券。某銀行財務主管應先預期哪種直接效果？","options":["銀行體系準備金可能減少，短期資金趨緊","銀行準備金因買入債券而增加","銀行放款能力不受任何影響","民眾持有債券的票面利率會自動改寫"],"answer":0,"explain":"正解：央行賣出債券，買方支付資金，銀行體系流動性通常收縮。\n錯誤選項解析：（2）這是央行買入債券時較可能的方向；（3）流動性變動可能影響銀行放款能力；（4）既有債券票面利率不會因交易自動更改。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP003","topic":"貨幣政策與總體金融","q":"小芳持有固定利率、距到期尚久的政府公債，市場預期政策利率上升。她想在到期前賣出，主要須評估什麼？","options":["債券票息將隨市場利率同步上升","既有債券價格可能下跌，且長天期價格較敏感","公債本金必因升息而增加","到期殖利率提高代表她現在賣出一定獲利"],"answer":1,"explain":"正解：固定票息債券與市場利率通常反向變動；存續期間越長通常越敏感。\n錯誤選項解析：（1）固定利率票息依發行條件，不自動上調；（3）市場價格可能跌，非本金自動增加；（4）殖利率上升可能伴隨現價下跌。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP004","topic":"貨幣政策與總體金融","q":"央行降息後，企業想投資擴廠，但經理提醒「降息不等於股價必漲」。哪項理由最完整？","options":["折現率下降一定抵銷營收下滑","股價只取決於政策利率，不受獲利影響","降息可能降低資金成本，但市場也可能反映衰退風險","央行降息後所有企業都能以相同利率借款"],"answer":2,"explain":"正解：股價同時受折現率、企業現金流與市場預期影響。\n錯誤選項解析：（1）營收與獲利下滑仍可能壓低估值；（2）企業獲利及風險溢酬同樣重要；（4）信用風險不同，借款條件也不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP005","topic":"貨幣政策與總體金融","q":"某家庭的房貸採浮動利率，央行啟動緊縮政策。家庭財務規劃最適合採取何種做法？","options":["先檢視利率重訂條款並試算月付金增加幅度","假設每家銀行明天同步調高同一幅度","立即把緊急預備金全數投入股票","認為政策升息只影響新貸款"],"answer":0,"explain":"正解：浮動利率房貸可能依契約與指標利率調整，應做現金流壓力測試。\n錯誤選項解析：（2）調整時點與幅度取決於契約及銀行指標；（3）緊縮時保留緊急預備金更重要；（4）既有浮動利率貸款也可能受影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP006","topic":"貨幣政策與總體金融","q":"出口商報價美元、主要成本以新臺幣支付。若其他因素不變，新臺幣升值，哪項風險最值得優先管理？","options":["同額美元收入換回新臺幣可能減少","同額美元收入換回新臺幣一定增加","出口商原料成本必定全面上升","匯率變動不會影響跨幣別收入"],"answer":0,"explain":"正解：新臺幣升值時，每美元可換得的新臺幣減少，影響未避險的外幣收入。\n錯誤選項解析：（2）方向相反；（3）進口原料成本未必上升，可能下降；（4）不同幣別收支存在換算風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP007","topic":"貨幣政策與總體金融","q":"進口商需三個月後支付美元貨款，央行升息可能支持本幣，但公司不願賭匯率。哪項決策較合理？","options":["只憑升息訊號取消所有避險","依付款時點評估遠期外匯或自然避險","假設匯率只受本國利率決定","借更多美元且不評估匯率曝險"],"answer":1,"explain":"正解：匯率受多種因素影響，企業應依實際幣別現金流管理曝險。\n錯誤選項解析：（1）升息不保證本幣升值；（3）資本流動、外國利率等也影響匯率；（4）擴大外幣負債可能增加曝險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP008","topic":"貨幣政策與總體金融","q":"央行調降存款準備率後，銀行主管說「可放款資金增加，因此信用風險不重要」。應如何評價？","options":["完全正確，準備率可取代徵信","錯誤，準備金約束可能放鬆，但仍須審核還款能力","錯誤，降低準備率必使所有貸款利率上升","完全正確，銀行可無限創造貸款"],"answer":1,"explain":"正解：準備率變動影響流動性約束，不免除授信、資本與風險管理要求。\n錯誤選項解析：（1）準備率不是信用審查替代品；（3）利率變化不具此必然方向；（4）放款仍受資本、流動性與信用風險限制。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP009","topic":"貨幣政策與總體金融","q":"央行擬提高重貼率，某學生主張「這與公開市場賣出債券一樣，都是偏緊縮工具」。哪項判斷最佳？","options":["方向一致，但傳導管道與效果不完全相同","兩者必然使貨幣供給增加","提高重貼率屬擴張，賣債屬緊縮","只有賣債影響利率，重貼率完全無關"],"answer":0,"explain":"正解：提高重貼率與賣債均偏緊縮，但分別經由央行融通成本與市場流動性傳導。\n錯誤選項解析：（2）兩者皆非增加流動性的典型作法；（3）提高重貼率偏緊縮；（4）重貼率變動可能影響資金成本與利率預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP010","topic":"貨幣政策與總體金融","q":"通膨下降但仍高於目標，經濟成長放緩。央行是否應立刻大幅降息？哪種分析最符合決策思維？","options":["只看失業率就能決定","只看最近一個月股價就能決定","同時評估通膨持續性、成長、就業與預期，再權衡風險","通膨只要比上月低就代表物價已下跌"],"answer":2,"explain":"正解：貨幣政策需權衡物價穩定與經濟情勢，通膨下降不等於物價水準下降。\n錯誤選項解析：（1）忽略物價風險；（2）股價不是唯一政策依據；（4）通膨率降低通常是價格漲得較慢。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP011","topic":"貨幣政策與總體金融","q":"某公司持有短期存款與長期固定利率債券。市場利率上升時，哪項比較較合理？","options":["兩者市場價值都會等幅上升","長期固定利率債券通常承受較大的價格波動風險","短期存款必產生與長債相同的資本損失","長債因票息固定所以市價不會改變"],"answer":1,"explain":"正解：長期固定利率債券通常利率敏感度較高；短期存款重訂價及流動性特性不同。\n錯誤選項解析：（1）利率上升通常不利既有固定利率債券市價；（3）存款與債券的價格機制不同；（4）固定票息不代表固定市場價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP012","topic":"貨幣政策與總體金融","q":"政府擴大支出刺激景氣，同期央行升息抑制通膨。學生要分析總體效果，哪個說法較好？","options":["兩種政策方向可能互相拉扯，須看力度與時點","財政政策與貨幣政策一定同向","只要央行升息，政府支出就失去所有效果","政府支出增加代表央行必須同步降息"],"answer":0,"explain":"正解：擴張性財政與緊縮性貨幣政策可能對總需求產生不同方向的影響。\n錯誤選項解析：（2）兩者可採不同方向；（3）影響不會機械式完全抵銷；（4）政策協調不等於必須同步降息。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP013","topic":"貨幣政策與總體金融","q":"銀行調升新臺幣定存利率，退休族想把所有資產改放一年期定存。哪個提醒最適當？","options":["定存名目利率較高就必定超越通膨","應比較稅後實質報酬、流動性與存保額度","利率上升後所有股票都不值得持有","銀行定存與長期債券價格波動完全相同"],"answer":1,"explain":"正解：資產配置須同時考量實質購買力、流動性、分散及存款保障。\n錯誤選項解析：（1）名目利率不等於實質報酬；（3）股票風險報酬不能單憑升息判定；（4）定存與債券的風險特性不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP014","topic":"貨幣政策與總體金融","q":"央行買入公債後，有人說「市場資金增加，企業融資成本必立即下降」。哪個修正較精確？","options":["資金供給可能增加，但貸款利率仍受風險與傳導時滯影響","買債會立即減少銀行準備金","所有企業借款利率依法必相同","公開市場買債只改變票面利率，不影響流動性"],"answer":0,"explain":"正解：公開市場買入債券通常增加流動性，但政策傳導非即時或一致。\n錯誤選項解析：（2）買債一般增加而非減少流動性；（3）信用條件及風險差異造成利率不同；（4）交易影響市場資金與債券價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP015","topic":"貨幣政策與總體金融","q":"臺灣進口能源價格大漲引發物價上升，央行考慮升息。哪個判斷較完整？","options":["升息能立即增加全球能源供給","升息可能抑制需求及通膨預期，但無法直接消除供給衝擊","升息一定讓能源進口量歸零","只要是成本推動通膨，貨幣政策就沒有任何影響"],"answer":1,"explain":"正解：貨幣政策主要影響需求與預期，對供給衝擊本身的處理有限。\n錯誤選項解析：（1）利率工具無法直接創造能源；（3）能源需求不會機械式歸零；（4）政策仍可能影響次輪通膨及預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP016","topic":"貨幣政策與總體金融","q":"某出口公司同時借美元貸款並收美元貨款。新臺幣貶值時，哪項風險判斷最合理？","options":["美元收入與美元負債可能部分自然抵銷匯率曝險","只有美元收入受匯率影響，美元負債不受影響","新臺幣貶值會使美元負債折算新臺幣必然下降","自然避險表示收付款時間差完全不重要"],"answer":0,"explain":"正解：相同幣別的收支可能形成自然避險，但金額與到期日須匹配。\n錯誤選項解析：（2）美元負債折算也受匯率影響；（3）貶值時美元負債折算成本通常增加；（4）期限錯配仍有現金流與匯率風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP017","topic":"貨幣政策與總體金融","q":"升息後，一家高負債企業與一家現金充裕企業的股價反應不同。哪個分析最有說服力？","options":["兩家企業必須同幅下跌","負債結構、利息保障倍數與獲利前景會造成不同影響","企業股價只由央行利率決定","現金多的企業永遠不受景氣衰退影響"],"answer":1,"explain":"正解：利率對企業的影響取決於財務結構、現金流及市場預期。\n錯誤選項解析：（1）不同企業曝險不同；（3）股價同時反映獲利與風險；（4）景氣下滑仍可能影響現金充裕企業。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP018","topic":"貨幣政策與總體金融","q":"央行宣布維持利率不變，市場債券殖利率卻上升。哪項解釋較合理？","options":["市場利率只能與政策利率完全同步","債券殖利率還受未來政策預期、通膨與期限溢酬影響","殖利率上升代表央行一定偷偷升息","政策利率不變，債券價格就不能變動"],"answer":1,"explain":"正解：市場殖利率反映預期與風險溢酬，並非只由當期政策利率決定。\n錯誤選項解析：（1）兩者非完全同步；（3）市場變動不等於央行改變政策利率；（4）市場價格會隨預期與供需變動。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP019","topic":"貨幣政策與總體金融","q":"央行緊縮時，學生想用「本幣一定升值、出口一定減少」預測貿易順差。老師應如何修正？","options":["保留方向性推論，但強調外國景氣、供應鏈與匯率預期也會影響結果","只要升息，順差一定歸零","緊縮政策不可能影響匯率","貿易收支只看進口，不必看出口"],"answer":0,"explain":"正解：講義提供典型傳導方向，但匯率與貿易收支結果取決於多重因素。\n錯誤選項解析：（2）順差不會機械式歸零；（3）利差可能影響資金流動與匯率；（4）貿易收支同時受出口與進口影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP020","topic":"貨幣政策與總體金融","q":"家庭同時持有房貸、債券ETF與緊急預備金。預期進入升息循環，哪個綜合行動最合理？","options":["評估房貸重訂價風險、債券存續期間並維持足夠現金","因債券ETF有配息，就忽略淨值波動","將全部緊急預備金用來加碼長天期債券ETF","認為升息對浮動房貸與債券ETF影響必相同"],"answer":0,"explain":"正解：升息對負債現金流與固定收益資產價格的影響不同，應分別衡量。\n錯誤選項解析：（2）配息不等於沒有價格風險；（3）動用全部備用金會提高流動性風險；（4）兩種商品的利率傳導與風險不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX001","topic":"貸款與信用","q":"阿翰要借20萬元，甲銀行名目利率3.2%但收開辦費，乙銀行利率3.6%免開辦費；兩者還款期間相同。應優先取得哪項資料才能公平比較？","options":["兩案的總費用年百分率與還款明細","兩案的廣告名目利率排名","兩案的核貸速度與分行數","兩案的銀行資本額"],"answer":0,"explain":"選項（1）：APR將利息與相關費用按規定納入比較，並須核對還款條件。\n選項（2）：名目利率忽略開辦費，可能低估實際成本。\n選項（3）：核貸速度是便利性，不是完整借貸成本。\n選項（4）：銀行資本額不直接決定這兩筆貸款的總成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX002","topic":"貸款與信用","q":"小恩有兩張循環信用卡，利率較高的卡片欠款8萬元、利率較低的欠款3萬元，且兩卡均未逾期。若有額外1萬元可還款，何者較能減少後續利息？","options":["先平均分給兩張卡","優先償還利率較高的卡片本金","優先還餘額較小的卡片不看利率","只繳兩張卡最低應繳金額"],"answer":1,"explain":"選項（1）：平均分配可能讓高利率餘額保留較久。\n選項（2）：在其他條件相同時，優先降低高利率本金通常節省較多利息。\n選項（3）：餘額大小與節省利息不必然一致。\n選項（4）：最低應繳通常無法有效減少循環利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX003","topic":"貸款與信用","q":"一筆浮動利率房貸約定每季重訂價，央行今天宣布升息，但借款人下週才收到帳單。哪個判斷最恰當？","options":["下一期帳單一定立刻增加相同幅度","央行升息後房貸契約自動變固定利率","應確認指標利率、加碼與重訂價日","只要銀行未通知就不會改變"],"answer":2,"explain":"選項（1）：是否立即調整取決於契約與重訂價日。\n選項（2）：升息不會自動改變貸款的固定或浮動性質。\n選項（3）：契約指標及調整時點才是判斷實際月付變動的關鍵。\n選項（4）：通知義務與實際計息條件須依契約和法規判斷。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX004","topic":"貸款與信用","q":"一位學生取得低利就學貸款，同時手上有僅供生活緊急支出的3萬元。畢業前想提前還款，哪個思考最完整？","options":["先查是否有提前還款限制，再比較利息節省與緊急預備金需求","只要利率低就永遠不應提前還款","把全部生活預備金一次還清","先用信用卡預借現金償還就學貸款"],"answer":0,"explain":"選項（1）：需同時衡量契約、利息與現金流風險。\n選項（2）：低利率不代表提前還款在任何情境都不適合。\n選項（3）：清空緊急預備金可能導致更高成本的臨時借款。\n選項（4）：預借現金常伴隨較高費用與利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX005","topic":"貸款與信用","q":"房貸寬限期剩兩個月，小婷每月收入固定，卻把目前只繳利息的金額當作未來月付。最該先做什麼？","options":["等寬限期結束再看銀行帳單","假設本金會自動減少","只用目前利息支出編列未來預算","試算開始攤還本金後的月付並預留現金流"],"answer":3,"explain":"選項（1）：延後評估可能錯失調整支出的時間。\n選項（2）：只繳利息時本金通常不會因時間經過而減少。\n選項（3）：目前月付低估未來本息攤還負擔。\n選項（4）：寬限期後本息攤還通常增加月付，應先試算。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX006","topic":"貸款與信用","q":"小豪信用卡額度10萬元，刷卡7萬元後決定只繳最低應繳；下個月又要申請車貸。哪項風險評估較完整？","options":["只要沒遲繳，負債就不影響任何審核","循環餘額與負債比可能影響授信評估","信用卡額度高代表收入一定高","最低應繳金額就是全部借款成本"],"answer":1,"explain":"選項（1）：未逾期不代表授信機構不考量既有負債。\n選項（2）：既有負債及還款能力可能列入信用審核。\n選項（3）：額度由多種因素決定，不能直接等同收入。\n選項（4）：最低應繳不等於剩餘本金與全部利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX007","topic":"貸款與信用","q":"某分期購物標榜「零利率」，但必須支付不可退還的服務費1,500元。購物者如何判斷是否划算？","options":["只比較每月分期金額","把服務費當成商品折扣","比較含服務費的總支付與其他付款方式","只看是否有銀行合作"],"answer":2,"explain":"選項（1）：月付低不代表總支付較低。\n選項（2）：服務費是成本而非折扣。\n選項（3）：零名目利率仍可能存在費用，須比較總成本。\n選項（4）：合作銀行並不保證該方案最便宜。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX008","topic":"投資與風險","q":"同樣投資10萬元，甲ETF集中單一科技產業，乙ETF涵蓋多個產業。小君已有大量科技公司股票，哪項配置考量較合理？","options":["只比較哪檔去年漲幅高","因甲持股數多就一定較分散","乙ETF名稱有大盤就不需看持股","檢查與既有部位的產業重疊及集中風險"],"answer":3,"explain":"選項（1）：歷史漲幅無法反映整體資產重疊。\n選項（2）：多檔同產業股票仍可能高度相關。\n選項（3）：ETF名稱不替代實際持股分析。\n選項（4）：應從整體投資組合檢查集中度。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX009","topic":"投資與風險","q":"債券基金配息率5%，但今年淨值下跌8%。投資人想知道是否真的賺錢，應如何評估？","options":["將配息與淨值變動一起納入總報酬","配息率5%即表示全年報酬5%","只看收到的現金不看本金","因債券基金配息就排除價格風險"],"answer":0,"explain":"選項（1）：總報酬需同時計入價格變化與現金分配。\n選項（2）：配息率不等於總報酬率。\n選項（3）：忽略淨值可能高估收益。\n選項（4）：債券基金仍受利率與信用風險影響。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX010","topic":"投資與風險","q":"甲股票報酬率預估12%但可能大幅虧損；乙定存利率2%且有適用的存保保障。半年後必須支付學費的資金應如何安排？","options":["全押甲股票以提高期望報酬","以保本與到期流動性為主要考量","把學費借出去換更高利息","只看預期報酬率不看用途"],"answer":1,"explain":"選項（1）：短期必需支出不宜承擔無法承受的價格波動。\n選項（2）：資金用途與使用期限優先於追求高報酬。\n選項（3）：私人借貸可能增加違約與流動性風險。\n選項（4）：預期報酬不能取代期限與風險評估。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX011","topic":"投資與風險","q":"一檔海外債券ETF以美元計價，債券價格上漲3%，但新臺幣同期明顯升值。以新臺幣計價的報酬可能如何？","options":["必然至少上漲3%","只與美國政策利率有關","可能因匯率換算而低於3%甚至虧損","只要有配息就不受匯率影響"],"answer":2,"explain":"選項（1）：本幣升值會影響外幣資產換算價值。\n選項（2）：利率只是債券報酬的其中一項因素。\n選項（3）：外幣報酬須加計匯率變動，可能抵銷價格收益。\n選項（4）：配息不會消除匯率風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX012","topic":"投資與風險","q":"某股票價格100元，投資人買入後漲到105元，想計算實際獲利。最完整的計算應考慮什麼？","options":["只用5元乘股數","買進手續費即可","賣出證交稅即可","買賣手續費、賣出證交稅及其他適用成本"],"answer":3,"explain":"選項（1）：價差尚未扣除交易成本。\n選項（2）：賣出時仍可能有手續費與稅。\n選項（3）：買進也有手續費等成本。\n選項（4）：完整損益應扣除買賣相關成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX013","topic":"投資與風險","q":"小琪將退休金全部買入長天期公債ETF，理由是「公債違約風險低」。她忽略了哪個主要風險？","options":["利率上升可能使長天期債券價格波動較大","公債ETF一定沒有任何現金流","長天期債券一定比短天期流動性差","公債不可能受到市場價格影響"],"answer":0,"explain":"選項（1）：低信用風險不等於低利率風險，存續期間愈長通常愈敏感。\n選項（2）：ETF可能有配息或資本利得。\n選項（3）：流動性需看實際市場條件，非單由天期決定。\n選項（4）：債券市場價格會隨利率等因素變動。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX014","topic":"投資與風險","q":"同一檔基金有A類型前收手續費與B類型遞延銷售費，投資人預計持有時間不確定。如何比較較合理？","options":["只比較申購當天扣款","估算不同持有期間的總費用與贖回條件","只看基金經理人照片","只看哪類型配息頻率高"],"answer":1,"explain":"選項（1）：前端費用無法代表整段期間成本。\n選項（2）：持有期間與贖回時點會影響總成本。\n選項（3）：經理人照片與費用比較無關。\n選項（4）：配息頻率不能替代費用結構。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX015","topic":"保險與保障","q":"小瑄已有住院實支實付醫療險，想替家人再買同類商品。她最應先核對什麼？","options":["保險公司廣告代言人","只比較每年保費","理賠限額、除外責任、給付方式及重複投保規範","只看保單封面保障名稱"],"answer":2,"explain":"選項（1）：代言資訊不代表保障內容。\n選項（2）：保費須與條款及保障內容一起比較。\n選項（3）：實際可理賠範圍與多張保單給付規則最重要。\n選項（4）：商品名稱不足以確認給付細節。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX016","topic":"保險與保障","q":"阿志購買重大疾病險後一個月發現健康異常，想確認是否符合給付。哪個處理最恰當？","options":["直接認定保險公司一定要賠","只詢問親友經驗","只看業務員口頭保證","檢視疾病定義、等待期、告知義務及保單生效條件"],"answer":3,"explain":"選項（1）：是否給付須依契約與事實判斷。\n選項（2）：他人個案不一定適用同一條款。\n選項（3）：口頭說明不應取代正式保單條款。\n選項（4）：等待期與承保條件可能影響給付。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX017","topic":"保險與保障","q":"家庭主要收入者有房貸、扶養子女與年邁父母，預算有限。評估壽險保額時應優先採何種方法？","options":["估算家庭未來支出、負債及現有資產保障缺口","直接買同事相同保額","只以年齡決定保額","將保額等同每月保費的十倍"],"answer":0,"explain":"選項（1）：需求分析可將扶養責任與負債納入。\n選項（2）：同事家庭責任可能不同。\n選項（3）：年齡不能單獨反映保障需求。\n選項（4）：保費與保額並無固定十倍關係。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX018","topic":"保險與保障","q":"車禍造成對方車輛損壞及對方受傷，車主只投保強制汽車責任保險。哪項理解最恰當？","options":["強制險會賠償全部車損","強制險主要提供法定人身傷害保障，財物損失須另評估","強制險只賠自己的車損","有強制險就不用考慮民事責任"],"answer":1,"explain":"選項（1）：強制險不涵蓋一般車輛財損賠償。\n選項（2）：強制險著重事故受害人法定人身給付。\n選項（3）：自己的車損通常非強制險保障項目。\n選項（4）：保險給付不必然免除全部民事責任。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX019","topic":"保險與保障","q":"小玲投保醫療險時曾有醫師診斷紀錄，但覺得已痊癒而不填要保書相關問題。最大風險是什麼？","options":["投保後所有疾病都不理賠","保險費會自動變兩倍","未依書面詢問據實告知可能衍生契約爭議","只要有醫療紀錄就無法投保"],"answer":2,"explain":"選項（1）：保障範圍須依具體契約與法律判斷。\n選項（2）：保費不會因隱匿資訊自動按固定倍數變動。\n選項（3）：告知義務應依要保書詢問及法律規定履行。\n選項（4）：有醫療紀錄不等於必然無法承保。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX020","topic":"保險與保障","q":"一位退休者考慮利率變動型年金保險，業務員展示較高宣告利率。哪個判斷較妥當？","options":["宣告利率可保證整個退休期間","宣告利率等同銀行定存利率","只比較當月宣告利率","確認保證條件、宣告利率調整機制及費用"],"answer":3,"explain":"選項（1）：宣告利率可能隨契約機制調整。\n選項（2）：年金保險與存款的保障及成本不同。\n選項（3）：單期利率不能代表長期收益。\n選項（4）：須區分保證與非保證部分及相關費用。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX021","topic":"保險與保障","q":"家長替孩子投保儲蓄型保險，但三年後可能要用錢繳學費。評估商品時最需要什麼資訊？","options":["前三年的解約金及現金流需求","保單封面的圖案","公司廣告曝光量","其他家庭是否也買同商品"],"answer":0,"explain":"選項（1）：提前解約可能造成損失，須與用錢時點比較。\n選項（2）：封面不反映解約成本。\n選項（3）：曝光量不代表流動性。\n選項（4）：他人投保不等於適合自身資金期限。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX022","topic":"防詐與洗錢防制","q":"小明收到自稱銀行的簡訊，要求點連結更新網銀密碼，否則帳戶將凍結。何者較安全？","options":["直接依簡訊操作但不要告訴家人","自行開啟銀行官方App或撥官方電話確認","先把簡訊轉傳同學請他代登","回傳一次性驗證碼確認身分"],"answer":1,"explain":"選項（1）：簡訊連結可能導向偽冒網站。\n選項（2）：透過獨立官方管道查證可降低釣魚風險。\n選項（3）：轉傳並代登會增加帳號資訊外洩風險。\n選項（4）：OTP是重要驗證資訊，不應回傳陌生訊息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX023","topic":"防詐與洗錢防制","q":"朋友借用你的銀行帳戶收取網拍貨款，說每筆給你500元報酬。你不清楚實際交易內容，最適合怎麼做？","options":["借帳戶但只收少量款項","只要朋友有身分證就可放心","拒絕提供帳戶並確認交易是否涉及不法","改用數位帳戶即可排除風險"],"answer":2,"explain":"選項（1）：金額小也可能涉及洗錢或詐欺。\n選項（2）：對方身分證不代表資金來源合法。\n選項（3）：出借帳戶可能涉及刑事與帳戶風險。\n選項（4）：帳戶類型不改變提供他人收款的風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX024","topic":"防詐與洗錢防制","q":"長者接到假檢警電話，對方聲稱帳戶涉案要求轉入「監管帳戶」。家人應如何協助？","options":["先轉一半以證明配合","要求對方傳來正式公文就轉帳","請長者不要掛電話以免失禮","中止通話並透過165或正式機關管道查證"],"answer":3,"explain":"選項（1）：轉帳可能造成直接損失。\n選項（2）：詐騙者也可能偽造公文。\n選項（3）：持續通話容易受話術操控。\n選項（4）：獨立查證與停止轉帳是重要防線。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX025","topic":"防詐與洗錢防制","q":"小店營業額增加，銀行詢問大額現金交易的資金來源。店主最適合的回應是什麼？","options":["提供交易發票、帳簿與合理資金來源說明","拒絕提供任何資訊並要求銀行不得詢問","改成多人分批存入以避免紀錄","宣稱營業收入不可能被查核"],"answer":0,"explain":"選項（1）：合法交易可用客觀紀錄說明來源。\n選項（2）：金融機構依法負有客戶審查義務。\n選項（3）：刻意拆分交易可能提高可疑交易風險。\n選項（4）：營業收入仍可能需要合理佐證。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX026","topic":"防詐與洗錢防制","q":"投資群組宣稱「每月固定獲利8%，本金保證，拉朋友再加碼」。哪項查核最重要？","options":["先看群組成員人數","查證業者資格、資金流向與保證獲利的合理性","只看群組中的獲利截圖","先投入少量金額就不必查核"],"answer":1,"explain":"選項（1）：群組人數可能造假，無法驗證合法性。\n選項（2）：不合理保證獲利及招攬結構是重要風險訊號。\n選項（3）：截圖可能經過編輯或偽造。\n選項（4）：小額投入也可能造成個資與資金風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX027","topic":"防詐與洗錢防制","q":"學生收到「帳戶異常」電話，對方能說出部分個資並要求提供OTP。哪個判斷最合理？","options":["能說出生日就一定是銀行","只要來電顯示銀行電話就可信","個資可能外洩或遭冒用，OTP不可交付","提供OTP後再改密碼即可免除風險"],"answer":2,"explain":"選項（1）：部分個資可從外洩資料取得。\n選項（2）：來電顯示可能被偽冒。\n選項（3）：OTP是驗證憑證，應獨立聯繫官方查證。\n選項（4）：事後改密碼不一定能追回已完成交易。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX028","topic":"防詐與洗錢防制","q":"一家企業接獲國外供應商郵件要求更換收款銀行帳號，金額較大且時間緊迫。哪個程序最能降低風險？","options":["依新郵件帳號立即匯款","只要郵件有公司Logo即可","先匯小額測試，成功就匯全額","以既有聯絡方式雙重確認收款帳號變更"],"answer":3,"explain":"選項（1）：電子郵件可能遭入侵或偽冒。\n選項（2）：Logo容易複製。\n選項（3）：小額匯款成功無法證明收款人身分。\n選項（4）：獨立管道核對可降低商務電子郵件詐騙。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX029","topic":"退休與信託","q":"退休者有每月固定生活費需求，卻將所有資產放在波動大的股票。哪項規劃較能改善風險？","options":["按生活費期限建立現金與較穩健資產緩衝","只買配息率最高的股票","把每月生活費都當作投資獲利","因退休後不再工作就不需資產配置"],"answer":0,"explain":"選項（1）：依支出期限安排流動性，可降低被迫低價賣出風險。\n選項（2）：高配息不保證價格與現金流穩定。\n選項（3）：配息可能伴隨本金價值變動。\n選項（4）：退休更需管理提領與市場風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX030","topic":"退休與信託","q":"長者擔心失能後財產被不當挪用，想安排專款支付照護費用。哪項規劃最貼近需求？","options":["只把提款卡交給鄰居","與專業人員討論安養信託的受託管理及給付條件","把全部財產改成現金藏在家中","只訂口頭約定請親友每月匯款"],"answer":1,"explain":"選項（1）：交付提款卡缺乏清楚的管理與監督安排。\n選項（2）：信託可依契約約定管理用途與給付方式。\n選項（3）：大量現金可能有保管與失竊風險。\n選項（4）：口頭約定的執行與監督較不明確。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX031","topic":"退休與信託","q":"父母想設立教育信託，但希望孩子成年後仍依學費支出分期領取。應優先確認什麼？","options":["銀行分行裝潢","受益人是否喜歡銀行品牌","信託契約中的給付條件、受益權與終止安排","存摺顏色是否方便辨識"],"answer":2,"explain":"選項（1）：裝潢與信託給付條件無關。\n選項（2）：品牌偏好不能取代法律契約設計。\n選項（3）：受益權與給付時點須以合法契約約定。\n選項（4）：存摺外觀不影響信託管理。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX032","topic":"退休與信託","q":"退休家庭評估以房養老，現有房屋是主要居所且仍有其他繼承人。哪項資訊最需要事先釐清？","options":["只看銀行廣告最高可貸成數","認為房價一定持續上漲","只比較每月可領金額","貸款計息、撥款期間、清償及繼承安排"],"answer":3,"explain":"選項（1）：最高成數未反映個案條件。\n選項（2）：房價存在波動風險。\n選項（3）：月領金額不是完整成本。\n選項（4）：以房養老涉及長期利息、房屋處分及繼承問題。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX033","topic":"退休與信託","q":"一位退休者預計十年後才動用部分資金，另一筆半年後就要付醫療費。哪項安排最合理？","options":["分別依資金使用期限規劃流動性與風險","把兩筆資金都放入同一高波動商品","只比較哪個商品宣傳報酬較高","把醫療費全部投入長期閉鎖商品"],"answer":0,"explain":"選項（1）：不同支出期限應有不同風險承受能力。\n選項（2）：高波動商品可能在短期需求時被迫賣出。\n選項（3）：宣傳報酬不能替代風險與期限評估。\n選項（4）：閉鎖商品可能無法及時支應醫療支出。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX034","topic":"退休與信託","q":"家庭規劃退休提領時只以去年投資報酬率推估未來每年收入。哪個問題最值得注意？","options":["去年報酬率足以保證未來收益","報酬順序風險可能使退休初期虧損加速資產耗損","退休後資產價格不再波動","只要平均報酬為正就不需控制提領率"],"answer":1,"explain":"選項（1）：單一年份不能代表長期報酬。\n選項（2）：提領期間遭遇早期大跌，可能對資產續航力造成較大影響。\n選項（3）：退休不會消除市場風險。\n選項（4）：平均報酬無法完整反映提領時點。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX035","topic":"退休與信託","q":"受託人依信託契約管理財產，委託人要求將原本指定教育用途的資金挪作高風險投機。哪項處理較妥當？","options":["立即照做，因委託人永遠可口頭變更","先挪用再補寫紀錄","依信託契約及法令確認變更權限與程序","只要投資可能賺錢就可改變用途"],"answer":2,"explain":"選項（1）：信託權利義務須依契約與法律，不可一概認定可口頭更改。\n選項（2）：事後補記不能取代合法程序。\n選項（3）：信託目的與變更權限是判斷核心。\n選項（4）：預期報酬不等於可違反信託目的。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX036","topic":"貨幣政策與總體金融","q":"央行在公開市場買進公債，其他條件不變。某銀行財務主管應如何評估初步影響？","options":["銀行準備金一定下降","央行直接提高所有銀行放款利率","銀行持有的所有公債價格必跌","市場流動性通常增加，短期利率可能承受下行壓力"],"answer":3,"explain":"選項（1）：買進公債通常向市場注入資金。\n選項（2）：公開市場買入不是直接規定各銀行放款利率。\n選項（3）：債券價格仍受多重因素影響。\n選項（4）：買入操作通常具有增加流動性的方向性效果。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX037","topic":"貨幣政策與總體金融","q":"本國升息，但同時出口衰退、國際資金避險流向美元。企業想預估匯率，最合理的做法是什麼？","options":["將升息視為可能因素之一，並評估其他匯率驅動因素","認定本國貨幣必然升值","只依出口商的單一報價判斷","只看去年同月匯率"],"answer":0,"explain":"選項（1）：匯率受利差、預期、風險情緒及貿易等因素共同影響。\n選項（2）：升息不保證匯率一定升值。\n選項（3）：單一報價不足以預測市場。\n選項（4）：歷史同月價格不代表未來。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX038","topic":"貨幣政策與總體金融","q":"進口商三個月後要支付100萬美元貨款，擔心新臺幣貶值增加成本。哪個風險管理方向較符合需求？","options":["先把所有新臺幣資金投入股票","評估遠期外匯等避險工具及其成本","等待匯率波動後再決定是否付款","認為本國升息就不需匯率避險"],"answer":1,"explain":"選項（1）：股票投資可能增加市場風險，不能直接鎖定匯率。\n選項（2）：遠期外匯可用來管理未來付款匯率，但需評估契約及成本。\n選項（3）：被動等待會暴露匯率變動風險。\n選項（4）：政策利率不能保證匯率方向。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX039","topic":"貨幣政策與總體金融","q":"通膨率下降但仍為正值，學生說「物價已經比去年便宜」。哪個回應最準確？","options":["通膨率下降代表所有商品價格下降","通膨率為正時物價一定不變","物價整體仍可能上漲，只是上漲速度放慢","通膨率只影響股票不影響生活費"],"answer":2,"explain":"選項（1）：通膨率下降不等於價格水準下降。\n選項（2）：正通膨表示整體價格水準仍上升。\n選項（3）：須區分通膨減速與通貨緊縮。\n選項（4）：通膨會影響生活購買力。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX040","topic":"貨幣政策與總體金融","q":"市場預期央行將降息，長天期公債殖利率卻因財政與風險溢酬上升。投資人應如何理解？","options":["只要降息，長債價格一定上漲","殖利率上升代表債券價格也上漲","短期政策利率與長期殖利率必然同步","長債價格可能下跌，因其殖利率受多種因素影響"],"answer":3,"explain":"選項（1）：市場預期已可能提前反映，長債殖利率亦受其他因素影響。\n選項（2）：殖利率與既有固定票息債券價格通常反向變動。\n選項（3）：長短期利率由不同因素共同決定。\n選項（4）：長債殖利率上升通常壓低既有債券價格。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX041","topic":"貨幣政策與總體金融","q":"景氣疲弱且物價仍高，企業主管想判斷央行下一步政策。何種分析最合適？","options":["同時觀察通膨、就業、金融穩定與政策取捨","只要失業上升央行就必然降息","只要物價上漲央行就必然升息","直接用股價漲跌推定央行決策"],"answer":0,"explain":"選項（1）：政策決策涉及多重目標與權衡。\n選項（2）：就業壓力不代表一定降息。\n選項（3）：通膨壓力也須考量其他條件。\n選項（4）：股價僅是眾多經濟資訊之一。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX042","topic":"貨幣政策與總體金融","q":"存款利率從1%升到2%，但同期通膨率為3%。學生想衡量購買力變化，應採何種比較？","options":["只看存款名目利率提高一倍","比較存款報酬與物價上漲率，評估實質購買力","只看銀行公告利率不看通膨","以股票指數漲跌取代物價資料"],"answer":1,"explain":"選項（1）：名目利率上升不代表實質報酬轉正。\n選項（2）：名目存款報酬低於通膨時購買力仍可能下降。\n選項（3）：忽略通膨會高估實質收益。\n選項（4）：股票指數不是衡量一般物價的指標。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX043","topic":"金融消費保護與永續金融","q":"消費者對保險理賠有爭議，已向金融機構提出申訴，對方回覆仍不滿意。下一步最適合做什麼？","options":["直接在社群公開所有病歷資料","自行停止履行所有保單義務","確認是否符合向金融消費評議中心申請評議的期限與程序","向陌生代辦支付高額保證勝訴費"],"answer":2,"explain":"選項（1）：公開病歷可能造成個資外洩。\n選項（2）：停止履約可能衍生其他契約風險。\n選項（3）：金融消費爭議有法定申訴與評議程序。\n選項（4）：代辦保證結果不可信且可能增加成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX044","topic":"金融消費保護與永續金融","q":"銀行推薦複雜結構型商品給首次投資的退休長者，長者無法說明最壞情況損失。理專最適當的做法是什麼？","options":["強調其他客戶都已購買","只提供過去最好報酬","把風險揭露放在簽約後","重新確認適合度並以可理解方式揭露風險"],"answer":3,"explain":"選項（1）：其他人購買不代表商品適合該客戶。\n選項（2）：只揭露最佳績效會忽略損失風險。\n選項（3）：風險應在交易決定前充分揭露。\n選項（4）：適合度與理解能力是公平待客的重要考量。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX045","topic":"金融消費保護與永續金融","q":"一家企業發行「綠色債券」，但資金實際用途不明。投資人要評估是否符合永續投資目的，最應查什麼？","options":["募集資金用途、管理機制與後續資訊揭露","公司Logo是否使用綠色","發行公司員工制服顏色","債券是否一定提供高於市場的報酬"],"answer":0,"explain":"選項（1）：綠色債券重視募集資金用途及透明揭露。\n選項（2）：品牌顏色不是永續績效證據。\n選項（3）：制服顏色與資金用途無關。\n選項（4）：綠色標籤不保證較高報酬。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX046","topic":"金融消費保護與永續金融","q":"兩檔永續基金都標榜ESG，但甲排除高碳產業，乙投資轉型中的高碳企業。學生如何比較較合理？","options":["認定投資高碳企業就一定不屬永續策略","檢視各自投資策略、轉型指標與揭露方法","只看基金名稱有沒有ESG","以配息率高低判斷永續程度"],"answer":1,"explain":"選項（1）：轉型投資可能以改善企業表現為目標，不能單憑產業排除。\n選項（2）：不同ESG策略須依目標、指標與執行證據比較。\n選項（3）：名稱不能替代投資組合與揭露。\n選項（4）：配息率不衡量環境與社會成果。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX047","topic":"金融消費保護與永續金融","q":"學生使用先買後付服務，商家宣稱不收利息，但逾期可能有費用。哪項決策最合理？","options":["把BNPL當成收入增加","只看每期付款金額","確認總費用、逾期條件與個人還款能力","同時申請多個平台就能降低總負債"],"answer":2,"explain":"選項（1）：分期付款不會增加可支配收入。\n選項（2）：每期付款不代表總費用與違約成本。\n選項（3）：需評估到期現金流及契約責任。\n選項（4）：多平台可能使債務更難管理。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX048","topic":"金融消費保護與永續金融","q":"一家工廠申請轉型融資，承諾五年內降低排放，但缺乏可驗證的中期目標。銀行最應要求什麼？","options":["只要求企業發表環保口號","只看公司股價表現","只要求廠房外觀改善","具體減排路徑、衡量指標與定期查核機制"],"answer":3,"explain":"選項（1）：口號不能驗證實際減排成果。\n選項（2）：股價與減排成效不必然一致。\n選項（3）：外觀改善不代表碳排下降。\n選項（4）：可衡量的轉型目標與驗證是風險評估核心。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX049","topic":"金融消費保護與永續金融","q":"消費者發現信用報告有疑似錯誤的逾期紀錄，正準備申請房貸。何者最適當？","options":["向資料提供機構或聯徵中心依程序申請查明與更正","先向陌生業者付費刪除信用紀錄","直接重新申請十家銀行讓資料自行消失","認為信用報告不能查詢也不能申請更正"],"answer":0,"explain":"選項（1）：可依相關程序確認紀錄及提出更正申請。\n選項（2）：陌生付費刪除服務可能涉及詐騙。\n選項（3）：大量申請不能解決錯誤資料來源。\n選項（4）：信用資料有查詢與爭議處理管道。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"}];let exam=[],answers=[],at=0,remaining=40,tick=null,timed=false,locked=[];const $=id=>document.getElementById(id);function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function begin(){timed=$('mode').value==='timed';exam=shuffle(BANK).slice(0,20).map(x=>{let opts=shuffle(x.options.map((v,i)=>({v,i})));return {...x,options:opts.map(y=>y.v),answer:opts.findIndex(y=>y.i===x.answer)}});answers=Array(20).fill(null);locked=Array(20).fill(false);$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){clearInterval(tick);let x=exam[at];$('counter').textContent=`第 ${at+1} / ${exam.length} 題 · ${x.topic}`;$('question').textContent=x.q;document.querySelector('button[onclick="prev()"]').disabled=timed;$('options').innerHTML='';x.options.forEach((s,i)=>{let b=document.createElement('button');b.className='opt'+(answers[at]===i?' selected':'');b.textContent=`(${i+1}) ${s}`;b.disabled=locked[at];b.onclick=()=>{if(locked[at])return;answers[at]=i;locked[at]=true;renderOptions();if(!timed){let fb=document.createElement('div');fb.style.cssText='background:#eff8f1;color:#123c25;padding:14px;border-radius:12px;margin:10px 0;font-size:16px;line-height:1.6';fb.textContent=(i===x.answer?'✓ 答對！':'✗ 答錯。正確答案：'+x.options[x.answer])+'　解析：'+x.explain;$('options').appendChild(fb)}setTimeout(()=>{if(at<exam.length-1)next();else submitQuiz(true)},timed?350:4200)};$('options').appendChild(b)});if(timed){remaining=40;$('timer').textContent=`剩餘 ${remaining} 秒`;tick=setInterval(()=>{remaining--;$('timer').textContent=`剩餘 ${remaining} 秒`;if(remaining<=0){if(at<exam.length-1){locked[at]=true;next()}else submitQuiz(true)}},1000)}else $('timer').textContent='不限時'}function renderOptions(){[...$('options').children].forEach((b,i)=>b.classList.toggle('selected',answers[at]===i))}function next(){if(at<exam.length-1){at++;render()}}function prev(){if(!timed&&at>0){at--;render()}}function submitQuiz(auto=false){clearInterval(tick);if(!auto&&!confirm('確定交卷？未作答題目以錯誤計算。')){if(timed)render();return}let n=exam.reduce((s,x,i)=>s+(answers[i]===x.answer),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`成績：${n*5} 分（答對 ${n} / 20 題）`; $('reviews').innerHTML='';exam.forEach((x,i)=>{let d=document.createElement('div');d.className='review';let good=answers[i]===x.answer;let h=document.createElement('h3');h.textContent=`${i+1}. ${x.q}`;d.appendChild(h);let p=document.createElement('p');p.className=good?'correct':'wrong';p.textContent=`${good?'答對':'答錯'}｜你的答案：${answers[i]===null?'未作答':x.options[answers[i]]}｜正解：${x.options[x.answer]}`;d.appendChild(p);let e=document.createElement('p');e.textContent=`解析：${x.explain}`;d.appendChild(e);let s=document.createElement('small');s.className='muted';s.textContent=`參考講義：${x.source}${x.official?"｜官方參考："+x.official:""}`;d.appendChild(s);$('reviews').appendChild(d)})}</script></body></html>
