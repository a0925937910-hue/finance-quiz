；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"家人想用以房養老款項支付看護費，卻擔心被他人挪用。應評估什麼？","options":["讓任何一位家屬代收款項，不需留下用途紀錄","只將撥款改為現金提領，即可杜絕挪用","將貸款撥款與信託或其他正式照護給付管理機制結合","以房屋抵押擔保為由，認為照護費必會自動支付"],"answer":2,"explain":"逐選項解析：（1）代收款若無授權與查核，仍可能遭不當使用。；（2）現金較難追蹤用途，不能解決監督問題。；（3）可評估專款管理、授權與給付監督的適當安排。；（4）抵押貸款不會自動形成照護費用監督。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F185","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"退休者房屋有既存貸款，打算申請以房養老。應先確認什麼？","options":["先估算房價淨值，既有房貸留待新貸撥款後再處理","確認原抵押權順位、剩餘債務與新貸清償或轉貸條件","只要房屋鑑價足夠，原貸款不影響新貸核准","優先比較每月撥款額，既有債務僅影響繼承時處理"],"answer":1,"explain":"逐選項解析：（1）淨值估算有用，但不能跳過抵押權與既有債務的處理。；（2）原抵押權、剩餘本金與銀行承作條件會影響是否可申辦及實際可用額度。；（3）鑑價不是唯一條件，抵押權順位與還款安排也可能影響核貸。；（4）原貸款可能直接影響新貸設定與可撥金額，非僅身後問題。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F186","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"夫妻共有房屋，只有一方想申貸以房養老。應優先處理什麼？","options":["只確認提出申請的一方符合年齡門檻，另一共有人可於撥款後補簽","先將共有持分估價，未取得同意也可直接設定整棟房屋抵押","先向銀行確認是否接受共有房屋，再依法取得必要共有人同意與辦理設定","由申請人單獨簽約即可使另一共有人持分自動成為擔保"],"answer":2,"explain":"逐選項解析：（1）年齡資格不能取代共有權利及設定程序。；（2）共有持分與整棟房屋擔保不同，不能逕自處分他人權利。；（3）應確認銀行承作條件及共有人的必要意思表示，兼顧居住安排。；（4）單方簽約不會自動使他人持分負擔抵押權。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F187","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"長者想把以房養老撥款全部投入高風險投資。應如何判斷？","options":["將每月撥款固定投入高股息基金，因配息可穩定支付貸款利息","先保留生活與照護現金流，再衡量借款成本、投資波動與風險承受能力","只要投資報酬預期高於房貸利率，便可投入全部撥款","將撥款集中投入一檔波動較低的產業ETF，便可避免虧損"],"answer":1,"explain":"逐選項解析：（1）配息不等於保證收益，也不排除基金淨值下跌。；（2）以房養老資金通常涉及必要生活需求，不宜忽略借款成本與投資損失風險。；（3）預期報酬並非保證，借款利息卻是契約義務。；（4）單一產業ETF仍有市場及集中風險。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F188","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"銀行提供固定撥款與其他撥款方式，長者醫療費可能不規則增加。應如何選擇？","options":["以第一個月撥款最高者為優先，因之後醫療費不影響需求","選總核貸額度最高者，無須比較提款限制及利息計算","比較定期撥款與可彈性動用方案的費用、可用額度及醫療現金流","優先選撥款最固定的方案，因醫療支出不規則不影響流動性"],"answer":2,"explain":"逐選項解析：（1）初期撥款額不能反映未來不定期大額支出。；（2）核貸總額與實際可動用時點、費用及契約條件不同。；（3）不規則醫療支出須評估撥款彈性與總成本，且實際方案依銀行提供為準。；（4）固定撥款可能不完全匹配不定期支出。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F189","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"子女擔心父母身故後房屋如何處理。申貸前應先確認什麼？","options":["確認借款到期或身故後的清償期限、繼承人選擇及抵押物處分機制","預先約定由銀行無條件取得房屋所有權，便不需清償","只比較每月可領金額，繼承問題留待日後再談","將房價預估增值視為足以抵銷所有利息與費用"],"answer":0,"explain":"逐選項解析：（1）以房養老仍涉及債務與抵押權，應事先理解到期處理及繼承安排。；（2）設定抵押權不等於銀行立即或無條件取得所有權。；（3）繼承與清償條件會影響家庭決策，應於簽約前確認。；（4）房價可能波動，不能假設一定足以抵銷債務。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F190","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"學生接到兼職邀約，對方要求提供提款卡與密碼才能領薪。應如何處理？","options":["要求雇主提供公司統編後，便可將提款卡寄給人資保管","只提供提款卡但不提供密碼，便不會有帳戶風險","拒絕交付提款卡、密碼及網銀認證資訊，透過獨立管道查核徵才真偽","先交付帳戶資料試做一天，確認收到薪水再決定是否繼續"],"answer":2,"explain":"逐選項解析：（1）公司登記資料可協助查證，但不代表可交付帳戶控制工具。；（2）提款卡仍可能被濫用，且不應交由不明人士持有。；（3）領薪通常不需要交出帳戶控制權，應拒絕並查證。；（4）短期試用也可能已使帳戶涉入異常金流。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F191","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"網拍賣家收到多匯款，買家要求退到不同姓名帳戶。應怎麼做？","options":["依買家提供的新帳號退款，並保留匯款收據即可","先確認原交易與入帳狀況，透過銀行及平台正式退款管道處理","將款項先轉入自己的另一帳戶，等買家補證件再退款","要求買家出示身分證影本後，便可直接匯到任何指定帳戶"],"answer":1,"explain":"逐選項解析：（1）不同姓名收款帳戶可能牽涉詐騙金流，收據不能排除風險。；（2）透過原交易、銀行及平台核對，避免替不明金流轉手。；（3）轉到自己另一帳戶無法釐清款項來源及真正權利人。；（4）證件影本可能偽造，亦不等於該帳戶有合法收款權。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F192","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"社群朋友推薦「保本月賺兩成」投資，收款帳戶卻是個人戶。應如何判斷？","options":["先要求提供過往三個月獲利截圖，若每月達標即可投資","先投入小額測試是否能出金，成功後再加碼","查核業者及收款人身分，對保本高報酬承諾保持警覺並暫停匯款","請推薦者簽個人保證書，即可將投資視為低風險"],"answer":2,"explain":"逐選項解析：（1）獲利截圖容易造假，也不能證明資金受保障。；（2）小額出金可能是誘導加碼手法，不能證明投資合法。；（3）保本且月報酬20%高度可疑，個人帳戶收款也需查證。；（4）私人保證書不能取代業者合法性及風險審查。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F193","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"學生收到假冒法院通知，要求立即匯款至安全帳戶。應如何處理？","options":["先核對通知書上的案件編號，再依通知指定帳戶匯款","要求來電者傳法院識別證，確認照片後照辦","停止付款，使用自行查得的法院或警政官方聯絡方式查證","先轉一筆小額驗證款，確定帳戶可用後再聯絡法院"],"answer":2,"explain":"逐選項解析：（1）案件編號與通知可遭偽造，不能因此照指示匯款。；（2）證件照片也可能偽造，不足以確認來電真實性。；（3）公務機關不會要求以私人安全帳戶保管款項，應獨立查證。；（4）小額匯款仍可能造成損失並暴露更多資訊。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F194","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"有人請學生代領陌生款項後換成虛擬資產轉出，承諾分潤。應注意什麼？","options":["只要每次轉帳不超過特定金額，便能排除洗錢風險","先確認對方提供的公司登記資料，再代收轉幣即可","拒絕代收不明款項及代轉虛擬資產，保存邀約資料並尋求官方協助","改用自己的虛擬資產錢包代轉，避免銀行帳戶被警示"],"answer":2,"explain":"逐選項解析：（1）分拆金額不能使不明資金合法，反而可能增加疑慮。；（2）公司登記不能證明資金來源或代收行為合法。；（3）代收代轉陌生資金可能成為詐騙金流環節，應拒絕。；（4）更換轉移媒介不會消除資金來源風險。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F195","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"長者接到自稱銀行專員的電話，要求報出OTP取消交易。應如何處理？","options":["請對方先說出帳戶末四碼，答對再提供OTP","只提供一次性驗證碼、不提供密碼，風險便可接受","掛斷電話並自行透過銀行官方客服或App查證，絕不口述OTP","先在電話中要求凍結帳戶，再把OTP告訴對方完成作業"],"answer":2,"explain":"逐選項解析：（1）來電者可能掌握部分個資，不能以此驗證身分。；（2）OTP可用於交易授權或登入驗證，不能交付陌生人。；（3）應透過獨立官方管道確認並採取必要保護措施。；（4）所謂取消交易也可能是誘導提供驗證碼的話術。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F196","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"學生想買演唱會票，賣家要求離開平台私下匯款。應如何降低風險？","options":["若賣家願意折價，改用私下轉帳可視為風險已降低","要求賣家提供票券截圖後，便可直接匯款","使用可信平台的付款與交易保障流程，查驗票券規則並保留紀錄","先匯一半訂金，待對方傳送電子票券後再付尾款"],"answer":2,"explain":"逐選項解析：（1）折扣不代表真實交易，離開平台可能失去保障。；（2）截圖可能重複販售或偽造，不足以確認可用性。；（3）平台交易保障與官方票券規則較能降低風險。；（4）分段付款仍可能遭詐騙，且不保證票券有效。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F197","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"親友帳戶突然被警示，家人想用自己的帳戶代收其所有款項。應先做什麼？","options":["讓家人以本人帳戶暫代收所有款項，等警示解除再轉回","先向金融機構及相關機關釐清警示原因與可行處理程序，避免代收不明金流","改用電子支付代收款項，因不經銀行便不受限制","只代收親友薪資以外的款項，就不需確認來源"],"answer":1,"explain":"逐選項解析：（1）代收可能讓自己帳戶涉入待釐清的金流。；（2）應先查明原因，依金融機構與司法程序處理。；（3）改變支付管道不能繞過合法審查義務。；（4）非薪資款項更需確認交易背景及合法性。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F198","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"網友提供租借帳戶高額日薪，說只會用來收公司款。應如何評估？","options":["要求對方出具租用契約並公證，就可安全出借帳戶","只提供帳號與網銀登入資訊，不提供實體卡片即可","拒絕出租帳戶控制權，查證工作真實性並警覺詐騙與洗錢風險","先約定每日轉入上限，便能避免帳戶被不法使用"],"answer":2,"explain":"逐選項解析：（1）契約形式不會使不當交付帳戶控制權變得安全。；（2）網銀憑證可直接被濫用，風險極高。；（3）高薪租借帳戶是重大警訊，應拒絕交付。；（4）限額不能排除帳戶被用於不法金流。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F199","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"公司登記負責人表示自己只是掛名，實際控制人不願揭露。銀行應如何辦理？","options":["依公司登記的負責人作為唯一實質受益人，因其具有法定代表權","只要公司提出股東名冊，就不必再追查實際控制者","要求補充股權及控制關係資料，無法完成必要審查時依規定處理","先核准開戶，再將實質受益人資料列為可選擇性補件"],"answer":2,"explain":"逐選項解析：（1）登記負責人與實際控制人可能不同。；（2）股東名冊有助辨識，但可能不足以釐清間接控制。；（3）應採風險基礎方法辨識實質受益人，不能完成審查時依規定處置。；（4）必要的開戶審查不能任意延後為非必要程序。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F200","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"客戶長期只有小額薪資入帳，突然每天收多筆不明大額款項。銀行應注意什麼？","options":["因客戶已往來多年，先將新增交易一律視為正常營業收入","只要每筆款項都小於某門檻，就不必評估整體型態","比較客戶原有背景、資金來源及交易目的，必要時加強審查與監控","要求客戶簽署不涉及詐騙切結書，便可停止監控"],"answer":2,"explain":"逐選項解析：（1）既有客戶的交易風險也會隨行為改變。；（2）多筆分拆交易仍可能具有異常風險。；（3）交易型態突然改變應結合背景及用途評估。；（4）切結書不能取代必要的持續監控與查核。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F201","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"某企業稱款項是海外貨款，卻無法提出合理交易文件。銀行應如何處理？","options":["因企業有進出口登記，直接接受海外貨款說明","先依企業自述認列收入，等年度審計再查文件","依風險與交易性質查核契約、發票、物流及資金來源等合理證據","將款項拆分為較小交易，降低單筆審查需求"],"answer":2,"explain":"逐選項解析：（1）營業登記不等於每筆交易均有合理背景。；（2）審查不能完全依賴單方口述或延後至審計。；（3）交易證據應與實際商業背景相符，並依規定評估。；（4）拆分交易不能降低法定審查義務。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F202","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"開戶者提供身分證，但拒絕說明帳戶用途，還要求立即提高轉帳限額。應如何判斷？","options":["身分證已驗真即可先提高限額，帳戶用途待日後補填","若申請人是學生，可用職業類別取代資金用途說明","依風險基礎原則確認開戶目的、預期交易與必要資訊後再評估額度","由申請人簽署用途保證書，銀行即無須進一步查證"],"answer":2,"explain":"逐選項解析：（1）身分辨識不等於已完成客戶用途及風險評估。；（2）職業與帳戶用途是不同的審查面向。；（3）開戶目的與交易預期會影響適當風險管理及額度決定。；（4）書面保證不能完全取代風險導向的查核。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F203","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"客戶把大筆現金拆成多次交易，說這樣銀行就不會詢問。銀行應注意什麼？","options":["單筆未達通貨交易申報門檻，便可排除異常交易疑慮","只記錄每日最大一筆現金交易，其他不必整合","檢視分拆頻率、關聯性及交易目的，依風險及規定進行監控或申報","只要客戶表示是節稅需求，銀行就不需追問"],"answer":2,"explain":"逐選項解析：（1）未達單筆門檻不等於不可能涉及可疑交易。；（2）應觀察整體交易樣態，不能只看最大單筆。；（3）刻意分拆可能是警訊，應依法監控並視情況處理。；（4）客戶自述不能排除金融機構的審查責任。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F204","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"境外公司股權結構層層交叉，開戶時只提供最上層公司名稱。銀行應如何處理？","options":["將最上層公司登記負責人直接視為所有實質受益人","只確認第一層股東，因境外股權資料通常難取得","逐層釐清直接及間接持有與控制關係，依規定辨識自然人實質受益人","以最近年度營業額最大的子公司作為實質受益人"],"answer":2,"explain":"逐選項解析：（1）登記負責人不一定具最終控制權。；（2）複雜股權結構可能透過多層持有隱藏控制者。；（3）應依適用規範追查最終所有或控制的自然人。；（4）公司營業額與實質受益人辨識是不同概念。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F205","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"客戶資料多年未更新，交易用途已由薪資轉為商業收款。應怎麼辦？","options":["沿用舊有薪資戶風險等級，因客戶已通過首次審查","只調高交易限額，讓系統自行累積資料再判斷","依新的商業收款用途更新客戶資料、預期交易與風險評估","要求客戶將商業收入拆成多筆小額，避免異常警示"],"answer":2,"explain":"逐選項解析：（1）客戶風險及交易用途會變動，不能永遠沿用初始評估。；（2）單純調額不等於完成持續審查。；（3）用途由薪資轉商業收款應重新確認交易背景。；（4）分拆金流不能取代合規審查，且可能提高疑慮。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F206","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"新開戶者要求行員替他填寫不實職業以提高額度。行員應如何回應？","options":["先填寫客戶希望的職業，待核貸後再修正","由客戶簽免責聲明，銀行即可填寫與事實不符資訊","拒絕不實填報，核實職業與收入等必要資訊並依程序處理","將職業欄位留白並直接提高轉帳額度"],"answer":2,"explain":"逐選項解析：（1）先填不實資料仍會破壞客戶審查正確性。；（2）免責聲明不能使不實資料合法或符合內控。；（3）應如實查核資料並遵守內部及法規程序。；（4）資料不完整不能成為逕自提高限額的理由。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F207","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"有人要求銀行員告知自己是否被申報可疑交易。行員應如何處理？","options":["只向客戶口頭透露是否有申報，不留下書面紀錄即可","若客戶是長期往來戶，可例外告知申報結果","依保密及禁止不當揭露規定處理，不向無權知悉者透露可疑交易申報資訊","提供申報表編號但不提供內容，便不涉及保密問題"],"answer":2,"explain":"逐選項解析：（1）口頭揭露仍可能違反保密義務。；（2）往來年限不構成任意揭露的理由。；（3）可疑交易申報資訊受特定保密與程序規範。；（4）申報編號本身也可能透露受保護資訊。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F208","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"數位帳戶與支付安全","q":"數位帳戶宣稱高利率，但只適用前五萬元。學生準備存二十萬元。應如何比較？","options":["以最高優惠利率乘20萬元，估算全部存款收益","只計算超額15萬元的利息，因前5萬元已享優惠","依優惠額度、超額利率及達成條件分段試算實際利息","以廣告標示的最高利率比較銀行，不需查優惠期限"],"answer":2,"explain":"逐選項解析：（1）優惠利率通常有額度限制，不能套用全部本金。；（2）前5萬元也會產生利息，不能略過。；（3）分段計息與任務條件才能反映實際報酬。；（4）優惠期間可能有限，長期比較不能忽略。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F209","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"數位帳戶與支付安全","q":"支付App突然出現陌生交易，持有人還能登入。應先做什麼？","options":["先將App刪除，避免其他人看見交易紀錄","先向朋友詢問是否代為付款，確認前不需通知業者","立即透過官方管道停用或限制支付工具、聯絡業者並保存紀錄","先變更手機桌面鎖定畫面，支付App帳號不必處理"],"answer":2,"explain":"逐選項解析：（1）刪除App不一定停用帳號或阻止未授權交易。；（2）陌生交易應及時通報，不宜等待私人查證。；（3）快速限制權限並保存證據，有利於防止擴大及後續爭議處理。；（4）手機鎖定與支付帳戶風控是不同層次。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F210","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"數位帳戶與支付安全","q":"學生收到銀行升級簡訊，短網址要求輸入帳密。應如何查證？","options":["先從簡訊連結登入，但不進行轉帳","改從自行開啟的銀行官方App或官方電話查證","先輸入帳號，待確認是銀行後再輸入密碼","請傳訊者提供員工編號，再照連結操作"],"answer":1,"explain":"逐選項解析：（1）釣魚網站可能在登入階段即竊取帳密。；（2）以獨立取得的官方管道查證，可避免偽冒網址。；（3）只提供帳號仍可能洩漏個資，且不能確認網站真偽。；（4）員工編號容易偽造，不能驗證短網址安全性。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F211","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"電子支付餘額與銀行活存被朋友視為完全相同。應如何判斷？","options":["兩者都是電子介面，因此都屬相同的銀行存款","只要平台有合作銀行，支付餘額就等同本人銀行活存","應辨識支付機構、資金保管與適用保障制度，不直接視為同一商品","電子支付餘額能轉帳，所以利率與存款保險必然相同"],"answer":2,"explain":"逐選項解析：（1）操作介面相似不代表法律性質相同。；（2）合作銀行及專戶安排不會自動使每位使用者取得同一種存款權利。；（3）不同機構與資金性質可能涉及不同法規和保障。；（4）可轉帳功能不能推論利息與存款保險待遇相同。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F212","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"未成年人想開數位帳戶，網友說任何人都可不經法定程序開戶。應如何處理？","options":["查明金融機構對未成年人開戶所需法定代理人同意及身分文件","先借用成年朋友的身分證完成線上驗證","只要用自己的手機申請，就可跳過法定代理程序","先提供帳號密碼給代辦，待開戶後再修改"],"answer":0,"explain":"逐選項解析：（1）未成年人開戶須依適用法令及銀行作業規定辦理。；（2）借用他人身分可能違反身分查核要求。；（3）手機操作方式不免除未成年人的開戶資格及同意要求。；（4）交付認證資料給不明代辦有資安及詐騙風險。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F213","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"家長替孩子綁定多張卡到手機支付，卻未設定交易提醒。應如何改善？","options":["只保留單筆交易限額，因通知會增加手續費","設定交易通知、裝置鎖定及適當額度，定期核對明細","關閉裝置生物辨識，避免付款時驗證失敗","將所有卡片共用同一個簡單密碼方便家人使用"],"answer":1,"explain":"逐選項解析：（1）單筆限額不能取代異常交易提醒。；（2）多層防護與即時核對能較早發現未授權交易。；（3）關閉身分驗證會降低支付安全性。；（4）共用弱密碼增加帳戶被盜用風險。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F214","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"手機遺失且已登入銀行App，持有人只想等找到手機。應如何降低損失？","options":["等電信業者寄下月帳單後再評估是否停用","只更換社群網站密碼，銀行App可保持登入","先登出家用電腦的網銀，不必通知銀行","立即遠端鎖定或清除裝置，並聯繫銀行停用相關登入權限"],"answer":3,"explain":"逐選項解析：（1）等待可能延誤阻止未授權交易的時機。；（2）社群帳號與銀行App的認證權限不同。；（3）只登出另一台設備未必能使遺失手機的登入失效。；（4）盡快停用遺失裝置的權限並檢查交易紀錄較能控制風險。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F215","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"學生在公共Wi-Fi登入網銀，網頁跳出憑證錯誤。應如何處理？","options":["忽略憑證警告，但先確認畫面有銀行商標","停止登入，改用可信網路與自行輸入的官方網址或App","先輸入一次性驗證碼測試網站是否正常","請公共Wi-Fi提供者代為輸入網銀密碼"],"answer":1,"explain":"逐選項解析：（1）商標可能被偽造，不能取代憑證驗證。；（2）憑證異常可能表示連線被攔截或網址不正確。；（3）一次性驗證碼屬敏感認證資料，不應用於測試可疑網站。；（4）網銀密碼不應交付Wi-Fi管理者。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F216","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"支付平台推出先買後付，學生只看到零頭期款。應如何比較？","options":["只比較第一期付款，因其最能反映負擔","只看商家標示的零利率，不需閱讀契約","比較總付款、逾期費用、付款期數與自身現金流","先用多個平台分散付款，便不會增加總負債"],"answer":2,"explain":"逐選項解析：（1）低頭期款可能隱藏較高的後續負擔。；（2）名目零利率仍可能有手續費或逾期成本。；（3）應比較完整契約成本及未來還款能力。；（4）跨平台分期仍是負債，可能造成過度借貸。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F217","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"學生看到智能合約標榜自動執行，便認為程式絕不會有漏洞。應如何評估？","options":["檢視程式碼審計、權限、預言機與合約可升級性等風險","因程式自動執行，所以所有外部資料必定正確","只要合約部署在區塊鏈上，就不需查核程式漏洞","以平台宣稱的使用人數取代安全性評估"],"answer":0,"explain":"逐選項解析：（1）智能合約可有程式缺陷、外部資料與管理權限風險。；（2）外部資料來源可能錯誤或被操縱。；（3）不可任意修改的程式也可能含漏洞。；（4）使用人數不等於合約經過充分安全審查。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F218","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"某交易平台承諾固定高收益，要求轉幣至私人錢包。應如何判斷？","options":["先少量轉幣測試，只要能顯示收益便可加碼","查核平台與收款地址，警惕固定高收益及私人錢包收款","請社群版主提供獲利截圖，便可確認本金安全","把幣分成數筆匯入同一私人錢包即可分散風險"],"answer":1,"explain":"逐選項解析：（1）小額測試可能是詐騙誘餌，不能證明大額可領回。；（2）固定高收益與非正式收款地址是需要高度警覺的風險訊號。；（3）截圖容易偽造，不能證明真實資產與清償能力。；（4）拆分匯款不會降低對同一收款方的集中風險。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F219","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"投資人遺失虛擬資產私鑰，認為客服必能幫忙找回。應注意什麼？","options":["先確認錢包備份及託管模式，了解私鑰遺失可能無法恢復","只要鏈上交易公開，任何客服都能重設私鑰","把錢包地址提供客服，即可重新產生原私鑰","向網路陌生人支付解鎖費，通常可保證恢復資產"],"answer":0,"explain":"逐選項解析：（1）非託管錢包若失去私鑰或助記詞，可能無法取回控制權。；（2）區塊鏈公開資訊不代表客服能替使用者重設私鑰。；（3）公開地址不足以推導出私人金鑰。；（4）聲稱保證恢復的收費服務可能是二次詐騙。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F220","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"銀行使用AI審核貸款，某族群長期遭異常拒絕。應關注什麼？","options":["只看模型整體核貸率，不必比較不同客群結果","要求所有被拒客戶重新提交相同資料即可","檢視資料偏差、模型可解釋性、公平性及申覆機制","因AI不會有人類偏見，所以異常拒貸不需調查"],"answer":2,"explain":"逐選項解析：（1）整體核貸率可能掩蓋特定族群的不合理差異。；（2）重複提交資料無法解決模型或資料偏差。；（3）應評估是否存在不合理差別待遇並提供適當救濟。；（4）模型可能複製訓練資料的歷史偏差。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F221","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"朋友把中央銀行數位貨幣和私人穩定幣視為完全相同。應如何區分？","options":["兩者都以數位形式存在，因此發行人和信用風險相同","區分中央銀行負債性質與私人發行者的儲備、贖回及信用風險","只比較代幣價格是否接近一美元，不需看發行人","只要穩定幣採用區塊鏈，就具備法定貨幣地位"],"answer":1,"explain":"逐選項解析：（1）數位形式不決定發行人的法律地位。；（2）CBDC概念上由央行發行，私人穩定幣涉及不同發行與贖回安排。；（3）價格穩定不能代替對發行機構與儲備資產的審查。；（4）區塊鏈技術不自動賦予法償地位。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F222","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"虛擬資產平台顯示帳面獲利，但暫停提款。應如何評估？","options":["以平台顯示的未實現獲利作為已收現金","只要價格走勢向上，暫停提款就不影響資產安全","借更多資金加碼，等待提款功能恢復","將提款限制視為流動性與對手方風險，查核公告及資產證明"],"answer":3,"explain":"逐選項解析：（1）帳面數字不代表資產可即時取回。；（2）無法提款可能反映流動性或營運問題。；（3）加碼會提高對同一平台的風險曝險。；（4）應區分市場價格、平台清償能力與資產可提領性。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F223","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"投資人把所有資產放在單一加密平台，認為分散幣種就安全。應如何改善？","options":["同一平台持有不同幣種，已分散全部營運風險","分散幣種後不必再保護帳號與私鑰","同時評估資產種類、平台集中度及託管安全","只要平台提供高利活存，就能抵銷倒閉風險"],"answer":2,"explain":"逐選項解析：（1）不同幣種仍暴露於同一平台營運與保管風險。；（2）資產分散不能替代認證及私鑰保護。；（3）應分別管理市場、對手方與資安風險。；（4）收益承諾不能保證平台具備足夠清償能力。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F224","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"某NFT宣稱保證可轉售獲利，但市場交易稀少。應先查什麼？","options":["查驗實際成交量、買賣價差、權利內容與轉售市場深度","以發行人宣稱的地板價作為保證變現價格","只要NFT可在鏈上轉移，就代表隨時有買家","只比較鑄造成本，因轉售時無流動性問題"],"answer":0,"explain":"逐選項解析：（1）市場稀少可能導致難以成交，NFT權利也需逐項確認。；（2）標示價格不等於真實成交價格或可保證獲利。；（3）可轉移不代表存在願意買入的交易對手。；（4）交易深度與買賣價差會影響實際變現。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F225","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"學生想透過社群提供的智能合約連結領取空投，網站要求無限額授權錢包。應怎麼辦？","options":["先授權，再依網站承諾於領取後取消權限","檢查合約與授權範圍，對不明無限額授權保持拒絕","只要空投免費，就不會涉及資產被轉出的風險","將主錢包私鑰輸入網站以完成授權驗證"],"answer":1,"explain":"逐選項解析：（1）惡意合約可能在授權期間轉走資產。；（2）不明合約的無限額授權可能使資產面臨重大風險。；（3）零購買價不等於沒有授權或資安風險。；（4）私鑰不得交付第三方網站。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F226","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"服飾品牌宣稱碳中和，卻不揭露供應鏈與運輸排放。投資人應查核什麼？","options":["只查企業總部用電，因供應鏈排放不屬企業責任","只看品牌是否購買碳權，不必確認排放範圍","確認碳中和主張的範圍、排放盤查及抵換品質","以宣傳影片的觀看數作為減碳成效證據"],"answer":2,"explain":"逐選項解析：（1）企業價值鏈排放可能是重大排放來源。；（2）抵換不能取代對排放範圍與實際減量的揭露。；（3）應區分直接、能源間接與其他價值鏈排放及宣稱邊界。；（4）宣傳熱度與碳排放績效沒有直接對應。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F227","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"鋼鐵公司申請轉型貸款，提出設備改善與年度減碳指標。銀行應如何評估？","options":["只依企業宣稱的最終淨零年份核貸","只要鋼鐵業排放高，任何轉型貸款都不適用","只比較企業與同業的股價走勢","評估基準排放、技術可行性、年度指標及監測機制"],"answer":3,"explain":"逐選項解析：（1）遠期目標不足以證明近期可衡量的減排進展。；（2）轉型金融正可支持高排放產業可信的減碳改善。；（3）股價不能直接反映專案減排可行性。；（4）可驗證的中期目標與監測有助辨識真實轉型。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F228","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"基金廣告稱投資綠能，因此完全沒有虧損可能。應如何判斷？","options":["辨別綠能產業仍有市場、技術、政策與估值風險","因投資標的屬綠能，基金本金應受存款保險保障","只要有ESG名稱，基金每年必然正報酬","基金投資於再生能源，就不會受到利率影響"],"answer":0,"explain":"逐選項解析：（1）永續主題不代表本金保證，仍需看投資風險。；（2）基金與銀行存款的保障制度不同。；（3）ESG名稱不能保證投資績效。；（4）綠能企業融資成本與估值也可能受利率變化影響。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F229","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"企業發行綠色債券，募集資金卻拿去支付一般股利。應先檢視什麼？","options":["只確認債券票面利率，資金用途不影響綠色標籤","檢視發行文件約定的合格用途、資金管理與分配報告","若發行人股價上漲，就代表資金用途符合綠色標準","只要發行人有ESG報告，股利支出即可視為綠色用途"],"answer":1,"explain":"逐選項解析：（1）綠色債券的核心特徵包括募集資金用途等要求。；（2）應核對用途承諾及後續分配揭露，不能任意改作一般股利。；（3）股價表現不能證明綠色資金用途合規。；（4）一般ESG揭露不能替代個別綠色債券的資金用途約束。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F230","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"公司公布淨零目標，但未提供中期減排里程碑。投資人應關注什麼？","options":["只看2050年淨零宣示，因中間年份可省略","只看企業當年度營收是否增加","要求具體中期減排里程碑、資本支出及執行進度","只要企業購買碳權，便不必衡量自身排放"],"answer":2,"explain":"逐選項解析：（1）長期承諾需可衡量的階段性進度支撐。；（2）營收增長不代表排放下降。；（3）中期目標與投資計畫可協助判斷轉型可信度。；（4）碳權不能取代對實際排放與減量措施的追蹤。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F231","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"某工廠宣稱用再生能源就代表所有產品零排放。應如何分析？","options":["將再生能源採購量直接視為所有產品零排放證明","只檢查工廠電費，不需查原料與運輸","只看產品包裝上的綠色標誌","依產品生命週期檢視原料、製造、運輸及使用階段排放"],"answer":3,"explain":"逐選項解析：（1）再生能源可能降低部分用電排放，不等於全生命週期零排放。；（2）原料及運輸也可能造成重大碳排放。；（3）包裝標誌不能替代盤查及驗證。；（4）完整邊界才能評估產品碳足跡。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F232","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"投資人發現ESG基金持有高排放企業，便認為必定違規。應如何判斷？","options":["先核對基金策略是否為排除、最佳同業或議合轉型，再查揭露","只要持有高排放企業，便一定違反所有ESG基金規則","只看基金名稱含有ESG，就不必檢視持股","只要高排放企業承諾淨零，基金便沒有漂綠風險"],"answer":0,"explain":"逐選項解析：（1）不同ESG策略可能納入高排放企業進行議合或轉型投資。；（2）是否違反須對照該基金公開策略與承諾。；（3）名稱不足以證明實際選股與管理方式。；（4）承諾仍需檢驗具體進度與基金策略一致性。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F233","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"企業報告只揭露減排百分比，不提供絕對排放量。應補充什麼？","options":["只揭露減排百分比即可，因絕對量不影響氣候風險","補充絕對排放量、基準年、計算邊界及產量變化","只公布綠色產品銷售額，不必盤查排放","以員工減碳活動照片取代數據"],"answer":1,"explain":"逐選項解析：（1）百分比可能受基準與產量變化影響，單獨使用不足。；（2）絕對量與基準資訊可判斷實際排放趨勢。；（3）綠色產品收入不等於企業總排放變化。；（4）活動照片不能替代可量測排放資料。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F234","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"銀行提供與減碳績效連動的貸款利率，企業指標容易操弄。應如何改善？","options":["把利率優惠全綁在企業自行填報、未查證的指標","只設定容易達成的單一年份目標，避免波動","採用具重大性、可量測及可獨立查證的績效指標","取消所有揭露義務，以降低企業行政成本"],"answer":2,"explain":"逐選項解析：（1）未經查證的自填數據容易遭操弄。；（2）過度容易的目標缺乏促進實際轉型的誘因。；（3）可衡量、具挑戰性及可查證指標有助降低漂綠風險。；（4）沒有揭露難以驗證利率連動是否合理。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F235","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"就學貸款與教育資金","q":"學生畢業後收入不穩定，擔心就學貸款開始還款。應先做什麼？","options":["透過不明代辦提供網銀密碼","畢業後失聯即可解除債務","認為學生貸款必然永遠免還","向承貸銀行查詢適用還款、緩繳或展延條件與期限"],"answer":3,"explain":"判斷關鍵：教育資金應比較資格、還款條件、實際成本、期限與詐騙風險。 本題應採取「向承貸銀行查詢適用還款、緩繳或展延條件與期限」。其他選項忽略關鍵限制或風險。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F236","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"就學貸款與教育資金","q":"家長比較就學貸款與信用卡學費分期，廣告都說負擔低。應如何評估？","options":["只看信用卡回饋不看分期費用","因為名為助學就不需 "F298","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"某基金配息高，但申購與買回費也高。應如何衡量？","options":["比較扣費後含息總報酬與投資期限","把申購手續費視為每年經理費","認為所有ETF與股票費用完全相同","把所有商品交易稅率視為完全相同"],"answer":0,"explain":"判斷關鍵：比較商品應依適用交易類型與現行規定核算稅費、費率及實際淨報酬。 本題應採取「比較扣費後含息總報酬與投資期限」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F299","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"學生在兩家券商交易同額股票，折扣不同但最低收費也不同。應如何選擇？","options":["只比較稅前報酬","只看券商折扣而忽略交易次數","依實際每筆金額估算應付手續費而非只看折扣比例","不查適用交易類型就套用稅率"],"answer":2,"explain":"券商手續費費率可依交易金額、折扣與最低收費而不同。應按「實際每筆交易金額 × 適用費率」並考量最低收費估算，不能僅憑宣傳折扣比較。一般股票賣出還須計入0.3%證交稅。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F300","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F301","topic":"存保與資產配置","q":"父親在A銀行活存120萬、定存140萬、外幣存款折合80萬，另有A銀行銷售的基金60萬；B銀行存款50萬。假設均為國內要保機構且不計利息，何者正確？","options":["A銀行全部400萬都算存保","A銀行存款最高保障300萬，基金不計入；B銀行另計","A銀行因外幣存款而全部失去保障","A、B銀行合計最高保障300萬"],"answer":1,"explain":"正解：A銀行存款340萬，存保上限300萬；基金不是存款；B銀行50萬另計。\n其他選項：選項1把基金誤當存款；選項3誤認外幣不受存保；選項4把不同要保機構合併","source":"中央存保與金融商品分類","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","concept":"存保歸戶+商品辨識","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F302","topic":"存保與流動性","q":"小芳有三個月後須支付的手術費220萬元。她在同一銀行已有定存260萬元，打算將手術費也放入同銀行，且希望兼顧存保與隨時動用。最適合先做什麼？","options":["將全部轉為同銀行長期定存以提高利率","先核對要保機構、合計保額及提前解約條件，必要時分散並保留活存","改買同銀行推薦的基金，因銀行銷售即可受存保","將存款分成十個同銀行帳戶，各帳戶享300萬元"],"answer":1,"explain":"正解：存保以同一存款人、同一要保機構歸戶，手術費還有短期流動性需求。\n其他選項：選項1忽略到期時間；選項3混淆投資與存款；選項4誤以帳戶數增加保障","source":"中央存保與財務規劃","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","concept":"保障額度+流動性","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F303","topic":"金融消費爭議","q":"阿偉向銀行申訴基金銷售說明不實，銀行第18天回覆拒絕退款。他收到回覆後想申請金融消費評議，何者最合理？","options":["須等銀行申訴滿30天才可申請","可自收到處理結果起60日內提出評議並附證據","必須先打贏民事官司才能申請","評議中心可直接判定業務員犯罪"],"answer":1,"explain":"正解：不接受金融服務業申訴處理結果者，得於收到結果起60日內申請評議，不必再等到第30天。\n其他選項：選項1混淆回覆與逾期；選項3誤加前置條件；選項4混淆評議與刑事司法","source":"金融消費爭議處理","official":"https://law.fsc.gov.tw/LawContent.aspx?id=GL000331","concept":"申訴回覆+60日","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F304","topic":"金融消費爭議","q":"小林4月1日提出金融消費申訴，銀行至5月1日仍未回覆。小林已保存掛號收據及商品說明書。下一步何者較符合程序？","options":["向評議中心申請評議並提出未回覆證據","繼續無限期等待銀行","要求評議中心先凍結所有銀行帳戶","直接把申訴當成法院勝訴判決"],"answer":0,"explain":"正解：金融業者逾30日未處理時，可在期限屆滿日起60日內申請評議。\n其他選項：選項2忽略法定救濟期限；選項3超出評議權限；選項4混淆程序與判決","source":"金融消費爭議處理","official":"https://law.fsc.gov.tw/LawContent.aspx?id=GL000331","concept":"申訴逾期+證據","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F305","topic":"交易成本比較","q":"小儒同日分別賣出一般上市股票10萬元與一般股票型ETF 10萬元，不計手續費，依一般適用稅率，兩筆證交稅合計多少？","options":["300元","400元","200元","500元"],"answer":1,"explain":"正解：股票賣出0.3%為300元，股票型ETF賣出0.1%為100元，合計400元。\n其他選項：選項1漏算ETF；選項3將稅率混淆；選項4多計費用","source":"金融商品費用","official":"https://www.twse.com.tw/zh/about/company/guide.html","concept":"股票與ETF賣出稅","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F306","topic":"交易成本比較","q":"甲持有一般股票與債券ETF各20萬元，近期需變現10萬元，假設兩者市價波動與手續費相同，且符合現行債券ETF免徵證交稅規定。僅比較證交稅，哪項正確？","options":["賣一般股票與債券ETF的證交稅相同","賣債券ETF的證交稅較低，但仍應檢查優惠期限","債券ETF須按0.3%課稅","股票賣出免證交稅，債券ETF課0.1%"],"answer":1,"explain":"正解：一般股票賣出0.3%，符合規定的債券ETF在現行優惠期間免徵；優惠有期限，不可當永久規則。\n其他選項：選項1忽略商品差異；選項3套用股票稅率；選項4將稅率倒置","source":"金融商品費用","official":"https://www.twse.com.tw/zh/about/company/guide.html","concept":"ETF稅費+時效","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F307","topic":"投資組合與流動性","q":"高三學生預計八個月後繳交海外交換費12萬元，現有15萬元，另有長期投資部位。最合宜的規劃是？","options":["將12萬元全投入波動較高的單一產業ETF","先將近期確定支出留在低波動且可動用工具，餘額再評估投資","只要ETF長期平均報酬為正，八個月後就不會虧","借信用卡循環額度支付交換費以保留投資"],"answer":1,"explain":"正解：確定且短期的負債需優先匹配資金到期與流動性；長期投資資金才能承擔較高波動。\n其他選項：選項1資產期限錯配；選項3將長期統計誤當短期保證；選項4以高成本負債增加風險","source":"財務規劃與ETF","official":"","concept":"資產負債期限配對","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F308","topic":"ETF持股重疊","q":"小安同時買了台灣大型股ETF、科技產業ETF及高股息ETF，發現前三大成分股高度重疊。最需要修正的認知是？","options":["ETF檔數增加不一定代表分散效果同比增加","應查看底層持股及產業權重","可以評估跨產業及跨資產類別的風險來源","三檔ETF名稱不同，風險必然互不相關"],"answer":3,"explain":"正解：名稱與策略不同不代表底層曝險獨立；應穿透查看成分股與產業集中度。\n其他選項：選項1是正確風險認知；選項2是合理查核方式；選項3是合理分散方向","source":"投資與資產配置","official":"","concept":"底層曝險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F309","topic":"家庭負債與保險","q":"雙薪家庭每月可支配收入9萬元，房貸4萬元、托育2萬元、生活費2萬元，只有1個月預備金。業務員建議先加碼長期高保費儲蓄型保單。何者較合理？","options":["先檢視緊急預備金、必要保障及繳費持續能力","只比較保單宣告利率","只要保單可解約，便可當作等同活存","房貸與托育固定支出不影響保費負擔"],"answer":0,"explain":"正解：家庭每月剩餘現金流僅1萬元且預備金不足，應先確保必要保障與資金彈性。\n其他選項：選項2忽略費用與流動性；選項3忽略解約成本與風險；選項4忽略現金流約束","source":"保險與財務規劃","official":"","concept":"現金流+保費可負擔","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F310","topic":"保險理賠與舉證","q":"阿成手術前查詢醫療險，業務員口頭說「一定會賠」，但保單對特定手術有給付條件。事故後發生爭議，哪種作法最完整？","options":["僅以業務員口頭說明作為唯一依據","保存投保及說明紀錄，核對條款、診斷書與給付項目，再循申訴程序","在社群貼文後即視為保險公司同意理賠","只要有醫院收據，任何費用都能全額理賠"],"answer":1,"explain":"正解：理賠需依契約、實際醫療資料及適用給付條件判斷；銷售說明爭議也要保全證據。\n其他選項：選項1證據不完整；選項3社群發文無契約效果；選項4忽略保障範圍與限額","source":"保險完整講義與金融消費爭議","official":"","concept":"條款+證據+救濟","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F311","topic":"信託與照護","q":"獨居長者希望房租每月優先支付照護機構、其餘再給付生活費，且家人不得任意一次提領。哪個安排較能達成目的？","options":["在契約中明確約定信託財產、受益人、給付順位及監督機制","把所有租金現金交給最親近的親戚","直接指定銀行理專持有提款卡及密碼","以購買單一股票代替支付約定"],"answer":0,"explain":"正解：信託可用契約建立財產管理、受益給付與監督安排，但需評估費用及實務執行。\n其他選項：選項2欠缺可稽核機制；選項3有帳戶安全與倫理風險；選項4無法穩定匹配照護支出","source":"信託2.0與高齡金融","official":"","concept":"信託契約設計","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F312","topic":"以房養老","q":"退休者想申辦以房養老，每月領款用於生活，但擔心未來升息及到期清償。哪個問題最值得簽約前向銀行確認？","options":["貸款利率、利息累積、撥款方式及到期清償條件","銀行大廳是否有專屬櫃檯","房價過去十年漲幅能否保證未來","子女是否願意替銀行做廣告"],"answer":0,"explain":"正解：逆向抵押貸款仍是借款，須確認利息、契約期限、房屋擔保與清償安排。\n其他選項：選項2不影響主要財務風險；選項3過去房價不保證未來；選項4與契約無關","source":"以房養老講義","official":"","concept":"逆向抵押現金流","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F313","topic":"防詐與洗錢","q":"二手交易買家匯入比售價多3萬元，稱轉錯帳請賣家把差額轉至另一人帳戶。賣家尚未寄貨。何者風險控制較佳？","options":["確認入帳後立即依買家指定帳戶退款","保留交易紀錄，向銀行查證來源並循正式退款程序","先把款項換成虛擬通貨再返還","要求買家傳自拍照即可證明款項合法"],"answer":1,"explain":"正解：第三方帳戶退款可能被用於詐欺金流分層；應透過金融機構查核與處理。\n其他選項：選項1可能協助異常資金移轉；選項3加深資金追查困難；選項4身分照片無法確認資金來源","source":"防制洗錢與帳戶安全","official":"","concept":"第三方退款","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F314","topic":"防詐與家庭財務","q":"家長收到孩子通訊軟體訊息，要求立即匯款8萬元支付醫療費，並稱手機壞了不能通話。最適當的第一步是？","options":["透過既有電話或其他獨立管道核實身分與醫療資訊","依訊息附上的帳號先匯一半","要求對方再傳一張模糊病歷即可匯款","把網銀驗證碼傳給對方確認親屬關係"],"answer":0,"explain":"正解：急迫性與無法通話是常見社交工程警訊，應以原有可信管道獨立查證。\n其他選項：選項2仍可能受騙；選項3文件可偽造且未獨立驗證；選項4會暴露帳戶控制資訊","source":"金融詐騙與帳戶安全","official":"","concept":"獨立回撥驗證","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F315","topic":"數位支付與風險","q":"學生手機遺失，內有已登入的支付App及銀行App。學生能借到另一支手機，最優先的處置組合為何？","options":["只刪除社群媒體貼文","立即聯繫金融機構停用或限制相關服務、變更憑證並檢查交易","等月底帳單出來再處理","將密碼傳給同學請其代為登入測試"],"answer":1,"explain":"正解：應優先降低未授權交易風險並保全異常交易證據。\n其他選項：選項1未處理金融權限；選項3延誤止損；選項4增加憑證外洩","source":"數位金融與防詐","official":"","concept":"設備遺失應變","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F316","topic":"虛擬資產與資安","q":"投資人使用去中心化金融平台時，錢包跳出「無限額授權代幣支出」要求。何者判斷較周全？","options":["先查核合約與授權範圍，避免為小額交易給予不必要的無限授權","只要畫面有鎖頭圖示即可放心","授權不涉及資產控制，與安全無關","只要平台承諾高收益就不需查看交易內容"],"answer":0,"explain":"正解：智能合約授權可能讓合約在授權範圍內轉移資產，需審視地址、權限及可撤銷性。\n其他選項：選項2圖示不足以證明合約安全；選項3誤解授權效果；選項4把收益宣稱當安全證據","source":"金融科技與虛擬資產","official":"","concept":"智能合約授權","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F317","topic":"ESG與漂綠","q":"某企業宣稱「2050淨零」，但只公布辦公室節電成果，未揭露主要製程排放與減碳路徑。投資人最應要求哪項資訊？","options":["涵蓋重大排放來源的基準年、範疇、階段目標與查證資料","企業標誌是否改成綠色","廣告中出現多少棵樹","高階主管是否常參加環保活動"],"answer":0,"explain":"正解：減碳可信度取決於重大排放涵蓋、可衡量目標、執行進度及可驗證資訊。\n其他選項：選項2屬視覺宣傳；選項3無法代替排放數據；選項4不足以衡量減碳成果","source":"綠色金融與淨零轉型","official":"","concept":"重大性與可驗證性","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F318","topic":"綠色金融與授信","q":"銀行審查高排放工廠轉型貸款：甲只承諾未來採購綠電；乙提出設備投資、分年排放減量目標與第三方查核機制。若其他條件相近，哪種審查較合理？","options":["僅因甲使用「綠色」名稱便給較佳條件","重視乙可量化的轉型路徑，並持續追蹤履約與減碳績效","只看兩家廠房外觀","認為高排放產業無法有任何轉型融資"],"answer":1,"explain":"正解：轉型金融評估重點是可信的減排路徑、資金用途與後續績效追蹤。\n其他選項：選項1以標籤代替實證；選項3與減排無直接關聯；選項4忽略轉型金融的目的","source":"綠色金融與轉型金融","official":"","concept":"轉型計畫可信度","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F319","topic":"就學貸款與還款","q":"畢業生剛就業，月薪3.4萬元，租金1.2萬元、生活費1.3萬元，另有信用卡循環欠款。就學貸款也即將開始還款。何者最適當？","options":["先盤點各筆負債利率、還款條件及現金流，必要時向承貸銀行詢問合法緩繳措施","直接以信用卡循環繳就學貸款，不計成本","只要就學貸款利率低，就不需查看還款通知","為求投資獲利，將所有可支配收入投入單一股票"],"answer":0,"explain":"正解：不同負債成本與法定還款安排需整體評估；可先了解官方適用的緩繳或還款協助資格。\n其他選項：選項2可能擴大高息債務；選項3忽略履約責任；選項4增加現金流風險","source":"就學貸款與個人理財","official":"","concept":"負債排序與現金流","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F320","topic":"信用與BNPL","q":"小宇每月收入1.8萬元，已有分期月付6千元，又看到零利率BNPL每月付5千元買電腦，還需繳學費4千元。下列判斷何者較合理？","options":["即使零利率，也應先算全部固定支出與違約風險","零利率代表不會有任何逾期成本","BNPL不算負擔，所以可以不列入預算","只看每期金額低於月薪就足夠"],"answer":0,"explain":"正解：原分期6千+新分期5千+學費4千=1.5萬，僅餘3千支付生活費，現金流壓力過高。\n其他選項：選項2忽略可能的逾期費用；選項3忽略付款義務；選項4忽略其他必要支出","source":"金融科技與消費信用","official":"","concept":"零利率陷阱","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F321","topic":"利率與債券","q":"投資人有五年期固定利率債券，計畫一年後出售支付裝潢費。若市場利率上升且其他條件不變，何者最合理？","options":["債券價格通常下跌，短期出售可能承受損失","固定票息保證一年後市價不變","市場利率上升會使既有固定票息債券價格同步上升","債券有到期日就不會有任何流動性風險"],"answer":0,"explain":"正解：既有固定票息債券相對吸引力下降，市價通常與市場利率反向變動；提前出售暴露價格風險。\n其他選項：選項2混淆票息與市價；選項3方向相反；選項4忽略提前出售及市場流動性","source":"金融市場與投資風險","official":"","concept":"債券久期+資金期限","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F322","topic":"通膨與實質報酬","q":"小薇投資一年名目報酬率6%，同期物價上漲4%。若忽略稅費，哪個敘述最接近實際購買力變化？","options":["實質報酬約1.9%，不是直接增加6%購買力","購買力增加10%","購買力減少4%","實質報酬固定等於6%減去4%再乘本金兩次"],"answer":0,"explain":"正解：精確實質報酬=(1.06/1.04)-1≈1.92%，不能只看名目報酬。\n其他選項：選項2把報酬與通膨相加；選項3忽略名目成長；選項4公式與單位錯誤","source":"貨幣與通膨講義","official":"","concept":"費雪方程近似","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F323","topic":"退休現金流","q":"退休夫妻每月基本支出4.8萬元，固定年金合計3萬元，另有基金每年配息20萬元但配息可能變動。評估退休安全性時，最合理的作法是？","options":["將基金配息視為保證且永遠不變","先估計每月缺口、預留流動資金，並對配息下降與長壽情境壓力測試","只看基金去年殖利率","因有自住房就不需估算醫療費"],"answer":1,"explain":"正解：固定收入與支出差額1.8萬元/月，配息有波動與本金變化風險，須做壓力測試。\n其他選項：選項1把不確定收入當保證；選項3忽略總報酬與風險；選項4忽略醫療及照護","source":"退休規劃與投資","official":"","concept":"現金流缺口+壓力測試","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F324","topic":"理專適合度與風險","q":"75歲客戶需兩年內支付長照費，理專推薦六年期且提前解約成本高的商品，理由是「預期報酬較高」。最關鍵的評估為何？","options":["是否符合客戶資金用途、流動性需求及風險承受能力","理專的銷售排名","商品廣告色彩是否吸引人","只要預期報酬高就可忽略到期限制"],"answer":0,"explain":"正解：適合度評估須對應客戶目標與資金使用期限，不能僅依預期報酬推薦。\n其他選項：選項2是銷售者指標；選項3與適合度無關；選項4忽略提前解約成本","source":"理專十誡與公平待客","official":"","concept":"高齡客戶適合度","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F325","topic":"跨主題決策","q":"一名自由工作者有20萬元預備金、信用卡循環欠款8萬元、下月確定稅款6萬元，朋友推薦高波動加密資產投資。何者最合理？","options":["先保留稅款與必要預備金，評估優先償還高成本債務後再考慮投資","先把20萬元全部投入加密資產以爭取高報酬","稅款可以等投資獲利後再支付","信用卡循環欠款只要按最低應繳就沒有成本"],"answer":0,"explain":"正解：確定義務與高成本債務優先於投機性資產，且自由工作收入不穩更需流動性。\n其他選項：選項2放大短期資金風險；選項3忽略法定支付期限；選項4忽略循環利息","source":"財務規劃與金融科技","official":"","concept":"流動性+高息債+投資風險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F326","topic":"投資與匯率","q":"學生一年後需付美元學費，現有新臺幣存款，考慮把全部換成美元高波動股票基金。哪項分析較周全？","options":["美元資產就一定與美元學費金額同步","區分匯率曝險與股票市場曝險，學費資金宜優先降低到期金額不確定性","股票基金名稱有美元就不會虧損","只看基金配息率即可判斷足夠繳學費"],"answer":1,"explain":"正解：美元計價基金仍有淨值波動；資產幣別匹配不等於消除市場風險。\n其他選項：選項1忽略淨值波動；選項3混淆計價幣別與本金保障；選項4配息不等於總報酬","source":"金融商品分類與投資風險","official":"","concept":"幣別匹配+市場風險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F327","topic":"防詐與數位帳戶","q":"詐騙集團假冒銀行發簡訊稱「帳戶即將凍結」，附網址要求輸入帳密及簡訊驗證碼。學生已點入網址但尚未輸入。哪項最適當？","options":["關閉頁面，改由銀行官方App或自行查得的客服管道確認","在簡訊網址輸入帳密但不輸入驗證碼","轉傳給同學請大家一起測試網址","回覆簡訊要求詐騙者提供工作證"],"answer":0,"explain":"正解：釣魚連結可能仿冒官方網站，應由獨立可信管道核實，不應在可疑頁面輸入憑證。\n其他選項：選項2仍暴露帳密；選項3擴散風險；選項4無法建立可信身分","source":"防詐與數位金融","official":"","concept":"釣魚連結應變","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F328","topic":"資產配置與相關性","q":"市場大跌時，甲組合有三檔同產業股票基金；乙組合含不同資產類別，且各資產風險來源不完全相同。哪個推論最合理？","options":["乙的分散效果可能較佳，但仍不能保證不虧損","甲持有三檔基金必定比乙分散","乙因資產不同而保證正報酬","基金檔數就是風險分散的唯一指標"],"answer":0,"explain":"正解：分散效果取決於資產風險來源與相關性，而非商品數量；市場系統性風險仍存在。\n其他選項：選項2只看數量；選項3把分散誤當保本；選項4忽略相關性","source":"金融商品分類與風險管理","official":"","concept":"相關性與分散","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F329","topic":"保險與退休","q":"退休者已有醫療實支實付保單，但照護機構每月生活照護費不一定屬於住院醫療費用。最適合的評估是？","options":["檢查醫療險理賠範圍，另估算長期照護現金流與相關保障缺口","認定實支實付會支付所有照護費","因已有醫療險就無需準備任何現金","只看保單名稱有「醫療」即可確認理賠"],"answer":0,"explain":"正解：醫療費用補償與長照日常支出性質不同，須以契約條款與實際需求核對。\n其他選項：選項2混淆保障事故與費用；選項3忽略現金需求；選項4忽略條款細節","source":"保險與高齡照護","official":"","concept":"醫療險與長照缺口","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F330","topic":"信託與受益安排","q":"家長為身心障礙成年子女設立信託，希望按月支付生活費並避免一次領走。哪個條款最值得明確約定？","options":["受益給付的金額、用途、條件及受託人報告方式","只寫「將來再討論」而不訂給付原則","由理專個人持有所有金融密碼","完全不指定受益人與財產範圍"],"answer":0,"explain":"正解：明確契約條款才能讓財產管理與受益目的可執行、可查核。\n其他選項：選項2不利執行；選項3增加挪用與安全風險；選項4缺乏必要安排","source":"信託2.0講義","official":"","concept":"受益給付條款","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F331","topic":"貨幣政策與債券","q":"中央銀行升息後，學生觀察到定存新利率上升、手中長天期固定票息債券市價下跌。何者最能同時解釋？","options":["新存款利率與既有債券市價受市場利率變化影響，但方向可能不同","升息必然讓所有金融資產價格同時上漲","債券票息固定表示市價固定","定存利率與債券價格都與利率無關"],"answer":0,"explain":"正解：市場利率上升時新存款條件可能提高；既有固定票息債券折現價值通常下降。\n其他選項：選項2忽略不同資產特性；選項3混淆票息與交易價格；選項4否認利率傳導","source":"中央銀行與金融市場","official":"","concept":"利率傳導","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP001","topic":"貨幣政策與總體金融","q":"景氣連續低迷、失業率升高且物價漲幅溫和。央行希望增加市場流動性，哪個政策組合較一致？","options":["提高存款準備率並賣出債券","降低重貼率並公開市場買入債券","提高重貼率但買入債券","降低重貼率並提高存款準備率"],"answer":1,"explain":"正解：降低重貼率與買入債券均偏向擴張性貨幣政策，有助增加流動性。\n錯誤選項解析：（1）兩者均偏緊縮，方向相反；（3）重貼率與公開市場操作方向互相抵銷；（4）降低重貼率偏寬鬆，但提高準備率偏緊縮。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP002","topic":"貨幣政策與總體金融","q":"物價持續快速上漲，央行決定公開市場賣出政府債券。某銀行財務主管應先預期哪種直接效果？","options":["銀行體系準備金可能減少，短期資金趨緊","銀行準備金因買入債券而增加","銀行放款能力不受任何影響","民眾持有債券的票面利率會自動改寫"],"answer":0,"explain":"正解：央行賣出債券，買方支付資金，銀行體系流動性通常收縮。\n錯誤選項解析：（2）這是央行買入債券時較可能的方向；（3）流動性變動可能影響銀行放款能力；（4）既有債券票面利率不會因交易自動更改。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP003","topic":"貨幣政策與總體金融","q":"小芳持有固定利率、距到期尚久的政府公債，市場預期政策利率上升。她想在到期前賣出，主要須評估什麼？","options":["債券票息將隨市場利率同步上升","既有債券價格可能下跌，且長天期價格較敏感","公債本金必因升息而增加","到期殖利率提高代表她現在賣出一定獲利"],"answer":1,"explain":"正解：固定票息債券與市場利率通常反向變動；存續期間越長通常越敏感。\n錯誤選項解析：（1）固定利率票息依發行條件，不自動上調；（3）市場價格可能跌，非本金自動增加；（4）殖利率上升可能伴隨現價下跌。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP004","topic":"貨幣政策與總體金融","q":"央行降息後，企業想投資擴廠，但經理提醒「降息不等於股價必漲」。哪項理由最完整？","options":["折現率下降一定抵銷營收下滑","股價只取決於政策利率，不受獲利影響","降息可能降低資金成本，但市場也可能反映衰退風險","央行降息後所有企業都能以相同利率借款"],"answer":2,"explain":"正解：股價同時受折現率、企業現金流與市場預期影響。\n錯誤選項解析：（1）營收與獲利下滑仍可能壓低估值；（2）企業獲利及風險溢酬同樣重要；（4）信用風險不同，借款條件也不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP005","topic":"貨幣政策與總體金融","q":"某家庭的房貸採浮動利率，央行啟動緊縮政策。家庭財務規劃最適合採取何種做法？","options":["先檢視利率重訂條款並試算月付金增加幅度","假設每家銀行明天同步調高同一幅度","立即把緊急預備金全數投入股票","認為政策升息只影響新貸款"],"answer":0,"explain":"正解：浮動利率房貸可能依契約與指標利率調整，應做現金流壓力測試。\n錯誤選項解析：（2）調整時點與幅度取決於契約及銀行指標；（3）緊縮時保留緊急預備金更重要；（4）既有浮動利率貸款也可能受影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP006","topic":"貨幣政策與總體金融","q":"出口商報價美元、主要成本以新臺幣支付。若其他因素不變，新臺幣升值，哪項風險最值得優先管理？","options":["同額美元收入換回新臺幣可能減少","同額美元收入換回新臺幣一定增加","出口商原料成本必定全面上升","匯率變動不會影響跨幣別收入"],"answer":0,"explain":"正解：新臺幣升值時，每美元可換得的新臺幣減少，影響未避險的外幣收入。\n錯誤選項解析：（2）方向相反；（3）進口原料成本未必上升，可能下降；（4）不同幣別收支存在換算風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP007","topic":"貨幣政策與總體金融","q":"進口商需三個月後支付美元貨款，央行升息可能支持本幣，但公司不願賭匯率。哪項決策較合理？","options":["只憑升息訊號取消所有避險","依付款時點評估遠期外匯或自然避險","假設匯率只受本國利率決定","借更多美元且不評估匯率曝險"],"answer":1,"explain":"正解：匯率受多種因素影響，企業應依實際幣別現金流管理曝險。\n錯誤選項解析：（1）升息不保證本幣升值；（3）資本流動、外國利率等也影響匯率；（4）擴大外幣負債可能增加曝險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP008","topic":"貨幣政策與總體金融","q":"央行調降存款準備率後，銀行主管說「可放款資金增加，因此信用風險不重要」。應如何評價？","options":["完全正確，準備率可取代徵信","錯誤，準備金約束可能放鬆，但仍須審核還款能力","錯誤，降低準備率必使所有貸款利率上升","完全正確，銀行可無限創造貸款"],"answer":1,"explain":"正解：準備率變動影響流動性約束，不免除授信、資本與風險管理要求。\n錯誤選項解析：（1）準備率不是信用審查替代品；（3）利率變化不具此必然方向；（4）放款仍受資本、流動性與信用風險限制。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP009","topic":"貨幣政策與總體金融","q":"央行擬提高重貼率，某學生主張「這與公開市場賣出債券一樣，都是偏緊縮工具」。哪項判斷最佳？","options":["方向一致，但傳導管道與效果不完全相同","兩者必然使貨幣供給增加","提高重貼率屬擴張，賣債屬緊縮","只有賣債影響利率，重貼率完全無關"],"answer":0,"explain":"正解：提高重貼率與賣債均偏緊縮，但分別經由央行融通成本與市場流動性傳導。\n錯誤選項解析：（2）兩者皆非增加流動性的典型作法；（3）提高重貼率偏緊縮；（4）重貼率變動可能影響資金成本與利率預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP010","topic":"貨幣政策與總體金融","q":"通膨下降但仍高於目標，經濟成長放緩。央行是否應立刻大幅降息？哪種分析最符合決策思維？","options":["只看失業率就能決定","只看最近一個月股價就能決定","同時評估通膨持續性、成長、就業與預期，再權衡風險","通膨只要比上月低就代表物價已下跌"],"answer":2,"explain":"正解：貨幣政策需權衡物價穩定與經濟情勢，通膨下降不等於物價水準下降。\n錯誤選項解析：（1）忽略物價風險；（2）股價不是唯一政策依據；（4）通膨率降低通常是價格漲得較慢。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP011","topic":"貨幣政策與總體金融","q":"某公司持有短期存款與長期固定利率債券。市場利率上升時，哪項比較較合理？","options":["兩者市場價值都會等幅上升","長期固定利率債券通常承受較大的價格波動風險","短期存款必產生與長債相同的資本損失","長債因票息固定所以市價不會改變"],"answer":1,"explain":"正解：長期固定利率債券通常利率敏感度較高；短期存款重訂價及流動性特性不同。\n錯誤選項解析：（1）利率上升通常不利既有固定利率債券市價；（3）存款與債券的價格機制不同；（4）固定票息不代表固定市場價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP012","topic":"貨幣政策與總體金融","q":"政府擴大支出刺激景氣，同期央行升息抑制通膨。學生要分析總體效果，哪個說法較好？","options":["兩種政策方向可能互相拉扯，須看力度與時點","財政政策與貨幣政策一定同向","只要央行升息，政府支出就失去所有效果","政府支出增加代表央行必須同步降息"],"answer":0,"explain":"正解：擴張性財政與緊縮性貨幣政策可能對總需求產生不同方向的影響。\n錯誤選項解析：（2）兩者可採不同方向；（3）影響不會機械式完全抵銷；（4）政策協調不等於必須同步降息。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP013","topic":"貨幣政策與總體金融","q":"銀行調升新臺幣定存利率，退休族想把所有資產改放一年期定存。哪個提醒最適當？","options":["定存名目利率較高就必定超越通膨","應比較稅後實質報酬、流動性與存保額度","利率上升後所有股票都不值得持有","銀行定存與長期債券價格波動完全相同"],"answer":1,"explain":"正解：資產配置須同時考量實質購買力、流動性、分散及存款保障。\n錯誤選項解析：（1）名目利率不等於實質報酬；（3）股票風險報酬不能單憑升息判定；（4）定存與債券的風險特性不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP014","topic":"貨幣政策與總體金融","q":"央行買入公債後，有人說「市場資金增加，企業融資成本必立即下降」。哪個修正較精確？","options":["資金供給可能增加，但貸款利率仍受風險與傳導時滯影響","買債會立即減少銀行準備金","所有企業借款利率依法必相同","公開市場買債只改變票面利率，不影響流動性"],"answer":0,"explain":"正解：公開市場買入債券通常增加流動性，但政策傳導非即時或一致。\n錯誤選項解析：（2）買債一般增加而非減少流動性；（3）信用條件及風險差異造成利率不同；（4）交易影響市場資金與債券價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP015","topic":"貨幣政策與總體金融","q":"臺灣進口能源價格大漲引發物價上升，央行考慮升息。哪個判斷較完整？","options":["升息能立即增加全球能源供給","升息可能抑制需求及通膨預期，但無法直接消除供給衝擊","升息一定讓能源進口量歸零","只要是成本推動通膨，貨幣政策就沒有任何影響"],"answer":1,"explain":"正解：貨幣政策主要影響需求與預期，對供給衝擊本身的處理有限。\n錯誤選項解析：（1）利率工具無法直接創造能源；（3）能源需求不會機械式歸零；（4）政策仍可能影響次輪通膨及預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP016","topic":"貨幣政策與總體金融","q":"某出口公司同時借美元貸款並收美元貨款。新臺幣貶值時，哪項風險判斷最合理？","options":["美元收入與美元負債可能部分自然抵銷匯率曝險","只有美元收入受匯率影響，美元負債不受影響","新臺幣貶值會使美元負債折算新臺幣必然下降","自然避險表示收付款時間差完全不重要"],"answer":0,"explain":"正解：相同幣別的收支可能形成自然避險，但金額與到期日須匹配。\n錯誤選項解析：（2）美元負債折算也受匯率影響；（3）貶值時美元負債折算成本通常增加；（4）期限錯配仍有現金流與匯率風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP017","topic":"貨幣政策與總體金融","q":"升息後，一家高負債企業與一家現金充裕企業的股價反應不同。哪個分析最有說服力？","options":["兩家企業必須同幅下跌","負債結構、利息保障倍數與獲利前景會造成不同影響","企業股價只由央行利率決定","現金多的企業永遠不受景氣衰退影響"],"answer":1,"explain":"正解：利率對企業的影響取決於財務結構、現金流及市場預期。\n錯誤選項解析：（1）不同企業曝險不同；（3）股價同時反映獲利與風險；（4）景氣下滑仍可能影響現金充裕企業。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP018","topic":"貨幣政策與總體金融","q":"央行宣布維持利率不變，市場債券殖利率卻上升。哪項解釋較合理？","options":["市場利率只能與政策利率完全同步","債券殖利率還受未來政策預期、通膨與期限溢酬影響","殖利率上升代表央行一定偷偷升息","政策利率不變，債券價格就不能變動"],"answer":1,"explain":"正解：市場殖利率反映預期與風險溢酬，並非只由當期政策利率決定。\n錯誤選項解析：（1）兩者非完全同步；（3）市場變動不等於央行改變政策利率；（4）市場價格會隨預期與供需變動。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP019","topic":"貨幣政策與總體金融","q":"央行緊縮時，學生想用「本幣一定升值、出口一定減少」預測貿易順差。老師應如何修正？","options":["保留方向性推論，但強調外國景氣、供應鏈與匯率預期也會影響結果","只要升息，順差一定歸零","緊縮政策不可能影響匯率","貿易收支只看進口，不必看出口"],"answer":0,"explain":"正解：講義提供典型傳導方向，但匯率與貿易收支結果取決於多重因素。\n錯誤選項解析：（2）順差不會機械式歸零；（3）利差可能影響資金流動與匯率；（4）貿易收支同時受出口與進口影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP020","topic":"貨幣政策與總體金融","q":"家庭同時持有房貸、債券ETF與緊急預備金。預期進入升息循環，哪個綜合行動最合理？","options":["評估房貸重訂價風險、債券存續期間並維持足夠現金","因債券ETF有配息，就忽略淨值波動","將全部緊急預備金用來加碼長天期債券ETF","認為升息對浮動房貸與債券ETF影響必相同"],"answer":0,"explain":"正解：升息對負債現金流與固定收益資產價格的影響不同，應分別衡量。\n錯誤選項解析：（2）配息不等於沒有價格風險；（3）動用全部備用金會提高流動性風險；（4）兩種商品的利率傳導與風險不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX001","topic":"貸款與信用","q":"阿翰要借20萬元，甲銀行名目利率3.2%但收開辦費，乙銀行利率3.6%免開辦費；兩者還款期間相同。應優先取得哪項資料才能公平比較？","options":["兩案的總費用年百分率與還款明細","兩案的廣告名目利率排名","兩案的核貸速度與分行數","兩案的銀行資本額"],"answer":0,"explain":"選項（1）：APR將利息與相關費用按規定納入比較，並須核對還款條件。\n選項（2）：名目利率忽略開辦費，可能低估實際成本。\n選項（3）：核貸速度是便利性，不是完整借貸成本。\n選項（4）：銀行資本額不直接決定這兩筆貸款的總成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX002","topic":"貸款與信用","q":"小恩有兩張循環信用卡，利率較高的卡片欠款8萬元、利率較低的欠款3萬元，且兩卡均未逾期。若有額外1萬元可還款，何者較能減少後續利息？","options":["先平均分給兩張卡","優先償還利率較高的卡片本金","優先還餘額較小的卡片不看利率","只繳兩張卡最低應繳金額"],"answer":1,"explain":"選項（1）：平均分配可能讓高利率餘額保留較久。\n選項（2）：在其他條件相同時，優先降低高利率本金通常節省較多利息。\n選項（3）：餘額大小與節省利息不必然一致。\n選項（4）：最低應繳通常無法有效減少循環利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX003","topic":"貸款與信用","q":"一筆浮動利率房貸約定每季重訂價，央行今天宣布升息，但借款人下週才收到帳單。哪個判斷最恰當？","options":["下一期帳單一定立刻增加相同幅度","央行升息後房貸契約自動變固定利率","應確認指標利率、加碼與重訂價日","只要銀行未通知就不會改變"],"answer":2,"explain":"選項（1）：是否立即調整取決於契約與重訂價日。\n選項（2）：升息不會自動改變貸款的固定或浮動性質。\n選項（3）：契約指標及調整時點才是判斷實際月付變動的關鍵。\n選項（4）：通知義務與實際計息條件須依契約和法規判斷。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX004","topic":"貸款與信用","q":"一位學生取得低利就學貸款，同時手上有僅供生活緊急支出的3萬元。畢業前想提前還款，哪個思考最完整？","options":["先查是否有提前還款限制，再比較利息節省與緊急預備金需求","只要利率低就永遠不應提前還款","把全部生活預備金一次還清","先用信用卡預借現金償還就學貸款"],"answer":0,"explain":"選項（1）：需同時衡量契約、利息與現金流風險。\n選項（2）：低利率不代表提前還款在任何情境都不適合。\n選項（3）：清空緊急預備金可能導致更高成本的臨時借款。\n選項（4）：預借現金常伴隨較高費用與利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX005","topic":"貸款與信用","q":"房貸寬限期剩兩個月，小婷每月收入固定，卻把目前只繳利息的金額當作未來月付。最該先做什麼？","options":["等寬限期結束再看銀行帳單","假設本金會自動減少","只用目前利息支出編列未來預算","試算開始攤還本金後的月付並預留現金流"],"answer":3,"explain":"選項（1）：延後評估可能錯失調整支出的時間。\n選項（2）：只繳利息時本金通常不會因時間經過而減少。\n選項（3）：目前月付低估未來本息攤還負擔。\n選項（4）：寬限期後本息攤還通常增加月付，應先試算。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX006","topic":"貸款與信用","q":"小豪信用卡額度10萬元，刷卡7萬元後決定只繳最低應繳；下個月又要申請車貸。哪項風險評估較完整？","options":["只要沒遲繳，負債就不影響任何審核","循環餘額與負債比可能影響授信評估","信用卡額度高代表收入一定高","最低應繳金額就是全部借款成本"],"answer":1,"explain":"選項（1）：未逾期不代表授信機構不考量既有負債。\n選項（2）：既有負債及還款能力可能列入信用審核。\n選項（3）：額度由多種因素決定，不能直接等同收入。\n選項（4）：最低應繳不等於剩餘本金與全部利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX007","topic":"貸款與信用","q":"某分期購物標榜「零利率」，但必須支付不可退還的服務費1,500元。購物者如何判斷是否划算？","options":["只比較每月分期金額","把服務費當成商品折扣","比較含服務費的總支付與其他付款方式","只看是否有銀行合作"],"answer":2,"explain":"選項（1）：月付低不代表總支付較低。\n選項（2）：服務費是成本而非折扣。\n選項（3）：零名目利率仍可能存在費用，須比較總成本。\n選項（4）：合作銀行並不保證該方案最便宜。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX008","topic":"投資與風險","q":"同樣投資10萬元，甲ETF集中單一科技產業，乙ETF涵蓋多個產業。小君已有大量科技公司股票，哪項配置考量較合理？","options":["只比較哪檔去年漲幅高","因甲持股數多就一定較分散","乙ETF名稱有大盤就不需看持股","檢查與既有部位的產業重疊及集中風險"],"answer":3,"explain":"選項（1）：歷史漲幅無法反映整體資產重疊。\n選項（2）：多檔同產業股票仍可能高度相關。\n選項（3）：ETF名稱不替代實際持股分析。\n選項（4）：應從整體投資組合檢查集中度。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX009","topic":"投資與風險","q":"債券基金配息率5%，但今年淨值下跌8%。投資人想知道是否真的賺錢，應如何評估？","options":["將配息與淨值變動一起納入總報酬","配息率5%即表示全年報酬5%","只看收到的現金不看本金","因債券基金配息就排除價格風險"],"answer":0,"explain":"選項（1）：總報酬需同時計入價格變化與現金分配。\n選項（2）：配息率不等於總報酬率。\n選項（3）：忽略淨值可能高估收益。\n選項（4）：債券基金仍受利率與信用風險影響。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX010","topic":"投資與風險","q":"甲股票報酬率預估12%但可能大幅虧損；乙定存利率2%且有適用的存保保障。半年後必須支付學費的資金應如何安排？","options":["全押甲股票以提高期望報酬","以保本與到期流動性為主要考量","把學費借出去換更高利息","只看預期報酬率不看用途"],"answer":1,"explain":"選項（1）：短期必需支出不宜承擔無法承受的價格波動。\n選項（2）：資金用途與使用期限優先於追求高報酬。\n選項（3）：私人借貸可能增加違約與流動性風險。\n選項（4）：預期報酬不能取代期限與風險評估。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX011","topic":"投資與風險","q":"一檔海外債券ETF以美元計價，債券價格上漲3%，但新臺幣同期明顯升值。以新臺幣計價的報酬可能如何？","options":["必然至少上漲3%","只與美國政策利率有關","可能因匯率換算而低於3%甚至虧損","只要有配息就不受匯率影響"],"answer":2,"explain":"選項（1）：本幣升值會影響外幣資產換算價值。\n選項（2）：利率只是債券報酬的其中一項因素。\n選項（3）：外幣報酬須加計匯率變動，可能抵銷價格收益。\n選項（4）：配息不會消除匯率風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX012","topic":"投資與風險","q":"某股票價格100元，投資人買入後漲到105元，想計算實際獲利。最完整的計算應考慮什麼？","options":["只用5元乘股數","買進手續費即可","賣出證交稅即可","買賣手續費、賣出證交稅及其他適用成本"],"answer":3,"explain":"選項（1）：價差尚未扣除交易成本。\n選項（2）：賣出時仍可能有手續費與稅。\n選項（3）：買進也有手續費等成本。\n選項（4）：完整損益應扣除買賣相關成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX013","topic":"投資與風險","q":"小琪將退休金全部買入長天期公債ETF，理由是「公債違約風險低」。她忽略了哪個主要風險？","options":["利率上升可能使長天期債券價格波動較大","公債ETF一定沒有任何現金流","長天期債券一定比短天期流動性差","公債不可能受到市場價格影響"],"answer":0,"explain":"選項（1）：低信用風險不等於低利率風險，存續期間愈長通常愈敏感。\n選項（2）：ETF可能有配息或資本利得。\n選項（3）：流動性需看實際市場條件，非單由天期決定。\n選項（4）：債券市場價格會隨利率等因素變動。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX014","topic":"投資與風險","q":"同一檔基金有A類型前收手續費與B類型遞延銷售費，投資人預計持有時間不確定。如何比較較合理？","options":["只比較申購當天扣款","估算不同持有期間的總費用與贖回條件","只看基金經理人照片","只看哪類型配息頻率高"],"answer":1,"explain":"選項（1）：前端費用無法代表整段期間成本。\n選項（2）：持有期間與贖回時點會影響總成本。\n選項（3）：經理人照片與費用比較無關。\n選項（4）：配息頻率不能替代費用結構。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX015","topic":"保險與保障","q":"小瑄已有住院實支實付醫療險，想替家人再買同類商品。她最應先核對什麼？","options":["保險公司廣告代言人","只比較每年保費","理賠限額、除外責任、給付方式及重複投保規範","只看保單封面保障名稱"],"answer":2,"explain":"選項（1）：代言資訊不代表保障內容。\n選項（2）：保費須與條款及保障內容一起比較。\n選項（3）：實際可理賠範圍與多張保單給付規則最重要。\n選項（4）：商品名稱不足以確認給付細節。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX016","topic":"保險與保障","q":"阿志購買重大疾病險後一個月發現健康異常，想確認是否符合給付。哪個處理最恰當？","options":["直接認定保險公司一定要賠","只詢問親友經驗","只看業務員口頭保證","檢視疾病定義、等待期、告知義務及保單生效條件"],"answer":3,"explain":"選項（1）：是否給付須依契約與事實判斷。\n選項（2）：他人個案不一定適用同一條款。\n選項（3）：口頭說明不應取代正式保單條款。\n選項（4）：等待期與承保條件可能影響給付。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX017","topic":"保險與保障","q":"家庭主要收入者有房貸、扶養子女與年邁父母，預算有限。評估壽險保額時應優先採何種方法？","options":["估算家庭未來支出、負債及現有資產保障缺口","直接買同事相同保額","只以年齡決定保額","將保額等同每月保費的十倍"],"answer":0,"explain":"選項（1）：需求分析可將扶養責任與負債納入。\n選項（2）：同事家庭責任可能不同。\n選項（3）：年齡不能單獨反映保障需求。\n選項（4）：保費與保額並無固定十倍關係。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX018","topic":"保險與保障","q":"車禍造成對方車輛損壞及對方受傷，車主只投保強制汽車責任保險。哪項理解最恰當？","options":["強制險會賠償全部車損","強制險主要提供法定人身傷害保障，財物損失須另評估","強制險只賠自己的車損","有強制險就不用考慮民事責任"],"answer":1,"explain":"選項（1）：強制險不涵蓋一般車輛財損賠償。\n選項（2）：強制險著重事故受害人法定人身給付。\n選項（3）：自己的車損通常非強制險保障項目。\n選項（4）：保險給付不必然免除全部民事責任。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX019","topic":"保險與保障","q":"小玲投保醫療險時曾有醫師診斷紀錄，但覺得已痊癒而不填要保書相關問題。最大風險是什麼？","options":["投保後所有疾病都不理賠","保險費會自動變兩倍","未依書面詢問據實告知可能衍生契約爭議","只要有醫療紀錄就無法投保"],"answer":2,"explain":"選項（1）：保障範圍須依具體契約與法律判斷。\n選項（2）：保費不會因隱匿資訊自動按固定倍數變動。\n選項（3）：告知義務應依要保書詢問及法律規定履行。\n選項（4）：有醫療紀錄不等於必然無法承保。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX020","topic":"保險與保障","q":"一位退休者考慮利率變動型年金保險，業務員展示較高宣告利率。哪個判斷較妥當？","options":["宣告利率可保證整個退休期間","宣告利率等同銀行定存利率","只比較當月宣告利率","確認保證條件、宣告利率調整機制及費用"],"answer":3,"explain":"選項（1）：宣告利率可能隨契約機制調整。\n選項（2）：年金保險與存款的保障及成本不同。\n選項（3）：單期利率不能代表長期收益。\n選項（4）：須區分保證與非保證部分及相關費用。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX021","topic":"保險與保障","q":"家長替孩子投保儲蓄型保險，但三年後可能要用錢繳學費。評估商品時最需要什麼資訊？","options":["前三年的解約金及現金流需求","保單封面的圖案","公司廣告曝光量","其他家庭是否也買同商品"],"answer":0,"explain":"選項（1）：提前解約可能造成損失，須與用錢時點比較。\n選項（2）：封面不反映解約成本。\n選項（3）：曝光量不代表流動性。\n選項（4）：他人投保不等於適合自身資金期限。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX022","topic":"防詐與洗錢防制","q":"小明收到自稱銀行的簡訊，要求點連結更新網銀密碼，否則帳戶將凍結。何者較安全？","options":["直接依簡訊操作但不要告訴家人","自行開啟銀行官方App或撥官方電話確認","先把簡訊轉傳同學請他代登","回傳一次性驗證碼確認身分"],"answer":1,"explain":"選項（1）：簡訊連結可能導向偽冒網站。\n選項（2）：透過獨立官方管道查證可降低釣魚風險。\n選項（3）：轉傳並代登會增加帳號資訊外洩風險。\n選項（4）：OTP是重要驗證資訊，不應回傳陌生訊息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX023","topic":"防詐與洗錢防制","q":"朋友借用你的銀行帳戶收取網拍貨款，說每筆給你500元報酬。你不清楚實際交易內容，最適合怎麼做？","options":["借帳戶但只收少量款項","只要朋友有身分證就可放心","拒絕提供帳戶並確認交易是否涉及不法","改用數位帳戶即可排除風險"],"answer":2,"explain":"選項（1）：金額小也可能涉及洗錢或詐欺。\n選項（2）：對方身分證不代表資金來源合法。\n選項（3）：出借帳戶可能涉及刑事與帳戶風險。\n選項（4）：帳戶類型不改變提供他人收款的風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX024","topic":"防詐與洗錢防制","q":"長者接到假檢警電話，對方聲稱帳戶涉案要求轉入「監管帳戶」。家人應如何協助？","options":["先轉一半以證明配合","要求對方傳來正式公文就轉帳","請長者不要掛電話以免失禮","中止通話並透過165或正式機關管道查證"],"answer":3,"explain":"選項（1）：轉帳可能造成直接損失。\n選項（2）：詐騙者也可能偽造公文。\n選項（3）：持續通話容易受話術操控。\n選項（4）：獨立查證與停止轉帳是重要防線。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX025","topic":"防詐與洗錢防制","q":"小店營業額增加，銀行詢問大額現金交易的資金來源。店主最適合的回應是什麼？","options":["提供交易發票、帳簿與合理資金來源說明","拒絕提供任何資訊並要求銀行不得詢問","改成多人分批存入以避免紀錄","宣稱營業收入不可能被查核"],"answer":0,"explain":"選項（1）：合法交易可用客觀紀錄說明來源。\n選項（2）：金融機構依法負有客戶審查義務。\n選項（3）：刻意拆分交易可能提高可疑交易風險。\n選項（4）：營業收入仍可能需要合理佐證。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX026","topic":"防詐與洗錢防制","q":"投資群組宣稱「每月固定獲利8%，本金保證，拉朋友再加碼」。哪項查核最重要？","options":["先看群組成員人數","查證業者資格、資金流向與保證獲利的合理性","只看群組中的獲利截圖","先投入少量金額就不必查核"],"answer":1,"explain":"選項（1）：群組人數可能造假，無法驗證合法性。\n選項（2）：不合理保證獲利及招攬結構是重要風險訊號。\n選項（3）：截圖可能經過編輯或偽造。\n選項（4）：小額投入也可能造成個資與資金風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX027","topic":"防詐與洗錢防制","q":"學生收到「帳戶異常」電話，對方能說出部分個資並要求提供OTP。哪個判斷最合理？","options":["能說出生日就一定是銀行","只要來電顯示銀行電話就可信","個資可能外洩或遭冒用，OTP不可交付","提供OTP後再改密碼即可免除風險"],"answer":2,"explain":"選項（1）：部分個資可從外洩資料取得。\n選項（2）：來電顯示可能被偽冒。\n選項（3）：OTP是驗證憑證，應獨立聯繫官方查證。\n選項（4）：事後改密碼不一定能追回已完成交易。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX028","topic":"防詐與洗錢防制","q":"一家企業接獲國外供應商郵件要求更換收款銀行帳號，金額較大且時間緊迫。哪個程序最能降低風險？","options":["依新郵件帳號立即匯款","只要郵件有公司Logo即可","先匯小額測試，成功就匯全額","以既有聯絡方式雙重確認收款帳號變更"],"answer":3,"explain":"選項（1）：電子郵件可能遭入侵或偽冒。\n選項（2）：Logo容易複製。\n選項（3）：小額匯款成功無法證明收款人身分。\n選項（4）：獨立管道核對可降低商務電子郵件詐騙。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX029","topic":"退休與信託","q":"退休者有每月固定生活費需求，卻將所有資產放在波動大的股票。哪項規劃較能改善風險？","options":["按生活費期限建立現金與較穩健資產緩衝","只買配息率最高的股票","把每月生活費都當作投資獲利","因退休後不再工作就不需資產配置"],"answer":0,"explain":"選項（1）：依支出期限安排流動性，可降低被迫低價賣出風險。\n選項（2）：高配息不保證價格與現金流穩定。\n選項（3）：配息可能伴隨本金價值變動。\n選項（4）：退休更需管理提領與市場風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX030","topic":"退休與信託","q":"長者擔心失能後財產被不當挪用，想安排專款支付照護費用。哪項規劃最貼近需求？","options":["只把提款卡交給鄰居","與專業人員討論安養信託的受託管理及給付條件","把全部財產改成現金藏在家中","只訂口頭約定請親友每月匯款"],"answer":1,"explain":"選項（1）：交付提款卡缺乏清楚的管理與監督安排。\n選項（2）：信託可依契約約定管理用途與給付方式。\n選項（3）：大量現金可能有保管與失竊風險。\n選項（4）：口頭約定的執行與監督較不明確。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX031","topic":"退休與信託","q":"父母想設立教育信託，但希望孩子成年後仍依學費支出分期領取。應優先確認什麼？","options":["銀行分行裝潢","受益人是否喜歡銀行品牌","信託契約中的給付條件、受益權與終止安排","存摺顏色是否方便辨識"],"answer":2,"explain":"選項（1）：裝潢與信託給付條件無關。\n選項（2）：品牌偏好不能取代法律契約設計。\n選項（3）：受益權與給付時點須以合法契約約定。\n選項（4）：存摺外觀不影響信託管理。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX032","topic":"退休與信託","q":"退休家庭評估以房養老，現有房屋是主要居所且仍有其他繼承人。哪項資訊最需要事先釐清？","options":["只看銀行廣告最高可貸成數","認為房價一定持續上漲","只比較每月可領金額","貸款計息、撥款期間、清償及繼承安排"],"answer":3,"explain":"選項（1）：最高成數未反映個案條件。\n選項（2）：房價存在波動風險。\n選項（3）：月領金額不是完整成本。\n選項（4）：以房養老涉及長期利息、房屋處分及繼承問題。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX033","topic":"退休與信託","q":"一位退休者預計十年後才動用部分資金，另一筆半年後就要付醫療費。哪項安排最合理？","options":["分別依資金使用期限規劃流動性與風險","把兩筆資金都放入同一高波動商品","只比較哪個商品宣傳報酬較高","把醫療費全部投入長期閉鎖商品"],"answer":0,"explain":"選項（1）：不同支出期限應有不同風險承受能力。\n選項（2）：高波動商品可能在短期需求時被迫賣出。\n選項（3）：宣傳報酬不能替代風險與期限評估。\n選項（4）：閉鎖商品可能無法及時支應醫療支出。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX034","topic":"退休與信託","q":"家庭規劃退休提領時只以去年投資報酬率推估未來每年收入。哪個問題最值得注意？","options":["去年報酬率足以保證未來收益","報酬順序風險可能使退休初期虧損加速資產耗損","退休後資產價格不再波動","只要平均報酬為正就不需控制提領率"],"answer":1,"explain":"選項（1）：單一年份不能代表長期報酬。\n選項（2）：提領期間遭遇早期大跌，可能對資產續航力造成較大影響。\n選項（3）：退休不會消除市場風險。\n選項（4）：平均報酬無法完整反映提領時點。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX035","topic":"退休與信託","q":"受託人依信託契約管理財產，委託人要求將原本指定教育用途的資金挪作高風險投機。哪項處理較妥當？","options":["立即照做，因委託人永遠可口頭變更","先挪用再補寫紀錄","依信託契約及法令確認變更權限與程序","只要投資可能賺錢就可改變用途"],"answer":2,"explain":"選項（1）：信託權利義務須依契約與法律，不可一概認定可口頭更改。\n選項（2）：事後補記不能取代合法程序。\n選項（3）：信託目的與變更權限是判斷核心。\n選項（4）：預期報酬不等於可違反信託目的。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX036","topic":"貨幣政策與總體金融","q":"央行在公開市場買進公債，其他條件不變。某銀行財務主管應如何評估初步影響？","options":["銀行準備金一定下降","央行直接提高所有銀行放款利率","銀行持有的所有公債價格必跌","市場流動性通常增加，短期利率可能承受下行壓力"],"answer":3,"explain":"選項（1）：買進公債通常向市場注入資金。\n選項（2）：公開市場買入不是直接規定各銀行放款利率。\n選項（3）：債券價格仍受多重因素影響。\n選項（4）：買入操作通常具有增加流動性的方向性效果。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX037","topic":"貨幣政策與總體金融","q":"本國升息，但同時出口衰退、國際資金避險流向美元。企業想預估匯率，最合理的做法是什麼？","options":["將升息視為可能因素之一，並評估其他匯率驅動因素","認定本國貨幣必然升值","只依出口商的單一報價判斷","只看去年同月匯率"],"answer":0,"explain":"選項（1）：匯率受利差、預期、風險情緒及貿易等因素共同影響。\n選項（2）：升息不保證匯率一定升值。\n選項（3）：單一報價不足以預測市場。\n選項（4）：歷史同月價格不代表未來。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX038","topic":"貨幣政策與總體金融","q":"進口商三個月後要支付100萬美元貨款，擔心新臺幣貶值增加成本。哪個風險管理方向較符合需求？","options":["先把所有新臺幣資金投入股票","評估遠期外匯等避險工具及其成本","等待匯率波動後再決定是否付款","認為本國升息就不需匯率避險"],"answer":1,"explain":"選項（1）：股票投資可能增加市場風險，不能直接鎖定匯率。\n選項（2）：遠期外匯可用來管理未來付款匯率，但需評估契約及成本。\n選項（3）：被動等待會暴露匯率變動風險。\n選項（4）：政策利率不能保證匯率方向。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX039","topic":"貨幣政策與總體金融","q":"通膨率下降但仍為正值，學生說「物價已經比去年便宜」。哪個回應最準確？","options":["通膨率下降代表所有商品價格下降","通膨率為正時物價一定不變","物價整體仍可能上漲，只是上漲速度放慢","通膨率只影響股票不影響生活費"],"answer":2,"explain":"選項（1）：通膨率下降不等於價格水準下降。\n選項（2）：正通膨表示整體價格水準仍上升。\n選項（3）：須區分通膨減速與通貨緊縮。\n選項（4）：通膨會影響生活購買力。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX040","topic":"貨幣政策與總體金融","q":"市場預期央行將降息，長天期公債殖利率卻因財政與風險溢酬上升。投資人應如何理解？","options":["只要降息，長債價格一定上漲","殖利率上升代表債券價格也上漲","短期政策利率與長期殖利率必然同步","長債價格可能下跌，因其殖利率受多種因素影響"],"answer":3,"explain":"選項（1）：市場預期已可能提前反映，長債殖利率亦受其他因素影響。\n選項（2）：殖利率與既有固定票息債券價格通常反向變動。\n選項（3）：長短期利率由不同因素共同決定。\n選項（4）：長債殖利率上升通常壓低既有債券價格。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX041","topic":"貨幣政策與總體金融","q":"景氣疲弱且物價仍高，企業主管想判斷央行下一步政策。何種分析最合適？","options":["同時觀察通膨、就業、金融穩定與政策取捨","只要失業上升央行就必然降息","只要物價上漲央行就必然升息","直接用股價漲跌推定央行決策"],"answer":0,"explain":"選項（1）：政策決策涉及多重目標與權衡。\n選項（2）：就業壓力不代表一定降息。\n選項（3）：通膨壓力也須考量其他條件。\n選項（4）：股價僅是眾多經濟資訊之一。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX042","topic":"貨幣政策與總體金融","q":"存款利率從1%升到2%，但同期通膨率為3%。學生想衡量購買力變化，應採何種比較？","options":["只看存款名目利率提高一倍","比較存款報酬與物價上漲率，評估實質購買力","只看銀行公告利率不看通膨","以股票指數漲跌取代物價資料"],"answer":1,"explain":"選項（1）：名目利率上升不代表實質報酬轉正。\n選項（2）：名目存款報酬低於通膨時購買力仍可能下降。\n選項（3）：忽略通膨會高估實質收益。\n選項（4）：股票指數不是衡量一般物價的指標。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX043","topic":"金融消費保護與永續金融","q":"消費者對保險理賠有爭議，已向金融機構提出申訴，對方回覆仍不滿意。下一步最適合做什麼？","options":["直接在社群公開所有病歷資料","自行停止履行所有保單義務","確認是否符合向金融消費評議中心申請評議的期限與程序","向陌生代辦支付高額保證勝訴費"],"answer":2,"explain":"選項（1）：公開病歷可能造成個資外洩。\n選項（2）：停止履約可能衍生其他契約風險。\n選項（3）：金融消費爭議有法定申訴與評議程序。\n選項（4）：代辦保證結果不可信且可能增加成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX044","topic":"金融消費保護與永續金融","q":"銀行推薦複雜結構型商品給首次投資的退休長者，長者無法說明最壞情況損失。理專最適當的做法是什麼？","options":["強調其他客戶都已購買","只提供過去最好報酬","把風險揭露放在簽約後","重新確認適合度並以可理解方式揭露風險"],"answer":3,"explain":"選項（1）：其他人購買不代表商品適合該客戶。\n選項（2）：只揭露最佳績效會忽略損失風險。\n選項（3）：風險應在交易決定前充分揭露。\n選項（4）：適合度與理解能力是公平待客的重要考量。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX045","topic":"金融消費保護與永續金融","q":"一家企業發行「綠色債券」，但資金實際用途不明。投資人要評估是否符合永續投資目的，最應查什麼？","options":["募集資金用途、管理機制與後續資訊揭露","公司Logo是否使用綠色","發行公司員工制服顏色","債券是否一定提供高於市場的報酬"],"answer":0,"explain":"選項（1）：綠色債券重視募集資金用途及透明揭露。\n選項（2）：品牌顏色不是永續績效證據。\n選項（3）：制服顏色與資金用途無關。\n選項（4）：綠色標籤不保證較高報酬。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX046","topic":"金融消費保護與永續金融","q":"兩檔永續基金都標榜ESG，但甲排除高碳產業，乙投資轉型中的高碳企業。學生如何比較較合理？","options":["認定投資高碳企業就一定不屬永續策略","檢視各自投資策略、轉型指標與揭露方法","只看基金名稱有沒有ESG","以配息率高低判斷永續程度"],"answer":1,"explain":"選項（1）：轉型投資可能以改善企業表現為目標，不能單憑產業排除。\n選項（2）：不同ESG策略須依目標、指標與執行證據比較。\n選項（3）：名稱不能替代投資組合與揭露。\n選項（4）：配息率不衡量環境與社會成果。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX047","topic":"金融消費保護與永續金融","q":"學生使用先買後付服務，商家宣稱不收利息，但逾期可能有費用。哪項決策最合理？","options":["把BNPL當成收入增加","只看每期付款金額","確認總費用、逾期條件與個人還款能力","同時申請多個平台就能降低總負債"],"answer":2,"explain":"選項（1）：分期付款不會增加可支配收入。\n選項（2）：每期付款不代表總費用與違約成本。\n選項（3）：需評估到期現金流及契約責任。\n選項（4）：多平台可能使債務更難管理。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX048","topic":"金融消費保護與永續金融","q":"一家工廠申請轉型融資，承諾五年內降低排放，但缺乏可驗證的中期目標。銀行最應要求什麼？","options":["只要求企業發表環保口號","只看公司股價表現","只要求廠房外觀改善","具體減排路徑、衡量指標與定期查核機制"],"answer":3,"explain":"選項（1）：口號不能驗證實際減排成果。\n選項（2）：股價與減排成效不必然一致。\n選項（3）：外觀改善不代表碳排下降。\n選項（4）：可衡量的轉型目標與驗證是風險評估核心。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX049","topic":"金融消費保護與永續金融","q":"消費者發現信用報告有疑似錯誤的逾期紀錄，正準備申請房貸。何者最適當？","options":["向資料提供機構或聯徵中心依程序申請查明與更正","先向陌生業者付費刪除信用紀錄","直接重新申請十家銀行讓資料自行消失","認為信用報告不能查詢也不能申請更正"],"answer":0,"explain":"選項（1）：可依相關程序確認紀錄及提出更正申請。\n選項（2）：陌生付費刪除服務可能涉及詐騙。\n選項（3）：大量申請不能解決錯誤資料來源。\n選項（4）：信用資料有查詢與爭議處理管道。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"NX001","topic":"信用與貸款","q":"甲信用卡循環年利率15%，尚欠20,000元；乙定存年利率2%，有20,000元可動用，但需保留緊急預備金。最合理的第一步是？","options":["先確認緊急預備金缺口，再評估用可動用資金減少高利循環債","因定存利率為正，所有資金都應繼續存定存","只要每月繳最低應繳額，就不必考慮循環利息","先把循環餘額轉為現金預借，以降低總成本"],"answer":0,"explain":"逐選項解析：（1）高利負債成本通常高於定存收益，但應先保留必要流動性。；（2）定存2%收益通常難抵15%循環成本，不能只看利率正負。；（3）最低應繳額不等於清償本金，可能持續計息。；（4）預借現金可能另有費用及利息，不能推定更便宜。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX002","topic":"信用與貸款","q":"學生比較兩筆同額貸款：A利率較低但收開辦費；B利率較高且免開辦費。若還款期數與攤還方式相同，應優先比較什麼？","options":["總費用年百分率及完整還款現金流","廣告標示的最低名目利率","首月帳單金額而忽略後續期數","銀行分行數量作為成本高低的唯一依據"],"answer":0,"explain":"逐選項解析：（1）總費用年百分率納入適用的相關費用，可搭配總還款額比較。；（2）名目利率未必反映開辦費等成本。；（3）首月金額不能代表整期總成本。；（4）分行數與實際借款成本沒有必然對應。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX003","topic":"信用與貸款","q":"家庭月收入固定，房貸採前兩年只繳息的寬限期。寬限期結束時，最應預先評估哪項風險？","options":["剩餘本金在較短期間攤還，月付金可能明顯增加","寬限期內繳的利息會自動轉成房屋權益","寬限期結束後銀行必須無條件降低利率","只要房價上漲，每月現金流就不會受影響"],"answer":0,"explain":"逐選項解析：（1）本金尚未明顯下降，剩餘攤還期縮短可能推高月付金。；（2）利息支出不會自動償還本金。；（3）利率依契約及市場條件，不因寬限期結束必降。；（4）房價與家庭每月還款現金流是不同問題。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX004","topic":"投資與風險","q":"投資人同時買進三檔不同名稱的臺股大型股ETF，想降低集中風險。應先檢查什麼？","options":["三檔ETF成分股及權重是否高度重疊","三檔ETF的名稱是否由不同文字組成","每檔ETF的單位淨值是否相同","交易畫面是否使用不同顏色"],"answer":0,"explain":"逐選項解析：（1）持股重疊會讓表面上的多檔投資仍集中於相同公司。；（2）基金名稱不同不保證曝險不同。；（3）淨值高低不能衡量成分股集中程度。；（4）畫面顏色與投資風險無關。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX005","topic":"投資與風險","q":"一檔債券基金持有長天期固定利率債券，市場殖利率突然上升。其他條件不變，最可能的短期影響是？","options":["基金持有債券市價下跌，且利率敏感度可能較高","因票面利息固定，基金淨值不受市場利率影響","長天期債券一定比短天期債券更抗利率上升","殖利率上升代表債券持有人立刻獲得資本利得"],"answer":0,"explain":"逐選項解析：（1）市場利率上升通常壓低既有固定利率債券價格，長存續期間更敏感。；（2）票息固定不等於市價固定。；（3）長存續期間通常承受較大價格波動。；（4）殖利率上升通常伴隨既有債券價格下跌。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX006","topic":"投資與風險","q":"投資人持有海外美元債券基金，美元資產報酬為正，但新臺幣升值。若未避險，臺幣計價報酬可能如何？","options":["換匯損失抵銷部分美元資產報酬","只要美元資產報酬為正，臺幣報酬必然相同","新臺幣升值會提高每美元可換得的臺幣","匯率只影響海外股票，不影響海外債券基金"],"answer":0,"explain":"逐選項解析：（1）美元換回臺幣時若可換得臺幣減少，可能抵銷投資收益。；（2）跨幣別投資還有匯率風險。；（3）新臺幣升值時每美元通常可換得較少臺幣。；（4）任何未避險外幣資產都可能受匯率影響。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX007","topic":"投資與風險","q":"甲基金年化報酬率8%、年化波動20%；乙報酬6%、波動7%。若投資人將風險承受度列為重要條件，最適當的說法是？","options":["不能只比報酬，還應比較波動、最大回撤與投資期限","甲報酬較高，因此必然適合所有投資人","乙波動較低，表示本金受到政府保證","只要投資期超過一年，兩檔基金風險就相同"],"answer":0,"explain":"逐選項解析：（1）風險承受度涉及損失能力、波動與投資期間等多面向。；（2）較高報酬不代表適合所有人。；（3）波動較低不等於保本或政府保證。；（4）投資期間不能消除商品本身風險差異。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX008","topic":"保險與保障","q":"家庭主要收入者有房貸與扶養責任，預算有限。評估壽險保障額度時最適合納入哪組因素？","options":["剩餘負債、扶養生活費、現有資產及既有保障","只看朋友投保的保額，避免自己買太少","只看保單首年保費，保額不必計算","只看投保人的年齡，忽略家庭負擔"],"answer":0,"explain":"逐選項解析：（1）保障需求應扣合家庭財務責任與可運用資源。；（2）他人家庭條件不同，不能直接照抄。；（3）保費負擔重要，但不足以決定保障缺口。；（4）年齡只是因素之一，無法替代家庭需求分析。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX009","topic":"保險與保障","q":"投保住院醫療實支實付保險後，因住院購買非必要的昂貴用品。是否能理賠，最合理的判斷依據是？","options":["檢視保單條款、必要性、費用項目及理賠文件","只要有醫院收據，所有消費必定全額理賠","只要住院超過一天，任何用品都算醫療費","醫療險與費用項目無關，完全依保戶自行認定"],"answer":0,"explain":"逐選項解析：（1）理賠依契約承保範圍、限額與相關證明認定。；（2）收據存在不代表屬於承保費用。；（3）住院天數不會使所有消費自動成為醫療費。；（4）理賠依契約與事實，非單方認定。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX010","topic":"保險與保障","q":"一位投保人收到保險公司要求補充健康告知資料的通知，最適當的處理方式是？","options":["依實際情況完整說明，並留存往來紀錄","為避免加費，只提供對自己有利的部分","請業務員代為填寫不確定的病史而不確認","認為健康告知與日後理賠完全無關"],"answer":0,"explain":"逐選項解析：（1）如實告知有助於契約風險評估並降低爭議。；（2）選擇性隱瞞可能產生告知義務爭議。；（3）本人仍應確認申報內容真實正確。；（4）重要告知事項可能影響契約效力及理賠。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX011","topic":"金融防詐","q":"學生收到「金融監管單位」簡訊，要求點擊短網址輸入網銀密碼以免帳戶凍結。最適當的處理是？","options":["不點連結，改用金融機構官方管道查證","先輸入帳號密碼，再致電客服確認","將簡訊轉給朋友，請朋友也登入測試","因簡訊提及監管單位，直接視為官方通知"],"answer":0,"explain":"逐選項解析：（1）可疑短網址及索取密碼屬高度警訊，應使用獨立官方管道。；（2）先輸入憑證可能造成帳戶遭盜用。；（3）轉傳可疑連結可能擴大風險。；（4）冒用官方名義是常見詐騙手法。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX012","topic":"金融防詐","q":"朋友要求借用帳戶收取「代購款」，並答應每筆給佣金。最應注意的風險是？","options":["可能成為詐騙金流或洗錢的中介帳戶","只要佣金金額不高，就不存在任何法律風險","款項由朋友匯入，帳戶持有人不必查明用途","有轉帳紀錄就能證明所有資金均合法"],"answer":0,"explain":"逐選項解析：（1）借用帳戶收款可能涉入不法金流，應拒絕不明用途。；（2）風險不以佣金多寡作為唯一判斷。；（3）帳戶使用與資金來源仍需謹慎。；（4）有交易紀錄不等於交易合法。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX013","topic":"金融防詐","q":"投資群組宣稱「保證每月獲利3%，虧損由老師賠」，並要求匯入私人帳戶。何者最合理？","options":["先停止匯款並查核業者資格、商品與金流去向","因承諾賠損，等同銀行存款保障","只要群組有人貼獲利截圖，就可確認績效真實","先小額匯款測試，若獲利再加碼即可排除詐騙"],"answer":0,"explain":"逐選項解析：（1）保證高報酬與私人帳戶收款是重要警訊。；（2）口頭賠損承諾不是存款保險。；（3）截圖容易偽造，無法驗證真實績效。；（4）小額試投仍可能造成個資與資金風險。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX014","topic":"洗錢防制","q":"銀行對長期小額交易客戶發現突然有多筆來源不明的大額匯款。最適當的風險管理方式是？","options":["依風險基礎方法進一步了解交易目的及資金來源",
