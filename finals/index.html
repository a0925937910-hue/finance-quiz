講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F184","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"家人想用以房養老款項支付看護費，卻擔心被他人挪用。應評估什麼？","options":["讓任何一位家屬代收款項，不需留下用途紀錄","只將撥款改為現金提領，即可杜絕挪用","將貸款撥款與信託或其他正式照護給付管理機制結合","以房屋抵押擔保為由，認為照護費必會自動支付"],"answer":2,"explain":"逐選項解析：（1）代收款若無授權與查核，仍可能遭不當使用。；（2）現金較難追蹤用途，不能解決監督問題。；（3）可評估專款管理、授權與給付監督的適當安排。；（4）抵押貸款不會自動形成照護費用監督。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F185","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"退休者房屋有既存貸款，打算申請以房養老。應先確認什麼？","options":["先估算房價淨值，既有房貸留待新貸撥款後再處理","確認原抵押權順位、剩餘債務與新貸清償或轉貸條件","只要房屋鑑價足夠，原貸款不影響新貸核准","優先比較每月撥款額，既有債務僅影響繼承時處理"],"answer":1,"explain":"逐選項解析：（1）淨值估算有用，但不能跳過抵押權與既有債務的處理。；（2）原抵押權、剩餘本金與銀行承作條件會影響是否可申辦及實際可用額度。；（3）鑑價不是唯一條件，抵押權順位與還款安排也可能影響核貸。；（4）原貸款可能直接影響新貸設定與可撥金額，非僅身後問題。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F186","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"夫妻共有房屋，只有一方想申貸以房養老。應優先處理什麼？","options":["只確認提出申請的一方符合年齡門檻，另一共有人可於撥款後補簽","先將共有持分估價，未取得同意也可直接設定整棟房屋抵押","先向銀行確認是否接受共有房屋，再依法取得必要共有人同意與辦理設定","由申請人單獨簽約即可使另一共有人持分自動成為擔保"],"answer":2,"explain":"逐選項解析：（1）年齡資格不能取代共有權利及設定程序。；（2）共有持分與整棟房屋擔保不同，不能逕自處分他人權利。；（3）應確認銀行承作條件及共有人的必要意思表示，兼顧居住安排。；（4）單方簽約不會自動使他人持分負擔抵押權。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F187","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"長者想把以房養老撥款全部投入高風險投資。應如何判斷？","options":["將每月撥款固定投入高股息基金，因配息可穩定支付貸款利息","先保留生活與照護現金流，再衡量借款成本、投資波動與風險承受能力","只要投資報酬預期高於房貸利率，便可投入全部撥款","將撥款集中投入一檔波動較低的產業ETF，便可避免虧損"],"answer":1,"explain":"逐選項解析：（1）配息不等於保證收益，也不排除基金淨值下跌。；（2）以房養老資金通常涉及必要生活需求，不宜忽略借款成本與投資損失風險。；（3）預期報酬並非保證，借款利息卻是契約義務。；（4）單一產業ETF仍有市場及集中風險。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F188","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"銀行提供固定撥款與其他撥款方式，長者醫療費可能不規則增加。應如何選擇？","options":["以第一個月撥款最高者為優先，因之後醫療費不影響需求","選總核貸額度最高者，無須比較提款限制及利息計算","比較定期撥款與可彈性動用方案的費用、可用額度及醫療現金流","優先選撥款最固定的方案，因醫療支出不規則不影響流動性"],"answer":2,"explain":"逐選項解析：（1）初期撥款額不能反映未來不定期大額支出。；（2）核貸總額與實際可動用時點、費用及契約條件不同。；（3）不規則醫療支出須評估撥款彈性與總成本，且實際方案依銀行提供為準。；（4）固定撥款可能不完全匹配不定期支出。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F189","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"子女擔心父母身故後房屋如何處理。申貸前應先確認什麼？","options":["確認借款到期或身故後的清償期限、繼承人選擇及抵押物處分機制","預先約定由銀行無條件取得房屋所有權，便不需清償","只比較每月可領金額，繼承問題留待日後再談","將房價預估增值視為足以抵銷所有利息與費用"],"answer":0,"explain":"逐選項解析：（1）以房養老仍涉及債務與抵押權，應事先理解到期處理及繼承安排。；（2）設定抵押權不等於銀行立即或無條件取得所有權。；（3）繼承與清償條件會影響家庭決策，應於簽約前確認。；（4）房價可能波動，不能假設一定足以抵銷債務。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F190","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"學生接到兼職邀約，對方要求提供提款卡與密碼才能領薪。應如何處理？","options":["要求雇主提供公司統編後，便可將提款卡寄給人資保管","只提供提款卡但不提供密碼，便不會有帳戶風險","拒絕交付提款卡、密碼及網銀認證資訊，透過獨立管道查核徵才真偽","先交付帳戶資料試做一天，確認收到薪水再決定是否繼續"],"answer":2,"explain":"逐選項解析：（1）公司登記資料可協助查證，但不代表可交付帳戶控制工具。；（2）提款卡仍可能被濫用，且不應交由不明人士持有。；（3）領薪通常不需要交出帳戶控制權，應拒絕並查證。；（4）短期試用也可能已使帳戶涉入異常金流。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F191","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"網拍賣家收到多匯款，買家要求退到不同姓名帳戶。應怎麼做？","options":["依買家提供的新帳號退款，並保留匯款收據即可","先確認原交易與入帳狀況，透過銀行及平台正式退款管道處理","將款項先轉入自己的另一帳戶，等買家補證件再退款","要求買家出示身分證影本後，便可直接匯到任何指定帳戶"],"answer":1,"explain":"逐選項解析：（1）不同姓名收款帳戶可能牽涉詐騙金流，收據不能排除風險。；（2）透過原交易、銀行及平台核對，避免替不明金流轉手。；（3）轉到自己另一帳戶無法釐清款項來源及真正權利人。；（4）證件影本可能偽造，亦不等於該帳戶有合法收款權。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F192","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"社群朋友推薦「保本月賺兩成」投資，收款帳戶卻是個人戶。應如何判斷？","options":["先要求提供過往三個月獲利截圖，若每月達標即可投資","先投入小額測試是否能出金，成功後再加碼","查核業者及收款人身分，對保本高報酬承諾保持警覺並暫停匯款","請推薦者簽個人保證書，即可將投資視為低風險"],"answer":2,"explain":"逐選項解析：（1）獲利截圖容易造假，也不能證明資金受保障。；（2）小額出金可能是誘導加碼手法，不能證明投資合法。；（3）保本且月報酬20%高度可疑，個人帳戶收款也需查證。；（4）私人保證書不能取代業者合法性及風險審查。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F193","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"學生收到假冒法院通知，要求立即匯款至安全帳戶。應如何處理？","options":["先核對通知書上的案件編號，再依通知指定帳戶匯款","要求來電者傳法院識別證，確認照片後照辦","停止付款，使用自行查得的法院或警政官方聯絡方式查證","先轉一筆小額驗證款，確定帳戶可用後再聯絡法院"],"answer":2,"explain":"逐選項解析：（1）案件編號與通知可遭偽造，不能因此照指示匯款。；（2）證件照片也可能偽造，不足以確認來電真實性。；（3）公務機關不會要求以私人安全帳戶保管款項，應獨立查證。；（4）小額匯款仍可能造成損失並暴露更多資訊。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F194","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"有人請學生代領陌生款項後換成虛擬資產轉出，承諾分潤。應注意什麼？","options":["只要每次轉帳不超過特定金額，便能排除洗錢風險","先確認對方提供的公司登記資料，再代收轉幣即可","拒絕代收不明款項及代轉虛擬資產，保存邀約資料並尋求官方協助","改用自己的虛擬資產錢包代轉，避免銀行帳戶被警示"],"answer":2,"explain":"逐選項解析：（1）分拆金額不能使不明資金合法，反而可能增加疑慮。；（2）公司登記不能證明資金來源或代收行為合法。；（3）代收代轉陌生資金可能成為詐騙金流環節，應拒絕。；（4）更換轉移媒介不會消除資金來源風險。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F195","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"長者接到自稱銀行專員的電話，要求報出OTP取消交易。應如何處理？","options":["請對方先說出帳戶末四碼，答對再提供OTP","只提供一次性驗證碼、不提供密碼，風險便可接受","掛斷電話並自行透過銀行官方客服或App查證，絕不口述OTP","先在電話中要求凍結帳戶，再把OTP告訴對方完成作業"],"answer":2,"explain":"逐選項解析：（1）來電者可能掌握部分個資，不能以此驗證身分。；（2）OTP可用於交易授權或登入驗證，不能交付陌生人。；（3）應透過獨立官方管道確認並採取必要保護措施。；（4）所謂取消交易也可能是誘導提供驗證碼的話術。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F196","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"學生想買演唱會票，賣家要求離開平台私下匯款。應如何降低風險？","options":["若賣家願意折價，改用私下轉帳可視為風險已降低","要求賣家提供票券截圖後，便可直接匯款","使用可信平台的付款與交易保障流程，查驗票券規則並保留紀錄","先匯一半訂金，待對方傳送電子票券後再付尾款"],"answer":2,"explain":"逐選項解析：（1）折扣不代表真實交易，離開平台可能失去保障。；（2）截圖可能重複販售或偽造，不足以確認可用性。；（3）平台交易保障與官方票券規則較能降低風險。；（4）分段付款仍可能遭詐騙，且不保證票券有效。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F197","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"親友帳戶突然被警示，家人想用自己的帳戶代收其所有款項。應先做什麼？","options":["讓家人以本人帳戶暫代收所有款項，等警示解除再轉回","先向金融機構及相關機關釐清警示原因與可行處理程序，避免代收不明金流","改用電子支付代收款項，因不經銀行便不受限制","只代收親友薪資以外的款項，就不需確認來源"],"answer":1,"explain":"逐選項解析：（1）代收可能讓自己帳戶涉入待釐清的金流。；（2）應先查明原因，依金融機構與司法程序處理。；（3）改變支付管道不能繞過合法審查義務。；（4）非薪資款項更需確認交易背景及合法性。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F198","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"防詐騙與帳戶借用","q":"網友提供租借帳戶高額日薪，說只會用來收公司款。應如何評估？","options":["要求對方出具租用契約並公證，就可安全出借帳戶","只提供帳號與網銀登入資訊，不提供實體卡片即可","拒絕出租帳戶控制權，查證工作真實性並警覺詐騙與洗錢風險","先約定每日轉入上限，便能避免帳戶被不法使用"],"answer":2,"explain":"逐選項解析：（1）契約形式不會使不當交付帳戶控制權變得安全。；（2）網銀憑證可直接被濫用，風險極高。；（3）高薪租借帳戶是重大警訊，應拒絕交付。；（4）限額不能排除帳戶被用於不法金流。。","source":"防制洗錢20261019；理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F199","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"公司登記負責人表示自己只是掛名，實際控制人不願揭露。銀行應如何辦理？","options":["依公司登記的負責人作為唯一實質受益人，因其具有法定代表權","只要公司提出股東名冊，就不必再追查實際控制者","要求補充股權及控制關係資料，無法完成必要審查時依規定處理","先核准開戶，再將實質受益人資料列為可選擇性補件"],"answer":2,"explain":"逐選項解析：（1）登記負責人與實際控制人可能不同。；（2）股東名冊有助辨識，但可能不足以釐清間接控制。；（3）應採風險基礎方法辨識實質受益人，不能完成審查時依規定處置。；（4）必要的開戶審查不能任意延後為非必要程序。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F200","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"客戶長期只有小額薪資入帳，突然每天收多筆不明大額款項。銀行應注意什麼？","options":["因客戶已往來多年，先將新增交易一律視為正常營業收入","只要每筆款項都小於某門檻，就不必評估整體型態","比較客戶原有背景、資金來源及交易目的，必要時加強審查與監控","要求客戶簽署不涉及詐騙切結書，便可停止監控"],"answer":2,"explain":"逐選項解析：（1）既有客戶的交易風險也會隨行為改變。；（2）多筆分拆交易仍可能具有異常風險。；（3）交易型態突然改變應結合背景及用途評估。；（4）切結書不能取代必要的持續監控與查核。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F201","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"某企業稱款項是海外貨款，卻無法提出合理交易文件。銀行應如何處理？","options":["因企業有進出口登記，直接接受海外貨款說明","先依企業自述認列收入，等年度審計再查文件","依風險與交易性質查核契約、發票、物流及資金來源等合理證據","將款項拆分為較小交易，降低單筆審查需求"],"answer":2,"explain":"逐選項解析：（1）營業登記不等於每筆交易均有合理背景。；（2）審查不能完全依賴單方口述或延後至審計。；（3）交易證據應與實際商業背景相符，並依規定評估。；（4）拆分交易不能降低法定審查義務。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F202","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"開戶者提供身分證，但拒絕說明帳戶用途，還要求立即提高轉帳限額。應如何判斷？","options":["身分證已驗真即可先提高限額，帳戶用途待日後補填","若申請人是學生，可用職業類別取代資金用途說明","依風險基礎原則確認開戶目的、預期交易與必要資訊後再評估額度","由申請人簽署用途保證書，銀行即無須進一步查證"],"answer":2,"explain":"逐選項解析：（1）身分辨識不等於已完成客戶用途及風險評估。；（2）職業與帳戶用途是不同的審查面向。；（3）開戶目的與交易預期會影響適當風險管理及額度決定。；（4）書面保證不能完全取代風險導向的查核。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F203","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"客戶把大筆現金拆成多次交易，說這樣銀行就不會詢問。銀行應注意什麼？","options":["單筆未達通貨交易申報門檻，便可排除異常交易疑慮","只記錄每日最大一筆現金交易，其他不必整合","檢視分拆頻率、關聯性及交易目的，依風險及規定進行監控或申報","只要客戶表示是節稅需求，銀行就不需追問"],"answer":2,"explain":"逐選項解析：（1）未達單筆門檻不等於不可能涉及可疑交易。；（2）應觀察整體交易樣態，不能只看最大單筆。；（3）刻意分拆可能是警訊，應依法監控並視情況處理。；（4）客戶自述不能排除金融機構的審查責任。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F204","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"境外公司股權結構層層交叉，開戶時只提供最上層公司名稱。銀行應如何處理？","options":["將最上層公司登記負責人直接視為所有實質受益人","只確認第一層股東，因境外股權資料通常難取得","逐層釐清直接及間接持有與控制關係，依規定辨識自然人實質受益人","以最近年度營業額最大的子公司作為實質受益人"],"answer":2,"explain":"逐選項解析：（1）登記負責人不一定具最終控制權。；（2）複雜股權結構可能透過多層持有隱藏控制者。；（3）應依適用規範追查最終所有或控制的自然人。；（4）公司營業額與實質受益人辨識是不同概念。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F205","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"客戶資料多年未更新，交易用途已由薪資轉為商業收款。應怎麼辦？","options":["沿用舊有薪資戶風險等級，因客戶已通過首次審查","只調高交易限額，讓系統自行累積資料再判斷","依新的商業收款用途更新客戶資料、預期交易與風險評估","要求客戶將商業收入拆成多筆小額，避免異常警示"],"answer":2,"explain":"逐選項解析：（1）客戶風險及交易用途會變動，不能永遠沿用初始評估。；（2）單純調額不等於完成持續審查。；（3）用途由薪資轉商業收款應重新確認交易背景。；（4）分拆金流不能取代合規審查，且可能提高疑慮。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F206","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"新開戶者要求行員替他填寫不實職業以提高額度。行員應如何回應？","options":["先填寫客戶希望的職業，待核貸後再修正","由客戶簽免責聲明，銀行即可填寫與事實不符資訊","拒絕不實填報，核實職業與收入等必要資訊並依程序處理","將職業欄位留白並直接提高轉帳額度"],"answer":2,"explain":"逐選項解析：（1）先填不實資料仍會破壞客戶審查正確性。；（2）免責聲明不能使不實資料合法或符合內控。；（3）應如實查核資料並遵守內部及法規程序。；（4）資料不完整不能成為逕自提高限額的理由。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F207","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"洗錢防制與客戶審查","q":"有人要求銀行員告知自己是否被申報可疑交易。行員應如何處理？","options":["只向客戶口頭透露是否有申報，不留下書面紀錄即可","若客戶是長期往來戶，可例外告知申報結果","依保密及禁止不當揭露規定處理，不向無權知悉者透露可疑交易申報資訊","提供申報表編號但不提供內容，便不涉及保密問題"],"answer":2,"explain":"逐選項解析：（1）口頭揭露仍可能違反保密義務。；（2）往來年限不構成任意揭露的理由。；（3）可疑交易申報資訊受特定保密與程序規範。；（4）申報編號本身也可能透露受保護資訊。。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F208","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"數位帳戶與支付安全","q":"數位帳戶宣稱高利率，但只適用前五萬元。學生準備存二十萬元。應如何比較？","options":["以最高優惠利率乘20萬元，估算全部存款收益","只計算超額15萬元的利息，因前5萬元已享優惠","依優惠額度、超額利率及達成條件分段試算實際利息","以廣告標示的最高利率比較銀行，不需查優惠期限"],"answer":2,"explain":"逐選項解析：（1）優惠利率通常有額度限制，不能套用全部本金。；（2）前5萬元也會產生利息，不能略過。；（3）分段計息與任務條件才能反映實際報酬。；（4）優惠期間可能有限，長期比較不能忽略。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F209","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"數位帳戶與支付安全","q":"支付App突然出現陌生交易，持有人還能登入。應先做什麼？","options":["先將App刪除，避免其他人看見交易紀錄","先向朋友詢問是否代為付款，確認前不需通知業者","立即透過官方管道停用或限制支付工具、聯絡業者並保存紀錄","先變更手機桌面鎖定畫面，支付App帳號不必處理"],"answer":2,"explain":"逐選項解析：（1）刪除App不一定停用帳號或阻止未授權交易。；（2）陌生交易應及時通報，不宜等待私人查證。；（3）快速限制權限並保存證據，有利於防止擴大及後續爭議處理。；（4）手機鎖定與支付帳戶風控是不同層次。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F210","quality_review":"第九批：選項與解析實質改寫；待官方資料及教師終審"},{"topic":"數位帳戶與支付安全","q":"學生收到銀行升級簡訊，短網址要求輸入帳密。應如何查證？","options":["先從簡訊連結登入，但不進行轉帳","改從自行開啟的銀行官方App或官方電話查證","先輸入帳號，待確認是銀行後再輸入密碼","請傳訊者提供員工編號，再照連結操作"],"answer":1,"explain":"逐選項解析：（1）釣魚網站可能在登入階段即竊取帳密。；（2）以獨立取得的官方管道查證，可避免偽冒網址。；（3）只提供帳號仍可能洩漏個資，且不能確認網站真偽。；（4）員工編號容易偽造，不能驗證短網址安全性。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F211","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"電子支付餘額與銀行活存被朋友視為完全相同。應如何判斷？","options":["兩者都是電子介面，因此都屬相同的銀行存款","只要平台有合作銀行，支付餘額就等同本人銀行活存","應辨識支付機構、資金保管與適用保障制度，不直接視為同一商品","電子支付餘額能轉帳，所以利率與存款保險必然相同"],"answer":2,"explain":"逐選項解析：（1）操作介面相似不代表法律性質相同。；（2）合作銀行及專戶安排不會自動使每位使用者取得同一種存款權利。；（3）不同機構與資金性質可能涉及不同法規和保障。；（4）可轉帳功能不能推論利息與存款保險待遇相同。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F212","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"未成年人想開數位帳戶，網友說任何人都可不經法定程序開戶。應如何處理？","options":["查明金融機構對未成年人開戶所需法定代理人同意及身分文件","先借用成年朋友的身分證完成線上驗證","只要用自己的手機申請，就可跳過法定代理程序","先提供帳號密碼給代辦，待開戶後再修改"],"answer":0,"explain":"逐選項解析：（1）未成年人開戶須依適用法令及銀行作業規定辦理。；（2）借用他人身分可能違反身分查核要求。；（3）手機操作方式不免除未成年人的開戶資格及同意要求。；（4）交付認證資料給不明代辦有資安及詐騙風險。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F213","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"家長替孩子綁定多張卡到手機支付，卻未設定交易提醒。應如何改善？","options":["只保留單筆交易限額，因通知會增加手續費","設定交易通知、裝置鎖定及適當額度，定期核對明細","關閉裝置生物辨識，避免付款時驗證失敗","將所有卡片共用同一個簡單密碼方便家人使用"],"answer":1,"explain":"逐選項解析：（1）單筆限額不能取代異常交易提醒。；（2）多層防護與即時核對能較早發現未授權交易。；（3）關閉身分驗證會降低支付安全性。；（4）共用弱密碼增加帳戶被盜用風險。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F214","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"手機遺失且已登入銀行App，持有人只想等找到手機。應如何降低損失？","options":["等電信業者寄下月帳單後再評估是否停用","只更換社群網站密碼，銀行App可保持登入","先登出家用電腦的網銀，不必通知銀行","立即遠端鎖定或清除裝置，並聯繫銀行停用相關登入權限"],"answer":3,"explain":"逐選項解析：（1）等待可能延誤阻止未授權交易的時機。；（2）社群帳號與銀行App的認證權限不同。；（3）只登出另一台設備未必能使遺失手機的登入失效。；（4）盡快停用遺失裝置的權限並檢查交易紀錄較能控制風險。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F215","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"學生在公共Wi-Fi登入網銀，網頁跳出憑證錯誤。應如何處理？","options":["忽略憑證警告，但先確認畫面有銀行商標","停止登入，改用可信網路與自行輸入的官方網址或App","先輸入一次性驗證碼測試網站是否正常","請公共Wi-Fi提供者代為輸入網銀密碼"],"answer":1,"explain":"逐選項解析：（1）商標可能被偽造，不能取代憑證驗證。；（2）憑證異常可能表示連線被攔截或網址不正確。；（3）一次性驗證碼屬敏感認證資料，不應用於測試可疑網站。；（4）網銀密碼不應交付Wi-Fi管理者。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F216","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"數位帳戶與支付安全","q":"支付平台推出先買後付，學生只看到零頭期款。應如何比較？","options":["只比較第一期付款，因其最能反映負擔","只看商家標示的零利率，不需閱讀契約","比較總付款、逾期費用、付款期數與自身現金流","先用多個平台分散付款，便不會增加總負債"],"answer":2,"explain":"逐選項解析：（1）低頭期款可能隱藏較高的後續負擔。；（2）名目零利率仍可能有手續費或逾期成本。；（3）應比較完整契約成本及未來還款能力。；（4）跨平台分期仍是負債，可能造成過度借貸。。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F217","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"學生看到智能合約標榜自動執行，便認為程式絕不會有漏洞。應如何評估？","options":["檢視程式碼審計、權限、預言機與合約可升級性等風險","因程式自動執行，所以所有外部資料必定正確","只要合約部署在區塊鏈上，就不需查核程式漏洞","以平台宣稱的使用人數取代安全性評估"],"answer":0,"explain":"逐選項解析：（1）智能合約可有程式缺陷、外部資料與管理權限風險。；（2）外部資料來源可能錯誤或被操縱。；（3）不可任意修改的程式也可能含漏洞。；（4）使用人數不等於合約經過充分安全審查。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F218","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"某交易平台承諾固定高收益，要求轉幣至私人錢包。應如何判斷？","options":["先少量轉幣測試，只要能顯示收益便可加碼","查核平台與收款地址，警惕固定高收益及私人錢包收款","請社群版主提供獲利截圖，便可確認本金安全","把幣分成數筆匯入同一私人錢包即可分散風險"],"answer":1,"explain":"逐選項解析：（1）小額測試可能是詐騙誘餌，不能證明大額可領回。；（2）固定高收益與非正式收款地址是需要高度警覺的風險訊號。；（3）截圖容易偽造，不能證明真實資產與清償能力。；（4）拆分匯款不會降低對同一收款方的集中風險。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F219","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"投資人遺失虛擬資產私鑰，認為客服必能幫忙找回。應注意什麼？","options":["先確認錢包備份及託管模式，了解私鑰遺失可能無法恢復","只要鏈上交易公開，任何客服都能重設私鑰","把錢包地址提供客服，即可重新產生原私鑰","向網路陌生人支付解鎖費，通常可保證恢復資產"],"answer":0,"explain":"逐選項解析：（1）非託管錢包若失去私鑰或助記詞，可能無法取回控制權。；（2）區塊鏈公開資訊不代表客服能替使用者重設私鑰。；（3）公開地址不足以推導出私人金鑰。；（4）聲稱保證恢復的收費服務可能是二次詐騙。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F220","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"銀行使用AI審核貸款，某族群長期遭異常拒絕。應關注什麼？","options":["只看模型整體核貸率，不必比較不同客群結果","要求所有被拒客戶重新提交相同資料即可","檢視資料偏差、模型可解釋性、公平性及申覆機制","因AI不會有人類偏見，所以異常拒貸不需調查"],"answer":2,"explain":"逐選項解析：（1）整體核貸率可能掩蓋特定族群的不合理差異。；（2）重複提交資料無法解決模型或資料偏差。；（3）應評估是否存在不合理差別待遇並提供適當救濟。；（4）模型可能複製訓練資料的歷史偏差。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F221","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"朋友把中央銀行數位貨幣和私人穩定幣視為完全相同。應如何區分？","options":["兩者都以數位形式存在，因此發行人和信用風險相同","區分中央銀行負債性質與私人發行者的儲備、贖回及信用風險","只比較代幣價格是否接近一美元，不需看發行人","只要穩定幣採用區塊鏈，就具備法定貨幣地位"],"answer":1,"explain":"逐選項解析：（1）數位形式不決定發行人的法律地位。；（2）CBDC概念上由央行發行，私人穩定幣涉及不同發行與贖回安排。；（3）價格穩定不能代替對發行機構與儲備資產的審查。；（4）區塊鏈技術不自動賦予法償地位。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F222","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"虛擬資產平台顯示帳面獲利，但暫停提款。應如何評估？","options":["以平台顯示的未實現獲利作為已收現金","只要價格走勢向上，暫停提款就不影響資產安全","借更多資金加碼，等待提款功能恢復","將提款限制視為流動性與對手方風險，查核公告及資產證明"],"answer":3,"explain":"逐選項解析：（1）帳面數字不代表資產可即時取回。；（2）無法提款可能反映流動性或營運問題。；（3）加碼會提高對同一平台的風險曝險。；（4）應區分市場價格、平台清償能力與資產可提領性。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F223","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"投資人把所有資產放在單一加密平台，認為分散幣種就安全。應如何改善？","options":["同一平台持有不同幣種，已分散全部營運風險","分散幣種後不必再保護帳號與私鑰","同時評估資產種類、平台集中度及託管安全","只要平台提供高利活存，就能抵銷倒閉風險"],"answer":2,"explain":"逐選項解析：（1）不同幣種仍暴露於同一平台營運與保管風險。；（2）資產分散不能替代認證及私鑰保護。；（3）應分別管理市場、對手方與資安風險。；（4）收益承諾不能保證平台具備足夠清償能力。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F224","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"某NFT宣稱保證可轉售獲利，但市場交易稀少。應先查什麼？","options":["查驗實際成交量、買賣價差、權利內容與轉售市場深度","以發行人宣稱的地板價作為保證變現價格","只要NFT可在鏈上轉移，就代表隨時有買家","只比較鑄造成本，因轉售時無流動性問題"],"answer":0,"explain":"逐選項解析：（1）市場稀少可能導致難以成交，NFT權利也需逐項確認。；（2）標示價格不等於真實成交價格或可保證獲利。；（3）可轉移不代表存在願意買入的交易對手。；（4）交易深度與買賣價差會影響實際變現。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F225","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"金融科技與虛擬資產","q":"學生想透過社群提供的智能合約連結領取空投，網站要求無限額授權錢包。應怎麼辦？","options":["先授權，再依網站承諾於領取後取消權限","檢查合約與授權範圍，對不明無限額授權保持拒絕","只要空投免費，就不會涉及資產被轉出的風險","將主錢包私鑰輸入網站以完成授權驗證"],"answer":1,"explain":"逐選項解析：（1）惡意合約可能在授權期間轉走資產。；（2）不明合約的無限額授權可能使資產面臨重大風險。；（3）零購買價不等於沒有授權或資安風險。；（4）私鑰不得交付第三方網站。。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F226","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"服飾品牌宣稱碳中和，卻不揭露供應鏈與運輸排放。投資人應查核什麼？","options":["只查企業總部用電，因供應鏈排放不屬企業責任","只看品牌是否購買碳權，不必確認排放範圍","確認碳中和主張的範圍、排放盤查及抵換品質","以宣傳影片的觀看數作為減碳成效證據"],"answer":2,"explain":"逐選項解析：（1）企業價值鏈排放可能是重大排放來源。；（2）抵換不能取代對排放範圍與實際減量的揭露。；（3）應區分直接、能源間接與其他價值鏈排放及宣稱邊界。；（4）宣傳熱度與碳排放績效沒有直接對應。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F227","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"鋼鐵公司申請轉型貸款，提出設備改善與年度減碳指標。銀行應如何評估？","options":["只依企業宣稱的最終淨零年份核貸","只要鋼鐵業排放高，任何轉型貸款都不適用","只比較企業與同業的股價走勢","評估基準排放、技術可行性、年度指標及監測機制"],"answer":3,"explain":"逐選項解析：（1）遠期目標不足以證明近期可衡量的減排進展。；（2）轉型金融正可支持高排放產業可信的減碳改善。；（3）股價不能直接反映專案減排可行性。；（4）可驗證的中期目標與監測有助辨識真實轉型。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F228","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"基金廣告稱投資綠能，因此完全沒有虧損可能。應如何判斷？","options":["辨別綠能產業仍有市場、技術、政策與估值風險","因投資標的屬綠能，基金本金應受存款保險保障","只要有ESG名稱，基金每年必然正報酬","基金投資於再生能源，就不會受到利率影響"],"answer":0,"explain":"逐選項解析：（1）永續主題不代表本金保證，仍需看投資風險。；（2）基金與銀行存款的保障制度不同。；（3）ESG名稱不能保證投資績效。；（4）綠能企業融資成本與估值也可能受利率變化影響。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F229","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"企業發行綠色債券，募集資金卻拿去支付一般股利。應先檢視什麼？","options":["只確認債券票面利率，資金用途不影響綠色標籤","檢視發行文件約定的合格用途、資金管理與分配報告","若發行人股價上漲，就代表資金用途符合綠色標準","只要發行人有ESG報告，股利支出即可視為綠色用途"],"answer":1,"explain":"逐選項解析：（1）綠色債券的核心特徵包括募集資金用途等要求。；（2）應核對用途承諾及後續分配揭露，不能任意改作一般股利。；（3）股價表現不能證明綠色資金用途合規。；（4）一般ESG揭露不能替代個別綠色債券的資金用途約束。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F230","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"公司公布淨零目標，但未提供中期減排里程碑。投資人應關注什麼？","options":["只看2050年淨零宣示，因中間年份可省略","只看企業當年度營收是否增加","要求具體中期減排里程碑、資本支出及執行進度","只要企業購買碳權，便不必衡量自身排放"],"answer":2,"explain":"逐選項解析：（1）長期承諾需可衡量的階段性進度支撐。；（2）營收增長不代表排放下降。；（3）中期目標與投資計畫可協助判斷轉型可信度。；（4）碳權不能取代對實際排放與減量措施的追蹤。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F231","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"某工廠宣稱用再生能源就代表所有產品零排放。應如何分析？","options":["將再生能源採購量直接視為所有產品零排放證明","只檢查工廠電費，不需查原料與運輸","只看產品包裝上的綠色標誌","依產品生命週期檢視原料、製造、運輸及使用階段排放"],"answer":3,"explain":"逐選項解析：（1）再生能源可能降低部分用電排放，不等於全生命週期零排放。；（2）原料及運輸也可能造成重大碳排放。；（3）包裝標誌不能替代盤查及驗證。；（4）完整邊界才能評估產品碳足跡。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F232","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"投資人發現ESG基金持有高排放企業，便認為必定違規。應如何判斷？","options":["先核對基金策略是否為排除、最佳同業或議合轉型，再查揭露","只要持有高排放企業，便一定違反所有ESG基金規則","只看基金名稱含有ESG，就不必檢視持股","只要高排放企業承諾淨零，基金便沒有漂綠風險"],"answer":0,"explain":"逐選項解析：（1）不同ESG策略可能納入高排放企業進行議合或轉型投資。；（2）是否違反須對照該基金公開策略與承諾。；（3）名稱不足以證明實際選股與管理方式。；（4）承諾仍需檢驗具體進度與基金策略一致性。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F233","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"企業報告只揭露減排百分比，不提供絕對排放量。應補充什麼？","options":["只揭露減排百分比即可，因絕對量不影響氣候風險","補充絕對排放量、基準年、計算邊界及產量變化","只公布綠色產品銷售額，不必盤查排放","以員工減碳活動照片取代數據"],"answer":1,"explain":"逐選項解析：（1）百分比可能受基準與產量變化影響，單獨使用不足。；（2）絕對量與基準資訊可判斷實際排放趨勢。；（3）綠色產品收入不等於企業總排放變化。；（4）活動照片不能替代可量測排放資料。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F234","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"綠色金融與漂綠辨識","q":"銀行提供與減碳績效連動的貸款利率，企業指標容易操弄。應如何改善？","options":["把利率優惠全綁在企業自行填報、未查證的指標","只設定容易達成的單一年份目標，避免波動","採用具重大性、可量測及可獨立查證的績效指標","取消所有揭露義務，以降低企業行政成本"],"answer":2,"explain":"逐選項解析：（1）未經查證的自填數據容易遭操弄。；（2）過度容易的目標缺乏促進實際轉型的誘因。；（3）可衡量、具挑戰性及可查證指標有助降低漂綠風險。；（4）沒有揭露難以驗證利率連動是否合理。。","source":"綠色金融與轉型金融講義；2050淨零轉型","review_status":"情境改寫，待官方法規及教師審核","id":"F235","quality_review":"第十批：四選項實質改寫及逐項解析；尚待官方資料與教師終審"},{"topic":"就學貸款與教育資金","q":"學生畢業後收入不穩定，擔心就學貸款開始還款。應先做什麼？","options":["暫停付款並等到銀行主動提出方案","自行改成只繳利息，無須向銀行申請","先用信用卡循環支付學貸以維持正常繳款","向承貸銀行查詢適用還款、緩繳或展延條件與期限"],"answer":3,"explain":"逐選項解析：（1）未申請而逾期可能衍生信用及追償問題。；（2）緩繳或展延有申請與核准程序，不能單方變更。；（3）以較高成本借款繳學貸可能擴大債務壓力。；（4）及早與承貸銀行確認資格及辦理程序，才能依法調整還款。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F236","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"家長比較就學貸款與信用卡學費分期，廣告都說負擔低。應如何評估？","options":["比較廣告月付，因每月較低即代表總成本較低","只比較名目利率，手續費不必納入","優先選期數最多的方案，因一定最省錢","比較實際利率、手續費、總還款及家庭現金流"],"answer":3,"explain":"逐選項解析：（1）月付較低可能來自期數延長，總成本未必較低。；（2）名目利率不包含所有可能的費用。；（3）期數越長不一定越省利息或手續費。；（4）完整成本及負擔能力才是不同融資方案的可比基礎。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F237","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"學生收到聲稱政府補助結清學貸的短網址，要求輸入OTP。應如何處理？","options":["先輸入手機號碼及OTP，若未扣款就可放心","不點連結，從官方主管機關與銀行管道查證","把簡訊轉給同學，請他先試是否可領補助","回覆簡訊詢問客服姓名，再依指示操作"],"answer":1,"explain":"逐選項解析：（1）OTP可能直接授權交易或登入，不可作為測試。；（2）從獨立官方管道核實可避免假冒補助詐騙。；（3）轉傳可疑連結會增加他人受騙風險。；（4）簡訊對方自稱客服不能證明真實身分。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F238","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"大學生每月打工收入有限，想借高利短期貸款支付娛樂開支。應先評估什麼？","options":["只要每期金額小於打工薪水就可以借","把借款期數拉到最長就能消除負債風險","檢視必要支出、負債成本及是否應避免非必要借款","優先使用可隨借隨還方案，因利率通常最低"],"answer":2,"explain":"逐選項解析：（1）還款能力還需扣除生活必要支出及其他債務。；（2）延長期限可能提高總成本，並未消除風險。；（3）娛樂支出不具急迫性，應先評估不借款的替代方案。；（4）額度彈性不代表利率或總費用較低。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F239","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"家長已為孩子存教育基金，但大學學費三個月後要付，資金全在高波動基金。應如何調整？","options":["預先準備短期確定支出的流動性資金","等繳費前一週再賣基金，以保留最高報酬機會","改買單一高配息股票，以股息支付學費","將基金全換成長期債券，因價格不會波動"],"answer":0,"explain":"逐選項解析：（1）短期確定支出應優先考慮可用性與本金波動風險。；（2）臨近付款才賣出可能遇到市場下跌或交割時間限制。；（3）股息不保證發放，股價亦有波動。；（4）長期債券也有利率風險，未必適合三個月支出。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F240","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"學生想提前清償就學貸款，卻還有高利信用卡循環。應如何排序？","options":["先還學貸，因任何政府相關貸款都不得延後","兩筆債務平均分配還款，不必比較利率","比較各債務實際成本與緊急預備金，再決定還款順序","保留所有資金投資，僅繳兩筆債務最低金額"],"answer":2,"explain":"逐選項解析：（1）學貸與卡債的成本、條款及緩繳資格不同。；（2）平均還款未必能有效降低高利債務成本。；（3）通常應優先評估高成本負債，同時維持基本流動性。；（4）投資報酬不保證高於循環信用成本。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F241","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"某家庭預估子女四年後留學，學費以外幣計價。應如何規劃？","options":["以目前匯率乘學費即可，未來匯率不必考慮","先把所有儲蓄換成外幣，避免任何匯率波動","只看學校學費，不需估算生活費與保險費","估算未來學費、匯率波動與分期儲蓄需求"],"answer":3,"explain":"逐選項解析：（1）四年後匯率及學費可能變動。；（2）一次換匯仍有時點風險，也可能犧牲本幣流動性。；（3）留學總費用通常包括住宿、生活與其他支出。；（4）將時間、匯率、通膨及分期儲蓄納入規劃較完整。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F242","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"學生為了提高信用評分，想同時申辦多筆分期貸款。應如何判斷？","options":["評估總負債、還款紀錄與不必要借貸風險","每多借一筆便會提高信用評分，與還款能力無關","同時申請越多貸款，金融機構就越相信信用良好","先借短期高利貸，再用新貸款建立更長信用紀錄"],"answer":0,"explain":"逐選項解析：（1）良好信用管理重視按期還款與負債可負擔性。；（2）額外借貸不保證提高信用評分，還可能增加負債。；（3）密集申貸可能引發授信審查關注。；（4）為建立紀錄承擔高利債務通常不划算。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F243","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"就學貸款與教育資金","q":"家長替子女申請貸款，誤以為保證人完全沒有責任。應先查什麼？","options":["保證人只在借款人同意時才需負責","只要學生已成年，原保證責任就自動消失","保證人沒有收到銀行催收通知就不必看契約","確認契約中的保證義務與可能追償責任"],"answer":3,"explain":"逐選項解析：（1）保證責任由契約與法律規範決定，非借款人事後單方同意。；（2）成年不必然使已成立的保證關係消滅。；（3）是否被催收與保證義務是否存在是不同問題。；（4）應確認保證範圍、責任方式及債務違約後果。。","source":"就學貸款教學講義；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F244","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"信用管理與先買後付","q":"學生使用先買後付購買球鞋，卻同時有三筆分期。應先檢查什麼？","options":["只看最大一筆分期的月付，其他可忽略","以新分期支付舊分期，就能改善負債比","彙整所有分期到期日與總月付，確認不超出可支配收入","先提高分期額度，讓每筆月付占比下降"],"answer":2,"explain":"逐選項解析：（1）多筆小額分期累積仍可能超過可負擔額度。；（2）以債養債通常會增加財務壓力。；（3）跨平台彙整才能看出每月實際現金流缺口。；（4）額度增加不等於收入或償債能力增加。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F245","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"信用管理與先買後付","q":"家長只繳信用卡最低應繳，認為這樣完全不會產生利息。應如何說明？","options":["只要按時繳最低應繳，剩餘本金也享有免息","只要沒有被收違約金，就不會產生循環利息","只要次月付清，所有已產生的利息都會自動退還","查明循環信用利息及剩餘本金的實際成本"],"answer":3,"explain":"逐選項解析：（1）最低應繳與全額繳清不同，剩餘款項可能計息。；（2）違約金與循環利息是不同的費用概念。；（3）已計息帳款是否有調整須依契約，不能假設自動退還。；（4）應核對帳單起息日、利率與未清償本金。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F246","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"信用管理與先買後付","q":"消費者選擇零利率分期，但逾期需付違約費。應如何評估？","options":["只要寫零利率，逾期費就不算融資成本","先選月付最低的方案，因一定最容易按時繳","比較商品原價與分期價差即可，不必看逾期條款","比較完整契約條件及無法準時付款的成本"],"answer":3,"explain":"逐選項解析：（1）零利率不代表逾期費用不存在。；（2）月付低仍可能有長期總負擔及延遲付款風險。；（3）價格差額不能取代完整契約審閱。；（4）應同時比較準時付款與違約時的總成本。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F247","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"信用管理與先買後付","q":"學生用信用卡預借現金支付一般消費，認為與刷卡完全相同。應先確認什麼？","options":["查明預借現金手續費、利息及計息起點","預借現金與一般刷卡均有相同免息期","只要ATM可提款，就代表沒有額外費用","預借現金只影響可用額度，不會形成應還債務"],"answer":0,"explain":"逐選項解析：（1）預借現金通常涉及不同於一般消費的費用及計息條款。；（2）一般消費免息安排不能直接套用預借現金。；（3）提款可用不代表免手續費與利息。；（4）預借款仍需償還，且可能增加融資成本。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F248","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"信用管理與先買後付","q":"家庭每月都用新卡分期償還舊卡帳單。最需要優先處理什麼？","options":["整理總負債並建立可執行的還款及支出調整計畫","增加信用卡張數以提高每月可循環額度","只償還各卡最低金額，因不會增加總利息","把所有帳單改為最長期數，便可不再管理支出"],"answer":0,"explain":"逐選項解析：（1）先掌握負債全貌及現金流，必要時與金融機構協商。；（2）增加信用額度可能延後而非解決還款困難。；（3）僅繳最低額可能累積循環利息。；（4）延長期數不會自動降低支出或清除負債。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F249","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"信用管理與先買後付","q":"學生借用朋友信用卡購物，口頭承諾會付款。最應注意什麼？","options":["朋友口頭答應付款後，銀行應直接向朋友請款","辨認持卡人對帳單及信用責任，避免以私人承諾替代正式管理","只要購買者不是持卡人，刷卡帳款就自動無效","只要朋友把商品退貨，所有帳務與爭議都會自動解除"],"answer":1,"explain":"逐選項解析：（1）私人承諾通常不能改變發卡機構與持卡人間的契約。；（2）持卡人應掌握授權、帳單與還款責任，避免任意借卡。；（3）借卡購物不代表交易對銀行必然無效。；（4）退貨仍涉及商家退款及入帳時間等程序。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F250","quality_review":"第十一批選項及逐項解析改善；待教師終審"},{"topic":"信用管理與先買後付","q":"信用卡廣告強調高回饋，但需達到高消費門檻。應如何判斷？","options":["計算必要消費可取得的淨回饋，並扣除年費與額外支出","以最高回饋百分比乘上信用額度，當作每年可得利益","為達成回饋門檻先購買不需要的商品，再分期攤還","只比較首月回饋，不考慮後續門檻及上限"],"answer":0,"explain":"逐選項解析：（1）須以原本會發生的支出評估實得回饋，避免額外消費侵蝕利益。；（2）信用額度不是實際消費或可得回饋，還有回饋上限。；（3）多花錢取得回饋通常不符合節省支出的目的。；（4）短期活動可能有限額、指定通路或後續條件。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F251","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"信用管理與先買後付","q":"有人認為信用額度越高就越有錢。應如何修正？","options":["信用額度代表銀行同意借款的上限，不等於個人淨資產","信用額度可以列為資產，因為隨時可用於消費","只要每期繳最低應繳額，額度就等於可長期支配所得","信用額度越高，表示負債占收入比率必然越低"],"answer":0,"explain":"逐選項解析：（1）授信額度是可借款範圍，動用後通常產生負債。；（2）可用額度不是自己已擁有的資產。；（3）最低繳款可能產生循環利息，不能視為收入。；（4）額度高低不能單獨推論實際負債負擔。。","source":"金融一點通；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F252","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"學生一年後要繳學費，卻把全部存款投入單一科技股。應如何調整？","options":["先買不同科技股，因為持有兩檔即可消除學費風險","將一年後確定要用的學費保留在流動性高、價格波動較低的工具","改投高股息科技ETF，因配息可確保學費本金","先以學貸補足學費，再把現有存款全部留在單一科技股"],"answer":1,"explain":"逐選項解析：（1）同產業股票仍可能同步下跌。；（2）短期確定支出應優先考慮資金可用性與本金波動。；（3）配息與淨值都不保證，仍可能不足支付學費。；（4）借款不會消除投資虧損，還會增加還款義務。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F253","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"退休者持有三檔同產業ETF，認為已充分分散。應檢視什麼？","options":["分析三檔ETF的持股重疊、產業與市場相關性","只看基金名稱不同，就認定投資風險互不相關","比較配息月份是否錯開，以判斷產業風險是否分散","只比較三檔ETF的經理費，不需要檢查底層資產"],"answer":0,"explain":"逐選項解析：（1）同產業ETF可能大量持有相同股票，分散效果有限。；（2）名稱不同不代表持股或風險來源不同。；（3）配息時間與底層投資相關性是不同概念。；（4）費用影響報酬，但不能代替風險集中度分析。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F254","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"家庭同時有高利卡債與股票投資，卻打算再借錢加碼。應先做什麼？","options":["先盤點高利債務、償還計畫及緊急預備金，再決定可投資金額","先借低利信貸買股，再用預期股利償還卡債","因股票長期可能上漲，先暫停支付卡債本金","只要將股票分成三檔，就可忽略卡債利息"],"answer":0,"explain":"逐選項解析：（1）高成本負債是確定的費用，應與投資風險一併衡量。；（2）股利不確定，借新債投資會擴大財務槓桿。；（3）拖延還款可能持續產生高額利息。；（4）分散股票不會降低既有卡債的利息成本。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F255","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"投資人因朋友推薦，把所有資產放入單一未上市公司。應如何降低風險？","options":["限制單一公司曝險，並查核財務資訊、估值與退出機制","只要創辦人是朋友，資訊揭露不足也不影響投資判斷","未上市股票沒有每日報價，因此價格不會下跌","先投資大部分資產，等上市後再考慮流動性"],"answer":0,"explain":"逐選項解析：（1）單一未上市公司具有資訊、估值與變現風險。；（2）私人關係不能取代財務與法律盡職調查。；（3）沒有公開報價不等於經濟價值穩定。；（4）上市時間不確定，資金可能長期無法退出。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F256","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"學生買海外基金，忽略未來要用新臺幣繳費。應評估什麼？","options":["納入匯率波動、換匯成本與繳費時間，評估新臺幣實際可得金額","只看基金以美元報價的報酬，因學費以新臺幣支付","只要基金持有不同國家股票，就不再有任何匯率風險","在繳費當天才決定是否賣出，因短期匯率無法影響學費"],"answer":0,"explain":"逐選項解析：（1）學費有確定到期日，匯率與資產價格都會影響可用金額。；（2）外幣報酬不等於換回新臺幣後的報酬。；（3）國際分散投資不必然消除換匯風險。；（4）繳費日若遇市場下跌或匯率不利，可能被迫認賠。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F257","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"家庭有三個月緊急預備金，但工作收入高度不穩定。應如何判斷是否足夠？","options":["三個月預備金對所有家庭都足夠，不必考慮職業","將預備金全部投入可隨時交易的股票，增加預期收益","依收入波動、扶養責任與固定支出評估是否增加預備金","只以去年平均收入決定預備金，不必計算每月必要支出"],"answer":2,"explain":"逐選項解析：（1）適當緩衝期因家庭風險而異。；（2）股票可交易不代表需要時能以合理價格變現。；（3）不穩定收入可能需要較長的生活費緩衝。；（4）預備金需求應以必要支出及可能中斷收入期間估計。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F258","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"投資人看到去年股市上漲，便提高所有投資預期報酬。應如何修正？","options":["以去年單年報酬直接當作未來每年固定收益","只挑去年漲幅最高的資產，因趨勢通常不會改變","把投資本金改為借款，放大去年觀察到的報酬","用保守與不利情境估計報酬、波動與可能損失"],"answer":3,"explain":"逐選項解析：（1）過去績效不能保證未來結果。；（2）追逐近期績效可能忽略估值與風險。；（3）槓桿同時放大虧損與還款壓力。；（4）情境分析有助避免過度樂觀的財務計畫。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F259","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"風險分散與資產配置","q":"退休者每月固定支出，投資組合卻缺乏現金部位。應如何改善？","options":["為追求報酬將所有現金換成長期鎖定商品","把每月生活費全部改靠股票配息，因配息金額固定","保留近期生活費所需的流動性資金，並檢查提領順序","只在股市下跌時出售股票支付生活費，避免錯過反彈"],"answer":2,"explain":"逐選項解析：（1）長期鎖定資金可能無法支付短期支出。；（2）股票配息可變動，也可能伴隨淨值下降。；（3）退休期間的固定支出需有可動用資金緩衝。；（4）下跌時被迫賣出可能加重資產耗損。。","source":"金融商品分類整理20261021；簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F260","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"接案工作者收入季節波動，卻用最高收入月份規劃固定支出。應如何調整？","options":["用最高收入月份作為固定支出上限，避免存款閒置","以保守收入與年度平均必要支出編預算，保留淡季現金緩衝","把淡季不足部分預設以信用卡循環支付","將所有旺季收入投入長期無法贖回的投資"],"answer":1,"explain":"逐選項解析：（1）高峰收入未必能在淡季持續。；（2）收入不穩定時需預留淡季生活費。；（3）循環利息可能提高淡季資金成本。；（4）資金全數鎖定會削弱支付日常支出的能力。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F261","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"家庭預計半年後換屋頂，卻把修繕款投入高波動股票。應如何規劃？","options":["因修繕支出半年後才發生，仍可全部投入高波動股票","將修繕費視為緊急支出，等工程開始再申請貸款","改買同產業三檔股票，便能確保半年後本金足夠","把已知短期修繕款保留在較低波動、易動用的資金"],"answer":3,"explain":"逐選項解析：（1）短期市場下跌可能使修繕款不足。；（2）已知費用應事先編列，借款另有成本與核貸不確定性。；（3）持有多檔股票仍不能保證短期本金。；（4）資金用途與時間期限應決定適合的風險程度。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F262","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"學生每月有零用錢，卻不知道錢花在哪裡。應先做什麼？","options":["先申請額度較高的信用卡，便能知道每月花費上限","先記錄實際支出，區分必要與非必要消費，再設定可達成的儲蓄目標","把每月結餘全部投入高風險商品，無須記帳","只記錄大額支出，因零食與交通費不影響預算"],"answer":1,"explain":"逐選項解析：（1）信用額度是借款能力，不能代替預算。；（2）記帳能找出可調整的支出及合理儲蓄額。；（3）儲蓄安排應先評估用途及風險承受度。；（4）小額經常性支出累積後可能相當可觀。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F263","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"雙薪家庭其中一人可能失業，仍打算把全部預備金用作旅遊。應如何判斷？","options":["將預備金投入短期高收益商品，預期獲利支付旅費","雙薪家庭有兩份收入，無須為單一失業風險留現金","把旅遊費改刷卡分期，便不會影響家庭資產負債","先估算可能失業期間的必要支出，保留合適預備金後再安排旅遊"],"answer":3,"explain":"逐選項解析：（1）高收益不保證，且可能侵蝕緊急預備金。；（2）失去一份收入仍可能使家庭現金流不足。；（3）分期只是延後付款，仍有未來償還義務。；（4）應依收入中斷風險與必要支出決定可動用旅遊預算。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F264","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"家中長者突然需要照護，原本預算只含生活費。應如何處理？","options":["重新估算照護費、現有保障與補助資格，調整家庭現金流","把照護費全部列為非必要支出，待有餘裕再支付","只購買投資型保單，便能立即支付所有照護費","把原本退休金全部投入股票，以彌補新增照護費"],"answer":0,"explain":"逐選項解析：（1）照護可能是持續且必要的費用，需整合可用資源。；（2）必要照護支出不宜僅依可自由支配餘額決定。；（3）保險商品可能有費用與保障限制，無法直接解決當期現金需求。；（4）高波動投資可能使短期照護資金不足。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F265","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"學生把每年保險費視為突發支出，繳費時只能借錢。應如何改善？","options":["將每年可預期保費除以十二，按月提列並保留在可動用資金","保費每年才繳一次，因此可全部視為不可預測的緊急支出","以信用卡循環支付保費，因分期必然比預先儲蓄便宜","將保費準備金投入高波動股票，繳費時再視價格賣出"],"answer":0,"explain":"逐選項解析：（1）年度保費是可預期支出，可按月編列準備。；（2）固定繳費日期通常可事先規劃。；（3）循環利息可能高於事先儲蓄的成本。；（4）短期確定支出不宜依賴波動較大的資產價格。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F266","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"家庭有高利卡債，但每月仍大量購買非必要商品。應優先做什麼？","options":["只要買入高股息ETF，就可保證股利高於卡債利息","先增加非必要消費取得信用卡回饋，再用回饋抵利息","將每月最低應繳額當作完整清償，無須追蹤本金","優先檢視必要支出、減少非必要消費並規劃高利債務償還"],"answer":3,"explain":"逐選項解析：（1）股利不保證，投資風險不應被忽略。；（2）回饋通常難以抵銷額外消費及高利息。；（3）最低應繳可能未清償全部本金，並產生循環利息。；（4）削減可調整支出有助騰出還款現金流。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F267","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"家庭預算與緊急預備金","q":"上班族準備轉職，可能三個月沒有薪資。應如何安排？","options":["預期三個月後會找到工作，因此不必預留生活費","先預估無薪期間的必要支出，準備可即時動用的現金","將轉職準備金全投入股票，因股票可隨時賣出","先申請信用卡預借現金，取代所有原有存款"],"answer":1,"explain":"逐選項解析：（1）求職時間具有不確定性。；（2）轉職期可能沒有收入，應預留生活費與意外緩衝。；（3）股票價格波動可能使賣出時資金不足。；（4）預借現金可能產生手續費及利息，不能取代風險管理。。","source":"簡單財務規劃筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F268","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"跨主題金融決策","q":"退休長者想用以房養老補貼照護費，家屬擔心款項被挪用。哪個整合方案較合理？","options":["只申辦以房養老，因貸款契約會自動監督所有照護支出","評估貸款撥款與利息條件，並視需要設計安養信託的支付監督","先將房屋贈與家屬，再以長者名義申請同一房屋的貸款","將所有貸款款項交由親友保管，因親屬關係足以取代契約"],"answer":1,"explain":"逐選項解析：（1）逆向抵押貸款不必然包含照護款項的用途監督。；（2）貸款與信託功能不同，結合時仍須檢查成本與契約條件。；（3）房屋所有權及設定抵押權資格需符合貸款規定。；（4）口頭委託親友可能缺乏可稽核的支付與監督安排。。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F269","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"跨主題金融決策","q":"學生收到假冒銀行的高利存款簡訊，手上又有三個月後要繳的學費。應如何決策？","options":["先從簡訊連結登入確認優惠，再決定是否存入學費","先將學費買入高配息基金，等配息後再支付學費","將學費拆成數筆轉入訊息提供的帳號，以降低單筆損失","以銀行官方管道查證訊息，並將三個月後的學費留在低波動且易動用的資金"],"answer":3,"explain":"逐選項解析：（1）可疑連結可能是釣魚網站，不宜先登入。；（2）配息不保證，短期基金淨值也可能下跌。；（3）拆分匯款不會使可疑收款方變安全。；（4）應同時處理詐騙風險與短期確定支出的流動性需求。。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F270","quality_review":"第十二批：選項與逐項解析改寫，尚待官方資料及教師終審"},{"topic":"跨主題金融決策","q":"家庭房貸寬限期即將結束，卻打算借信貸買高波動ETF。應先做什麼？","options":["先試算寬限期後本息月付及ETF下跌時的家庭現金流","先投入ETF，待寬限期結束再看是否出售","只比較信貸利率與ETF過去一年報酬","用寬限期節省的月付當成可永久投資的餘額"],"answer":0,"explain":"逐選項解析：（1）同時評估負債與資產波動才看得出資金缺口；（2）市場下跌時可能被迫賣出且無法支付房貸；（3）歷史報酬不保證未來收益且忽略本金風險；（4）寬限期結束後本息負擔通常會改變。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F271","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"跨主題金融決策","q":"企業推出ESG債券基金，投資人一年後要用新臺幣支付留學費。應如何評估？","options":["同時衡量債券淨值、匯率、費用及一年後支付需求","以ESG標示判斷一年後本金必可全額取回","只比較配息率，不考慮賣出時基金市價","因基金持有債券就把它當作一年期定存"],"answer":0,"explain":"逐選項解析：（1）一年後有確定外幣支出，須同步管理價格與匯率風險；（2）ESG不代表保本或到期兌付；（3）配息不能取代對總報酬與流動性的評估；（4）債券基金沒有等同定存的本金保障。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F272","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"跨主題金融決策","q":"家長有高利卡債，卻想先購買高保費投資型保單。應如何排序？","options":["先購買保單，因保單長期報酬可能抵銷卡債利息","先檢視必要保障及卡債成本，再決定可負擔的保費與投資","把卡債轉為最低應繳，將差額全數繳投資型保費","用保單預期投資報酬率直接當作還債資金"],"answer":1,"explain":"逐選項解析：（1）投資報酬不確定，不能忽略已發生的高利債務；（2）先處理保障缺口與昂貴負債較符合風險管理；（3）最低應繳可能延長還款並累積利息；（4）未實現投資收益不等於可支付的確定現金流。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F273","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"跨主題金融決策","q":"長者接到自稱理專的電話，要求提供OTP以設定信託撥款。應如何處理？","options":["先確認電話顯示的銀行名稱，再告知OTP","拒絕提供OTP，改從銀行官方電話或App確認","只告知OTP最後三碼，讓對方核對身分","請對方先傳信託契約照片，再提供驗證碼"],"answer":1,"explain":"逐選項解析：（1）來電顯示可被偽冒，不足以驗證身分；（2）驗證碼屬敏感資訊，應獨立向官方查證；（3）部分驗證碼仍可能被濫用，不應透露；（4）文件照片也可能偽造，不能證明來電可信。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F274","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"跨主題金融決策","q":"學生把所有存款投入高配息ETF，還準備用配息償還學貸。應如何評估？","options":["只看ETF最近一年配息，推估每月可還學貸金額","先延後學貸還款，將本金留在ETF領息","評估配息變動、淨值波動與固定還款義務","只要ETF有配息，就無須準備還款預備金"],"answer":2,"explain":"逐選項解析：（1）歷史配息不保證未來金額；（2）還款條件不能由投資人自行決定；（3）配息不一定是額外收益，投資本金仍會波動；（4）固定負債需要可靠的現金流與備援。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F275","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"跨主題金融決策","q":"公司宣稱淨零並提供高保證報酬投資方案，要求匯入私人帳戶。應如何判斷？","options":["因公司宣稱淨零，先投入小額確認收益","先匯款但要求對方提供年度ESG報告","只要提供高保證報酬就可忽略收款帳戶名稱","同時核查永續聲明、合法投資資格及私人帳戶收款風險"],"answer":3,"explain":"逐選項解析：（1）小額獲利可能是詐騙誘餌；（2）ESG報告不能替代收款對象及投資合法性查核；（3）保證高報酬與私人收款均屬重大警訊；（4）應分別核實環境主張與投資及金流真實性。","source":"財務規劃、金融科技、保險、信託與防詐講義","review_status":"情境改寫，待官方法規及教師審核","id":"F276","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"央行升息後，家庭機動利率房貸月付可能提高。應先做什麼？","options":["依貸款契約重算利率調整後月付並預留支出緩衝","直接用央行升息幅度乘原月付金額估算增加額","因房貸是機動利率，隔日月付必立刻改變","先把緊急預備金全數拿去提前還款"],"answer":2,"explain":"逐選項解析：（1）實際調整依契約指標與重設時間而定；（2）月付增加不是原月付乘升息幅度的簡單關係；（3）各銀行調整時點可能不同；（4）提前還款也須兼顧流動性及違約金。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F277","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"市場預期降息，投資人想買長期債券。應注意什麼？","options":["只要預期降息，長債價格就不可能再跌","只比較長債票面利率，不必看目前市價","檢視降息預期是否已反映於價格及存續期間風險","預期降息時買債不需評估發行人信用風險"],"answer":2,"explain":"逐選項解析：（1）市場預期變動可能導致價格反向波動；（2）票面利率不等於以現價買入的殖利率；（3）長存續期間債券對利率變動通常更敏感；（4）債券仍有信用及流動性風險。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F278","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"物價快速上漲，學生認為存款利息增加就一定變富有。應如何判斷？","options":["比較名目存款利率與通膨率以估算實質購買力","存款利率提高就代表購買力必然提高","只看帳戶餘額增加，不需考慮物價","用名目利率加上通膨率估計實質報酬"],"answer":0,"explain":"逐選項解析：（1）實質報酬近似名目報酬扣除通膨；（2）若通膨更高，實質購買力仍可能下降；（3）帳面金額增加不等於能購買更多商品；（4）實質報酬不是兩者直接相加。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F279","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"企業因借款成本上升而延後擴廠，這反映什麼決策？","options":["利率上升提高資金成本，可能降低擴廠計畫淨現值","利率上升必使所有企業立即停止投資","企業延後擴廠表示其產品需求必然歸零","只要擴廠有營收，借款利率就不影響決策"],"answer":0,"explain":"逐選項解析：（1）折現率與融資成本影響投資可行性；（2）企業是否投資仍取決於預期現金流與資金來源；（3）延後投資可能出於成本變化，不代表需求消失；（4）營收不等於扣除融資成本後仍有足夠報酬。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F280","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"家庭想用信貸買車，發現市場利率普遍上升。應如何調整？","options":["重新比較總借款成本、月付與其他交通方案","只看每月車貸廣告利率，不必比較總費用","先延長年限到最長，因總利息必然較低","用未來加薪預期支付目前已確定的月付"],"answer":0,"explain":"逐選項解析：（1）應將利率、費用與現金流一起比較；（2）名目利率可能未反映全部借款成本；（3）年限延長可能降低月付但增加總利息；（4）預期加薪不保證能支應固定債務。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F281","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"股市因政策消息短期大漲，學生準備借錢追高。應如何評估？","options":["以政策消息當作必然上漲的訊號借款進場","分辨市場已反映的預期與實際風險，避免槓桿追價","只設定停利價，不需規劃最大可承受損失","只要借款利率低於過去股市報酬率就值得借款"],"answer":1,"explain":"逐選項解析：（1）消息可能已反映在股價中；（2）借款投資會放大虧損並增加固定還款壓力；（3）停利不能替代風險與流動性規劃；（4）過去報酬不保證未來且不等於確定現金流。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F282","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"企業有大量浮動利率負債，央行政策可能收緊。財務主管應先評估什麼？","options":["只估算營收成長，不用看利息支出","測試浮動利率上升對利息費用與營運現金流的影響","因借款本金固定，未來利息支出也固定","把所有浮動借款直接視為零利率負債"],"answer":1,"explain":"逐選項解析：（1）營收成長可能不足以抵銷財務成本；（2）利率敏感度分析可辨識現金流缺口；（3）浮動利率會依約定指標與時點調整；（4）本金固定不代表借款利率為零。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F283","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"金融市場與貨幣政策","q":"退休者持有固定利率債券，市場殖利率上升。應如何理解價格變化？","options":["殖利率上升代表既有固定票息債券市價必然上升","評估債券市價可能下跌及提前賣出的損失","固定利率債券不會有任何價格波動","只看持有期間收到的票息，不必管出售時市價"],"answer":1,"explain":"逐選項解析：（1）價格與市場殖利率通常反向變動；（2）提前出售可能實現價格損失；（3）固定票息不等於固定市場價格；（4）若有提前變現需求，市場價格十分重要。","source":"金融市場常識；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F284","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"職涯、保險與人力資本","q":"學生在高薪短期兼職與能培養專業技能的實習間選擇。應如何比較？","options":["只比較本月到手薪資，因技能未來價值無法評估","只看實習公司名氣，不考慮學習內容","比較目前收入、技能累積與未來職涯選擇","只看工作時間最短的方案，不考慮通勤及發展"],"answer":2,"explain":"逐選項解析：（1）短期收入未涵蓋長期人力資本效益；（2）企業名氣不等於實際學習品質；（3）應綜合當期機會成本與未來能力累積；（4）工作時間只是其中一項成本。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F285","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"職涯、保險與人力資本","q":"自由工作者沒有固定雇主團保，收入又仰賴個人工作能力。應先做什麼？","options":["只選保費最低的意外險，不必看承保範圍","先把所有收入投資高風險商品以彌補沒有團保","盤點傷病停工的收入損失、現有保障與預備金","因沒有雇主團保，就無法購買個人保障"],"answer":2,"explain":"逐選項解析：（1）低保費不代表保障符合實際缺口；（2）高波動投資不能取代停工時的保障；（3）自由工作者尤其需要評估收入中斷風險；（4）可依資格與需求評估個人保險及其他保障。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F286","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"職涯、保險與人力資本","q":"剛畢業者想用全部存款購買高價課程，卻沒有生活預備金。應如何決策？","options":["只比較課程廣告標示的原價與折扣","評估課程與職涯需求的關聯並保留基本生活預備金","因課程有證書，全部存款投入必然值得","先刷卡分期繳費，就等於不必準備生活費"],"answer":1,"explain":"逐選項解析：（1）折扣不能證明學習成果或投資效益；（2）教育投資應兼顧回報與短期流動性；（3）證書未必獲雇主認可；（4）分期付款仍是未來負債。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F287","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"職涯、保險與人力資本","q":"某人轉職後薪資提高但通勤與住宿費大增。應如何比較兩份工作？","options":["以新工作名目薪資直接判定一定比較好","只比較住宿費，不需考慮通勤時間","比較扣除通勤住宿等成本後所得與未來發展","只看第一個月薪水，不必考慮試用期或福利"],"answer":2,"explain":"逐選項解析：（1）薪資提高可能被相關成本抵銷；（2）時間與其他生活成本也影響淨效益；（3）綜合可支配所得與職涯成長較合理；（4）工作條件可能隨時間改變。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F288","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"職涯、保險與人力資本","q":"學生想借高利貸款購買不確定能提高收入的證照課程。應如何處理？","options":["只看課程承諾的平均薪資，不必核實認證","先借高利貸，若課程有用再考慮還款","核實證照效益、費用、融資成本與還款能力","只要課程名額有限，就應優先付款"],"answer":2,"explain":"逐選項解析：（1）廣告薪資可能有選樣偏差；（2）高利借款可能超過課程帶來的效益；（3）先確認實際需求與可負擔性較穩妥；（4）限時行銷不應取代成本效益評估。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F289","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"職涯、保險與人力資本","q":"家庭主要收入者準備創業，暫時沒有穩定薪水。應如何安排？","options":["試算創業期間家庭現金流、預備金與必要保障","以預估營業額全額當成家庭可用收入","只準備創業資金，不需估計家庭固定支出","因創業後時間彈性較高，就不必考慮收入中斷"],"answer":0,"explain":"逐選項解析：（1）創業收入不穩定，應事先準備生活緩衝；（2）營業額還需扣除成本與稅費；（3）家庭固定支出不會因創業而自動消失；（4）創業初期可能有較長收入空窗。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F290","quality_review":"第十三批：四選項與逐項解析已改寫，尚待教師與官方資料終審"},{"topic":"職涯、保險與人力資本","q":"員工離職後失去公司團體保險，卻未安排替代保障。應先做什麼？","options":["先核對原團保終止日與延續保障可能性，再依個人需求補足","先比較各公司團保費率，離職後仍沿用原公司保障","先投保儲蓄型商品，因其通常涵蓋原團保全部保障","確認保障中斷與個人風險缺口，評估適合的保障"],"answer":3,"explain":"逐選項解析：（1）核對保障期限有助辨識空窗，但仍須評估個人風險缺口。；（2）離職後團保是否有效依契約與資格，不能假定持續。；（3）儲蓄型商品不必然涵蓋團保的醫療或意外保障。；（4）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F291","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"職涯、保險與人力資本","q":"學生把信用卡回饋視為額外薪水，為達門檻增加消費。應如何修正？","options":["將回饋額度列為固定月薪，按最高回饋率規劃開銷","比較回饋上限與實際支出，避免為回饋新增非必要消費","為了達回饋門檻先分期付款，再用回饋抵銷利息","以實際必要支出計算回饋，不把借款額度當收入"],"answer":3,"explain":"逐選項解析：（1）回饋依消費與活動條件產生，並非固定收入。；（2）回饋只應是既有必要支出的附加效益。；（3）分期成本可能超過回饋，增加不必要負債。；（4）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。。","source":"財務規劃筆記；保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F292","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"學生比較一般股票與股票型ETF的交易成本。應先確認什麼？","options":["只比較股票與ETF的成交價差，不需看交易稅","查明各商品適用手續費與交易稅規定，再估算淨成本","先確認券商折扣，再把股票與ETF都套用同一證交稅率","只比較配息，交易成本會在券商帳戶自動抵銷"],"answer":1,"explain":"逐選項解析：（1）成交價差未包含手續費與交易稅。；（2）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。；（3）券商折扣與商品適用稅率是不同事項。；（4）配息不會使交易費用自動消失。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F293","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"投資人想做現股當沖，直接套用一般股票賣出稅率。應如何處理？","options":["只要同日買賣任意股票，賣出稅率一律固定減半","先確認是否為合格當沖交易，再依適用規定計算成本","先確認交易符合當沖資格及適用期間與稅率","因當沖在同一天完成，買賣兩邊都免證交稅"],"answer":2,"explain":"逐選項解析：（1）優惠須符合標的、交易方式與適用法規。；（2）適用資格與優惠期限會影響實際交易稅。；（3）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。；（4）當沖並非買賣兩邊完全免除相關成本。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F294","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"兩檔基金報酬相近，但一檔有遞延銷售手續費。應如何比較？","options":["只看基金申購當日扣款，遞延費可忽略","比較短期與長期持有的總費用，含買回時的遞延費","只看基金淨值走勢，因遞延費已必然反映在淨值","按預計持有與買回時間估算實際費用"],"answer":3,"explain":"逐選項解析：（1）買回時可能另收費用，初始扣款不足以比較。；（2）遞延費通常與持有期間或買回條件相關。；（3）個人買回時的遞延銷售費未必已反映於公布淨值。；（4）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F295","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"學生以為基金經理費只在買入時支付一次。應如何查核？","options":["經理費只在首次申購收取，之後淨值不受影響","經理費按契約持續計提，投資人應檢視公開說明書","經理費只在基金配息時收取，未配息就免收","確認經理費等持續性費用的計提方式與淨值反映"],"answer":3,"explain":"逐選項解析：（1）持續性費用不等於一次性申購費。；（2）經理費與保管費等可能按日計提並反映於淨值。；（3）是否配息通常不是經理費收取的唯一條件。；（4）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F296","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"某人買進股票後隔日賣出，價差小於總交易費。應如何判斷？","options":["只看成交價差，因券商已在成交價內含全部稅費","扣除買賣手續費與適用交易稅後計算實際損益","扣除買進與賣出手續費及適用的賣出證交稅","先用股息率抵銷當次交易費，即使未除息也計入"],"answer":1,"explain":"逐選項解析：（1）成交價差未必是扣費後實現損益。；（2）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。；（3）買賣成本及稅費可能使小幅價差轉為淨虧損。；（4）未取得的股息不應計入當次已實現損益。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F297","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"投資人比較債券ETF與直接買債券，卻只看票息。應如何改善？","options":["因兩者都投資債券，費用及流動性必然相同","同時評估費用、流動性、信用及利率風險","直接買債券只看票息，ETF只看配息率即可","只要ETF可在盤中交易，就不需衡量利率敏感度"],"answer":1,"explain":"逐選項解析：（1）持有結構與交易市場不同，費用和流動性可能不同。；（2）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。；（3）票息或配息率不足以反映價格、信用及費用風險。；（4）盤中可交易不代表價格不受利率影響。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F298","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"某基金配息高，但申購與買回費也高。應如何衡量？","options":["比較扣費後含息總報酬與投資期限","以扣費後含息總報酬比較，並依持有期限評估買回成本","只比較年化配息率，因本金淨值變化可忽略","以申購費較低者為優先，買回費與管理費不重要"],"answer":0,"explain":"逐選項解析：（1）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。；（2）總報酬須納入價格變動、現金分配與各項費用。；（3）高配息可能伴隨淨值下降，不等於淨賺。；（4）費用分布於不同時點，應綜合比較。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F299","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"topic":"稅費與金融商品比較","q":"學生在兩家券商交易同額股票，折扣不同但最低收費也不同。應如何選擇？","options":["只比較折扣百分比，折扣較高者一定較省","比較每筆交易金額、費率折扣與最低手續費","依實際每筆金額估算應付手續費而非只看折扣比例","把最低手續費除以年度交易總額，即可忽略單筆規定"],"answer":2,"explain":"逐選項解析：（1）若有最低收費，折扣較高未必讓小額交易較便宜。；（2）實際應付金額取決於折扣與最低收費等條件。；（3）此選項符合題意，須將商品條件、費用與自身資金用途一起評估。；（4）最低收費通常按交易或券商約定計，不宜任意攤提。。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F300","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F301","topic":"存保與資產配置","q":"父親在A銀行活存120萬、定存140萬、外幣存款折合80萬，另有A銀行銷售的基金60萬；B銀行存款50萬。假設均為國內要保機構且不計利息，何者正確？","options":["A銀行全部400萬都算存保","A銀行存款最高保障300萬，基金不計入；B銀行另計","A銀行因外幣存款而全部失去保障","A、B銀行合計最高保障300萬"],"answer":1,"explain":"逐選項解析：（1）把基金誤當存款；（2）A銀行存款340萬，存保上限300萬；基金不是存款；B銀行50萬另計；（3）誤認外幣不受存保；（4）把不同要保機構合併。","source":"中央存保與金融商品分類","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","concept":"存保歸戶+商品辨識","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F302","topic":"存保與流動性","q":"小芳有三個月後須支付的手術費220萬元。她在同一銀行已有定存260萬元，打算將手術費也放入同銀行，且希望兼顧存保與隨時動用。最適合先做什麼？","options":["將全部轉為同銀行長期定存以提高利率","先核對要保機構、合計保額及提前解約條件，必要時分散並保留活存","改買同銀行推薦的基金，因銀行銷售即可受存保","將存款分成十個同銀行帳戶，各帳戶享300萬元"],"answer":1,"explain":"逐選項解析：（1）忽略到期時間；（2）存保以同一存款人、同一要保機構歸戶，手術費還有短期流動性需求；（3）混淆投資與存款；（4）誤以帳戶數增加保障。","source":"中央存保與財務規劃","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","concept":"保障額度+流動性","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F303","topic":"金融消費爭議","q":"阿偉向銀行申訴基金銷售說明不實，銀行第18天回覆拒絕退款。他收到回覆後想申請金融消費評議，何者最合理？","options":["須等銀行申訴滿30天才可申請","可自收到處理結果起60日內提出評議並附證據","必須先打贏民事官司才能申請","評議中心可直接判定業務員犯罪"],"answer":1,"explain":"逐選項解析：（1）混淆回覆與逾期；（2）不接受金融服務業申訴處理結果者，得於收到結果起60日內申請評議，不必再等到第30天；（3）誤加前置條件；（4）混淆評議與刑事司法。","source":"金融消費爭議處理","official":"https://law.fsc.gov.tw/LawContent.aspx?id=GL000331","concept":"申訴回覆+60日","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F304","topic":"金融消費爭議","q":"小林4月1日提出金融消費申訴，銀行至5月1日仍未回覆。小林已保存掛號收據及商品說明書。下一步何者較符合程序？","options":["向評議中心申請評議並提出未回覆證據","繼續無限期等待銀行","要求評議中心先凍結所有銀行帳戶","直接把申訴當成法院勝訴判決"],"answer":0,"explain":"逐選項解析：（1）金融業者逾30日未處理時，可在期限屆滿日起60日內申請評議；（2）忽略法定救濟期限；（3）超出評議權限；（4）混淆程序與判決。","source":"金融消費爭議處理","official":"https://law.fsc.gov.tw/LawContent.aspx?id=GL000331","concept":"申訴逾期+證據","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F305","topic":"交易成本比較","q":"小儒同日分別賣出一般上市股票10萬元與一般股票型ETF 10萬元，不計手續費，依一般適用稅率，兩筆證交稅合計多少？","options":["300元","400元","200元","500元"],"answer":1,"explain":"逐選項解析：（1）漏算ETF；（2）股票賣出0.3%為300元，股票型ETF賣出0.1%為100元，合計400元；（3）將稅率混淆；（4）多計費用。","source":"金融商品費用","official":"https://www.twse.com.tw/zh/about/company/guide.html","concept":"股票與ETF賣出稅","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F306","topic":"交易成本比較","q":"甲持有一般股票與債券ETF各20萬元，近期需變現10萬元，假設兩者市價波動與手續費相同，且符合現行債券ETF免徵證交稅規定。僅比較證交稅，哪項正確？","options":["賣一般股票與債券ETF的證交稅相同","賣債券ETF的證交稅較低，但仍應檢查優惠期限","債券ETF須按0.3%課稅","股票賣出免證交稅，債券ETF課0.1%"],"answer":1,"explain":"逐選項解析：（1）忽略商品差異；（2）一般股票賣出0.3%，符合規定的債券ETF在現行優惠期間免徵；優惠有期限，不可當永久規則；（3）套用股票稅率；（4）將稅率倒置。","source":"金融商品費用","official":"https://www.twse.com.tw/zh/about/company/guide.html","concept":"ETF稅費+時效","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F307","topic":"投資組合與流動性","q":"高三學生預計八個月後繳交海外交換費12萬元，現有15萬元，另有長期投資部位。最合宜的規劃是？","options":["將12萬元全投入波動較高的單一產業ETF","先將近期確定支出留在低波動且可動用工具，餘額再評估投資","只要ETF長期平均報酬為正，八個月後就不會虧","借信用卡循環額度支付交換費以保留投資"],"answer":1,"explain":"逐選項解析：（1）資產期限錯配；（2）確定且短期的負債需優先匹配資金到期與流動性；長期投資資金才能承擔較高波動；（3）將長期統計誤當短期保證；（4）以高成本負債增加風險。","source":"財務規劃與ETF","official":"","concept":"資產負債期限配對","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"F308","topic":"ETF持股重疊","q":"小安同時買了台灣大型股ETF、科技產業ETF及高股息ETF，發現前三大成分股高度重疊。最需要修正的認知是？","options":["ETF檔數增加不一定代表分散效果同比增加","應查看底 存新利率上升、手中長天期固定票息債券市價下跌。何者最能同時解釋？","options":["新存款利率與既有債券市價受市場利率變化影響，但方向可能不同","升息必然讓所有金融資產價格同時上漲","債券票息固定表示市價固定","定存利率與債券價格都與利率無關"],"answer":0,"explain":"逐選項解析：（1）市場利率上升時新存款條件可能提高；既有固定票息債券折現價值通常下降；（2）忽略不同資產特性；（3）混淆票息與交易價格；（4）否認利率傳導。","source":"中央銀行與金融市場","official":"","concept":"利率傳導","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP001","topic":"貨幣政策與總體金融","q":"景氣連續低迷、失業率升高且物價漲幅溫和。央行希望增加市場流動性，哪個政策組合較一致？","options":["提高存款準備率並賣出債券","降低重貼率並公開市場買入債券","提高重貼率但買入債券","降低重貼率並提高存款準備率"],"answer":1,"explain":"逐選項解析：（1）兩者均偏緊縮，方向相反；（2）降低重貼率與買入債券均偏向擴張性貨幣政策，有助增加流動性；（3）重貼率與公開市場操作方向互相抵銷；（4）降低重貼率偏寬鬆，但提高準備率偏緊縮。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP002","topic":"貨幣政策與總體金融","q":"物價持續快速上漲，央行決定公開市場賣出政府債券。某銀行財務主管應先預期哪種直接效果？","options":["銀行體系準備金可能減少，短期資金趨緊","銀行準備金因買入債券而增加","銀行放款能力不受任何影響","民眾持有債券的票面利率會自動改寫"],"answer":0,"explain":"逐選項解析：（1）央行賣出債券，買方支付資金，銀行體系流動性通常收縮；（2）這是央行買入債券時較可能的方向；（3）流動性變動可能影響銀行放款能力；（4）既有債券票面利率不會因交易自動更改。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP003","topic":"貨幣政策與總體金融","q":"小芳持有固定利率、距到期尚久的政府公債，市場預期政策利率上升。她想在到期前賣出，主要須評估什麼？","options":["債券票息將隨市場利率同步上升","既有債券價格可能下跌，且長天期價格較敏感","公債本金必因升息而增加","到期殖利率提高代表她現在賣出一定獲利"],"answer":1,"explain":"逐選項解析：（1）固定利率票息依發行條件，不自動上調；（2）固定票息債券與市場利率通常反向變動；存續期間越長通常越敏感；（3）市場價格可能跌，非本金自動增加；（4）殖利率上升可能伴隨現價下跌。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP004","topic":"貨幣政策與總體金融","q":"央行降息後，企業想投資擴廠，但經理提醒「降息不等於股價必漲」。哪項理由最完整？","options":["折現率下降一定抵銷營收下滑","股價只取決於政策利率，不受獲利影響","降息可能降低資金成本，但市場也可能反映衰退風險","央行降息後所有企業都能以相同利率借款"],"answer":2,"explain":"逐選項解析：（1）營收與獲利下滑仍可能壓低估值；（2）企業獲利及風險溢酬同樣重要；（3）股價同時受折現率、企業現金流與市場預期影響；（4）信用風險不同，借款條件也不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP005","topic":"貨幣政策與總體金融","q":"某家庭的房貸採浮動利率，央行啟動緊縮政策。家庭財務規劃最適合採取何種做法？","options":["先檢視利率重訂條款並試算月付金增加幅度","假設每家銀行明天同步調高同一幅度","立即把緊急預備金全數投入股票","認為政策升息只影響新貸款"],"answer":0,"explain":"逐選項解析：（1）浮動利率房貸可能依契約與指標利率調整，應做現金流壓力測試；（2）調整時點與幅度取決於契約及銀行指標；（3）緊縮時保留緊急預備金更重要；（4）既有浮動利率貸款也可能受影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP006","topic":"貨幣政策與總體金融","q":"出口商報價美元、主要成本以新臺幣支付。若其他因素不變，新臺幣升值，哪項風險最值得優先管理？","options":["同額美元收入換回新臺幣可能減少","同額美元收入換回新臺幣一定增加","出口商原料成本必定全面上升","匯率變動不會影響跨幣別收入"],"answer":0,"explain":"逐選項解析：（1）新臺幣升值時，每美元可換得的新臺幣減少，影響未避險的外幣收入；（2）方向相反；（3）進口原料成本未必上升，可能下降；（4）不同幣別收支存在換算風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP007","topic":"貨幣政策與總體金融","q":"進口商需三個月後支付美元貨款，央行升息可能支持本幣，但公司不願賭匯率。哪項決策較合理？","options":["只憑升息訊號取消所有避險","依付款時點評估遠期外匯或自然避險","假設匯率只受本國利率決定","借更多美元且不評估匯率曝險"],"answer":1,"explain":"逐選項解析：（1）升息不保證本幣升值；（2）匯率受多種因素影響，企業應依實際幣別現金流管理曝險；（3）資本流動、外國利率等也影響匯率；（4）擴大外幣負債可能增加曝險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP008","topic":"貨幣政策與總體金融","q":"央行調降存款準備率後，銀行主管說「可放款資金增加，因此信用風險不重要」。應如何評價？","options":["完全正確，準備率可取代徵信","錯誤，準備金約束可能放鬆，但仍須審核還款能力","錯誤，降低準備率必使所有貸款利率上升","完全正確，銀行可無限創造貸款"],"answer":1,"explain":"逐選項解析：（1）準備率不是信用審查替代品；（2）準備率變動影響流動性約束，不免除授信、資本與風險管理要求；（3）利率變化不具此必然方向；（4）放款仍受資本、流動性與信用風險限制。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP009","topic":"貨幣政策與總體金融","q":"央行擬提高重貼率，某學生主張「這與公開市場賣出債券一樣，都是偏緊縮工具」。哪項判斷最佳？","options":["方向一致，但傳導管道與效果不完全相同","兩者必然使貨幣供給增加","提高重貼率屬擴張，賣債屬緊縮","只有賣債影響利率，重貼率完全無關"],"answer":0,"explain":"逐選項解析：（1）提高重貼率與賣債均偏緊縮，但分別經由央行融通成本與市場流動性傳導；（2）兩者皆非增加流動性的典型作法；（3）提高重貼率偏緊縮；（4）重貼率變動可能影響資金成本與利率預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP010","topic":"貨幣政策與總體金融","q":"通膨下降但仍高於目標，經濟成長放緩。央行是否應立刻大幅降息？哪種分析最符合決策思維？","options":["只看失業率就能決定","只看最近一個月股價就能決定","同時評估通膨持續性、成長、就業與預期，再權衡風險","通膨只要比上月低就代表物價已下跌"],"answer":2,"explain":"逐選項解析：（1）忽略物價風險；（2）股價不是唯一政策依據；（3）貨幣政策需權衡物價穩定與經濟情勢，通膨下降不等於物價水準下降；（4）通膨率降低通常是價格漲得較慢。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP011","topic":"貨幣政策與總體金融","q":"某公司持有短期存款與長期固定利率債券。市場利率上升時，哪項比較較合理？","options":["兩者市場價值都會等幅上升","長期固定利率債券通常承受較大的價格波動風險","短期存款必產生與長債相同的資本損失","長債因票息固定所以市價不會改變"],"answer":1,"explain":"逐選項解析：（1）利率上升通常不利既有固定利率債券市價；（2）長期固定利率債券通常利率敏感度較高；短期存款重訂價及流動性特性不同；（3）存款與債券的價格機制不同；（4）固定票息不代表固定市場價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP012","topic":"貨幣政策與總體金融","q":"政府擴大支出刺激景氣，同期央行升息抑制通膨。學生要分析總體效果，哪個說法較好？","options":["兩種政策方向可能互相拉扯，須看力度與時點","財政政策與貨幣政策一定同向","只要央行升息，政府支出就失去所有效果","政府支出增加代表央行必須同步降息"],"answer":0,"explain":"逐選項解析：（1）擴張性財政與緊縮性貨幣政策可能對總需求產生不同方向的影響；（2）兩者可採不同方向；（3）影響不會機械式完全抵銷；（4）政策協調不等於必須同步降息。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP013","topic":"貨幣政策與總體金融","q":"銀行調升新臺幣定存利率，退休族想把所有資產改放一年期定存。哪個提醒最適當？","options":["定存名目利率較高就必定超越通膨","應比較稅後實質報酬、流動性與存保額度","利率上升後所有股票都不值得持有","銀行定存與長期債券價格波動完全相同"],"answer":1,"explain":"逐選項解析：（1）名目利率不等於實質報酬；（2）資產配置須同時考量實質購買力、流動性、分散及存款保障；（3）股票風險報酬不能單憑升息判定；（4）定存與債券的風險特性不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP014","topic":"貨幣政策與總體金融","q":"央行買入公債後，有人說「市場資金增加，企業融資成本必立即下降」。哪個修正較精確？","options":["資金供給可能增加，但貸款利率仍受風險與傳導時滯影響","買債會立即減少銀行準備金","所有企業借款利率依法必相同","公開市場買債只改變票面利率，不影響流動性"],"answer":0,"explain":"逐選項解析：（1）公開市場買入債券通常增加流動性，但政策傳導非即時或一致；（2）買債一般增加而非減少流動性；（3）信用條件及風險差異造成利率不同；（4）交易影響市場資金與債券價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP015","topic":"貨幣政策與總體金融","q":"臺灣進口能源價格大漲引發物價上升，央行考慮升息。哪個判斷較完整？","options":["升息能立即增加全球能源供給","升息可能抑制需求及通膨預期，但無法直接消除供給衝擊","升息一定讓能源進口量歸零","只要是成本推動通膨，貨幣政策就沒有任何影響"],"answer":1,"explain":"逐選項解析：（1）利率工具無法直接創造能源；（2）貨幣政策主要影響需求與預期，對供給衝擊本身的處理有限；（3）能源需求不會機械式歸零；（4）政策仍可能影響次輪通膨及預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP016","topic":"貨幣政策與總體金融","q":"某出口公司同時借美元貸款並收美元貨款。新臺幣貶值時，哪項風險判斷最合理？","options":["美元收入與美元負債可能部分自然抵銷匯率曝險","只有美元收入受匯率影響，美元負債不受影響","新臺幣貶值會使美元負債折算新臺幣必然下降","自然避險表示收付款時間差完全不重要"],"answer":0,"explain":"逐選項解析：（1）相同幣別的收支可能形成自然避險，但金額與到期日須匹配；（2）美元負債折算也受匯率影響；（3）貶值時美元負債折算成本通常增加；（4）期限錯配仍有現金流與匯率風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP017","topic":"貨幣政策與總體金融","q":"升息後，一家高負債企業與一家現金充裕企業的股價反應不同。哪個分析最有說服力？","options":["兩家企業必須同幅下跌","負債結構、利息保障倍數與獲利前景會造成不同影響","企業股價只由央行利率決定","現金多的企業永遠不受景氣衰退影響"],"answer":1,"explain":"逐選項解析：（1）不同企業曝險不同；（2）利率對企業的影響取決於財務結構、現金流及市場預期；（3）股價同時反映獲利與風險；（4）景氣下滑仍可能影響現金充裕企業。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP018","topic":"貨幣政策與總體金融","q":"央行宣布維持利率不變，市場債券殖利率卻上升。哪項解釋較合理？","options":["市場利率只能與政策利率完全同步","債券殖利率還受未來政策預期、通膨與期限溢酬影響","殖利率上升代表央行一定偷偷升息","政策利率不變，債券價格就不能變動"],"answer":1,"explain":"逐選項解析：（1）兩者非完全同步；（2）市場殖利率反映預期與風險溢酬，並非只由當期政策利率決定；（3）市場變動不等於央行改變政策利率；（4）市場價格會隨預期與供需變動。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP019","topic":"貨幣政策與總體金融","q":"央行緊縮時，學生想用「本幣一定升值、出口一定減少」預測貿易順差。老師應如何修正？","options":["保留方向性推論，但強調外國景氣、供應鏈與匯率預期也會影響結果","只要升息，順差一定歸零","緊縮政策不可能影響匯率","貿易收支只看進口，不必看出口"],"answer":0,"explain":"逐選項解析：（1）講義提供典型傳導方向，但匯率與貿易收支結果取決於多重因素；（2）順差不會機械式歸零；（3）利差可能影響資金流動與匯率；（4）貿易收支同時受出口與進口影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"MP020","topic":"貨幣政策與總體金融","q":"家庭同時持有房貸、債券ETF與緊急預備金。預期進入升息循環，哪個綜合行動最合理？","options":["評估房貸重訂價風險、債券存續期間並維持足夠現金","因債券ETF有配息，就忽略淨值波動","將全部緊急預備金用來加碼長天期債券ETF","認為升息對浮動房貸與債券ETF影響必相同"],"answer":0,"explain":"逐選項解析：（1）升息對負債現金流與固定收益資產價格的影響不同，應分別衡量；（2）配息不等於沒有價格風險；（3）動用全部備用金會提高流動性風險；（4）兩種商品的利率傳導與風險不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX001","topic":"貸款與信用","q":"阿翰要借20萬元，甲銀行名目利率3.2%但收開辦費，乙銀行利率3.6%免開辦費；兩者還款期間相同。應優先取得哪項資料才能公平比較？","options":["兩案的總費用年百分率與還款明細","兩案的廣告名目利率排名","兩案的核貸速度與分行數","兩案的銀行資本額"],"answer":0,"explain":"逐選項解析：（1）APR將利息與相關費用按規定納入比較，並須核對還款條件；（2）名目利率忽略開辦費，可能低估實際成本；（3）核貸速度是便利性，不是完整借貸成本；（4）銀行資本額不直接決定這兩筆貸款的總成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX002","topic":"貸款與信用","q":"小恩有兩張循環信用卡，利率較高的卡片欠款8萬元、利率較低的欠款3萬元，且兩卡均未逾期。若有額外1萬元可還款，何者較能減少後續利息？","options":["先平均分給兩張卡","優先償還利率較高的卡片本金","優先還餘額較小的卡片不看利率","只繳兩張卡最低應繳金額"],"answer":1,"explain":"逐選項解析：（1）平均分配可能讓高利率餘額保留較久；（2）在其他條件相同時，優先降低高利率本金通常節省較多利息；（3）餘額大小與節省利息不必然一致；（4）最低應繳通常無法有效減少循環利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX003","topic":"貸款與信用","q":"一筆浮動利率房貸約定每季重訂價，央行今天宣布升息，但借款人下週才收到帳單。哪個判斷最恰當？","options":["下一期帳單一定立刻增加相同幅度","央行升息後房貸契約自動變固定利率","應確認指標利率、加碼與重訂價日","只要銀行未通知就不會改變"],"answer":2,"explain":"逐選項解析：（1）是否立即調整取決於契約與重訂價日；（2）升息不會自動改變貸款的固定或浮動性質；（3）契約指標及調整時點才是判斷實際月付變動的關鍵；（4）通知義務與實際計息條件須依契約和法規判斷。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX004","topic":"貸款與信用","q":"一位學生取得低利就學貸款，同時手上有僅供生活緊急支出的3萬元。畢業前想提前還款，哪個思考最完整？","options":["先查是否有提前還款限制，再比較利息節省與緊急預備金需求","只要利率低就永遠不應提前還款","把全部生活預備金一次還清","先用信用卡預借現金償還就學貸款"],"answer":0,"explain":"逐選項解析：（1）需同時衡量契約、利息與現金流風險；（2）低利率不代表提前還款在任何情境都不適合；（3）清空緊急預備金可能導致更高成本的臨時借款；（4）預借現金常伴隨較高費用與利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX005","topic":"貸款與信用","q":"房貸寬限期剩兩個月，小婷每月收入固定，卻把目前只繳利息的金額當作未來月付。最該先做什麼？","options":["等寬限期結束再看銀行帳單","假設本金會自動減少","只用目前利息支出編列未來預算","試算開始攤還本金後的月付並預留現金流"],"answer":3,"explain":"逐選項解析：（1）延後評估可能錯失調整支出的時間；（2）只繳利息時本金通常不會因時間經過而減少；（3）目前月付低估未來本息攤還負擔；（4）寬限期後本息攤還通常增加月付，應先試算。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX006","topic":"貸款與信用","q":"小豪信用卡額度10萬元，刷卡7萬元後決定只繳最低應繳；下個月又要申請車貸。哪項風險評估較完整？","options":["只要沒遲繳，負債就不影響任何審核","循環餘額與負債比可能影響授信評估","信用卡額度高代表收入一定高","最低應繳金額就是全部借款成本"],"answer":1,"explain":"逐選項解析：（1）未逾期不代表授信機構不考量既有負債；（2）既有負債及還款能力可能列入信用審核；（3）額度由多種因素決定，不能直接等同收入；（4）最低應繳不等於剩餘本金與全部利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX007","topic":"貸款與信用","q":"某分期購物標榜「零利率」，但必須支付不可退還的服務費1,500元。購物者如何判斷是否划算？","options":["只比較每月分期金額","把服務費當成商品折扣","比較含服務費的總支付與其他付款方式","只看是否有銀行合作"],"answer":2,"explain":"逐選項解析：（1）月付低不代表總支付較低；（2）服務費是成本而非折扣；（3）零名目利率仍可能存在費用，須比較總成本；（4）合作銀行並不保證該方案最便宜。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX008","topic":"投資與風險","q":"同樣投資10萬元，甲ETF集中單一科技產業，乙ETF涵蓋多個產業。小君已有大量科技公司股票，哪項配置考量較合理？","options":["只比較哪檔去年漲幅高","因甲持股數多就一定較分散","乙ETF名稱有大盤就不需看持股","檢查與既有部位的產業重疊及集中風險"],"answer":3,"explain":"逐選項解析：（1）歷史漲幅無法反映整體資產重疊；（2）多檔同產業股票仍可能高度相關；（3）ETF名稱不替代實際持股分析；（4）應從整體投資組合檢查集中度。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"第十四批：逐選項解析已整理；部分題目保留原有選項；仍待教師與官方法規終審"},{"id":"EX009","topic":"投資與風險","q":"債券基金配息率5%，但今年淨值下跌8%。投資人想知道是否真的賺錢，應如何評估？","options":["將配息與淨值變動一起納入總報酬","配息率5%即表示全年報酬5%","只看收到的現金不看本金","因債券基金配息就排除價格風險"],"answer":0,"explain":"逐選項解析：（1）總報酬需同時計入價格變化與現金分配；（2）配息率不等於總報酬率；（3）忽略淨值可能高估收益；（4）債券基金仍受利率
