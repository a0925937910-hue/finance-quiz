金","退休後所有資產都應轉為單一長天期債券","將每月生活費改用信用卡循環支應"],"answer":0,"explain":"逐選項解析：（1）預留短期支出資金可降低市場下跌時被迫出售風險。；（2）沒有流動資金會提高順序報酬風險。；（3）單一長天期債券仍有利率及集中風險。；（4）循環信用可能增加利息負擔。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX020","topic":"退休規劃","q":"65歲退休者希望每月有穩定現金流，但也擔心長壽與通膨。評估年金商品時應同時注意什麼？","options":["給付期間、通膨侵蝕、費用及流動性限制","只比較第一個月領到的金額","只看商品名稱是否包含「終身」二字","認為固定金額給付能完全消除購買力下降風險"],"answer":0,"explain":"逐選項解析：（1）年金規劃應同時考慮給付條件、實質購買力與可動用性。；（2）首月金額不足以比較長期利益。；（3）商品名稱不能替代契約條款。；（4）固定名目給付可能遭通膨侵蝕。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX021","topic":"信託與高齡金融","q":"長者希望保留財產所有權安排，並依條件定期支付照護費用。評估信託方案時最重要的是？","options":["明確約定信託目的、受益人、給付條件與管理權限","只要設立信託，就能保證所有投資永不虧損","將所有財產交給任何熟人保管即可視為正式信託","信託成立後不必再檢視照護需求與給付安排"],"answer":0,"explain":"逐選項解析：（1）信託功能仰賴契約設計與受託管理安排。；（2）信託不等於投資保本。；（3）非正式保管與法律上信託安排不同。；（4）照護需求可能變化，應依契約及情況檢視。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX022","topic":"信託與高齡金融","q":"長者考慮以房養老，想比較可貸金額及未來遺產安排。何者最適當？","options":["檢視利率、給付方式、房屋估值及到期清償條件","只看廣告每月最高可領金額","認為房價不會變動，因此不必評估抵押風險","只要簽約，所有繼承人一定不受影響"],"answer":0,"explain":"逐選項解析：（1）應評估契約現金流、成本、抵押及繼承影響。；（2）最高給付額未必適用個人條件。；（3）房價及利率可能變動。；（4）抵押權與債務清償可能影響遺產。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX023","topic":"永續金融","q":"企業發行標榜「綠色」的債券，但募集資金用途說明模糊。投資人應優先查核什麼？","options":["募集資金用途、評估標準與後續揭露機制","只要債券名稱有綠色字樣就視為符合標準","只看發行企業的商標是否為綠色","只看票面利率，永續用途不必驗證"],"answer":0,"explain":"逐選項解析：（1）永續債券需查核用途、標準及資訊揭露以降低漂綠風險。；（2）名稱不能取代實質驗證。；（3）視覺識別與永續績效無關。；（4）若投資目的包含永續性，應核對資金用途。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX024","topic":"貨幣政策","q":"中央銀行升息後，某企業仍需大量借新債，且營收成長放緩。最值得優先評估哪個風險？","options":["融資成本上升及償債現金流壓力","升息會讓所有企業的借款利率立即歸零","只要企業營收成長放緩，負債本金會自動減少","央行升息只影響家庭存款，與企業融資無關"],"answer":0,"explain":"逐選項解析：（1）利率上升可能提高新借款成本，需評估現金流覆蓋。；（2）升息通常不會使借款利率歸零。；（3）營收變化不會自動減少負債本金。；（4）企業借款成本也可能受政策與市場利率影響。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX025","topic":"貨幣政策","q":"國際油價上漲引發物價上升，但國內需求疲弱。判斷貨幣政策時，何者較合理？","options":["同時衡量通膨來源、預期、就業與成長風險","因物價上漲，升息一定能直接增加原油供給","因需求疲弱，降息必定讓進口能源價格下跌","只看單月物價數字即可確定最適政策"],"answer":0,"explain":"逐選項解析：（1）供給衝擊下政策需權衡通膨與經濟活動。；（2）升息不能直接增加全球原油供給。；（3）降息不保證能源進口價格下跌。；（4）單月數據不足以全面判斷政策。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX026","topic":"金融計算","q":"學生將12萬元分別存入A銀行年利率1.8%按單利計算，或B銀行年利率1.7%按年複利計算，均存2年且不計稅費。哪項比較正確？","options":["A期末124,320元，B約124,115元，A較高","B採複利，因此2年後必定超過A","A期末124,320元，B期末124,320元","兩者期末本金都不會增加"],"answer":0,"explain":"逐選項解析：（1）A單利利息120,000×1.8%×2＝4,320元；B為120,000×1.017²＝124,114.68元。；（2）複利並不保證勝過較高利率；應比較實際期間及利率。；（3）B期末約124,115元，不等於A的124,320元。；（4）兩者利率皆為正且假設正常給息，期末金額會增加。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX027","topic":"貸款成本","q":"兩筆10萬元、1年期一次還本貸款：甲年利率5%、開辦費500元；乙年利率4.5%、開辦費1,500元。忽略其他費用，哪項正確？","options":["乙名目利率低，總成本一定低","甲總費用5,500元，低於乙6,000元","甲利息5,000元，因此總成本5,000元","乙總成本4,500元，因開辦費不算借款成本"],"answer":1,"explain":"逐選項解析：（1）乙利息4,500元加費用1,500元，共6,000元，高於甲。；（2）甲5,000＋500＝5,500元；乙4,500＋1,500＝6,000元。；（3）甲還有500元開辦費，不能只計利息。；（4）乙開辦費屬取得貸款的成本，不能忽略。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX028","topic":"債券投資","q":"甲乙兩債券信用評等及殖利率相近，但甲存續期間2年、乙存續期間8年。若市場殖利率同時上升0.5個百分點，其他條件不變，哪項較合理？","options":["乙價格通常較敏感、跌幅可能較大","甲存續期間短，價格跌幅必然較大","兩債券信用評等相同，價格變動必相同","殖利率上升時兩者價格必同幅上漲"],"answer":0,"explain":"逐選項解析：（1）存續期間較長通常對利率變動更敏感；這是近似比較，仍受凸性等因素影響。；（2）較短存續期間一般代表較低利率敏感度。；（3）信用評等反映信用風險，不決定利率敏感度相同。；（4）固定收益債券市場殖利率上升，既有債券價格一般下降。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX029","topic":"資產配置","q":"小芸明年要繳20萬元學費，手上有25萬元，且尚未建立緊急預備金。她想全部買入高波動股票。哪項做法較適當？","options":["先將確定用途的學費保留在低波動且可動用工具，再規劃其餘資金","只要股票長期向上，一年內繳費就沒有風險","改買單一熱門科技股，可降低學費不足風險","用信用卡預借現金補足學費，再持續持有股票"],"answer":0,"explain":"逐選項解析：（1）短期確定支出重視本金波動與流動性，剩餘資金才評估風險承受度。；（2）股票短期可能下跌，長期報酬預期不能保證一年內資金足夠。；（3）集中單一股票增加非系統性風險。；（4）預借現金增加利息與還款壓力，不是降低風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX030","topic":"基金費用","q":"兩檔同類型基金預期投資內容相近：甲申購費0%、年費用率1.6%；乙申購費1%、年費用率0.6%。預計持有10年，何者較合理？","options":["只比較申購費，甲必定划算","比較長期持有的累積費用及投資差異，乙可能較省","只要基金配息高，費用率不影響報酬","乙申購費較高，任何持有期間都較貴"],"answer":1,"explain":"逐選項解析：（1）長期費用率可能累積成顯著差距，不能只看一次性申購費。；（2）長期持有時較低的持續費用可能抵銷初始費用，但仍應比較績效及其他條件。；（3）費用會減少淨報酬，配息並不消除費用。；（4）持有期間不同，總成本比較可能改變。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX031","topic":"外匯風險","q":"台灣進口商3個月後須支付10萬美元貨款，擔心新臺幣貶值增加成本。哪項管理方式較切合需求？","options":["評估遠期外匯或其他適當避險工具鎖定部分匯率","將美元應付款全部視為新臺幣固定成本","新臺幣貶值時美元貨款的新臺幣成本會下降","不需預測現金流，只要等付款日再決定"],"answer":0,"explain":"逐選項解析：（1）進口商有美元支付需求，適當避險可降低未來換匯成本的不確定性。；（2）外幣應付款以新臺幣衡量的成本會隨匯率變動。；（3）新臺幣貶值通常意味每美元需要更多新臺幣。；（4）預先盤點支付日期與金額有助管理風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX032","topic":"金融防詐","q":"有人假冒銀行發送『帳戶異常』訊息，要求點短網址輸入網銀密碼與一次性驗證碼。哪項做法較妥當？","options":["先在訊息頁面登入，若失敗再聯絡銀行","不點連結，改用官方App或自行查得的客服管道查證","將驗證碼傳給對方，但不要提供身分證號","請對方先傳員工證照片，便可安全交付密碼"],"answer":1,"explain":"逐選項解析：（1）釣魚頁面可能在第一次輸入時即竊取憑證。；（2）透過獨立取得的官方管道查證可避免被偽冒連結導向。；（3）一次性驗證碼同樣屬敏感認證資訊。；（4）員工證影像可被偽造，不構成提供密碼的理由。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX033","topic":"洗錢防制","q":"新開戶公司由甲持股60%，甲聲稱僅代海外人士乙持股且乙實際控制資金，卻拒絕提供乙資料。銀行最合理的處理是？","options":["只登記甲，因股權文件已足夠","確認實質受益人及控制關係，無法完成審查時依規定處理","讓甲口頭承諾無違法用途即可","因公司有營業登記，直接跳過身分審查"],"answer":1,"explain":"逐選項解析：（1）股權登記人不一定就是實質控制者。；（2）金融機構應辨識實質受益人並依風險及法規執行審查。；（3）口頭保證不能取代必要的身分及控制關係查核。；（4）公司登記不免除客戶審查義務。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX034","topic":"保險規劃","q":"家庭主要收入者有兩名未成年子女、房貸餘額600萬元，已有醫療險但壽險保障不足。哪項優先順序較合理？","options":["先估算身故後家庭生活及債務缺口，再評估定期壽險等保障","因已有醫療險，身故後家人收入缺口也已保障","先買高保費儲蓄型商品，不需評估保障額度","只要房屋有市價，家人就不會有現金流風險"],"answer":0,"explain":"逐選項解析：（1）壽險需求應由負債、扶養與現有資產及保障缺口估算。；（2）醫療險主要處理符合條款的醫療風險，與身故保障不同。；（3）未先盤點缺口可能使保費排擠必要保障。；（4）房產不等於可即時支應生活的現金。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX035","topic":"實支實付","q":"保戶住院花費12萬元，其中部分醫材不在保單給付範圍，且每次住院雜費上限8萬元。哪項說法正確？","options":["只要拿到12萬元收據，就一定能理賠12萬元","應按條款確認給付項目、限額、自負額及其他約定","保單有『實支實付』四字就不受限額影響","醫院開立收據後，保險公司不得審核條款"],"answer":1,"explain":"逐選項解析：（1）實際支出不等於全部都屬承保項目，也可能超過限額。；（2）給付須依保單約定及必要文件核定。；（3）實支實付仍有承保範圍與金額限制。；（4）保險公司仍須依契約審查理賠。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX036","topic":"金融消費爭議","q":"消費者主張銀行未充分揭露複雜商品風險，已向銀行正式申訴並保留契約與錄音資料。若對處理結果不滿，下一步何者較合理？","options":["保存往來紀錄並依適用制度向金融消費評議中心申請評議","直接刪除交易紀錄，避免影響申訴","只在社群留言即可取代正式程序","因已簽名，任何爭議均無法再提出"],"answer":0,"explain":"逐選項解析：（1）符合受理條件時可循金融消費爭議處理程序，證據有助釐清。；（2）刪除紀錄會降低可供查核的證據。；（3）社群留言不等於正式爭議處理程序。；（4）簽名不排除針對說明義務或交易爭議提出主張。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX037","topic":"信託規劃","q":"家長希望在身故後讓未成年子女按月取得生活費、學費依需要撥付，避免一次領取大筆資產。哪項安排較切合？","options":["評估設定具有給付條件與管理機制的信託","把所有資產直接交給任何一位親友且不設限制","將資金全部改買單一股票，便可按月穩定給付","只在口頭上交代子女節省支出即可"],"answer":0,"explain":"逐選項解析：（1）信託可依契約設計管理、給付對象及條件，仍須評估成本與適法性。；（2）未設定正式管理機制，較難落實指定用途與監督。；（3）單一股票存在價格波動，無法保證固定生活費。；（4）口頭交代通常不足以形成可執行的財產管理安排。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX038","topic":"退休規劃","q":"退休者每月必要支出5萬元、穩定退休收入3.2萬元，另有現金216萬元。忽略通膨與利息，現金可補足收支缺口多久？","options":["約8年","約10年","約12年","約15年"],"answer":1,"explain":"逐選項解析：（1）每月缺口1.8萬元，216萬元可支應120個月，即10年。；（2）216萬÷(5萬－3.2萬)＝120個月，等於10年。；（3）12年需約259.2萬元，超過現有216萬元。；（4）15年需約324萬元，超過現有216萬元。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX039","topic":"房貸風險","q":"房貸前兩年只繳利息，寬限期後開始攤還本金。借款人收入未增加，哪項風險最需事前評估？","options":["寬限期後月付金可能上升，應以完整還款期做壓力測試","只繳利息代表本金已逐月減少","寬限期結束後利率必然降至零","只要房價上漲，月付金就不會增加"],"answer":0,"explain":"逐選項解析：（1）本金未於寬限期攤還，後續攤還期較短，月付可能明顯增加。；（2）只繳息通常不會降低本金餘額。；（3）寬限期與市場利率變動是不同事項。；（4）房價變動不直接消除契約還款義務。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX040","topic":"股票交易","q":"小方以每股80元買入1,000股股票，再以81元賣出。買賣手續費各0.1425%，賣出證交稅0.3%，忽略最低收費及折扣。最接近的稅費後損益？","options":["約賺529元","約賺1,000元","約賺757元","約賺-243元"],"answer":0,"explain":"逐選項解析：（1）價差1,000元，手續費約114＋115.425元，賣出稅243元，淨利約527.575元，最接近529元。；（2）1,000元是未扣稅費價差。；（3）757元僅扣證交稅，未扣雙邊手續費。；（4）約243元是證交稅額，不是淨損益。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX041","topic":"數位帳戶","q":"數位帳戶廣告年利率3%，但只適用前5萬元且需每月完成指定任務；超額部分利率0.5%。學生存入15萬元時，何項判斷最合理？","options":["全部15萬元都適用3%，因廣告標示最高利率","應分別計算適用額度、任務條件與超額利率","只要是數位帳戶，就免除所有存款風險","利率愈高，資金流動性一定愈好"],"answer":1,"explain":"逐選項解析：（1）高利率可能僅適用特定額度與條件。；（2）分段計息與條件是否達成決定實際利息。；（3）數位化不代表所有金融風險消失。；（4）利率高低不直接代表提領限制或流動性優劣。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX042","topic":"貨幣政策","q":"中央銀行升息後，某家庭持有機動利率房貸，另有長期固定票息債券基金。若其他條件不變，哪項組合風險較合理？","options":["房貸利息負擔可能增加，債券基金淨值可能承壓","房貸利息必降，債券價格必漲","房貸本金立即歸零，債券基金無波動","升息只影響股票，與貸款及債券無關"],"answer":0,"explain":"逐選項解析：（1）機動房貸可能隨參考利率調整；市場殖利率上升通常壓抑既有固定票息債券價格。；（2）方向通常相反，但仍視契約與市場而定。；（3）升息不會自動免除本金，也不會消除基金價格風險。；（4）利率變動可透過貸款及債券市場傳導。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX043","topic":"通膨與儲蓄","q":"定存年利率2%，同年物價上漲3%。忽略稅費，實質購買力變化最接近何者？","options":["約增加1%","約減少1%","約增加5%","完全不變"],"answer":1,"explain":"逐選項解析：（1）名目收益2%低於通膨3%，購買力不會增加。；（2）實質報酬約1.02／1.03－1＝−0.97%，接近減少1%。；（3）不能把名目利率與通膨率直接相加當實質報酬。；（4）名目本金增加不代表實質購買力不變。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX044","topic":"永續金融","q":"甲企業公開完整排放基準、減碳路徑與第三方查證；乙只宣稱『碳中和』，未說明邊界與抵換方式。投資人應優先採取何種判斷？","options":["比較揭露範圍、減量績效與查證品質，警惕漂綠","乙口號較簡潔，因此風險一定較低","只看企業商標是否有綠色即可判斷","甲有查證就代表投資報酬必然為正"],"answer":0,"explain":"逐選項解析：（1）可查核的排放邊界、基準與績效較能支持永續主張。；（2）缺乏資訊不能因口號而推定較低風險。；（3）視覺設計無法取代永續資訊揭露。；（4）環境資訊較完整不代表沒有市場或信用風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX045","topic":"支付安全","q":"學生手機遺失，內有已登入的支付App及綁定信用卡。哪組行動最能降低損失？","options":["立即遠端鎖定裝置、通知支付業者及發卡機構，檢查交易紀錄","等到下一期帳單出現再處理","只更換社群網站密碼，不需處理支付工具","直接在公開社群貼出卡號請大家幫忙尋找"],"answer":0,"explain":"逐選項解析：（1）快速阻斷裝置與支付權限並檢查交易，有助降低後續未授權使用風險。；（2）等待可能延誤停用及爭議處理。；（3）社群密碼與支付工具權限不同。；（4）公開卡號反而增加資訊外洩風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX046","topic":"保險等待期","q":"投保某醫療險後第10天因一般疾病住院，保單約定該疾病等待期30天且無例外。何項判斷較適當？","options":["只要住院就必然理賠，不必看生效日","應依契約等待期及除外約定判斷，可能不符給付條件","等待期只影響保費，不影響理賠","業務員口頭承諾可自動取代保單所有條款"],"answer":1,"explain":"逐選項解析：（1）理賠需檢視契約承保及等待期條件。；（2）題設疾病發生於30天等待期內，依約可能不符給付條件。；（3）等待期與特定事故是否可理賠有關。；（4）口頭說明與契約不一致時仍須釐清證據及適用規範。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX047","topic":"投資槓桿","q":"學生以自有資金10萬元，再借10萬元買入20萬元股票。股價下跌20%且不計費用，股票市值及淨資產各約多少？","options":["市值16萬元，扣借款後淨資產6萬元","市值18萬元，淨資產8萬元","市值16萬元，淨資產16萬元","市值20萬元，淨資產10萬元"],"answer":0,"explain":"逐選項解析：（1）20萬×80%＝16萬，扣借款10萬後淨資產6萬，原10萬自有資金損失40%。；（2）跌20%後市值為16萬，不是18萬。；（3）仍須償還10萬借款，不能把全部市值當淨資產。；（4）股價下跌使持股市值減少，不會維持20萬。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX048","topic":"信用卡循環","q":"持卡人只繳最低應繳金額，剩餘帳款持續循環計息。哪項決策最有助降低長期負擔？","options":["評估利率及費用，優先減少高成本循環餘額","持續只繳最低金額，總利息一定最低","增加信用卡張數即可抵銷循環利息","只要每月刷卡回饋高，循環利息可忽略"],"answer":0,"explain":"逐選項解析：（1）高利率循環餘額長期累積可能使總成本增加，應盤點現金流及還款。；（2）最低應繳不代表最小總利息支出。；（3）卡片數量增加不會直接抵銷既有債務利息。；（4）回饋通常不能合理化持續支付高額循環利息。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX049","topic":"投資型保單","q":"理專推薦投資型保單，僅強調『預估年報酬8%』，未說明保險成本、投資風險及提前解約費用。消費者最應要求什麼？","options":["提供完整費用、保障內容、投資風險與不利情境說明","將預估報酬視為保證收益，直接簽約","只比較首期保費，不必考慮後續扣費","認為有壽險名稱便可排除市場風險"],"answer":0,"explain":"逐選項解析：（1）投資型保單同時涉及保障與投資，應了解扣費、保障及可能損失。；（2）預估報酬不等於契約保證。；（3）後續扣費與解約成本可能影響保單價值。；（4）投資帳戶價值仍可能受市場波動影響。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX050","topic":"就學貸款","q":"大學生畢業後暫無固定收入，收到就學貸款還款通知。哪項處理較適當？","options":["主動向承貸銀行查詢適用的緩繳、展延或其他協助條件","忽略通知，因為學生貸款不需償還","直接向不明網路代辦提供網銀密碼求協助","只要申請過就學貸款，利息及本金永遠免繳"],"answer":0,"explain":"逐選項解析：（1）應依個別資格、契約與當時制度向正式承貸機構確認可用協助。；（2）就學貸款通常仍有契約還款義務。；（3）不明代辦索取認證資訊可能涉及詐騙。；（4）補助及緩繳均有條件，不能推定永久免還。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"topic":"實質利率","q":"銀行一年定存名目利率4%，同期間物價上漲6%。若不計稅費，10萬元的期末實質購買力變化約為何？","options":["增加2%","減少1.89%","減少6%","增加4%"],"answer":1,"explain":"逐選項解析：（1）名目利率低於通膨，購買力不是增加。；（2）實質報酬=1.04/1.06−1≈−1.89%。；（3）6%是通膨率，未扣除4%的名目收益。；（4）4%是名目利率，非實質報酬。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX051"},{"topic":"機會成本","q":"學生已有足夠生活費，想花3萬元買平板；同額資金也可用於必修證照課程。評估購買平板的機會成本應如何理解？","options":["平板的售價加上證照課程費用","放棄的最佳替代方案所帶來的淨效益","所有沒選的方案價值總和","只計算購物當天的交通費"],"answer":1,"explain":"逐選項解析：（1）機會成本不是把兩個互斥支出加總。；（2）機會成本是放棄的最佳替代選擇價值。；（3）不會將所有未選方案全部加總。；（4）交通費可能是顯性成本，但不代表機會成本。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX052"},{"topic":"信用風險","q":"甲公司債殖利率5%，乙同期限公債3%，兩者幣別相同。哪項說明最審慎？","options":["甲多2%代表保證多賺2%","甲可能含信用與流動性風險溢酬","甲債券價格不會波動","乙公債必定完全沒有任何風險"],"answer":1,"explain":"逐選項解析：（1）殖利率較高可能伴隨違約或價格風險。；（2）信用及流動性差異可能反映在利差。；（3）公司債同樣會隨利率及信用評估波動。；（4）公債仍可能有利率及通膨風險。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX053"},{"topic":"股利與除息","q":"某股票除息前收盤100元，每股現金股利5元，假設除息參考價為95元且不考慮其他變動。投資人持有1股時，哪項判斷合理？","options":["收到5元就必然新增5元財富","參考價調整後股票價值加現金約仍為100元","除息參考價應為105元","現金股利是公司額外憑空創造的資產"],"answer":1,"explain":"逐選項解析：（1）股利發放同時伴隨公司資產流出及參考價調整。；（2）95元股票加5元現金，簡化下約100元。；（3）現金除息參考價一般扣除股利。；（4）股利來自公司資產分配，並非憑空創造。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX054"},{"topic":"ETF追蹤誤差","q":"兩檔ETF追蹤同一指數，甲年度報酬8.0%，乙7.2%，指數8.1%，忽略配息差異。單看該年度追蹤差距，何者較小？","options":["甲差0.1個百分點","乙差0.1個百分點","兩者都差0.9個百分點","乙報酬較低，因此一定有較小追蹤差距"],"answer":0,"explain":"逐選項解析：（1）甲與指數差|8.0−8.1|=0.1個百分點。；（2）乙與指數差0.9個百分點。；（3）甲差0.1、乙差0.9，並非相同。；（4）報酬低不代表更貼近指數。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX055"},{"topic":"交易成本","q":"股票買進金額20萬元、賣出21萬元，買賣手續費各按成交額0.1%，賣出證交稅0.3%。忽略其他成本，淨獲利為何？","options":["10,000元","8,960元","9,370元","8,750元"],"answer":1,"explain":"逐選項解析：（1）10,000元是未扣成本價差。；（2）成本=200+210+630=1,040，淨利=8,960元。；（3）9,370元只扣賣出證交稅，漏雙邊手續費。；（4）8,750元與題設費率計算不符。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX056"},{"topic":"分散風險","q":"甲投資人持有台灣大型科技股ETF與另一檔同樣高度集中科技股的ETF。哪項判斷最合理？","options":["ETF數量變多就必然分散產業風險","應檢視持股重疊與產業集中度","兩檔不同投信ETF不可能持有相同股票","只要一檔有配息即可抵銷另一檔跌幅"],"answer":1,"explain":"逐選項解析：（1）標的高度重疊時，分散效果有限。；（2）應檢視實際持股、產業及風險因子。；（3）不同發行人可能追蹤類似指數。；（4）配息不等於風險對沖。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX057"},{"topic":"存款保險","q":"某人將500萬元全部放在同一家銀行的兩個不同分行，並認為可按分行分別計算存保額度。哪項說法較正確？","options":["按每個分行各自計算保障上限","通常按同一存款人在同一家要保機構的存款合併計算","同一家銀行開越多帳戶保障額度越高","只要是銀行銷售的基金也計入存款保險"],"answer":1,"explain":"逐選項解析：（1）分行不是獨立要保機構。；（2）存款保險一般以同一存款人在同一要保機構合併計算，並受法定上限約束。；（3）帳戶數不會改變同一機構的合併原則。；（4）基金不屬受保障的存款。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX058"},{"topic":"APR","q":"A信用貸款名目利率4%，另收開辦費；B名目利率4.3%，免開辦費。比較同額同期間的借款，最應看哪項？","options":["只看名目利率，A一定便宜","比較總費用年百分率及還款現金流","只看每月最低應繳金額","只比較銀行廣告的最低利率"],"answer":1,"explain":"逐選項解析：（1）名目利率未包含開辦費等借款成本。；（2）總費用年百分率有助在相同假設下比較費用。；（3）最低月付可能隱藏還款期間及總成本差異。；（4）廣告最低利率不一定適用每位借款人。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX059"},{"topic":"循環信用","q":"持卡人欠款6萬元，年循環利率15%，簡化按單利計算，若整筆餘額持續30天且以365天計息，利息約多少？","options":["約740元","約123元","約9,000元","約2,500元"],"answer":0,"explain":"逐選項解析：（1）60,000×15%×30/365≈739.73元。；（2）約123元是過低估計，與30天利息不符。；（3）9,000元是整年利息，非30天。；（4）2,500元超出題設簡化計息結果。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX060"},{"topic":"房貸寬限期","q":"兩筆同額房貸利率相同，甲一開始本息攤還，乙前3年只繳息且總貸款年限相同。哪項較可能發生？","options":["乙寬限期後每月本金攤還壓力較高","乙在寬限期內本金下降得更快","甲的本金在前3年完全不減少","乙的總利息必定比甲少"],"answer":0,"explain":"逐選項解析：（1）乙剩餘攤還年限較短且本金未減，後續月付可能較高。；（2）只繳息通常不會降低本金。；（3）本息攤還包含本金。；（4）延後償還本金一般不會降低總利息。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX061"},{"topic":"債券價格","q":"一張固定票息債券面額10萬元、票息2%，市場新發同風險債券殖利率升至4%。既有債券價格通常如何？","options":["高於面額，因舊票息較低","低於面額，以反映較低票息","必恰好等於面額","與市場殖利率完全無關"],"answer":1,"explain":"逐選項解析：（1）較低舊票息通常需折價而非溢價。；（2）市場要求較高收益率，既有低票息債券價格通常下跌。；（3）票息與市場殖利率不一致時不必等於面額。；（4）債券價格與市場利率通常反向。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX062"},{"topic":"匯率換算","q":"學生計畫赴美留學，需支付2萬美元學費。新臺幣兌美元從每美元30元變為32元，學費的新臺幣成本變化為何？","options":["減少4萬元","增加4萬元","增加2萬元","不變，因美元學費固定"],"answer":1,"explain":"逐選項解析：（1）美元變貴，新臺幣成本不會下降。；（2）20,000×(32−30)=40,000元。；（3）每美元增加2元，乘以2萬美元為4萬元。；（4）美元金額不變，但新臺幣換匯成本會變。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX063"},{"topic":"通膨風險","q":"退休者持有固定年金，每月領2萬元且不隨物價調整。若未來物價持續上漲，最主要風險是？","options":["名目給付下降","實質購買力下降","年金契約自動增加給付","固定給付不受任何經濟環境影響"],"answer":1,"explain":"逐選項解析：（1）名目金額仍為2萬元。；（2）固定名目收入在物價上漲時可購買的商品減少。；（3）題目已假設不隨物價調整。；（4）實質購買力仍受通膨影響。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX064"},{"topic":"退休提領","q":"退休者年初資產100萬元，第一年市場下跌20%且年底提領10萬元。年底資產多少？","options":["70萬元","80萬元","90萬元","72萬元"],"answer":0,"explain":"逐選項解析：（1）100萬×0.8−10萬=70萬元。；（2）80萬元尚未扣除提領。；（3）90萬元忽略市場下跌。；（4）72萬元不是題設的先跌後領計算。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX065"},{"topic":"保險免責額","q":"醫療險每次事故自負額2萬元，符合條款的醫療費用7萬元且無其他限制。保險公司給付額為何？","options":["7萬元","5萬元","2萬元","9萬元"],"answer":1,"explain":"逐選項解析：（1）自負額需由被保險人自行負擔。；（2）7萬−2萬=5萬元。；（3）2萬元是自負額，不是保險給付。；（4）理賠不會因自負額而高於符合條款的費用。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX066"},{"topic":"保險保障缺口","q":"家中主要收入者身故後，估計未來生活及教育支出700萬元、房貸300萬元，現有可用資產250萬元及壽險保額200萬元。簡化估算保障缺口多少？","options":["550萬元","750萬元","1,000萬元","250萬元"],"answer":0,"explain":"逐選項解析：（1）需求1,000萬−資產250萬−現有壽險200萬=550萬元。；（2）750萬元漏扣現有壽險保障。；（3）1,000萬元是總需求未扣資源。；（4）250萬元是現有可用資產，不是缺口。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX067"},{"topic":"投資型保單","q":"某投資型保單年初帳戶價值10萬元，投資報酬率5%，年末扣除保險成本及相關費用共3,000元，忽略其他現金流。年末帳戶價值為何？","options":["105,000元","102,000元","97,000元","108,000元"],"answer":1,"explain":"逐選項解析：（1）105,000元是扣費前價值。；（2）100,000×1.05−3,000=102,000元。；（3）97,000元忽略投資收益。；（4）108,000元把費用當成增加資產。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX068"},{"topic":"實支實付","q":"醫療保險條款規定符合條款的雜費最高給付8萬元，實際符合條款支出10萬元，且無自負額或其他限制。最多可給付多少？","options":["10萬元","8萬元","18萬元","2萬元"],"answer":1,"explain":"逐選項解析：（1）符合條款支出仍受每次限額約束。；（2）限額8萬元，因此最多8萬元。；（3）理賠不會把支出與限額相加。；（4）2萬元是超過限額的部分，非給付額。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX069"},{"topic":"風險揭露","q":"高齡客戶購買結構型商品，銀行僅口頭說明「本金可能損失」，未解釋觸發條件與流動性。哪項改善最適當？","options":["提供具體不利情境、費用與適合度說明","只加大字體即可取代所有風險說明","因客戶有存款，就免除適合度評估","只展示過去最高報酬，避免造成疑慮"],"answer":0,"explain":"逐選項解析：（1）須讓客戶理解具體損失機制及商品適合性。；（2）字體改善有助閱讀，但不能取代內容。；（3）有存款不代表適合高風險商品。；（4）最高報酬不代表可能損失範圍。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX070"},{"topic":"金融爭議","q":"消費者收到銀行對正式申訴的回覆，但對於商品風險告知仍有爭議。哪項做法較適當？","options":["保存證據並查詢金融消費評議適用程序","直接刪除契約以免洩漏個資","要求銀行先保證投資獲利再申訴","在網路匿名留言即可取代正式爭議程序"],"answer":0,"explain":"逐選項解析：（1）保存文件並循正式申訴及評議制度有助處理爭議。；（2）刪除契約會減少證據。；（3）申訴處理不等於保證投資獲利。；（4）留言不構成正式評議申請。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX071"},{"topic":"防詐辨識","q":"有人假冒檢警要求將存款轉入「監管帳戶」，並強調不得告訴家人。最適當行動為何？","options":["立即轉帳，避免帳戶遭凍結","停止操作並透過165或正式機關管道查證","先匯小額測試帳戶是否安全","提供網銀驗證碼以證明清白"],"answer":1,"explain":"逐選項解析：（1）所謂監管帳戶要求轉帳是常見詐騙話術。；（2）應中止交易並使用獨立可信管道查證。；（3）小額匯款同樣可能造成損失並暴露資訊。；（4）驗證碼不可交付不明人士。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX072"},{"topic":"帳戶安全","q":"使用者收到未申請的網銀登入驗證碼，且帳戶顯示異地登入警示。哪項處理最適當？","options":["忽略訊息，因未輸入驗證碼就必然安全","透過官方管道變更憑證、檢查交易並通報銀行","將驗證碼回覆給發送訊息的陌生人","立即把所有存款轉入訊息提供的保管帳戶"],"answer":1,"explain":"逐選項解析：（1）異常驗證與登入警示可能表示憑證遭嘗試使用。；（2）應以官方管道採取帳戶保護措施。；（3）回覆驗證碼可能讓他人完成認證。；（4）不明保管帳戶可能是詐騙收款工具。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX073"},{"topic":"洗錢防制","q":"某客戶頻繁以多筆接近申報門檻的現金交易，且交易目的與其業務規模不符。金融機構最應做什麼？","options":["只要每筆低於門檻就完全不需關注","依風險及規範審視交易模式並採取必要措施","立即向客戶保證絕不申報任何資訊","將所有款項視為正常營業收入，不需核實"],"answer":1,"explain":"逐選項解析：（1）分拆交易仍可能涉及異常交易風險。；（2）應綜合交易目的、頻率及客戶背景執行監控。；（3）金融機構不能承諾不履行法定義務。；（4）未查核前不能推定所有交易均正常。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX074"},{"topic":"實質受益人","q":"公司股權分散，但乙透過契約控制董事任免及重大決策。銀行進行客戶審查時，哪項較合理？","options":["只看最大股東，忽略其他控制方式","評估乙是否為透過其他方式控制公司的實質受益人","只查詢公司登記地址即可","公司已上市便完全免除所有審查"],"answer":1,"explain":"逐選項解析：（1）實質控制不只透過持股比例。；（2）控制權可能來自契約及其他安排，應依法辨識。；（3）登記地址不足以辨識控制關係。；（4）是否上市不代表全部客戶審查義務自動消失。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX075"},{"topic":"金融科技","q":"某支付平台宣稱用戶餘額可獲高額收益，卻未清楚說明資金保管及法律性質。消費者應優先確認什麼？","options":["平台名稱是否含「銀行」二字","業者牌照、資金性質、保障及風險揭露","App下載量是否超過百萬","宣傳影片是否由知名人士代言"],"answer":1,"explain":"逐選項解析：（1）名稱不能代替法律資格與資金保障判斷。；（2）應確認資金法律性質、監理及風險。；（3）下載量不是存款保障或獲利保證。；（4）代言不能取代正式資訊揭露。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX076"},{"topic":"個資保護","q":"學生在網路申請貸款，網站要求上傳身分證、存摺及網銀密碼。哪項判斷較合理？","options":["可先提供全部資料再確認業者身分","應先核實合法業者及必要資料範圍，拒絕交付網銀密碼","有HTTPS就保證不是詐騙","只要承諾低利率即可提供驗證碼"],"answer":1,"explain":"逐選項解析：（1）敏感憑證一旦外洩可能立即被濫用。；（2）合法申辦仍須辨識業者與最小必要資料，網銀密碼不應交付。；（3）HTTPS僅表示傳輸加密，不能保證業者可信。；（4）利率宣傳不構成索取驗證碼的正當理由。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX077"},{"topic":"資產負債","q":"小店月營收40萬元、進貨與營運支出30萬元、貸款本息支出7萬元。若下月營收下降20%，其他不變，現金流為何？","options":["盈餘3萬元","短缺5萬元","盈餘10萬元","短缺7萬元"],"answer":1,"explain":"逐選項解析：（1）原本盈餘3萬元，但營收下降後不同。；（2）營收32萬−支出30萬−還款7萬=−5萬元。；（3）10萬元未扣貸款本息且未反映營收下降。；（4）7萬元是還款額，不是現金流短缺。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX078"},{"topic":"流動性風險","q":"企業帳上持有高評等長天期債券，但兩週後需支付大筆貨款。哪項風險管理較合理？","options":["債券信用評等高就等於隨時能無損變現","評估到期日、買賣價差及出售價格波動","以票面利率推估兩週後必然售價","將債券全部改成無成交量的商品"],"answer":1,"explain":"逐選項解析：（1）高評等不保證短期出售價格穩定。；（2）短期資金需求須考量市場流動性與利率波動。；（3）票息不能決定短期市場售價。；（4）無成交量可能增加變現難度。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX079"},{"topic":"存續期間","q":"甲債券修正存續期間約5年，市場殖利率上升1個百分點，忽略凸性等因素。價格變動近似為何？","options":["上漲約5%","下跌約5%","下跌約1%","上漲約1%"],"answer":1,"explain":"逐選項解析：（1）利率上升時既有固定收益債券通常下跌。；（2）近似價格變動≈−存續期間×殖利率變動=−5%。；（3）1%是殖利率變動，非價格變動幅度。；（4）方向與幅度都不符近似關係。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX080"},{"topic":"匯率避險","q":"出口商半年後可收50萬美元，擔心新臺幣升值。若目標是降低收款換回新臺幣的不確定性，哪項工具較切合？","options":["評估賣出美元遠期契約鎖定換匯匯率","向銀行買入更多美元現貨以增加美元曝險","以新臺幣升值會增加美元收入作為假設","不確認收款日期，任意選擇遠期到期日"],"answer":0,"explain":"逐選項解析：（1）出口商未來收美元，賣出美元遠期可管理匯率風險。；（2）增加美元部位可能放大同方向曝險。；（3）新臺幣升值會使美元換回新臺幣金額減少。；（4）避險工具到期日須匹配預期現金流。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX081"},{"topic":"利率傳導","q":"中央銀行調高政策利率，但銀行某定期固定利率房貸尚未到重訂日。哪項判斷較準確？","options":["房貸利率必在當日立即提高","實際調整依契約利率型態與重訂條件","固定利率房貸本金會因此自動增加","政策利率調整不可能影響任何借款成本"],"answer":1,"explain":"逐選項解析：（1）不同契約有固定及機動利率、重訂日差異。；（2）應依貸款契約判斷利率調整時點。；（3）利率變動不等於本金自動增加。；（4）政策利率可能經市場與銀行定價傳導。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX082"},{"topic":"通貨緊縮","q":"企業因需求下降而削價，民眾預期未來價格更低而延後購買。若此預期擴大，哪項風險值得注意？","options":["可能加劇需求疲弱與債務實質負擔","所有企業獲利必定上升","名目負債金額自動減少","通縮必然立即帶來充分就業"],"answer":0,"explain":"逐選項解析：（1）延後消費可能使需求更弱，固定名目債務的實質負擔可能上升。；（2）需求疲弱及降價可能壓抑利潤。；（3）物價下降不會自動減少契約名目債務。；（4）通縮可能伴隨經濟疲弱，非充分就業保證。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX083"},{"topic":"金融政策","q":"政府發放一次性消費補助，同期中央銀行調高利率。哪項分析較合理？","options":["兩項政策都一定同方向刺激消費","財政補助可能支撐需求，升息可能抑制部分借貸與支出","升息是財政政策，補助是貨幣政策","兩項政策對不同家庭必然影響完全相同"],"answer":1,"explain":"逐選項解析：（1）補助與升息的作用方向及傳導對象可能不同。；（2）財政與貨幣政策可能產生不同方向的需求效果。；（3）升息屬貨幣政策工具，補助屬財政政策。；（4）借貸狀況及消費傾向不同，效果也可能不同。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX084"},{"topic":"綠色債券","q":"企業發行標榜「綠色」的債券，募集資金用途與後續成效卻不公開。投資人最應確認什麼？","options":["只看債券名稱是否有「綠色」","查核募集資金用途、追蹤報告及相關驗證","因為是綠色債券就免除信用風險","只看票面利率，不必看發行人財務"],"answer":1,"explain":"逐選項解析：（1）標籤不能替代用途與成效證據。；（2）用途揭露及持續報告有助評估綠色主張。；（3）綠色用途不消除違約可能。；（4）發行人償債能力仍重要。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX085"},{"topic":"轉型金融","q":"水泥廠申請轉型融資，承諾2030年排放強度降低30%，但沒有基準年及查證機制。哪項改善最關鍵？","options":["建立基準年、衡量方法、階段目標與第三方驗證","將宣傳文案改成更鮮豔的綠色","只宣稱產業很難減碳即可獲得信任","不再公開排放數據以避免外界誤解"],"answer":0,"explain":"逐選項解析：（1）可衡量且可查核的目標較有助判斷轉型可信度。；（2）設計顏色不能取代排放數據。；（3）產業困難不能取代可行的減碳路徑。；（4）不揭露會降低透明度。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX086"},{"topic":"ESG風險","q":"企業ESG評分高，但營運現金流連續兩年為負且負債快速上升。哪項投資判斷較完整？","options":["ESG評分高就可以忽略財務風險","同時評估永續表現、財務及估值風險","只看社群聲量決定是否買進","因為ESG評分高，債務不可能違約"],"answer":1,"explain":"逐選項解析：（1）永續表現不能取代財務分析。；（2）投資仍須考慮現金流、負債、估值與永續風險。；（3）聲量不是財務償債能力。；（4）ESG評分不保證無信用風險。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX087"},{"topic":"保險契約","q":"保單條款約定特定疾病等待期90天，投保後第30天確診，且沒有例外規定。何項較符合契約判斷？","options":["疾病確診就一定給付","應依等待期及條款判斷，可能不符給付條件","等待期只影響續保保費","業務員宣傳文宣可以直接取代條款"],"answer":1,"explain":"逐選項解析：（1）仍需檢視等待期與承保範圍。；（2）在題設無例外下，第30天尚未滿90天。；（3）等待期可能直接影響事故是否給付。；（4）契約及相關法規才是重要依據。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX088"},{"topic":"長照規劃","q":"家庭預估長照每月支出5萬元，已有穩定可用收入2萬元，計畫先準備3年缺口且忽略通膨。需準備多少？","options":["108萬元","180萬元","72萬元","36萬元"],"answer":0,"explain":"逐選項解析：（1）每月缺口3萬元，3年36個月，共108萬元。；（2）180萬元是全額支出，未扣可用收入。；（3）72萬元不是3萬元×36個月。；（4）36萬元僅相當於每月1萬元×36個月。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX089"},{"topic":"信託財產","q":"委託人將房屋交付適當信託管理，契約約定租金用於長者生活費。哪項理解較合理？","options":["房屋及其收益管理應依信託契約與法令處理","信託成立後受託人可不受限制任意挪用租金","信託可保證房屋價格不下跌","信託必然免除所有稅費與管理成本"],"answer":0,"explain":"逐選項解析：（1）受託人須依信託本旨及契約履行管理義務。；（2）受託人仍有法定義務，不可任意挪用。；（3）信託不消除市場價格風險。；（4）信託可能涉及稅費與管理成本。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX090"},{"topic":"繼承規劃","q":"父母希望指定子女在成年後分階段領取教育與生活資金。哪項安排較有利於落實條件？","options":["事前評估信託條款與給付條件","將全部資產交付陌生代管人且不簽契約","只在家族聚會口頭宣布即可確保執行","把全部資金投入高槓桿商品保證增值"],"answer":0,"explain":"逐選項解析：（1）可透過合適信託契約設定受益與給付安排。；（2）缺乏正式契約及監督風險較高。；（3）口頭安排可能無法有效落實財產管理。；（4）槓桿商品無法保證增值且有損失風險。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX091"},{"topic":"金融消費適合度","q":"退休者需要每月穩定現金流，卻被推薦流動性低、可能大幅損失本金的複雜商品。哪項評估最重要？","options":["只比較宣傳的最高預期收益","檢視風險承受度、資金用途與商品適合度","只因理專服務年資長就直接購買","只要商品名稱有「收益」就視為固定收入"],"answer":1,"explain":"逐選項解析：（1）最高收益不能反映可能損失與流動性。；（2）資金用途及風險承受度應與商品特性匹配。；（3）服務年資不能取代適合度審查。；（4）商品名稱不等於契約保證。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX092"},{"topic":"學生理財","q":"高中生每月收入8,000元、必要支出5,500元，希望一年存下24,000元。每月可自由運用金額還剩多少？","options":["500元","2,000元","2,500元","0元"],"answer":0,"explain":"逐選項解析：（1）每月可存2,500元，目標月存2,000元，餘500元。；（2）2,000元是每月儲蓄目標，不是剩餘自由支配額。；（3）2,500元是扣必要支出後餘額，尚未扣儲蓄。；（4）扣除儲蓄後仍有500元。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX093"},{"topic":"複利","q":"本金10萬元，年報酬率5%，按年複利兩年且無其他現金流，期末約多少？","options":["110,000元","110,250元","105,000元","115,000元"],"answer":1,"explain":"逐選項解析：（1）110,000元為兩年單利近似。；（2）100,000×1.05²=110,250元。；（3）105,000元只有一年複利。；（4）115,000元高於題設兩年複利結果。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX094"},{"topic":"年化報酬","q":"投資6個月報酬率4%，若單純以相同半年報酬複利推算全年有效報酬，約為何？","options":["8%","8.16%","4%","16%"],"answer":1,"explain":"逐選項解析：（1）8%是單純相加，未考慮第二期複利。；（2）1.04²−1=8.16%。；（3）4%是半年報酬。；（4）16%並非兩期4%複利。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX095"},{"topic":"投資風險","q":"某投資組合一年報酬率可能為+30%或−20%，兩種情況機率各50%。期望報酬率為何？","options":["5%","10%","25%","−5%"],"answer":0,"explain":"逐選項解析：（1）0.5×30%+0.5×(−20%)=5%。；（2）10%不是等機率加權平均。；（3）25%是兩報酬絕對值的平均，忽略負號。；（4）−5%與加權計算不符。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX096"},{"topic":"基金贖回","q":"基金贖回金額20萬元，契約約定贖回費率0.5%，且不計其他費用。實際入帳金額為何？","options":["200,000元","199,000元","190,000元","201,000元"],"answer":1,"explain":"逐選項解析：（1）未扣贖回費。；（2）200,000×(1−0.005)=199,000元。；（3）10,000元費用相當於5%，非0.5%。；（4）費用應扣除，不會增加入帳金額。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX097"},{"topic":"債券基金","q":"投資人認為債券基金有「固定收益」四字，因此基金淨值永遠不會下降。哪項說明較正確？","options":["基金持有債券仍受利率、信用及流動性風險影響","固定收益代表淨值每日固定","只要債券有票息，基金一定保本","債券基金與定期存款有相同存保保障"],"answer":0,"explain":"逐選項解析：（1）債券基金淨值可能隨市場殖利率及信用利差波動。；（2）票息固定不等於市價固定。；（3）票息收入不能保證基金不虧損。；（4）基金不等於受存款保險保障的存款。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX098"},{"topic":"現金流管理","q":"學生為明年畢業旅行準備6萬元，目前已有2.4萬元，剩12個月且不計利息。每月最少應再存多少？","options":["2,000元","3,000元","5,000元","3,600元"],"answer":1,"explain":"逐選項解析：（1）2,000×12只增加2.4萬元，不足目標。；（2）(60,000−24,000)/12=3,000元。；（3）5,000×12會超過所需金額。；（4）3,600元是總缺口除以10個月，非12個月。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX099"},{"topic":"企業營運資金","q":"公司應收帳款30天後收回、應付帳款15天後到期，且無其他現金。哪項資金安排最重要？","options":["確認15天資金缺口並安排短期流動性","因應收帳款金額足夠，15天內完全沒有風險","直接停止支付所有合法債務","只看損益表淨利，不必看收付款時點"],"answer":0,"explain":"逐選項解析：（1）收付款時間差可能造成短期資金缺口。；（2）應收款未入帳前仍可能有流動性壓力。；（3）不當停付可能造成違約及信用損失。；（4）獲利與現金流時點不同。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX100"}];let exam=[],answers=[],at=0,remaining=40,tick=null,timed=false,locked=[];const $=id=>document.getElementById(id);function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function begin(){timed=$('mode').value==='timed';exam=shuffle(BANK).slice(0,20).map(x=>{let opts=shuffle(x.options.map((v,i)=>({v,i})));return {...x,options:opts.map(y=>y.v),answer:opts.findIndex(y=>y.i===x.answer)}});answers=Array(20).fill(null);locked=Array(20).fill(false);$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){clearInterval(tick);let x=exam[at];$('counter').textContent=`第 ${at+1} / ${exam.length} 題 · ${x.topic}`;$('question').textContent=x.q;document.querySelector('button[onclick="prev()"]').disabled=timed;$('options').innerHTML='';x.options.forEach((s,i)=>{let b=document.createElement('button');b.className='opt'+(answers[at]===i?' selected':'');b.textContent=`(${i+1}) ${s}`;b.disabled=locked[at];b.onclick=()=>{if(locked[at])return;answers[at]=i;locked[at]=true;renderOptions();if(!timed){let fb=document.createElement('div');fb.style.cssText='background:#eff8f1;color:#123c25;padding:14px;border-radius:12px;margin:10px 0;font-size:16px;line-height:1.6';fb.textContent=(i===x.answer?'✓ 答對！':'✗ 答錯。正確答案：'+x.options[x.answer])+'　解析：'+x.explain;$('options').appendChild(fb)}setTimeout(()=>{if(at<exam.length-1)next();else submitQuiz(true)},timed?350:4200)};$('options').appendChild(b)});if(timed){remaining=40;$('timer').textContent=`剩餘 ${remaining} 秒`;tick=setInterval(()=>{remaining--;$('timer').textContent=`剩餘 ${remaining} 秒`;if(remaining<=0){if(at<exam.length-1){locked[at]=true;next()}else submitQuiz(true)}},1000)}else $('timer').textContent='不限時'}function renderOptions(){[...$('options').children].forEach((b,i)=>b.classList.toggle('selected',answers[at]===i))}function next(){if(at<exam.length-1){at++;render()}}function prev(){if(!timed&&at>0){at--;render()}}function submitQuiz(auto=false){clearInterval(tick);if(!auto&&!confirm('確定交卷？未作答題目以錯誤計算。')){if(timed)render();return}let n=exam.reduce((s,x,i)=>s+(answers[i]===x.answer),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`成績：${n*5} 分（答對 ${n} / 20 題）`; $('reviews').innerHTML='';exam.forEach((x,i)=>{let d=document.createElement('div');d.className='review';let good=answers[i]===x.answer;let h=document.createElement('h3');h.textContent=`${i+1}. ${x.q}`;d.appendChild(h);let p=document.createElement('p');p.className=good?'correct':'wrong';p.textContent=`${good?'答對':'答錯'}｜你的答案：${answers[i]===null?'未作答':x.options[answers[i]]}｜正解：${x.options[x.answer]}`;d.appendChild(p);let e=document.createElement('p');e.textContent=`解析：${x.explain}`;d.appendChild(e);let s=document.createElement('small');s.className='muted';s.textContent=`參考講義：${x.source}${x.official?"｜官方參考："+x.official:""}`;d.appendChild(s);$('reviews').appendChild(d)})}</script></body></html>
