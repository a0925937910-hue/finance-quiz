<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融決賽即測即評｜情境改寫第一批</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f2f5fa;color:#18283b;margin:0}.wrap{max-width:760px;margin:auto;padding:22px}header{background:#102c4b;color:white;padding:24px;border-radius:16px}h1{font-size:1.6rem;margin:0 0 8px}.panel{background:white;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 3px 18px #1232}.muted{color:#63758b}.opt{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:white;padding:15px;border-radius:10px;margin:10px 0;font-size:1rem;cursor:pointer;line-height:1.5}.opt:hover{border-color:#2366ac}.opt.selected{background:#dbeafe;border-color:#2563eb}.primary{background:#145ea8;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:1rem;cursor:pointer}button:disabled{opacity:.5}select{padding:10px;font-size:1rem}.hidden{display:none}.review{padding:14px;border-top:1px solid #ddd}.correct{color:#087341}.wrong{color:#ba2929}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}</style></head><body><div class="wrap"><header><h1>金融知識競賽｜決賽應用題</h1><div>進階應用建置版 · 300 題題庫 · 每回隨機 20 題</div></header><section id="start" class="panel"><p>本版收錄30題已核可情境題、43題新改寫情境題及227題待改寫參數化題，共300題。已核對部分官方制度；參數化題型仍需教師審題，尚非正式定稿或官方題庫。</p><p>模式：<select id="mode"><option value="practice">練習模式（不限時）</option><option value="timed">決賽模擬（每題20秒）</option></select></p><button class="primary" onclick="begin()">開始測驗</button></section><section id="quiz" class="panel hidden"><div class="meta"><span id="counter"></span><span id="timer"></span></div><h2 id="question"></h2><div id="options"></div><div class="meta"><button class="primary" onclick="prev()">上一題</button><button class="primary" onclick="next()">下一題</button><button class="primary" onclick="submitQuiz()">交卷／看成績</button></div></section><section id="result" class="panel hidden"><h2 id="score"></h2><p class="muted">以下列出每題答案、講義依據與解析。</p><div id="reviews"></div><button class="primary" onclick="location.reload()">重新抽題</button></section></div><script>const BANK=[{"topic":"貸款成本","q":"甲貸10萬元、1年後一次還本，年息3%、開辦費3000元；乙同條件年息4%、免開辦費。若不考慮其他費用，哪項判斷最合理？","options":["甲利率較低，必定較省","甲總成本6000元，比乙多2000元","乙利率較高，總成本一定較高","甲乙總成本相同"],"answer":1,"explain":"甲利息3000元加開辦費3000元＝6000元；乙利息4000元。這是簡化總成本比較，不等於正式APR。","source":"金融商品費用20261021","id":"F001"},{"topic":"房貸規劃","q":"家庭每月可支配收入6萬元，房貸前2年月付2萬元、第3年起預估2.8萬元，另每月管理與維修費5000元。下列哪個規劃最完整？","options":["只用前兩年月付金評估","以2.8萬元加5000元評估，並預留利率上升緩衝","以房價上漲預期支付未來月付","只要有頭期款即可忽略持有費"],"answer":1,"explain":"後續月付與持有成本合計約3.3萬元，占可支配收入55%；還應考量利率變動及緊急預備金。","source":"金融商品費用20261021","id":"F002"},{"topic":"投資成本","q":"小庭以每股50元買入1000股股票，之後以51元賣出。忽略券商折扣，買賣各收0.1425%手續費，賣出另課0.3%證交稅。最接近的損益為？","options":["賺1000元","賺約704元","賺約775元","虧約296元"],"answer":1,"explain":"價差1000元；買進手續費71.25、賣出72.675、證交稅153元，淨利約703元（實際收費依券商規定）。","source":"金融商品費用20261021","id":"F003"},{"topic":"基金費用","q":"兩檔基金投資相似資產，A申購手續費低但每年經理費較高，B申購費較高但每年經理費較低。若預計長期持有，最適當的比較是？","options":["只看申購當下費用","只看去年報酬","估計持有期間總費用及風險，並確認費用如何反映淨值","只看配息頻率"],"answer":2,"explain":"長期持有會累積經理費等持續費用，須與一次性費用合併評估；歷史績效不能保證未來。","source":"金融商品費用20261021","id":"F004"},{"topic":"存款保險","q":"阿杰在同一要保銀行有新臺幣活存180萬元、定存100萬元、外幣存款折合60萬元，另在另一家要保銀行存款80萬元。假設不計利息，哪項判斷正確？","options":["所有銀行合併最高只保300萬元","第一家340萬元全數受保障","第一家最高保障300萬元，第二家另依其額度保障","外幣存款完全不受存保保障"],"answer":2,"explain":"每一存款人在同一要保機構本金及利息合計最高保障新臺幣300萬元；不同要保機構分別計算，外幣存款也計入。","source":"金融商品分類整理20261021","id":"F005"},{"topic":"防詐與帳戶","q":"網拍賣家收到一筆「重複匯款」，買家要求將款項退到與原匯款人不同的帳戶，並催促立刻處理。最安全的做法？","options":["直接退到指定帳戶避免客訴","要求對方傳身分證照片就可退款","先與銀行核實交易並循銀行協助的退款程序","先提領現金交給買家"],"answer":2,"explain":"須防範利用錯誤匯款情境洗錢或詐騙；透過銀行查證並處理可降低風險。","source":"防制洗錢20261019","id":"F006"},{"topic":"KYC與防洗錢","q":"某公司開戶時，登記負責人表示自己只是掛名，真正決定資金用途的人不願揭露。銀行最應如何處理？","options":["只驗登記負責人即可","查明實質受益人與控制關係，未能完成審查時依規定處理","請公司提供營業額即可免查","由行員代填控制人資料"],"answer":1,"explain":"CDD需辨識實質受益人與實際控制人，不能只核對表面登記資訊。","source":"防制洗錢20261019","id":"F007"},{"topic":"理專十誡","q":"理專稱客戶長期出國，可替其保管存摺、印鑑與網銀密碼，並定期代為交易。何種判斷最適當？","options":["客戶書面同意即無風險","僅保管印鑑不違規","涉及代客保管敏感物品及代客操作，應拒絕並循正式授權管道","只要交易獲利即可接受"],"answer":2,"explain":"理專十誡限制代客保管及代客操作，避免挪用與未授權交易；不能以熟識或方便為由忽略。","source":"2026年最新版教學講義_理專十誡與警示帳戶(2)","id":"F008"},{"topic":"信託與照護","q":"高齡父親有房租收入，但擔心失能後親屬擅用資金；希望每月支付照護費並定期查核。哪個方案最切合需求？","options":["將全部現金交給照護者自行管理","設計安養信託，約定支付條件與受託人管理機制","購買高波動股票期待高報酬","把房屋無條件贈與親屬"],"answer":1,"explain":"安養信託可依契約規劃財產管理與照護給付；仍須評估費用、受益安排及受託人義務。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F009"},{"topic":"以房養老","q":"退休夫妻自有住房、現金流不足，希望繼續居住，子女擔心房屋立刻歸銀行所有。哪項說明最合理？","options":["申貸後銀行立即取得房屋所有權","以房養老通常以房屋抵押取得分期貸款，仍有利息與到期清償問題","撥款是政府無償年金","任何房屋都能貸到市價100%"],"answer":1,"explain":"逆向抵押貸款通常仍由屋主持有產權，以房屋設定抵押；核貸、利息、撥款及清償依契約。","source":"2026年最新版以房養老講議1027(1)","id":"F010"},{"topic":"退休現金流","q":"退休者每月生活費4萬元、固定退休收入2.6萬元，手上存款168萬元，忽略利息及通膨。若不改變支出，存款可填補缺口多久？","options":["約5年","約10年","約12年","約20年"],"answer":1,"explain":"每月缺口1.4萬元，168萬÷1.4萬＝120個月＝10年；實際還須納入通膨、醫療與投資風險。","source":"2026年最新版以房養老講議1027(1)","id":"F011"},{"topic":"保險保障","q":"學生出國前僅投保基本旅平險，旅途中因一般疾病住院。何項判斷最適當？","options":["旅平險一定賠所有疾病住院","須檢視是否附加海外突發疾病醫療及相關條款","只要有登機證就必定理賠","旅遊不便險必定支付住院費"],"answer":1,"explain":"基本旅平險以意外身故或失能為核心，海外突發疾病醫療需確認是否有相關保障與限制。","source":"2026年最新版保險完整教學講義(2)","id":"F012"},{"topic":"醫療險理賠","q":"阿芸持有兩張新制實支實付醫療保單，同一次住院自付醫療費8萬元。她認為可向兩家各領8萬元。何項說明最恰當？","options":["一定可領16萬元","新制強調損害填補，實際給付依條款及適用規範，不能假設雙倍領取","只要收據影本就能領雙倍","實支實付只理賠住院天數"],"answer":1,"explain":"2024年7月起新制重視損害填補及差額分攤，舊契約與個別條款另須判斷。","source":"2026年最新版保險完整教學講義(2)","id":"F013"},{"topic":"責任保險","q":"餐飲店同時發生兩件事：顧客因餐點污染受傷、店家自有冷藏設備故障。若投保適當公共意外責任險，何項較合理？","options":["兩者都是第三人責任損失","顧客損害可能涉及第三人責任，自有設備損壞通常非該責任險保障","自有設備損壞優先由責任險支付","沒有過失也一定全額賠償"],"answer":1,"explain":"責任保險重點在依法應負的第三人賠償責任，自有財產損失通常應另評估財產保險；仍依保單條款。","source":"2026年最新版保險完整教學講義(2)","id":"F014"},{"topic":"金融爭議","q":"小美發現銀行貸款收費與契約說明不一致，先向銀行申訴，但銀行30日內未妥善處理。下一步何者較符合制度？","options":["直接要求中央銀行退費","依適用期限向金融消費評議中心申請評議","只能在社群平台留言","立即要求銀行停業"],"answer":1,"explain":"金融消費爭議原則上先向金融服務業申訴，符合條件時可再向評議中心申請評議，應留意申請期限。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F015"},{"topic":"就學貸款","q":"阿宏想借學貸就讀大學，預估畢業後月薪3.2萬元、房租1萬元、生活費1.4萬元，另有學貸還款。何項評估最完整？","options":["只看能否取得貸款","只比較大學排名","估算畢業後可支配現金流、還款負擔及收入不確定性","認為寬限期代表免還款"],"answer":2,"explain":"學貸需結合就學成本、未來工作收入、必要支出與還款條件評估，寬限與緩繳並非免除債務。","source":"2026年最新版教學講義_就學貸款(2)","id":"F016"},{"topic":"就學貸款","q":"畢業生遇到短期失業，考慮申請「只繳息不還本」。哪項風險最值得提醒？","options":["只繳息期間本金通常不下降，總利息可能增加","申請後本金自動減半","只繳息代表銀行放棄債權","任何人都可永久不還本金"],"answer":0,"explain":"只繳息可暫時減輕現金流壓力，但本金未減少，需估計未來還款與累計利息。","source":"2026年最新版教學講義_就學貸款(2)","id":"F017"},{"topic":"綠色金融","q":"鋼鐵廠目前排放高，但提出逐年減排、設備投資、第三方驗證與明確里程碑；另一企業只宣稱「100%永續」卻無數據。哪個判斷合理？","options":["高排放企業永遠不能取得轉型融資","有可信減碳路徑的高排放企業可能符合轉型金融精神","只要寫永續就等於綠色金融","轉型金融不需追蹤成果"],"answer":1,"explain":"轉型金融重視高排放產業具可信、可衡量的減碳計畫；空泛宣稱則有漂綠疑慮。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F018"},{"topic":"碳排放範疇","q":"飲料公司自有鍋爐燃氣、購買台電電力，另委外運輸產品。依溫室氣體盤查概念，哪項配對正確？","options":["鍋爐範疇二、外購電範疇一","鍋爐範疇一、外購電範疇二、委外運輸通常範疇三","三者都是範疇一","委外運輸一定屬範疇二"],"answer":1,"explain":"直接燃燒排放屬範疇一，外購能源間接排放屬範疇二，價值鏈其他間接排放如委外運輸通常屬範疇三。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F019"},{"topic":"投資風險","q":"小恩投資三檔都追蹤台灣科技股的ETF，認為「買三檔就完全分散風險」。最適合的提醒？","options":["三檔必定消除市場風險","雖有多檔，持股可能高度重疊，仍受同產業與市場風險影響","ETF沒有管理費","只要長期持有就保證獲利"],"answer":1,"explain":"分散效果取決於實際資產與風險來源，數量多不等於風險充分分散。","source":"金融商品分類整理20261021","id":"F020"},{"topic":"利率與債券","q":"央行為抑制通膨而升息，投資人持有固定票面利率的既有債券。若其他條件不變，哪項影響較合理？","options":["市場利率上升，既有固定利率債券價格通常承壓","債券價格一定上漲","票面利率會自動變成新市場利率","升息可消除債券違約風險"],"answer":0,"explain":"市場利率上升時，舊債券固定票息相對不具吸引力，價格通常下跌；仍有信用與流動性風險。","source":"金融商品分類整理20261021","id":"F021"},{"topic":"實質報酬","q":"某基金一年由10萬元成長為10.6萬元，期間物價上漲4%。忽略費稅，投資人的實質報酬率最接近多少？","options":["約2%","約6%","約10%","約-4%"],"answer":0,"explain":"名目報酬6%；精確實質報酬=(1.06/1.04)-1≈1.92%，約2%，不是直接把6%當購買力增加。","source":"金融商品分類整理20261021","id":"F022"},{"topic":"緊急預備金","q":"小宇每月必要支出2.5萬元，已有活存5萬元，另持有高波動股票20萬元。他希望至少準備6個月緊急預備金。哪項規劃最合理？","options":["已持有股票20萬元，不需額外現金","將流動且低波動預備金提高至約15萬元，尚差約10萬元","全部買進高槓桿商品加速達標","以信用卡循環額度取代預備金"],"answer":1,"explain":"必要支出2.5萬元×6＝15萬元，現有活存5萬元，尚缺10萬元；高波動投資不宜完全取代緊急備用資金。","source":"全民金融通","id":"F023"},{"topic":"支付科技","q":"網購平台代收買方款項、確認收貨後撥給賣方；另一持牌業者可提供儲值與用戶間轉帳。何項比較較適當？","options":["兩者法律性質及業務範圍必定相同","前者偏第三方支付代收付，後者涉及電子支付業務，應依實際許可範圍判斷","只要有QR Code就是銀行","任何購物平台都可無限制吸收儲值款"],"answer":1,"explain":"第三方支付與電子支付業務監理及可提供的功能不同，須依業者許可與法規判斷。","source":"Cheap教你金融科技力","id":"F024"},{"topic":"數位安全","q":"銀行提供開放API整合個人資產，App要求授權讀取帳戶資料。使用者最應先確認什麼？","options":["只要App免費就可授權所有權限","服務提供者身分、授權範圍、撤銷方式與資料安全","把網銀密碼直接傳給客服","同意後資料永遠不可撤回"],"answer":1,"explain":"開放銀行應重視合法授權、最小必要範圍及資訊安全，避免向第三方交付敏感登入憑證。","source":"貿二潘伊靜金融影片筆記","id":"F025"},{"topic":"警示帳戶","q":"朋友說「借我帳戶收一筆貨款，會給你5000元」，並保證與詐騙無關。最適當的決策？","options":["只借一次就不會有法律風險","借帳戶前先收押金即可","拒絕出借帳戶與提款工具，避免成為詐欺或洗錢工具","只提供提款卡、不提供密碼就安全"],"answer":2,"explain":"帳戶提供他人使用可能衍生刑事、民事與帳戶管制風險，不能以對方保證或報酬取代審查。","source":"防制洗錢20261019","id":"F026"},{"topic":"資產配置","q":"即將一年後繳學費的學生，有10萬元學費預備金與5萬元長期投資資金。哪項配置原則最合理？","options":["把15萬元全部投入波動大的加密資產","學費預備金優先考量流動性與本金風險，長期資金再依風險承受度投資","只看最高預期報酬","借款增加投資本金"],"answer":1,"explain":"短期必要支出資金應優先確保可用性，投資期限與風險承受能力需匹配。","source":"全民金融通","id":"F027"},{"topic":"信託與保險","q":"單親家長擔心身故後未成年子女一次取得大筆保險金遭不當使用，希望分期支付教育費。哪項安排最切合需求？","options":["指定任何成年人直接領全部保險金即可","評估保險金信託，約定受益人與分期給付條件","將保單受益人設為保險業務員","把保費全數改投機性投資"],"answer":1,"explain":"保險金信託可依契約管理理賠金並分期支付教育、照護等費用；須注意契約、費用與受益權。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F028"},{"topic":"綜合財務決策","q":"夫妻準備退休，名下有自住房、每月固定收入3萬元、必要支出4.5萬元，子女無法固定支援。哪項做法最合理？","options":["立即以房養老且不比較條款","先計算每月1.5萬元缺口，評估節流、其他收入與房屋養老方案的成本及居住需求","把房屋無償過戶給子女換取口頭承諾","全部存款投入單一高股息股票"],"answer":1,"explain":"先量化現金流缺口，再比較以房養老、出租或其他安排的產權、成本、居住與風險。","source":"2026年最新版以房養老講議1027(1)","id":"F029"},{"topic":"金融爭議與保險","q":"保戶住院後遭拒賠，保險公司引用「等待期間」條款，但保戶認為業務員投保時未說明。哪項行動最有助於處理爭議？","options":["立即在社群公開業務員個資","保留要保文件、條款、醫療與招攬紀錄，先向保險公司申訴","要求醫師修改診斷日期","直接停止所有保費且不看契約"],"answer":1,"explain":"保留證據有助釐清契約保障、等待期間及招攬說明，並依申訴與評議程序處理。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F030"},{"topic":"金融消費爭議","q":"阿哲發現銀行推銷的投資型保單與原先告知的風險不符。他已向銀行正式申訴，銀行回覆仍未解決爭議。下列後續做法何者較符合金融消費爭議處理程序？","options":["先在社群公布行員個資，迫使銀行退費","保留銷售紀錄與申訴回覆，依規定期限向金融消費評議中心申請評議","把保單轉賣給朋友，再由朋友代替原投保人申訴","不經任何申訴程序，直接要求評議中心判決銀行刑事責任"],"answer":1,"explain":"金融消費爭議一般先向金融服務業申訴；未獲妥適處理時，可在法定期限內申請評議。評議不是刑事判決。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F031"},{"topic":"金融消費爭議","q":"小美向銀行借款時，被要求同時購買她不需要的金融商品。銀行說「不買就不受理」，但沒有說明兩者關係。她要評估是否有不當銷售，最重要的查核方向是？","options":["因為貸款利率固定，任何附加商品都不影響消費者權益","確認是否存在不當搭售、資訊揭露不足，以及該要求是否具有合法合理依據","只要銀行有簽名文件，就不必再查核銷售過程","只比較贈品價值是否超過借款利息"],"answer":1,"explain":"不當搭售與充分揭露是關鍵；簽署文件不代表所有銷售程序都必然妥當。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F032"},{"topic":"金融消費爭議","q":"投資人發現帳戶遭不明交易，客服先表示系統異常，後來又稱是本人授權。若準備申訴，哪一組資料最能協助釐清爭議？","options":["交易時間與紀錄、授權證據、通知訊息、客服往來紀錄","先刪除簡訊與交易通知，避免個資外洩","只截圖交易獲利的那一天，忽略其他紀錄","只有投資人自己對市場行情的猜測"],"answer":0,"explain":"爭議判斷須重建交易及授權流程，保存原始證據比單純主張有用。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F033"},{"topic":"保險保障","q":"小芳已有足額住院醫療保障，卻因家中主要收入由她負擔，擔心意外身故後家人無法償還房貸。新增保險時應優先評估什麼？","options":["只看哪一張保單保費最低，不必比較保障範圍","家庭收入中斷風險、負債及扶養責任，再估算適當身故保障缺口","把全部預算投入高報酬基金，不需要風險移轉","再加購最多張住院日額險，因為住院理賠能完全替代身故保障"],"answer":1,"explain":"保障規劃先辨認風險與缺口；醫療險和壽險主要保障事故不同。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F034"},{"topic":"保險保障","q":"父親買了實支實付醫療險，住院時使用病房升等與自費醫材，卻以為所有自費支出都能全額理賠。正確的檢核方式是？","options":["只要有醫院收據，所有費用一律無上限理賠","確認醫療必要性、條款列舉或約定的給付項目、限額及收據等申請條件","只要住院超過一天，任何保單都會理賠病房升等全額","若有兩張保單，必定可向每家公司各領全額且完全不受規定限制"],"answer":1,"explain":"實支實付須依契約約定及適用規範，並非凡自費都能全額請領。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F035"},{"topic":"保險保障","q":"小杰車禍造成對方受傷，也撞壞對方高價攝影器材。他只投保強制汽車責任保險。哪個風險最需要另外評估？","options":["對方財物損失與超出強制險保障範圍的賠償責任","強制險必然賠償對方攝影器材全部價值","強制險會自動補償自己車輛所有修復費","只要事故不是故意造成，駕駛就完全不必負賠償責任"],"answer":0,"explain":"強制汽車責任保險主要針對交通事故受害人的人身傷害給付，財損及其他責任需另評估。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F036"},{"topic":"保險保障","q":"學生在投保時隱瞞曾接受的重要治療，認為只要按時繳費，保險公司日後一定要理賠。最適當的提醒是？","options":["可以請業務員代填錯誤資訊，責任會完全轉給業務員","只要第一期保費已扣款，告知內容不再重要","對要保書詢問事項應據實告知；重要不實告知可能影響契約及理賠","只要醫院資料保密，保險公司就不能查證"],"answer":2,"explain":"告知義務與契約效力有關；是否符合解除契約等要件須依法律與個案判斷。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F037"},{"topic":"信託與高齡金融","q":"獨居長者擔心失智後遭人盜領，想保留房租收入作為長期照護費，並希望有定期報告。何種安排最切合目標？","options":["評估安養信託，約定受託管理、給付條件與監督機制","把房租全部投入無保本的短期投機商品","立即將房屋過戶給照護員且不保留任何條件","將所有銀行密碼交給鄰居代管"],"answer":0,"explain":"信託可用契約安排財產管理與定期照護支付，並可設計監督條件。","source":"信託制度與信託2.0整合版","review_status":"待教師逐題確認","id":"F038"},{"topic":"信託與高齡金融","q":"母親想為成年身障子女保留生活費，擔心一次交付遺產被不當使用。下列何種設計最符合需求？","options":["透過適當信託契約設定分期給付、用途及受益人保障","直接把全部財產換成高槓桿衍生商品","所有款項一次支付給任何聲稱可代管的人","把財產登記在遠親名下，僅以口頭承諾管理"],"answer":0,"explain":"分期給付與用途管理能降低資產一次耗盡風險，仍須考量契約成本與受託義務。","source":"信託制度與信託2.0整合版","review_status":"待教師逐題確認","id":"F039"},{"topic":"信託與高齡金融","q":"退休夫妻考慮以房養老：希望繼續住在自宅，但子女擔心未來繼承與清償。決策前哪組資訊最關鍵？","options":["認為貸款核准就代表房屋立即由銀行取得所有權","只比較銀行廣告中每月最高可領金額","因為房價可能上漲，所以不用閱讀契約","撥款方式、利息累積、抵押權、到期或身故清償條件及繼承影響"],"answer":3,"explain":"逆向抵押貸款須綜合評估現金流與債務及擔保品風險。","source":"以房養老教學講義","review_status":"待教師逐題確認","id":"F040"},{"topic":"防制洗錢","q":"公司開戶時，登記負責人說真正出資及決策者在海外，但拒絕提供控制關係文件。銀行應如何處理？","options":["請登記負責人簽切結書即可完全免除審查","把公司帳戶先開好，之後永遠不必更新客戶資料","要求釐清實質受益人及資金用途，未能完成審查時依規定處理","只看公司有沒有營業登記即可開戶"],"answer":2,"explain":"金融機構需進行客戶審查與實質受益人辨識，不能僅看表面登記。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F041"},{"topic":"防制洗錢","q":"學生把自己的帳戶借給網友收取「代購款」，對方承諾每天支付報酬，還要求提款交付現金。最應注意什麼？","options":["只要有報酬，出借帳戶就一定合法","因為沒有親自詐騙，所以絕對不會涉及任何責任","可能成為詐欺或洗錢金流工具，應拒絕並保存聯繫紀錄","只要對方提供暱稱，就能證明款項合法"],"answer":2,"explain":"交付帳戶控制權及代收代轉不明款項有高度風險。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F042"},{"topic":"防制洗錢","q":"賣家收到疑似誤匯款，對方急著要求退到第三人帳戶。哪個處理流程最能降低風險？","options":["把款項換成虛擬資產轉出，讓對方更快收到","只要對方傳身分證照片，就不必確認款項來源","先匯到對方指定帳戶再說，避免客訴","透過銀行查證原始款項與退款方式，不依陌生指示轉至第三人帳戶"],"answer":3,"explain":"避免被利用進行金流分層或詐騙，退款應循可信賴金融管道。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F043"},{"topic":"數位金融安全","q":"小華收到自稱銀行客服的電話，要求提供一次性驗證碼以解除「異常交易」。他此時最合適的行動是？","options":["停止通話，從銀行官方網站或卡片背面電話自行聯絡查證","將驗證碼提供給對方，因為客服已說出姓名","請對方先匯一元驗證，就可以交出驗證碼","把驗證碼傳到對方提供的社群帳號以留存紀錄"],"answer":0,"explain":"一次性驗證碼常用於授權，不能因來電者知道個資就認定其身分。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F044"},{"topic":"數位金融安全","q":"學生在咖啡廳公共 Wi-Fi 登入網銀，瀏覽器出現憑證警告，網站網址也與官方不同。最合理的做法？","options":["停止輸入資料，改用可信網路與官方入口，必要時變更憑證並通報銀行","忽略警告，因為公共 Wi-Fi 一定安全","只要畫面有銀行標誌，就能視為官方網站","把網銀密碼傳給店員協助確認"],"answer":0,"explain":"假網站與連線風險需以網址、憑證及可信入口辨識。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F045"},{"topic":"數位金融安全","q":"家長發現孩子手機的支付 App 不明扣款，且帳戶已綁定多張卡片。最優先的處理組合是？","options":["等月底帳單再說，因為電子支付交易一定可無條件撤銷","將驗證碼交給社群自稱退款專員的人","立即停用或鎖定支付工具、聯絡發卡機構查證爭議交易並保留紀錄","先刪除所有交易通知，避免孩子擔心"],"answer":2,"explain":"先止損、通報與保全證據，再依交易類型走爭議程序。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F046"},{"topic":"綠色金融","q":"某企業宣稱產品「零碳排」，但只計算自家工廠用電，未揭露原料運輸及供應鏈排放。投資人最應質疑什麼？","options":["只要工廠裝太陽能板，就不必揭露其他排放","只要廣告顏色是綠色，就代表已達成淨零","因為公司有 ESG 報告，任何環保主張都自動成立","排放邊界是否完整、是否有第三方查證及是否誤導性宣稱"],"answer":3,"explain":"碳排放範疇及查證邊界影響宣稱可信度，避免漂綠。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F047"},{"topic":"綠色金融","q":"高排放鋼鐵公司計畫以貸款汰換設備，提出可量測減碳路徑及年度驗證指標。金融機構應如何評估？","options":["只要目前排放高，就必然不可能取得任何轉型金融支持","評估轉型計畫的可信度、資金用途、指標及未達標風險","只要公司自稱綠色，就不必查證","只看企業短期股價漲跌，不必分析排放改善"],"answer":1,"explain":"轉型金融重視可驗證的改善路徑，而非僅依現況或口號判斷。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F048"},{"topic":"綠色金融","q":"基金廣告稱「投資綠色產業，因此保證獲利且沒有市場風險」。投資人應如何理解？","options":["綠色基金可以忽略費用及投資標的集中度","即使投資永續產業，仍有市場、信用與流動性等風險，不能保證獲利","因為是綠色基金，所以本金一定由政府保障","只要符合 ESG，市場波動就不會影響淨值"],"answer":1,"explain":"永續目標不等於保本或無風險，應看持股、費用與風險揭露。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F049"},{"topic":"投資與風險","q":"兩名同學都預計一年後繳交學費；甲把全部資金放進高波動股票，乙把必要學費留在低波動高流動性工具。哪個判斷較合理？","options":["甲因為預期報酬較高，所以一定比較安全","乙較符合短期確定支出的資金用途，甲可能在繳費前遭遇市場下跌","只要股票分散到兩檔，就不存在市場風險","兩人的投資期間相同，因此風險承受度必然相同"],"answer":1,"explain":"資產配置要配合資金使用期限、承受損失能力與流動性。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F050"},{"topic":"投資與風險","q":"投資人買入追蹤同一產業的三檔 ETF，認為「買三檔就是高度分散」。哪個分析較正確？","options":["ETF 只要超過一檔，就能完全消除系統性風險","只要管理費不同，投資風險就完全不相關","三檔 ETF 的價格一定互相抵銷","仍可能高度集中在同一產業與相同成分股，應檢查持股重疊"],"answer":3,"explain":"基金數量不等於有效分散；相關性與重疊持股更重要。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F051"},{"topic":"投資與風險","q":"某人借錢投資高槓桿商品，帳面報酬率看似高於借款利率，卻沒有預留追繳保證金的現金。最大盲點是？","options":["只要平均報酬高於利息，就完全沒有虧損風險","借款本金會因市場下跌而自動減少","忽略價格波動、槓桿損失及流動性需求，可能被迫平倉","槓桿投資一定比現金投資更容易保本"],"answer":2,"explain":"預期報酬不能取代風險與現金流管理，槓桿會放大損益。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F052"},{"topic":"利率與債券","q":"小明持有固定票息長期債券，市場利率突然上升。他想立即賣出，應注意什麼？","options":["只要發行人沒有違約，提前賣出就一定能拿回面額","市場利率上升，所有既有固定票息債券市價必然等幅上漲","既有固定票息債券市價通常下跌，且存續期間較長者一般更敏感","票息會自動跟著央行升息調整"],"answer":2,"explain":"固定利率債券價格與市場殖利率通常反向，提前出售有價格風險。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F053"},{"topic":"利率與債券","q":"投資人認為「債券基金有配息，所以本金完全不會跌」。最適當的反駁是？","options":["配息金額越高，信用評等必然越高","配息不等於總報酬，仍應看淨值變動、信用風險與利率風險","債券基金的每筆配息都必定來自額外獲利","只要基金每月配息，淨值就不可能下降"],"answer":1,"explain":"配息與淨值需合併看總報酬；債券基金仍有各種市場風險。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F054"},{"topic":"利率與債券","q":"兩檔債券基金信用評等相近，但 A 存續期間約 2 年，B 約 10 年。若預期市場殖利率可能快速上升，哪個判斷較合理？","options":["兩檔信用評等相近，所以利率風險完全相同","A 的存續期間較短，因此信用風險一定較高","B 存續期間較長，因此市場利率上升時必然獲利","在其他條件相近時，B 對利率變動的價格敏感度通常較高"],"answer":3,"explain":"存續期間是衡量利率敏感度的重要指標，不能只看信用評等。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F055"},{"topic":"就學貸款","q":"學生畢業後尚未找到穩定工作，擔心就學貸款開始還款。他最合理的處理方式是？","options":["先向不明代辦支付高額手續費，保證能註銷貸款","因為沒有工作，貸款會自動永久免還","停止接聽銀行電話，讓債務自然消失","主動查詢承貸銀行及主管機關的還款、緩繳或展延資格與申請期限"],"answer":3,"explain":"應主動確認適用的還款與緩繳制度，不能假定債務自動免除。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F056"},{"topic":"就學貸款","q":"同學收到「教育部補助結清就學貸款」簡訊，要求點擊短網址、輸入銀行密碼與簡訊驗證碼。哪個處理最妥當？","options":["不點擊連結，改由承貸銀行與主管機關官方管道查證","先輸入密碼，確認不是詐騙後再改密碼","請對方先傳公司統編，就可提供驗證碼","因為提到教育部就必定是官方訊息"],"answer":0,"explain":"貸款資訊與帳戶驗證應由官方可信管道查證，不能透過可疑連結提供敏感資料。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F057"},{"topic":"就學貸款","q":"家長想替學生支付學費，考慮就學貸款或刷卡分期。哪個比較方式最完整？","options":["比較實際適用利率、各項費用、寬限與還款條件及家庭現金流","因為就學貸款名稱有「學生」，就完全不用評估還款責任","只看刷卡回饋，不必看分期費用或違約條件","只要月付金較低，就代表總成本一定較低"],"answer":0,"explain":"借款方案須同時比較成本、期限與未來償還能力。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F058"},{"topic":"理專倫理","q":"理專建議高齡客戶將全部退休存款換成高風險商品，理由是「近期漲很多」。最重要的缺失是？","options":["客戶年紀較大，因此任何金融商品都不能購買","只要理專有銷售業績，建議就一定符合客戶最佳利益","未充分評估客戶風險承受度、流動性需求與商品適合度","只要商品近期報酬高，就可以忽略客戶需求"],"answer":2,"explain":"適合度評估與風險揭露應以客戶目標與承受能力為核心。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F059"},{"topic":"理專倫理","q":"客戶長期旅居海外，要求理專保管印鑑、密碼並代下單。哪個做法較符合內控原則？","options":["因為客戶口頭同意，所以理專可以持有所有密碼","將憑證轉交理專家人保管就能規避限制","只要有賺錢，代客操作就不會產生利益衝突","拒絕保管敏感憑證與私下代客操作，協助使用正式授權程序"],"answer":3,"explain":"金融服務應遵循授權與內控，不得以方便或熟識代替程序。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F060"},{"topic":"理專倫理","q":"銀行推出複雜結構型商品，理專只展示最高可能報酬，沒有說明最差情境及提前贖回限制。何者最值得關注？","options":["若商品有英文名稱，客戶必然理解風險","資訊揭露是否平衡且充分，客戶是否真正理解風險與流動性限制","只要最高報酬率寫在首頁，就已充分揭露","提前贖回限制只影響銀行，不影響投資人"],"answer":1,"explain":"風險與報酬須對稱揭露，不能只強調最好情況。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F061"},{"topic":"綜合財務規劃","q":"家庭每月收入 8 萬元，必要支出 5 萬元，信用卡循環利息負擔高，卻打算先借錢投入高波動商品。最合理的財務優先順序是？","options":["因為有固定收入，信用卡循環利息可以永久忽略","只要投資名稱包含 ETF，就不必考慮負債","先處理高成本負債與緊急預備金，再依風險承受度安排投資","先借更多錢加碼，因為高波動商品必然賺得較快"],"answer":2,"explain":"高成本負債與緊急預備金通常是風險管理的優先項目。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F062"},{"topic":"綜合財務規劃","q":"學生存下 6 萬元，半年後要繳 4 萬元學費，另有 2 萬元可長期投資。哪個配置最符合用途？","options":["因為本金只有 6 萬元，資金期限與流動性都不重要","將短期確定支出保留在低風險高流動性資金，長期資金再評估投資","全部投入高槓桿商品，因為短期可能獲利較高","全部購買長期鎖定且提前退出有高額費用的商品"],"answer":1,"explain":"資金使用期限不同，適合的風險與流動性安排也不同。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F063"},{"topic":"綜合財務規劃","q":"退休者持有大量單一公司股票，每月靠賣股支付生活費。若股市連續下跌，最值得事前處理的問題是？","options":["降低集中與被迫賣出的風險，規劃適當現金流及資產分散","股價下跌時一定能以原價賣出","退休後不必再考慮資金流動性","只要公司知名，集中持股就沒有風險"],"answer":0,"explain":"退休提款期需管理報酬順序風險、集中風險與現金需求。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F064"},{"topic":"金融科技","q":"兩家銀行數位帳戶提供不同活存優惠：甲僅在指定額度內有高利率，乙利率略低但限制較少。學生要存緊急預備金，最適合怎麼比較？","options":["依實際存款金額計算可得利息，並確認活動期限、上限、轉帳與提款便利性","只要是數位帳戶，所有銀行優惠與限制必然相同","只看廣告最大利率，不必確認適用額度","只看 App 圖示是否漂亮"],"answer":0,"explain":"優惠利率可能有額度、條件與期間限制，流動性同樣重要。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F065"},{"topic":"金融科技","q":"小王把錢從銀行帳戶轉到電子支付帳戶，誤以為所有電子支付餘額都與銀行存款享有完全相同的存款保險。應如何判斷？","options":["先辨認資金法律性質及業者保管機制，不能把所有支付餘額直接等同銀行存款","只要 App 有付款功能，就必然是存款保險的要保機構","只要能轉帳，資金法律性質就與定期存款完全相同","任何電子支付餘額都由政府無上限保證"],"answer":0,"explain":"支付服務與銀行存款性質及保障機制可能不同，應查官方規範。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F066"},{"topic":"金融科技","q":"有人在社群宣稱「去中心化金融商品由智慧合約執行，因此完全沒有風險」。哪個判斷最合理？","options":["沒有銀行參與就代表本金由政府保證","交易不可逆代表遭詐騙時一定能自動退款","只要合約寫在區塊鏈上，程式就不可能出錯","智慧合約仍可能有程式漏洞、資產價格波動及平台與治理風險"],"answer":3,"explain":"自動執行降低部分中介需求，但不能消除技術與市場風險。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F067"},{"topic":"綜合決賽題","q":"家庭同時面臨房貸寬限期結束、長輩照護費增加及投資虧損。若只能先做一項財務檢視，哪個最能幫助後續決策？","options":["只比較房屋市價，不必估計每月付款","先加碼虧損股票，期待反彈支付所有支出","把長輩所有財產轉到不明代管帳戶","建立未來 12 個月現金流與必要支出表，估計還款及照護缺口，再決定資產處置"],"answer":3,"explain":"先掌握現金流、負債與照護責任，才能安排資產配置與保障。","source":"財務規劃、以房養老、信託講義","review_status":"待教師逐題確認","id":"F068"},{"topic":"綜合決賽題","q":"學生打算投資一檔標榜 ESG 的海外債券基金，需兩年後支付留學費用。基金以外幣計價且有提前買回費。哪個評估最完整？","options":["只要投資海外商品，就能完全消除市場風險","只要債券基金配息，兩年後本金就一定不變","同時評估匯率、債券利率與信用風險、買回費用及資金使用期限","因為標榜 ESG，所以不必考慮匯率"],"answer":2,"explain":"跨境債券基金同時面臨多種風險，資金期限與費用不可忽略。","source":"綠色金融、金融商品分類與費用講義","review_status":"待教師逐題確認","id":"F069"},{"topic":"綜合決賽題","q":"退休者想以房養老補充生活費，同時設安養信託管理撥款。子女認為兩者只能擇一。哪個分析較合理？","options":["設立信託後，所有貸款利息會自動消失","只要辦安養信託，銀行就必須無償提供生活費","以房養老的撥款一定不能用於照護","兩者功能不同，可評估貸款取得現金流與信託管理用途是否能適當搭配"],"answer":3,"explain":"逆向抵押貸款與信託可能分別處理資金來源與管理，仍須看契約與成本。","source":"以房養老、信託制度講義","review_status":"待教師逐題確認","id":"F070"},{"topic":"綜合決賽題","q":"公司推出「保本高收益」虛擬資產商品，要求投資人匯款到個人帳戶，還宣稱有國際金融專家背書。最合理的處置？","options":["查核合法性、交易對象及資金流向，警惕保證高收益與私人收款帳戶","只要有專家照片，就可以相信保本承諾","先投入全部積蓄，賺錢後再確認是否合法","因為使用虛擬資產，所以沒有詐騙風險"],"answer":0,"explain":"保證高報酬與不明收款管道都是警訊，需多重查證。","source":"防詐、金融科技與理專倫理講義","review_status":"待教師逐題確認","id":"F071"},{"topic":"綜合決賽題","q":"家長希望為未成年子女存教育基金，卻同時接到假冒銀行的高利優惠簡訊。哪個決策最符合金融安全與資產規劃？","options":["先提供 OTP 以保留名額，之後再確認","先透過官方管道查證優惠，再依教育費用期限評估流動性與風險","把所有教育基金轉到陌生人的私人帳戶","因為是替孩子存錢，所以任何高利商品都安全"],"answer":1,"explain":"先辨識詐騙，再做符合用途的資產安排。","source":"數位安全、財務規劃講義","review_status":"待教師逐題確認","id":"F072"},{"topic":"綜合決賽題","q":"投資人看到基金今年報酬率 8%，但支付一次性申購費，基金另有持續費用；同年物價上漲 3%。要判斷購買力是否增加，應採用什麼順序？","options":["直接把名目報酬 8% 當成實質淨報酬","先估算扣除相關費用後的投資結果，再考慮通膨調整購買力","只看基金配息率，不必看淨值與費用","因為物價上漲，投資報酬必定為負"],"answer":1,"explain":"淨報酬需考慮投資費用，實質報酬再考慮物價變化。","source":"金融商品費用與財務規劃講義","review_status":"待教師逐題確認","id":"F073"},{"topic":"房貸負擔與寬限","q":"某家庭每月可支配收入51,000元，房貸寬限期間每月付16,000元，寬限後預估每月付25,000元，房屋管理維護費2,000元。若只比較這些固定項目，寬限後合計占可支配收入約多少？","options":["3.9%","52.9%","31.4%","49.0%"],"answer":1,"explain":"寬限後房貸與持有費合計27,000元；除以收入51,000元約52.9%。尚須預留生活、利率與修繕風險。","source":"金融商品費用20261021","official":"","id":"F074","review_status":"參數化題，待改寫"},{"topic":"股票交易淨損益","q":"小玲以每股43元買進2,000股上市一般股票，再以49元賣出。假設買賣手續費均為成交額0.1425%，賣出證交稅0.3%，忽略折扣及最低收費，實際損益約為？","options":["獲利12,000元","獲利11,738元","獲利11,444元","獲利11,706元"],"answer":2,"explain":"價差12,000元－雙邊手續費262.20元－賣出證交稅294.00元＝約11,444元。實際收費以券商規定為準。","source":"金融商品費用20261021","official":"","id":"F075","review_status":"參數化題，待改寫"},{"topic":"貸款總成本","q":"小芳申請20萬元、1年後一次還本的短期借款，甲年利率3%且開辦費4,900元；乙年利率5%免開辦費。忽略其他費用及時間價值，何者正確？","options":["乙較省900元","甲較省900元","僅看名目利率，甲必定較省","兩方案成本完全相同"],"answer":0,"explain":"甲利息6,000元＋開辦費4,900元＝10,900元；乙利息10,000元，乙少900元。此為簡化成本比較，非正式APR。","source":"金融商品費用20261021","official":"","id":"F076","review_status":"參數化題，待改寫"},{"topic":"緊急預備金","q":"阿威每月必要支出23,000元，預計保留8個月緊急預備金；目前活存69,000元，另有波動大的股票。若股票不計入低風險預備金，至少還須補足多少元？","options":["115,000元","69,000元","184,000元","253,000元"],"answer":0,"explain":"目標=23,000×8=184,000元；扣除活存69,000元，缺口115,000元。緊急資金重視流動性與本金風險。","source":"全民金融通","official":"","id":"F077","review_status":"參數化題，待改寫"},{"topic":"退休現金流","q":"退休家庭每月固定收入32,000元、必要支出42,000元，持有可動用現金960,000元。若不考慮利息、物價與突發醫療支出，現金最多可彌補支出缺口幾年？","options":["10年","6年","16年","8年"],"answer":3,"explain":"每月缺口=42,000－32,000=10,000元；960,000÷10,000÷12=8年。真實退休規劃另須估計通膨及照護風險。","source emaining} 秒`;if(remaining<=0){if(at<exam.length-1){locked[at]=true;next()}else submitQuiz(true)}},1000)}else $('timer').textContent='不限時'}function renderOptions(){[...$('options').children].forEach((b,i)=>b.classList.toggle('selected',answers[at]===i))}function next(){if(at<exam.length-1){at++;render()}}function prev(){if(!timed&&at>0){at--;render()}}function submitQuiz(auto=false){clearInterval(tick);if(!auto&&!confirm('確定交卷？未作答題目以錯誤計算。')){if(timed)render();return}let n=exam.reduce((s,x,i)=>s+(answers[i]===x.answer),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`成績：${n*5} 分（答對 ${n} / 20 題）`; $('reviews').innerHTML='';exam.forEach((x,i)=>{let d=document.createElement('div');d.className='review';let good=answers[i]===x.answer;let h=document.createElement('h3');h.textContent=`${i+1}. ${x.q}`;d.appendChild(h);let p=document.createElement('p');p.className=good?'correct':'wrong';p.textContent=`${good?'答對':'答錯'}｜你的答案：${answers[i]===null?'未作答':x.options[answers[i]]}｜正解：${x.options[x.answer]}`;d.appendChild(p);let e=document.createElement('p');e.textContent=`解析：${x.explain}`;d.appendChild(e);let s=document.createElement('small');s.className='muted';s.textContent=`參考講義：${x.source}${x.official?"｜官方參考："+x.official:""}`;d.appendChild(s);$('reviews').appendChild(d)})}</script></body></html>
