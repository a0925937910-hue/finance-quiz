<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融決賽即測即評｜400題解析優化第三批版</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f2f5fa;color:#18283b;margin:0}.wrap{max-width:760px;margin:auto;padding:22px}header{background:#102c4b;color:white;padding:24px;border-radius:16px}h1{font-size:1.6rem;margin:0 0 8px}.panel{background:white;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 3px 18px #1232}.muted{color:#63758b}.opt{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:white;padding:15px;border-radius:10px;margin:10px 0;font-size:1rem;cursor:pointer;line-height:1.5}.opt:hover{border-color:#2366ac}.opt.selected{background:#dbeafe;border-color:#2563eb}.primary{background:#145ea8;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:1rem;cursor:pointer}button:disabled{opacity:.5}select{padding:10px;font-size:1rem}.hidden{display:none}.review{padding:14px;border-top:1px solid #ddd}.correct{color:#087341}.wrong{color:#ba2929}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}</style></head><body><div class="wrap"><header><h1>金融知識競賽｜決賽應用題</h1><div>進階應用建置版 · 400 題題庫（解析優化第一批） · 每回隨機 20 題</div></header><section id="start" class="panel"><p>本版收錄400題情境應用題（含新增貨幣政策20題、跨領域決策49題），仍待教師與官方資料終審。已核對部分官方制度；參數化題型仍需教師審題，尚非正式定稿或官方題庫。</p><p>模式：<select id="mode"><option value="practice">練習模式（不限時）</option><option value="timed">決賽模擬（每題40秒）</option></select></p><button class="primary" onclick="begin()">開始測驗</button></section><section id="quiz" class="panel hidden"><div class="meta"><span id="counter"></span><span id="timer"></span></div><h2 id="question"></h2><div id="options"></div><div class="meta"><button class="primary" onclick="prev()">上一題</button><button class="primary" onclick="next()">下一題</button><button class="primary" onclick="submitQuiz()">交卷／看成績</button></div></section><section id="result" class="panel hidden"><h2 id="score"></h2><p class="muted">以下列出每題答案、講義依據與解析。</p><div id="reviews"></div><button class="primary" onclick="location.reload()">重新抽題</button></section></div><script>const BANK=[{"topic":"貸款成本","q":"甲貸10萬元、1年後一次還本，年息3%、開辦費3000元；乙同條件年息4%、免開辦費。若不考慮其他費用，哪項判斷最合理？","options":["甲的名目利率較低，因此總費用較低","甲的總成本為6,000元，比乙多2,000元","乙的利息較高，因此總費用較高","兩方案總費用都是4,000元"],"answer":1,"explain":"逐選項解析：（1）甲利息3,000元，另有3,000元開辦費，合計6,000元；乙利息4,000元且無開辦費。名目利率不能取代費用比較。；（2）甲總費用＝100,000×3%＋3,000＝6,000元；乙＝100,000×4%＝4,000元，甲多2,000元。題目是一次還本的簡化比較，非正式APR。；（3）乙利息雖為4,000元，高於甲的3,000元，但甲另收3,000元開辦費，因此乙總費用反而較低。；（4）乙總費用是4,000元，但甲是6,000元；不能漏算開辦費。","source":"金融商品費用20261021","id":"F001","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"房貸規劃","q":"家庭每月可支配收入6萬元，房貸前2年月付2萬元、第3年起預估2.8萬元，另每月管理與維修費5000元。下列哪個規劃最完整？","options":["以最初兩年的月付與持有成本作主要壓力測試","以第3年2.8萬元月付加5,000元持有費，另測試升息及緊急預備金","以兩階段月付平均2.4萬元，當成固定長期負擔","以第3年月付2.8萬元評估，但將維修費視為可忽略"],"answer":1,"explain":"逐選項解析：（1）前兩年合計2.5萬元，低估第3年起的3.3萬元；只看優惠期容易誤判可負擔性。；（2）第3年起月付2.8萬元＋管理維修5,000元＝3.3萬元，占6萬元可支配收入55%；還需測試利率及突發支出。；（3）平均月付不能代表第3年起實際現金流壓力，且未反映持有費。；（4）第3年2.8萬元尚未加上每月5,000元持有成本，會低估總負擔。","source":"金融商品費用20261021","id":"F002","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"投資成本","q":"小庭以每股50元買入1000股股票，之後以51元賣出。忽略券商折扣，買賣各收0.1425%手續費，賣出另課0.3%證交稅。最接近的損益為？","options":["淨賺約1,000元","淨賺約703元","淨賺約847元","淨賺約775元"],"answer":1,"explain":"逐選項解析：（1）1,000元只是價差，尚未扣除買賣手續費及賣出證交稅。；（2）價差＝(51−50)×1,000＝1,000元；買入手續費71.25元、賣出72.675元、賣出證交稅153元；淨利＝703.075元，約703元，未計最低手續費及折扣。；（3）約847元僅接近扣除賣出證交稅的結果，漏掉兩次券商手續費。；（4）約775元不符合題目列明的買賣手續費與證交稅合計296.925元。","source":"金融商品費用20261021","id":"F003","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"基金費用","q":"兩檔基金投資相似資產，A申購手續費低但每年經理費較高，B申購費較高但每年經理費較低。若預計長期持有，最適當的比較是？","options":["比較申購費與最近一年績效，不必估計長期成本","比較兩檔歷年配息率，以配息高者優先","比較持有期間總費用、投資風險及經理費反映淨值的方式","比較單次申購手續費，忽略經理費因其已內扣"],"answer":2,"explain":"逐選項解析：（1）申購費是一次性費用，但長期經理費會持續影響淨值；最近一年績效也無法替代成本估計。；（2）配息率不是總報酬，也不能直接推導費用負擔或投資風險。；（3）長期投資須合併評估一次性申購費、持續性經理費與保管費及風險；內扣費用仍會影響投資成果。；（4）經理費即使從基金資產內扣，仍降低基金淨值及投資人報酬，不能視為零成本。","source":"金融商品費用20261021","id":"F004","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"存款保險","q":"阿杰在同一要保銀行有新臺幣活存180萬元、定存100萬元、外幣存款折合60萬元，另在另一家要保銀行存款80萬元。假設不計利息，哪項判斷正確？","options":["兩家銀行的420萬元存款合併只保障300萬元","第一家銀行的340萬元均受存保保障","第一家最高保障300萬元；第二家80萬元另計","第一家只計新臺幣280萬元，外幣60萬元另設上限"],"answer":2,"explain":"逐選項解析：（1）存保按同一存款人、同一家要保機構計算，不能將不同銀行存款合併套同一上限。；（2）第一家本外幣存款合計340萬元，超過每家要保機構300萬元的保障上限。；（3）第一家180＋100＋60＝340萬元，最高保障300萬元；第二家80萬元在另一家要保銀行另計。題目不計利息。；（4）同一家要保機構的本外幣存款本金及利息合併計算保障上限，不是外幣獨立再享300萬元。","source":"金融商品分類整理20261021","id":"F005","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"防詐與帳戶","q":"網拍賣家收到一筆「重複匯款」，買家要求將款項退到與原匯款人不同的帳戶，並催促立刻處理。最安全的做法？","options":["直接退到指定帳戶避免客訴","要求對方傳身分證照片就可退款","先與銀行核實交易並循銀行協助的退款程序","先提領現金交給買家"],"answer":2,"explain":"須防範利用錯誤匯款情境洗錢或詐騙；透過銀行查證並處理可降低風險。","source":"防制洗錢20261019","id":"F006","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"KYC與防洗錢","q":"某公司開戶時，登記負責人表示自己只是掛名，真正決定資金用途的人不願揭露。銀行最應如何處理？","options":["先核對登記負責人並暫緩辨識其他控制人","辨識實質受益人及控制關係，審查不足時依法處理","先完成開戶，之後再以交易監控代替身分審查","請登記負責人書面保證資金合法，免再查證"],"answer":1,"explain":"逐選項解析：（1）公司登記負責人不一定等於最終控制人；只核對表面身分不足以完成客戶審查。；（2）應採合理措施辨識及驗證實質受益人與控制關係，必要時了解資金來源與用途；無法完成必要審查須依規定處理。；（3）交易監控不能取代開戶前或建立業務關係時應完成的客戶審查。；（4）切結書可能是輔助資料，但不能取代金融機構對實質受益人及控制關係的查核。","source":"防制洗錢20261019","id":"F007","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"理專十誡","q":"理專稱客戶長期出國，可替其保管存摺、印鑑與網銀密碼，並定期代為交易。何種判斷最適當？","options":["客戶書面同意即無風險","僅保管印鑑不違規","涉及代客保管敏感物品及代客操作，應拒絕並循正式授權管道","只要交易獲利即可接受"],"answer":2,"explain":"理專十誡限制代客保管及代客操作，避免挪用與未授權交易；不能以熟識或方便為由忽略。","source":"2026年最新版教學講義_理專十誡與警示帳戶(2)","id":"F008","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"信託與照護","q":"高齡父親有房租收入，但擔心失能後親屬擅用資金；希望每月支付照護費並定期查核。哪個方案最切合需求？","options":["由親屬擔任代收人，直接使用房租支付照護費","設計安養信託，約定給付、管理與監督機制","將租金改投入定期配息基金，按配息支付照護費","以共同帳戶讓照護者可直接提款支付費用"],"answer":1,"explain":"逐選項解析：（1）由親屬代收缺乏題目要求的契約化用途控制與定期查核，仍可能遭擅用。；（2）安養信託可依契約約定財產管理、照護給付條件、受託人責任及監督安排；仍須評估費用與契約限制。；（3）基金配息有市場及配息變動風險，不能直接達成限制他人擅用與定期查核的核心需求。；（4）共同帳戶可能便利支付，但不等於信託財產隔離及受託管理，未必能限制提款用途。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F009","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"以房養老","q":"退休夫妻自有住房、現金流不足，希望繼續居住，子女擔心房屋立刻歸銀行所有。哪項說明最合理？","options":["借款後銀行取得所有權，屋主保有居住權","以自宅設定抵押取得分期貸款，須評估利息及清償","由政府按房屋鑑價定期無償支付養老金","以房屋出售給銀行後，再用租約維持居住"],"answer":1,"explain":"逐選項解析：（1）一般商業型以房養老屬逆向抵押貸款，設定抵押權不等於立即移轉所有權。；（2）屋主通常保有房屋所有權，以房屋設定抵押取得撥款；利息累積、清償時點及繼承影響依契約。；（3）商業型以房養老不是政府無償年金，撥款通常形成借款債務。；（4）賣屋後回租是不同安排，與題目所述的逆向抵押貸款結構不同。","source":"2026年最新版以房養老講議1027(1)","id":"F010","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"退休現金流","q":"退休者每月生活費4萬元、固定退休收入2.6萬元，手上存款168萬元，忽略利息及通膨。若不改變支出，存款可填補缺口多久？","options":["約8年","約10年","約12年","約14年"],"answer":1,"explain":"逐選項解析：（1）每月缺口1.4萬元，168萬元約可支應120個月，不是96個月。；（2）每月缺口＝4萬−2.6萬＝1.4萬元；168萬÷1.4萬＝120個月＝10年。未計利息、通膨及突發支出。；（3）12年相當於144個月，需201.6萬元填補缺口，超過現有168萬元。；（4）14年相當於168個月，需235.2萬元，超過現有168萬元。","source":"2026年最新版以房養老講議1027(1)","id":"F011","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"保險保障","q":"學生出國前僅投保基本旅平險，旅途中因一般疾病住院。何項判斷最適當？","options":["確認旅平險是否含傷害醫療給付即可","檢查是否附加海外突發疾病醫療及其等待、除外條款","以旅遊不便險的班機延誤保障支應疾病醫療","確認意外身故保額足夠即可涵蓋疾病住院"],"answer":1,"explain":"逐選項解析：（1）傷害醫療通常以意外事故為基礎，一般疾病住院不必然屬於保障範圍。；（2）應檢視是否有海外突發疾病醫療保障及相關除外、等待或既往症限制，依個別保單條款判斷。；（3）旅遊不便險主要保障約定旅行不便事故，不等於疾病住院醫療保險。；（4）意外身故保額與一般疾病住院醫療是不同保障項目，不能相互取代。","source":"2026年最新版保險完整教學講義(2)","id":"F012","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"醫療險理賠","q":"阿芸持有兩張新制實支實付醫療保單，同一次住院自付醫療費8萬元。她認為可向兩家各領8萬元。何項說明最恰當？","options":["一定可領16萬元","新制強調損害填補，實際給付依條款及適用規範，不能假設雙倍領取","只要收據影本就能領雙倍","實支實付只理賠住院天數"],"answer":1,"explain":"2024年7月起新制重視損害填補及差額分攤，舊契約與個別條款另須判斷。","source":"2026年最新版保險完整教學講義(2)","id":"F013","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"責任保險","q":"餐飲店同時發生兩件事：顧客因餐點污染受傷、店家自有冷藏設備故障。若投保適當公共意外責任險，何項較合理？","options":["兩者都是第三人責任損失","顧客損害可能涉及第三人責任，自有設備損壞通常非該責任險保障","自有設備損壞優先由責任險支付","沒有過失也一定全額賠償"],"answer":1,"explain":"責任保險重點在依法應負的第三人賠償責任，自有財產損失通常應另評估財產保險；仍依保單條款。","source":"2026年最新版保險完整教學講義(2)","id":"F014","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"金融爭議","q":"小美發現銀行貸款收費與契約說明不一致，先向銀行申訴，但銀行30日內未妥善處理。下一步何者較符合制度？","options":["直接向主管機關要求判定銀行退費","保存申訴資料，於法定期限內向評議中心申請評議","因銀行30日未解決，改向其他銀行申請退費","先向評議中心申請刑事調查再處理契約爭議"],"answer":1,"explain":"逐選項解析：（1）主管機關監理與個別金融消費評議程序不同，不能把主管機關當成直接退費機構。；（2）原則上先向金融服務業申訴；未於30日內處理或不接受結果者，應注意自處理期限屆滿或收到結果起60日內申請評議。；（3）其他銀行不是原爭議契約當事人，無從直接承擔原銀行的退款義務。；（4）評議中心處理金融消費民事爭議，不是刑事偵查機關。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F015","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"就學貸款","q":"阿宏想借學貸就讀大學，預估畢業後月薪3.2萬元、房租1萬元、生活費1.4萬元，另有學貸還款。何項評估最完整？","options":["只看能否取得貸款","只比較大學排名","估算畢業後可支配現金流、還款負擔及收入不確定性","認為寬限期代表免還款"],"answer":2,"explain":"學貸需結合就學成本、未來工作收入、必要支出與還款條件評估，寬限與緩繳並非免除債務。","source":"2026年最新版教學講義_就學貸款(2)","id":"F016","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"就學貸款","q":"畢業生遇到短期失業，考慮申請「只繳息不還本」。哪項風險最值得提醒？","options":["短期減輕月付，但本金未減少且累計利息可能增加","本金依原還款期數持續攤還，只是延後收款","只繳息期間視同本金已清償，不影響後續期數","只繳息能鎖定總利息，與正常攤還成本相同"],"answer":0,"explain":"逐選項解析：（1）只繳息不還本可降低短期現金流壓力，但本金通常不下降；延長或調整還款期可能增加總利息，須依契約試算。；（2）只繳息的重點就是暫不攤還本金，不能視為原本本金攤還仍持續。；（3）利息支付不等於本金清償；後續仍須依調整後條件還本。；（4）本金較晚下降會影響計息期間及總成本，不能直接認定與正常攤還相同。","source":"2026年最新版教學講義_就學貸款(2)","id":"F017","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"綠色金融","q":"鋼鐵廠目前排放高，但提出逐年減排、設備投資、第三方驗證與明確里程碑；另一企業只宣稱「100%永續」卻無數據。哪個判斷合理？","options":["高排放企業永遠不能取得轉型融資","有可信減碳路徑的高排放企業可能符合轉型金融精神","只要寫永續就等於綠色金融","轉型金融不需追蹤成果"],"answer":1,"explain":"轉型金融重視高排放產業具可信、可衡量的減碳計畫；空泛宣稱則有漂綠疑慮。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F018","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"碳排放範疇","q":"飲料公司自有鍋爐燃氣、購買台電電力，另委外運輸產品。依溫室氣體盤查概念，哪項配對正確？","options":["鍋爐範疇一、外購電範疇三、委外運輸範疇二","鍋爐範疇一、外購電範疇二、委外運輸通常範疇三","鍋爐範疇二、外購電範疇一、委外運輸範疇三","鍋爐範疇一、外購電範疇二、委外運輸範疇一"],"answer":1,"explain":"逐選項解析：（1）外購電力是購買能源的間接排放，應列範疇二；委外運輸一般屬價值鏈其他間接排放。；（2）自有鍋爐直接燃燒為範疇一；購電為範疇二；外包運輸通常為範疇三，仍須按盤查邊界確認。；（3）鍋爐由企業自有設備燃燒，不是外購能源所生間接排放；購電也不是直接排放。；（4）委外運輸並非企業自行控制車輛的直接排放，通常應納入範疇三。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F019","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"投資風險","q":"小恩投資三檔都追蹤台灣科技股的ETF，認為「買三檔就完全分散風險」。最適合的提醒？","options":["三檔ETF追蹤不同指數，就代表個股風險與產業風險都已分散","雖有多檔，持股可能高度重疊，仍受同產業與市場風險影響","三檔ETF持股數量多，便可忽略共同產業曝險","三檔ETF的費率不同，就代表報酬來源相互獨立"],"answer":1,"explain":"逐選項解析：（1）指數名稱不同不代表成分股、產業或風格沒有重疊；仍須看實際持股。；（2）三檔皆追蹤台灣科技股，可能高度重疊，市場及產業風險仍共同存在。；（3）持股數量是分散度的一部分，但共同科技產業因子仍可能主導報酬。；（4）費率差異是成本差異，不代表底層資產或風險來源獨立。","source":"金融商品分類整理20261021","id":"F020","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"利率與債券","q":"央行為抑制通膨而升息，投資人持有固定票面利率的既有債券。若其他條件不變，哪項影響較合理？","options":["市場利率上升，既有固定票息債券價格通常下跌","債券到期還本額不變，因此目前市場成交價不受利率影響","新發行債券殖利率提高，會使舊債票息同步調高","升息只影響新債，不影響舊債投資人提前出售的價格"],"answer":0,"explain":"逐選項解析：（1）市場要求殖利率提高時，固定現金流折現值下降，舊債市價通常下跌。；（2）到期還本額固定與中途交易價格不同；折現率變動會影響現值。；（3）固定票息債券的票息依發行條件決定，不會隨市場利率自動調高。；（4）若到期前出售，舊債須按當時市場殖利率定價，仍有利率風險。","source":"金融商品分類整理20261021","id":"F021","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"實質報酬","q":"某基金一年由10萬元成長為10.6萬元，期間物價上漲4%。忽略費稅，投資人的實質報酬率最接近多少？","options":["約2%","約6%","約1%","約4%"],"answer":0,"explain":"逐選項解析：（1）精確實質報酬率＝1.06／1.04－1≈1.923%，四捨五入約2%。；（2）6%是名目報酬率，未扣除物價上漲造成的購買力減損。；（3）實質報酬率約1.923%，若取整數百分點應為2%，不是1%。；（4）4%是物價漲幅，不是扣除通膨後的投資報酬率。","source":"金融商品分類整理20261021","id":"F022","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"緊急預備金","q":"小宇每月必要支出2.5萬元，已有活存5萬元，另持有高波動股票20萬元。他希望至少準備6個月緊急預備金。哪項規劃最合理？","options":["把股票20萬元全數列入預備金，但另外留2萬元活存緩衝","將流動、低波動預備金提高至15萬元，尚需補足10萬元","保留5萬元活存，另以10萬元股票市值作為主要預備金","用可隨時申請的信用額度作為6個月預備金"],"answer":1,"explain":"逐選項解析：（1）股票可變現但市價波動大，無法取代需要時可確定動用的低波動資金。；（2）2.5萬×6＝15萬元，現有低波動活存5萬元，仍需補足10萬元。；（3）股票可能在失業或急用時同步下跌，不宜視為等值的緊急現金。；（4）信用額度可能被調整且借款產生利息，不能等同自有預備金。","source":"全民金融通","id":"F023","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"支付科技","q":"網購平台代收買方款項、確認收貨後撥給賣方；另一持牌業者可提供儲值與用戶間轉帳。何項比較較適當？","options":["兩種業者均可代收付，因而其儲值與轉帳權限相同","前者偏第三方支付代收付，後者涉及電子支付業務，應依實際許可範圍判斷","有第三方支付服務的平台就可直接經營使用者間轉帳","電子支付業者與一般購物平台只在交易介面不同"],"answer":1,"explain":"逐選項解析：（1）代收付功能相似，不代表經營儲值及使用者間轉帳的法定資格相同。；（2）代收付與儲值、使用者間轉帳涉及不同監理規範，應核對業者許可範圍。；（3）用戶間轉帳可能涉及電子支付相關法規，不能由代收付服務推論可經營。；（4）差別涉及資金保管、許可及監理，不只是畫面或技術。","source":"Cheap教你金融科技力","id":"F024","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"數位安全","q":"銀行提供開放API整合個人資產，App要求授權讀取帳戶資料。使用者最應先確認什麼？","options":["只要App採用加密傳輸，便不需檢視授權資料種類","服務提供者身分、授權範圍、撤銷方式與資料安全","只要銀行合作，就應永久授權所有帳戶讀取權限","只核對App下載次數即可判斷資料使用安全"],"answer":1,"explain":"逐選項解析：（1）傳輸加密只能降低傳輸風險，不能代替目的、權限與資料保存的評估。；（2）確認誰讀取、讀取哪些資料、用途與撤銷方式，是知情授權的核心。；（3）合作關係不代表所有資料都必須長期授權，仍應遵循最小必要原則。；（4）下載次數不能證明資料蒐集範圍、處理方式及撤銷機制。","source":"貿二潘伊靜金融影片筆記","id":"F025","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"警示帳戶","q":"朋友說「借我帳戶收一筆貨款，會給你5000元」，並保證與詐騙無關。最適當的決策？","options":["只要對方提供身分證影本，就可短期借帳戶收款","先要求朋友簽借用契約，再提供提款卡","拒絕出借帳戶與提款工具，避免成為詐欺或洗錢工具","由自己代收款後立即轉出，便可避免帳戶風險"],"answer":2,"explain":"逐選項解析：（1）身分證影本無法排除不明金流風險，借帳戶仍可能涉及違法。；（2）契約不能把不明金流及帳戶被利用的法律風險消除。；（3）收款用途不明且有報酬誘因，應拒絕並透過正當交易管道處理。；（4）親自轉出也可能形成可疑資金移轉，並非安全替代方式。","source":"防制洗錢20261019","id":"F026","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"資產配置","q":"即將一年後繳學費的學生，有10萬元學費預備金與5萬元長期投資資金。哪項配置原則最合理？","options":["學費與長期資金合併投資，可提高資產配置效率","學費資金優先保留流動性與本金安全，長期資金再投資","學費先買中長天期債券基金，以利率較高換取穩定收益","學費先投入股票型ETF，一年後賣出即可支付"],"answer":1,"explain":"逐選項解析：（1）兩筆資金用途及時間不同，合併可能讓短期學費暴露於市場波動。；（2）一年後確定要用的10萬元應重視流動性及低波動，5萬元才適合依長期目標配置。；（3）中長天期債券基金有利率風險，價格可能在繳費前下跌。；（4）股票型ETF可分散個股風險，但一年內仍可能出現顯著跌幅。","source":"全民金融通","id":"F027","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"信託與保險","q":"單親家長擔心身故後未成年子女一次取得大筆保險金遭不當使用，希望分期支付教育費。哪項安排最切合需求？","options":["將保險金一次交給指定監護人，並以口頭約定分期支付","評估保險金信託，約定受益人與分期給付條件","改由未成年子女直接一次領取保險金，日後自行管理","指定受益人後不另約定管理條件，由親屬自行協調"],"answer":1,"explain":"逐選項解析：（1）一次交付且只靠口頭承諾，難以確保教育費按期專款使用。；（2）可依實際契約設計保險金進入信託後的受益人、用途及分期給付。；（3）一次領取無法直接滿足避免資金被不當動用及定期支付的目標。；（4）指定受益人與後續資金管理是不同問題，缺少管理條款仍有風險。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F028","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"綜合財務決策","q":"夫妻準備退休，名下有自住房、每月固定收入3萬元、必要支出4.5萬元，子女無法固定支援。哪項做法最合理？","options":["先申請以房養老，等銀行核貸後再估算生活費缺口","先計算每月1.5萬元缺口，評估節流、其他收入與房屋養老方案的成本及居住需求","先賣掉自住房，因為持有房產不會產生現金流","優先投入高配息股票補足1.5萬元缺口，不必調整支出"],"answer":1,"explain":"逐選項解析：（1）尚未確認缺口及貸款成本就申請，可能取得不適合的撥款方案。；（2）每月4.5萬－3萬＝1.5萬元，先量化缺口，再比較節流、收入與房屋融資選項。；（3）出售自宅可能改善資金卻改變居住安排，需與其他方案一起評估。；（4）配息不保證且本金會波動，不能取代對必要支出及現金流的評估。","source":"2026年最新版以房養老講議1027(1)","id":"F029","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融爭議與保險","q":"保戶住院後遭拒賠，保險公司引用「等待期間」條款，但保戶認為業務員投保時未說明。哪項行動最有助於處理爭議？","options":["直接向評議中心申請評議，保單資料可於開庭時再補","保存保單、招攬及醫療紀錄，先向保險公司申訴","先請業務員重新口頭解釋，不必留下書面紀錄","先停繳保費以保留爭議權利，待評議後再恢復"],"answer":1,"explain":"逐選項解析：（1）金融消費爭議原則上應先向金融服務業申訴，且保留證據有助釐清。；（2）保單條款、招攬說明及醫療時點可釐清等待期爭點，先申訴符合程序。；（3）只有口頭溝通難以證明招攬說明與處理時程，應保留紀錄。；（4）擅自停繳可能影響契約效力，與爭議救濟並非同一程序。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F030","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融消費爭議","q":"阿哲發現銀行推銷的投資型保單與原先告知的風險不符。他已向銀行正式申訴，銀行回覆仍未解決爭議。下列後續做法何者較符合金融消費爭議處理程序？","options":["已收到銀行回覆，應先向主管機關請求直接核定損害金額","保留銷售紀錄與申訴回覆，依規定期限向金融消費評議中心申請評議","改向同業公會要求其直接撤銷投資型保單契約","既已申訴，就可不受期限限制隨時申請評議"],"answer":1,"explain":"逐選項解析：（1）主管機關監理與個案評議救濟不同，不能直接視為核定賠償機制。；（2）保留招攬與申訴證據，依規定期間向評議中心申請，是金融消費爭議管道。；（3）同業公會未必具有個案契約撤銷的法定裁決權。；（4）評議申請有法定期間，不能因曾申訴便認為期限無限制。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F031","official":"https://www.foi.org.tw/Article.aspx?Arti=358&Lang=1","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融消費爭議","q":"小美向銀行借款時，被要求同時購買她不需要的金融商品。銀行說「不買就不受理」，但沒有說明兩者關係。她要評估是否有不當銷售，最重要的查核方向是？","options":["只要附加商品有優惠價格，就可視為借款必要條件","確認是否存在不當搭售、資訊揭露不足，以及該要求是否具有合法合理依據","只要借款人已簽名，就不需要再檢視銷售適合度","先比較附加商品預期報酬，報酬高就能合理搭售"],"answer":1,"explain":"逐選項解析：（1）價格優惠與強制搭售是否合理合法是不同問題。；（2）應查明銀行要求購買的依據、是否充分揭露及是否違反公平待客。；（3）簽名不當然消除不當招攬、資訊不對稱或適合度疑義。；（4）商品報酬高低不能代替審查貸款與附加商品是否存在不當連結。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F032","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融消費爭議","q":"投資人發現帳戶遭不明交易，客服先表示系統異常，後來又稱是本人授權。若準備申訴，哪一組資料最能協助釐清爭議？","options":["交易時間與紀錄、授權證據、通知訊息、客服往來紀錄","先向銀行索取交易明細，但刪除手機通知以避免資料外洩","只蒐集交易前後的帳戶餘額，不保留登入與授權紀錄","僅記錄客服電話時間，其他交易紀錄由銀行自行提供"],"answer":0,"explain":"逐選項解析：（1）交易軌跡、授權紀錄與客服回覆可交叉核對是否為本人操作。；（2）刪除通知會流失可核對的時間與授權證據，應安全保存。；（3）餘額能顯示結果，卻不足以辨識授權、設備及交易指令來源。；（4）客服時間有幫助，但仍需交易與授權資料才能釐清爭議。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F033","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"小芳已有足額住院醫療保障，卻因家中主要收入由她負擔，擔心意外身故後家人無法償還房貸。新增保險時應優先評估什麼？","options":["優先增加住院日額險，以增加每次住院的現金補貼","家庭收入中斷風險、負債及扶養責任，再估算適當身故保障缺口","以既有醫療險保額作為身故保障，減少重複保費","先以投資型保單預估收益取代身故保障需求估算"],"answer":1,"explain":"逐選項解析：（1）住院日額主要補貼住院期間支出，不能直接替代身故後家庭長期財務缺口。；（2）應從房貸、扶養責任及收入中斷估算身故保障，再檢視既有保障。；（3）醫療給付與身故給付的保險事故不同，不能將額度直接相加替代。；（4）投資收益不確定，保障缺口應先按家庭責任估算。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F034","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"父親買了實支實付醫療險，住院時使用病房升等與自費醫材，卻以為所有自費支出都能全額理賠。正確的檢核方式是？","options":["先以醫院收據總額申請，再假定保險公司按全額理賠","確認醫療必要性、條款列舉或約定的給付項目、限額及收據等申請條件","只檢查是否住院，病房差額與自費醫材應同一限額處理","先比較兩張保單的總保額，較高者必能理賠全部自費支出"],"answer":1,"explain":"逐選項解析：（1）收據證明支出，不等於每一筆都在承保範圍與限額內。；（2）病房費、醫材及其他醫療費用可能有不同條款、限額與申請要求。；（3）住院事實是必要資訊之一，但不同費用項目與限額須分別核對。；（4）保額高低不能取代條款、除外責任與理賠單據審核。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F035","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"小杰車禍造成對方受傷，也撞壞對方高價攝影器材。他只投保強制汽車責任保險。哪個風險最需要另外評估？","options":["對方財物損失與超出強制險保障範圍的賠償責任","對方攝影器材價值較高，應先向強制險申請財物賠償","只要對方受傷已由強制險處理，其他民事責任也一併終結","可用強制險直接支付自己車輛修理費，無須其他保障"],"answer":0,"explain":"逐選項解析：（1）強制汽車責任保險主要保障交通事故受害人的傷害或死亡，第三人財物損失須另評估。；（2）強制險並非第三人財物損失保險，攝影器材損壞需看其他責任保障。；（3）強制險給付不代表全部民事損害責任必然消失。；（4）自己車輛損失通常不是強制險給付項目，須另看車體險等。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F036","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"學生在投保時隱瞞曾接受的重要治療，認為只要按時繳費，保險公司日後一定要理賠。最適當的提醒是？","options":["若業務員代填告知書，要保人就不必核對內容","只要首期保費已繳，保險人便不得審查投保告知","對要保書詢問事項應據實告知；重要不實告知可能影響契約及理賠","只要隱瞞事項與這次住院無關，任何不實告知都不影響契約"],"answer":2,"explain":"逐選項解析：（1）即使由業務員協助填寫，要保人仍應確認告知內容正確。；（2）保費繳納不代表免除依法告知義務，也不當然排除後續爭議。；（3）對書面詢問的重要事項應據實告知；不實告知的法律效果須依具體法定要件判斷。；（4）不實告知是否影響契約涉及重要性、因果及法定期間等要件，不能一概而論。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F037","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"信託與高齡金融","q":"獨居長者擔心失智後遭人盜領，想保留房租收入作為長期照護費，並希望有定期報告。何種安排最切合目標？","options":["評估安養信託，約定受託管理、給付條件與監督機制","將房租直接匯給家人管理，並以口頭約定每月照護費","以共同帳戶讓親屬自行提領房租，作為長期照護備用金","把所有房租改投入高股息基金，依配息支付照護費"],"answer":0,"explain":"逐選項解析：（1）信託可依契約約定專款用途、給付與管理報告，較符合照護及監督需求。；（2）親屬代管可行性需評估，但單靠口頭約定缺少明確給付及監督制度。；（3）共同帳戶可能方便提領，卻難保證專款專用及定期監督。；（4）配息與本金都可能波動，無法取代有明確給付與監督條件的管理機制。","source":"信託制度與信託2.0整合版","review_status":"待教師逐題確認","id":"F038","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"信託與高齡金融","q":"母親想為成年身障子女保留生活費，擔心一次交付遺產被不當使用。下列何種設計最符合需求？","options":["透過適當信託契約設定分期給付、用途及受益人保障","直接把全部財產換成高槓桿衍生商品","所有款項一次支付給任何聲稱可代管的人","把財產登記在遠親名下，僅以口頭承諾管理"],"answer":0,"explain":"分期給付與用途管理能降低資產一次耗盡風險，仍須考量契約成本與受託義務。","source":"信託制度與信託2.0整合版","review_status":"待教師逐題確認","id":"F039","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"信託與高齡金融","q":"退休夫妻考慮以房養老：希望繼續住在自宅，但子女擔心未來繼承與清償。決策前哪組資訊最關鍵？","options":["認為貸款核准就代表房屋立即由銀行取得所有權","只比較銀行廣告中每月最高可領金額","因為房價可能上漲，所以不用閱讀契約","撥款方式、利息累積、抵押權、到期或身故清償條件及繼承影響"],"answer":3,"explain":"逆向抵押貸款須綜合評估現金流與債務及擔保品風險。","source":"以房養老教學講義","review_status":"待教師逐題確認","id":"F040","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"防制洗錢","q":"公司開戶時，登記負責人說真正出資及決策者在海外，但拒絕提供控制關係文件。銀行應如何處理？","options":["請登記負責人簽切結書即可完全免除審查","把公司帳戶先開好，之後永遠不必更新客戶資料","要求釐清實質受益人及資金用途，未能完成審查時依規定處理","只看公司有沒有營業登記即可開戶"],"answer":2,"explain":"金融機構需進行客戶審查與實質受益人辨識，不能僅看表面登記。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F041","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"防制洗錢","q":"學生把自己的帳戶借給網友收取「代購款」，對方承諾每天支付報酬，還要求提款交付現金。最應注意什麼？","options":["只要有報酬，出借帳戶就一定合法","因為沒有親自詐騙，所以絕對不會涉及任何責任","可能成為詐欺或洗錢金流工具，應拒絕並保存聯繫紀錄","只要對方提供暱稱，就能證明款項合法"],"answer":2,"explain":"交付帳戶控制權及代收代轉不明款項有高度風險。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F042","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"防制洗錢","q":"賣家收到疑似誤匯款，對方急著要求退到第三人帳戶。哪個處理流程最能降低風險？","options":["把款項換成虛擬資產轉出，讓對方更快收到","只要對方傳身分證照片，就不必確認款項來源","先匯到對方指定帳戶再說，避免客訴","透過銀行查證原始款項與退款方式，不依陌生指示轉至第三人帳戶"],"answer":3,"explain":"避免被利用進行金流分層或詐騙，退款應循可信賴金融管道。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F043","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位金融安全","q":"小華收到自稱銀行客服的電話，要求提供一次性驗證碼以解除「異常交易」。他此時最合適的行動是？","options":["停止通話，從銀行官方網站或卡片背面電話自行聯絡查證","將驗證碼提供給對方，因為客服已說出姓名","請對方先匯一元驗證，就可以交出驗證碼","把驗證碼傳到對方提供的社群帳號以留存紀錄"],"answer":0,"explain":"一次性驗證碼常用於授權，不能因來電者知道個資就認定其身分。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F044","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位金融安全","q":"學生在咖啡廳公共 Wi-Fi 登入網銀，瀏覽器出現憑證警告，網站網址也與官方不同。最合理的做法？","options":["停止輸入資料，改用可信網路與官方入口，必要時變更憑證並通報銀行","忽略警告，因為公共 Wi-Fi 一定安全","只要畫面有銀行標誌，就能視為官方網站","把網銀密碼傳給店員協助確認"],"answer":0,"explain":"假網站與連線風險需以網址、憑證及可信入口辨識。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F045","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位金融安全","q":"家長發現孩子手機的支付 App 不明扣款，且帳戶已綁定多張卡片。最優先的處理組合是？","options":["等月底帳單再說，因為電子支付交易一定可無條件撤銷","將驗證碼交給社群自稱退款專員的人","立即停用或鎖定支付工具、聯絡發卡機構查證爭議交易並保留紀錄","先刪除所有交易通知，避免孩子擔心"],"answer":2,"explain":"先止損、通報與保全證據，再依交易類型走爭議程序。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F046","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"綠色金融","q":"某企業宣稱產品「零碳排」，但只計算自家工廠用電，未揭露原料運輸及供應鏈排放。投資人最應質疑什麼？","options":["只要工廠裝太陽能板，就不必揭露其他排放","只要廣告顏色是綠色，就代表已達成淨零","因為公司有 ESG 報告，任何環保主張都自動成立","排放邊界是否完整、是否有第三方查證及是否誤導性宣稱"],"answer":3,"explain":"碳排放範疇及查證邊界影響宣稱可信度，避免漂綠。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F047","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"綠色金融","q":"高排放鋼鐵公司計畫以貸款汰換設備，提出可量測減碳路徑及年度驗證指標。金融機構應如何評估？","options":["只要目前排放高，就必然不可能取得任何轉型金融支持","評估轉型計畫的可信度、資金用途、指標及未達標風險","只要公司自稱綠色，就不必查證","只看企業短期股價漲跌，不必分析排放改善"],"answer":1,"explain":"轉型金融重視可驗證的改善路徑，而非僅依現況或口號判斷。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F048","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"綠色金融","q":"基金廣告稱「投資綠色產業，因此保證獲利且沒有市場風險」。投資人應如何理解？","options":["綠色基金可以忽略費用及投資標的集中度","即使投資永續產業，仍有市場、信用與流動性等風險，不能保證獲利","因為是綠色基金，所以本金一定由政府保障","只要符合 ESG，市場波動就不會影響淨值"],"answer":1,"explain":"永續目標不等於保本或無風險，應看持股、費用與風險揭露。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F049","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"投資與風險","q":"兩名同學都預計一年後繳交學費；甲把全部資金放進高波動股票，乙把必要學費留在低波動高流動性工具。哪個判斷較合理？","options":["甲因為預期報酬較高，所以一定比較安全","乙較符合短期確定支出的資金用途，甲可能在繳費前遭遇市場下跌","只要股票分散到兩檔，就不存在市場風險","兩人的投資期間相同，因此風險承受度必然相同"],"answer":1,"explain":"資產配置要配合資金使用期限、承受損失能力與流動性。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F050","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"投資與風險","q":"投資人買入追蹤同一產業的三檔 ETF，認為「買三檔就是高度分散」。哪個分析較正確？","options":["三檔ETF由不同投信發行，因此產業集中風險已消失","三檔ETF管理費不同，因此持股報酬的相關性會降低","三檔ETF若追蹤不同指數名稱，就不需比對實際成分股","即使有三檔，仍應比對成分股重疊與產業權重"],"answer":3,"explain":"逐選項解析：（1）發行人不同不等於投資標的不同，仍可能持有同一批股票。；（2）管理費影響成本，不會直接改變標的之間的報酬相關性。；（3）指數名稱不同仍可能有高度重疊持股。；（4）分散效果取決於實際曝險與相關性，而非基金檔數。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F051","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"投資與風險","q":"某人借錢投資高槓桿商品，帳面報酬率看似高於借款利率，卻沒有預留追繳保證金的現金。最大盲點是？","options":["以預期年報酬減借款年利率即可衡量全部風險","只要初始保證金足夠，就不用考慮日後追繳","需評估槓桿放大虧損及保證金追繳時的現金需求","借款投資的最大風險僅在於手續費"],"answer":2,"explain":"逐選項解析：（1）平均報酬無法呈現中途大幅回撤及追繳保證金風險。；（2）保證金要求會隨行情變動，初始充足不代表後續不需補繳。；（3）槓桿與強制平倉風險會使資金不足時被迫在不利價格賣出。；（4）交易費用是成本之一，但不足以涵蓋槓桿與流動性風險。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F052","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"利率與債券","q":"小明持有固定票息長期債券，市場利率突然上升。他想立即賣出，應注意什麼？","options":["發行人未違約，提前賣出通常可取得票面本金","市場利率上升時，固定票息債券的市價通常也上升","固定票息債券市價通常下降，長存續期間更敏感","固定票息債券的票息會隨市場殖利率即時調整"],"answer":2,"explain":"逐選項解析：（1）到期償還與提前市價賣出不同，提前出售可能有資本損失。；（2）新發債券提供較高殖利率時，舊券價格通常需要下調才具競爭力。；（3）殖利率與固定票息債券價格通常反向變動，長存續期間敏感度較高。；（4）固定票息通常依契約不變，變動的是市場價格與到期殖利率。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F053","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"利率與債券","q":"投資人認為「債券基金有配息，所以本金完全不會跌」。最適當的反駁是？","options":["配息率高代表該基金持有債券的信用評等較高","應同時看配息與淨值變化，並評估利率及信用風險","配息可以直接視為投資人額外增加的總資產","月配息能降低基金持有債券的違約機率"],"answer":1,"explain":"逐選項解析：（1）配息率無法直接推論持債信用品質。；（2）總報酬須把配息與淨值漲跌合併評估，債券基金仍承擔風險。；（3）除息後淨值通常會相應調整，配息不等於憑空增加財富。；（4）配息頻率不會改變發行人的償債能力。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F054","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"利率與債券","q":"兩檔債券基金信用評等相近，但 A 存續期間約 2 年，B 約 10 年。若預期市場殖利率可能快速上升，哪個判斷較合理？","options":["信用評等相近時，兩基金的利率敏感度也必然相同","存續期間較短的A，在升息時通常承受較大的價格波動","B存續期間較長，因此殖利率上升時較容易有資本利得","其他條件相近時，B對殖利率上升的價格跌幅通常較大"],"answer":3,"explain":"逐選項解析：（1）信用風險與利率風險是不同構面。；（2）較短存續期間通常意味利率敏感度較低。；（3）較長存續期間通常放大升息帶來的價格跌幅，而非利得。；（4）存續期間衡量價格對殖利率變動的敏感度，B約10年高於A約2年。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F055","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"就學貸款","q":"學生畢業後尚未找到穩定工作，擔心就學貸款開始還款。他最合理的處理方式是？","options":["向代辦繳費，以取得免還款保證","等銀行主動通知違約後，再討論還款計畫","將貸款轉成循環信用，以延後所有成本","主動查詢承貸銀行的緩繳、展延與申請資格"],"answer":3,"explain":"逐選項解析：（1）私人代辦無法保證依法免除就學貸款。；（2）拖延可能增加逾期與信用風險，應在期限前確認。；（3）以高成本循環信用替代學貸，可能使負擔惡化。；（4）應依實際制度與個人條件確認可申請措施，並注意期限。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F056","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"就學貸款","q":"同學收到「教育部補助結清就學貸款」簡訊，要求點擊短網址、輸入銀行密碼與簡訊驗證碼。哪個處理最妥當？","options":["不點連結，改由銀行或主管機關官方網站與電話核實","先登入簡訊連結，若畫面正常再輸入驗證碼","回覆簡訊要求對方出示公文照片後即可提供密碼","把簡訊轉給同學請他先測試連結是否安全"],"answer":0,"explain":"逐選項解析：（1）短網址與索取密碼、OTP是警訊，應走獨立官方管道查證。；（2）偽造網站也可能外觀正常，輸入驗證碼可能授權交易。；（3）公文圖片可能偽造，不能據此交付密碼。；（4）轉傳可疑連結讓他人測試，反而擴大風險。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F057","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"就學貸款","q":"家長想替學生支付學費，考慮就學貸款或刷卡分期。哪個比較方式最完整？","options":["比較適用利率、費用、還款期限與家庭每月現金流","以兩方案每月最低付款額直接判斷總成本","先比較刷卡回饋，將其他費用留待簽約後確認","只比較借款名目利率，忽略分期手續費與提前清償條件"],"answer":0,"explain":"逐選項解析：（1）完整比較須涵蓋總成本、付款時點、資格與家庭承受能力。；（2）低月付可能來自拉長年限，總費用反而增加。；（3）回饋未必抵得過分期費用及違約成本。；（4）名目利率不含所有費用，可能誤判實際負擔。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F058","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"理專倫理","q":"理專建議高齡客戶將全部退休存款換成高風險商品，理由是「近期漲很多」。最重要的缺失是？","options":["高齡者應完全避免任何具有價格波動的商品","過去一年績效最佳者通常最適合退休族","應先確認風險承受度、流動性與退休現金流需求","只要商品風險揭露文件很長，就代表已完成適合度評估"],"answer":2,"explain":"逐選項解析：（1）是否適合須看個人財務與需求，不能僅以年齡一概排除。；（2）短期績效不能代替對風險與資金需求的評估。；（3）將全部退休金集中高風險商品，忽略生活支出與風險承受能力。；（4）形式上的揭露不等於已了解客戶並確認商品適合。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F059","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"理專倫理","q":"客戶長期旅居海外，要求理專保管印鑑、密碼並代下單。哪個做法較符合內控原則？","options":["口頭同意即可由理專長期保管客戶密碼","可交給另一名員工保管，以降低理專個人責任","可用客戶私人通訊軟體傳送密碼，留下紀錄即可","應拒絕私下保管密碼或代操，改走合規授權程序"],"answer":3,"explain":"逐選項解析：（1）客戶口頭同意不能取代內控與資安要求。；（2）將密碼交其他員工同樣增加憑證外洩風險。；（3）通訊留痕不等於可合法或安全傳送密碼。；（4）正式授權與身分驗證程序可降低未授權交易及利益衝突。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F060","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"理專倫理","q":"銀行推出複雜結構型商品，理專只展示最高可能報酬，沒有說明最差情境及提前贖回限制。何者最值得關注？","options":["只揭露最高可能報酬，客戶可自行推測最差情境","應完整揭露可能損失、提前退出限制及適合度資訊","只要商品通過銀行內部審查，便可略過個別風險說明","提前贖回條件僅影響流動性，不影響投資決策"],"answer":1,"explain":"逐選項解析：（1）僅呈現最好情境，無法讓投資人理解下檔風險。；（2）報酬、損失情境及退出限制都可能影響決策，需充分說明。；（3）商品內部審查不能取代對客戶的適當揭露。；（4）流動性與可能的提前退出損失是重要投資條件。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F061","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合財務規劃","q":"家庭每月收入 8 萬元，必要支出 5 萬元，信用卡循環利息負擔高，卻打算先借錢投入高波動商品。最合理的財務優先順序是？","options":["先借款投資，再用預期獲利處理循環信用","維持循環信用，只需把投資分散到多檔ETF","優先處理高成本負債與預備金，再規劃風險投資","先降低每月必要支出到零，再決定是否還款"],"answer":2,"explain":"逐選項解析：（1）投資報酬不確定，不能當作償還高息債的保證。；（2）分散投資不會消除信用卡循環利息負擔。；（3）優先處理確定的高利息成本與流動性需求，通常更穩健。；（4）必要支出不可能任意歸零，應做可行的收支調整。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F062","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合財務規劃","q":"學生存下 6 萬元，半年後要繳 4 萬元學費，另有 2 萬元可長期投資。哪個配置最符合用途？","options":["將學費與長期投資資金平均配置於高波動基金","先確保半年後學費可動用，再評估剩餘資金長期投資","將六萬元全部放入有提前解約費的長期商品","因有半年時間，學費資金可承受與退休金相同風險"],"answer":1,"explain":"逐選項解析：（1）短期確定支出不宜以高波動投資承擔資金缺口風險。；（2）四萬元有明確半年用途，應重視本金穩定及流動性。；（3）提前解約成本可能妨礙按期繳費。；（4）半年與長期投資期限不同，承受波動能力也不同。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F063","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合財務規劃","q":"退休者持有大量單一公司股票，每月靠賣股支付生活費。若股市連續下跌，最值得事前處理的問題是？","options":["分散單一公司風險，並預留可支付生活費的流動資金","提高單一股票比重，以避免下跌時賣出太多股數","只需估計股票長期平均報酬，不必安排短期現金流","改用股票質押支付所有生活費，即可消除市場風險"],"answer":0,"explain":"逐選項解析：（1）集中持股及下跌時被迫賣股，可能形成退休提領順序風險。；（2）加重集中可能放大公司特有風險。；（3）平均報酬無法保證每月支出時點有足夠資金。；（4）股票質押仍有利息與擔保品追繳風險。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F064","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"金融科技","q":"兩家銀行數位帳戶提供不同活存優惠：甲僅在指定額度內有高利率，乙利率略低但限制較少。學生要存緊急預備金，最適合怎麼比較？","options":["按實際存款額度計算利息，並比較期限、限制及提領便利","以廣告最高利率直接乘全部存款，忽略優惠額度上限","只比較銀行名稱，因同一類數位帳戶利率相同","只看開戶贈品，緊急提領條件可等需要時再查"],"answer":0,"explain":"逐選項解析：（1）緊急預備金應兼顧實得利息、優惠條件及可即時使用性。；（2）超過優惠上限的部分可能適用較低利率。；（3）各銀行數位帳戶的優惠與條件不同。；（4）贈品不能取代對流動性與提領限制的評估。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F065","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"金融科技","q":"小王把錢從銀行帳戶轉到電子支付帳戶，誤以為所有電子支付餘額都與銀行存款享有完全相同的存款保險。應如何判斷？","options":["區分銀行存款與電子支付款項，查明各自保管與保障制度","電子支付業者若與銀行合作，餘額即全部轉為個人銀行存款","電子支付款項可轉帳，所以與定存享有相同保障","只要支付業者受監理，就等同適用存款保險上限"],"answer":0,"explain":"逐選項解析：（1）法律性質與保障制度應分別確認，不可直接把支付餘額視為存款。；（2）合作銀行與使用者對支付業者的債權性質不一定相同。；（3）能否轉帳不是判斷存款保險適用的標準。；（4）受監理不代表該款項必然是存保承保的存款。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F066","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"金融科技","q":"有人在社群宣稱「去中心化金融商品由智慧合約執行，因此完全沒有風險」。哪個判斷最合理？","options":["智慧合約可自動執行，因此不必檢查資產價格風險","區塊鏈記錄可追溯，因此能保證每筆交易可撤銷","去中心化降低部分中介依賴，也同步排除治理風險","仍須評估程式漏洞、價格波動、預言機與治理風險"],"answer":3,"explain":"逐選項解析：（1）自動執行不會消除標的價格波動。；（2）鏈上可追溯與交易可撤銷是不同概念。；（3）沒有傳統中介不代表沒有協議治理或權限風險。；（4）智慧合約與外部資料、治理及資產本身都可能帶來損失。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F067","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"家庭同時面臨房貸寬限期結束、長輩照護費增加及投資虧損。若只能先做一項財務檢視，哪個最能幫助後續決策？","options":["先估算房屋市價，再假設所有支出可以延後","先增加投資槓桿，以彌補帳面虧損","先辦新信用貸款，暫不盤點原有每月負債","先編列未來12個月收支與還款表，再判斷缺口"],"answer":3,"explain":"逐選項解析：（1）房屋價值不能直接顯示每月能否負擔房貸與照護費。；（2）加槓桿可能擴大虧損，未釐清現金流前不宜先做。；（3）新增貸款可能使負擔增加，應先掌握現金流。；（4）同時盤點寬限期後月付與照護費，才能判斷資金缺口及處置順序。","source":"財務規劃、以房養老、信託講義","review_status":"待教師逐題確認","id":"F068","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"學生打算投資一檔標榜 ESG 的海外債券基金，需兩年後支付留學費用。基金以外幣計價且有提前買回費。哪個評估最完整？","options":["因標榜ESG，基金可視為沒有匯率風險","配息率高於學費成長率，便可確保兩年後本金足夠","應同時檢查匯率、債券風險、買回成本及兩年期限","基金以外幣計價，因此可直接鎖定兩年後台幣學費金額"],"answer":2,"explain":"逐選項解析：（1）ESG標示不代表免除外幣與市場風險。；（2）配息率不是保證報酬，也無法排除淨值下跌。；（3）短期確定用途須綜合衡量價格、匯率與退出費用。；（4）外幣基金的台幣價值仍受匯率波動影響。","source":"綠色金融、金融商品分類與費用講義","review_status":"待教師逐題確認","id":"F069","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"退休者想以房養老補充生活費，同時設安養信託管理撥款。子女認為兩者只能擇一。哪個分析較合理？","options":["設立安養信託後，以房養老借款利息即可免除","以房養老與安養信託都只能提供一次性現金","信託管理人必須無償承擔以房養老所有還款責任","可分別評估以房養老現金流與安養信託的資金管理功能"],"answer":3,"explain":"逐選項解析：（1）信託安排不會自動消除貸款利息或其他成本。；（2）以房養老可能分期撥款，信託則重在財產管理與給付安排。；（3）信託契約不代表受託人無條件承擔借款人債務。；（4）兩者目的不同，是否搭配需依契約、費用與家庭需求評估。","source":"以房養老、信託制度講義","review_status":"待教師逐題確認","id":"F070","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"公司推出「保本高收益」虛擬資產商品，要求投資人匯款到個人帳戶，還宣稱有國際金融專家背書。最合理的處置？","options":["查核合法性、交易對象及資金流向，警惕保證高收益與私人收款帳戶","只要有專家照片，就可以相信保本承諾","先投入全部積蓄，賺錢後再確認是否合法","因為使用虛擬資產，所以沒有詐騙風險"],"answer":0,"explain":"保證高報酬與不明收款管道都是警訊，需多重查證。","source":"防詐、金融科技與理專倫理講義","review_status":"待教師逐題確認","id":"F071","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"綜合決賽題","q":"家長希望為未成年子女存教育基金，卻同時接到假冒銀行的高利優惠簡訊。哪個決策最符合金融安全與資產規劃？","options":["先提供 OTP 以保留名額，之後再確認","先透過官方管道查證優惠，再依教育費用期限評估流動性與風險","把所有教育基金轉到陌生人的私人帳戶","因為是替孩子存錢，所以任何高利商品都安全"],"answer":1,"explain":"先辨識詐騙，再做符合用途的資產安排。","source":"數位安全、財務規劃講義","review_status":"待教師逐題確認","id":"F072","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"綜合決賽題","q":"投資人看到基金今年報酬率 8%，但支付一次性申購費，基金另有持續費用；同年物價上漲 3%。要判斷購買力是否增加，應採用什麼順序？","options":["直接把名目報酬 8% 當成實質淨報酬","先估算扣除相關費用後的投資結果，再考慮通膨調整購買力","只看基金配息率，不必看淨值與費用","因為物價上漲，投資報酬必定為負"],"answer":1,"explain":"淨報酬需考慮投資費用，實質報酬再考慮物價變化。","source":"金融商品費用與財務規劃講義","review_status":"待教師逐題確認","id":"F073","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"貸款成本與借款決策","q":"大學生想買電腦，A方案零利率卻有一次性帳管費，B方案收利息但免帳管費；兩者期數相同。應如何選擇？","options":["只比較廣告上最醒目的最低利率","因為有銀行核准就代表不必衡量還款能力","將全部帳管費及利息列入同一期間總支出，再比較可負擔性","認為所有附加費用都可忽略"],"answer":2,"explain":"判斷關鍵：應以相同條件比較實際總費用、還款現金流與風險，不能只看單一廣告數字。 本題應採取「將全部帳管費及利息列入同一期間總支出，再比較可負擔性」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F074","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"貸款成本與借款決策","q":"家庭考慮信貸整合卡債，銀行提出較低月付但還款期限延長一倍。應先查什麼？","options":["只要有優惠贈品就應優先申貸","計算延長期限後總利息與手續費，確認是否真的降低成本","選擇每月付款最低者，完全不看總還款","先簽約再決定是否能負擔"],"answer":1,"explain":"判斷關鍵：應以相同條件比較實際總費用、還款現金流與風險，不能只看單一廣告數字。 本題應採取「計算延長期限後總利息與手續費，確認是否真的降低成本」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F075","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"貸款成本與借款決策","q":"某銀行宣稱首三個月超低利率，之後恢復機動利率。借款人最應評估什麼？","options":["認為所有附加費用都可忽略","以優惠結束後的利率與可能升息情境測試整期負擔","只比較廣告上最醒目的最低利率","因為有銀行核准就代表不必衡量還款能力"],"answer":1,"explain":"判斷關鍵：應以相同條件比較實際總費用、還款現金流與風險，不能只看單一廣告數字。 本題應採取「以優惠結束後的利率與可能升息情境測試整期負擔」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F076","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"貸款成本與借款決策","q":"甲銀行核貸快但收提前清償違約金，乙銀行利率略高卻可隨時還款。準備半年後獲獎金的上班族怎麼選？","options":["只要有優惠贈品就應優先申貸","選擇每月付款最低者，完全不看總還款","先簽約再決定是否能負擔","將預計提前還款時間與違約金納入總成本比較"],"answer":3,"explain":"判斷關鍵：應以相同條件比較實際總費用、還款現金流與風險，不能只看單一廣告數字。 本題應採取「將預計提前還款時間與違約金納入總成本比較」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F077","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"貸款成本與借款決策","q":"小店主借營運週轉金，貸款月付雖低，卻要求旺季結束時一次還大筆本金。應先確認什麼？","options":["認為所有附加費用都可忽略","因為有銀行核准就代表不必衡量還款能力","編製各月現金流，確認到期本金有穩定償還來源","只比較廣告上最醒目的最低利率"],"answer":2,"explain":"判斷關鍵：應以相同條件比較實際總費用、還款現金流與風險，不能只看單一廣告數字。 本題應採取「編製各月現金流，確認到期本金有穩定償還來源」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F078","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"貸款成本與借款決策","q":"學生以分期購買手機，業者把服務費拆到每月帳單，標示利率為零。應如何判斷？","options":["先簽約再決定是否能負擔","選擇每月付款最低者，完全不看總還款","把所有必要費用加總，辨識零利率是否等於零融資成本","只要有優惠贈品就應優先申貸"],"answer":2,"explain":"判斷關鍵：應以相同條件比較實際總費用、還款現金流與風險，不能只看單一廣告數字。 本題應採取「把所有必要費用加總，辨識零利率是否等於零融資成本」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F079","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"貸款成本與借款決策","q":"家長替子女貸款，銀行要求連帶保證。家長最需要評估哪個後果？","options":["只比較廣告上最醒目的最低利率","因為有銀行核准就代表不必衡量還款能力","了解保證責任範圍及主債務人未還款時自身可能承擔的負擔","認為所有附加費用都可忽略"],"answer":2,"explain":"判斷關鍵：應以相同條件比較實際總費用 ,"q":"學生買三檔科技ETF，發現前十大持股高度重疊。應如何調整風險判斷？","options":["把配息率直接當作總報酬率","因為名稱有ETF就認為本金受保障","只挑手續費最高的產品當作最安全","把重疊持股視為集中曝險，重新評估分散效果"],"answer":3,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「把重疊持股視為集中曝險，重新評估分散效果」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F102","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"ETF與基金費用","q":"某高股息ETF配息增加但淨值下降，廣告只展示配息率。投資人應看什麼？","options":["忽略持股重疊及匯率","只比較配息次數","同時檢視淨值變動、配息來源及含息總報酬","只看最近一個月績效"],"answer":2,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「同時檢視淨值變動、配息來源及含息總報酬」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F103","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"ETF與基金費用","q":"兩檔基金，一檔申購費高而經理費低，另一檔相反。長期投資者應如何比較？","options":["把配息率直接當作總報酬率","只挑手續費最高的產品當作最安全","因為名稱有ETF就認為本金受保障","依預計持有期間加總一次性與持續性費用"],"answer":3,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「依預計持有期間加總一次性與持續性費用」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F104","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"ETF與基金費用","q":"投資人買海外ETF，原幣報酬為正，但換回新臺幣後虧損。應如何理解？","options":["忽略持股重疊及匯率","將匯率變化及換匯成本納入本幣實際報酬","只看最近一個月績效","只比較配息次數"],"answer":1,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「將匯率變化及換匯成本納入本幣實際報酬」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F105","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"ETF與基金費用","q":"市場大跌時ETF折溢價突然擴大，學生想立即市價買入。應先確認什麼？","options":["把配息率直接當作總報酬率","因為名稱有ETF就認為本金受保障","檢查即時淨值參考、買賣價差與委託價格風險","只挑手續費最高的產品當作最安全"],"answer":2,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「檢查即時淨值參考、買賣價差與委託價格風險」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F106","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"ETF與基金費用","q":"一檔債券ETF每月配息，投資人認為沒有利率風險。應如何判斷？","options":["檢視存續期間、信用風險及淨值可能波動","忽略持股重疊及匯率","只看最近一個月績效","只比較配息次數"],"answer":0,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「檢視存續期間、信用風險及淨值可能波動」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F107","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"ETF與基金費用","q":"投資人追逐去年報酬最高的主題基金，未查看投資組合。最重要的補充分析是？","options":["把配息率直接當作總報酬率","只挑手續費最高的產品當作最安全","因為名稱有ETF就認為本金受保障","確認基金集中度、投資策略與自身風險承受度"],"answer":3,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「確認基金集中度、投資策略與自身風險承受度」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F108","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"ETF與基金費用","q":"學生準備每月小額投資，某基金設有最低申購金額與贖回費。應先做什麼？","options":["只比較配息次數","忽略持股重疊及匯率","確認申購門檻、費用與預計用錢時間是否相容","只看最近一個月績效"],"answer":2,"explain":"判斷關鍵：基金投資要綜合比較標的、風險、一次性及持續性費用、買賣價差與投資期間。 本題應採取「確認申購門檻、費用與預計用錢時間是否相容」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F109","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"阿姨在同一家要保銀行有活存與定存，合計超過保障上限。最合理的管理方式是？","options":["認為任何金融商品都自動享有存款保險","認為外幣帳戶一定沒有任何匯率風險","只看廣告利率不確認機構資格","確認同一銀行各存款合計受保障範圍，必要時分散至其他要保機構"],"answer":3,"explain":"存款保險保障同一存款人在同一家要保機構之本外幣存款本金及利息合計最高300萬元。超額部分不在最高保額內；可依流動性與資金需求考慮分散至不同要保機構，並查證要保資格。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F110","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"家庭把緊急預備金全部買入銀行銷售的基金，以為等同銀行存款。應如何修正認知？","options":["區分基金與存款的法律性質及保障機制","把所有不同銀行存款一律合併成單一保障額度","因為有政府監理就不必保留存款紀錄","把存款保險當成投資保本承諾"],"answer":0,"explain":"基金是投資商品，即使由銀行銷售或保管，也不是銀行存款，不受存款保險保障。應依緊急預備金用途優先評估本金波動與變現時間。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F111","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"學生收到高利存款廣告，網站卻無法確認是否為要保機構。應先做什麼？","options":["認為外幣帳戶一定沒有任何匯率風險","認為任何金融商品都自動享有存款保險","向官方機構名錄查證金融機構身分及商品性質","只看廣告利率不確認機構資格"],"answer":2,"explain":"高利率廣告不能替代存款保障查證。應向中央存保官方管道確認該機構是否為要保機構，並辨識產品究竟是存款、基金或其他投資商品。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F112","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"小店主將營業週轉金放入長天期定存，提前解約會影響利息。應如何規劃？","options":["把所有不同銀行存款一律合併成單一保障額度","按預計付款時間分層安排流動資金與定存期限","因為有政府監理就不必保留存款紀錄","把存款保險當成投資保本承諾"],"answer":1,"explain":"判斷關鍵：須分辨要保機構、受保障存款種類與每人在同一要保機構的保障上限，並兼顧流動性。 本題應採取「按預計付款時間分層安排流動資金與定存期限」。其他選項忽略關鍵限制或風險。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F113","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"父親在同一家銀行以本人名義開多個帳戶，認為每戶都各有一份最高存保額度。應如何說明？","options":["只看廣告利率不確認機構資格","以同一存款人在同一要保機構合計計算保障，而非按帳戶數計算","認為任何金融商品都自動享有存款保險","認為外幣帳戶一定沒有任何匯率風險"],"answer":1,"explain":"存保以「存款人＋同一家要保機構」合併計算，不以帳戶數或分行數計算。即使同名有多個活存、定存或外幣存款，合計最高保障仍為新臺幣300萬元（含本金及利息）。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F114","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"某家庭有新臺幣與外幣存款，將來要支付新臺幣醫療費。最需要同時評估什麼？","options":["把存款保險當成投資保本承諾","兼顧存保計算、匯率波動及需要用錢時的換匯風險","把所有不同銀行存款一律合併成單一保障額度","因為有政府監理就不必保留存款紀錄"],"answer":1,"explain":"本外幣存款均可納入同一要保機構最高300萬元存保額度，但外幣存款還有匯率風險。若確定要支付新臺幣醫療費，須兼顧可立即動用的臺幣金額及匯率變化。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F115","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"學生把錢放進支付App儲值餘額，認為與銀行定存保障完全相同。應先辨認什麼？","options":["只看廣告利率不確認機構資格","認為外幣帳戶一定沒有任何匯率風險","認為任何金融商品都自動享有存款保險","確認支付餘額法律性質、資金保管方式與適用保障"],"answer":3,"explain":"不能把支付App的所有餘額一概視為銀行定存。中央存保官方FAQ指出「要保機構兼營電子支付業務所收取之儲值款項」有其特定保障方式；不同支付機構及商品的法律關係須先辨識，不可直接套用存款保險結論。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F116","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"一名退休者只追求最高定存利率，把全部存款放入單一機構。應如何評估？","options":["把存款保險當成投資保本承諾","同時查核要保資格、保障額度、提款需求及集中風險","把所有不同銀行存款一律合併成單一保障額度","因為有政府監理就不必保留存款紀錄"],"answer":1,"explain":"即使銀行利率高，仍應查明是否為要保機構、存款種類與最高保障範圍。存保上限按同一存款人、同一家要保機構本外幣存款本息合計300萬元計算；亦應保留可動用資金。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F117","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"存款保險與資金安全","q":"家庭準備半年後支付手術費，銀行推薦有提前退出限制的投資商品。應如何選擇？","options":["優先保留可隨時使用的必要醫療資金，避免流動性不足","認為外幣帳戶一定沒有任何匯率風險","只看廣告利率不確認機構資格","認為任何金融商品都自動享有存款保險"],"answer":0,"explain":"判斷關鍵：須分辨要保機構、受保障存款種類與每人在同一要保機構的保障上限，並兼顧流動性。 本題應採取「優先保留可隨時使用的必要醫療資金，避免流動性不足」。其他選項忽略關鍵限制或風險。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F118","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"退休者每月領固定年金，物價連續上升。最需要重新評估什麼？","options":["忽略稅費及實際消費籃子","只看名目金額增加","認為利息收入一定高於通膨","估計固定年金未來購買力下降對生活預算的影響"],"answer":3,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「估計固定年金未來購買力下降對生活預算的影響」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F119","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"學生存下五萬元，兩年後要買筆電，預估售價可能上漲。應如何設定儲蓄目標？","options":["把去年物價漲幅視為未來保證值","只比較存款帳戶的名稱","以預期未來價格而非今天售價估算需要存下的金額","因為資產上漲就不必估算未來支出"],"answer":2,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「以預期未來價格而非今天售價估算需要存下的金額」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F120","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"投資帳面報酬率為正，但同期物價漲幅更高。應如何判斷？","options":["只看名目金額增加","計算扣除通膨影響後的實質購買力變化","認為利息收入一定高於通膨","忽略稅費及實際消費籃子"],"answer":1,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「計算扣除通膨影響後的實質購買力變化」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F121","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"家庭薪資調漲百分之二，生活必要支出卻增加更多。最合理的財務分析是？","options":["比較收入與支出漲幅，檢視實質可支配所得是否縮水","把去年物價漲幅視為未來保證值","因為資產上漲就不必估算未來支出","只比較存款帳戶的名稱"],"answer":0,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「比較收入與支出漲幅，檢視實質可支配所得是否縮水」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F122","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"某銀行提供固定利率定存，投資人想知道五年後能買多少商品。應如何評估？","options":["忽略稅費及實際消費籃子","比較定存到期金額與預估物價水準，不只看利息數字","認為利息收入一定高於通膨","只看名目金額增加"],"answer":1,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「比較定存到期金額與預估物價水準，不只看利息數字」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F123","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"學生想以股票長期抗通膨，卻把三個月後要用的學費也投入。應如何調整？","options":["區分長期抗通膨投資與短期必要支出的資金期限","因為資產上漲就不必估算未來支出","把去年物價漲幅視為未來保證值","只比較存款帳戶的名稱"],"answer":0,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「區分長期抗通膨投資與短期必要支出的資金期限」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F124","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"某企業營收成長，但原物料與薪資成本上漲更快。分析獲利能力應看什麼？","options":["認為利息收入一定高於通膨","只看名目金額增加","忽略稅費及實際消費籃子","比較營收增幅與成本變動後的實質利潤"],"answer":3,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「比較營收增幅與成本變動後的實質利潤」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F125","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"家庭規劃十年後退休，直接以今天每月生活費乘以退休年數。最需要補充什麼？","options":["只比較存款帳戶的名稱","估計退休後各年支出受通膨影響的金額","把去年物價漲幅視為未來保證值","因為資產上漲就不必估算未來支出"],"answer":1,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「估計退休後各年支出受通膨影響的金額」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F126","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"通膨與購買力","q":"有人認為黃金或虛擬資產一定能在每次通膨期間保值。應如何判斷？","options":["檢視價格波動、持有成本與歷史不確定性，避免保證性推論","只看名目金額增加","認為利息收入一定高於通膨","忽略稅費及實際消費籃子"],"answer":0,"explain":"判斷關鍵：應區分名目報酬、扣費後報酬與實質購買力，並考量不同時間點的資金用途。 本題應採取「檢視價格波動、持有成本與歷史不確定性，避免保證性推論」。其他選項忽略關鍵限制或風險。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F127","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"退休現金流與長壽風險","q":"退休夫妻預估生活費可負擔二十年，但其中一人家族長壽。應如何補強計畫？","options":["只看每月配息而忽略本金波動","把預期股票報酬當成保證收入","只看退休當天的存款餘額","模擬更長退休期間與醫療支出，預留長壽風險緩衝"],"answer":3,"explain":"判斷關鍵：退休規劃應綜合預期支出、資產流動性、長壽風險、照護與市場波動。 本題應採取「模擬更長退休期間與醫療支出，預留長壽風險緩衝」。其他選項忽略關鍵限制或風險。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F128","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"退休現金流與長壽風險","q":"退休者每月固定提款，第一年市場大跌。最需要管理什麼？","options":["假設退休後醫療費用一定為零","把唯一住處視為可立即無成本變現","認為活得越久就越不必規劃","規劃短期現金緩衝，降低低點賣出資產的順序風險"],"answer":3,"explain":"判斷關鍵：退休規劃應綜合預期支出、資產流動性、長壽風險、照護與市場波動。 本題應採取「規劃短期現金緩衝，降低低點賣出資產的順序風險」。其他選項忽略關鍵限制或風險。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F129","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"退休現金流與長壽風險","q":"家庭退休金主要來自單一出租房屋，遇到空租就沒有收入。應如何改善？","options":["把預期股票報酬當成保證收入","只看每月配息而忽略本金波動","只看退休當天的存款餘額","建立租金中斷準備金並評估其他收入來源"],"answer":3,"explain":"判斷關鍵：退休規劃應綜合預期支出、資產流動性、長壽風險、照護與市場波動。 本題應採取「建立租金中斷準備金並評估其他收入來源」。其他選項忽略關鍵限制或風險。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F130","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"退休現金流與長壽風險","q":"父母即將退休，但仍有房貸餘額。決定退休日期前應先做什麼？","options":["認為活得越久就越不必規劃","將退休後收入、房貸月付及必要支出整合成現金流試算","假設退休後醫療費用一定為零","把唯一住處視為可立即無成本變現"],"answer":1,"explain":"判斷關鍵：退休規劃應綜合預期支出、資產流動性、長壽風險、照護與市場波動。 本題應採取「將退休後收入、房貸月付及必要支出整合成現金流試算」。其他選項忽略關鍵限制或風險。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F131","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"退休現金流與長壽風險","q":"退休者想提高收益，準備將全部存款換成高配息基金。應先確認什麼？","options":["只看每月配息而忽略本金波動","把預期股票報酬當成保證收入","只看退休當天的存款餘額","分析基金淨值風險與配息來源，避免把配息誤認為保證收入"],"answer":3,"explain":"判斷關鍵：退休規劃應綜合預期支出、資產流動性、長壽風險、照護與市場波動。 本題應採取「分析基金淨值風險與配息來源，避免把配息誤認為保證收入」。其他選項忽略關鍵限制或風險。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F132","quality_review":"待 寫，待官方法規及教師審核","id":"F143","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"債券與利率變動","q":"市場傳出降息預期，投資人認為長債一定會立即上漲。最重要的提醒是？","options":["只比較債券名稱不看期限","市場價格可能已反映預期，仍須考慮實際利率及風險變化","把央行升息視為所有舊債券價格上漲","只看票面利率不看買入價格"],"answer":1,"explain":"判斷關鍵：固定利率債券價格通常與市場殖利率反向，須同時評估存續期間、信用與流動性。 本題應採取「市場價格可能已反映預期，仍須考慮實際利率及風險變化」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F144","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"債券與利率變動","q":"兩檔債券基金存續期間相近，但一檔持有低評等公司債。應注意什麼？","options":["認為不同信用評等的違約風險相同","比較信用曝險與違約可能性，不能只看利率風險","認為所有債券永遠保本且可隨時面額賣出","因為債券有配息就忽略淨值波動"],"answer":1,"explain":"判斷關鍵：固定利率債券價格通常與市場殖利率反向，須同時評估存續期間、信用與流動性。 本題應採取「比較信用曝險與違約可能性，不能只看利率風險」。其他選項忽略關鍵限制或風險。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F145","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"保險需求與保障缺口","q":"單親家長是家庭唯一收入來源，已有醫療險卻無身故保障。應優先評估什麼？","options":["只選保費最低而不看保障範圍","假設任何事故都不受除外責任限制","認為有醫院收據就必然全額理賠","估算扶養責任與債務形成的壽險保障缺口"],"answer":3,"explain":"判斷關鍵：保險應先辨認事故風險、保障範圍、除外責任、限額與家庭負擔，不能僅看保費。 本題應採取「估算扶養責任與債務形成的壽險保障缺口」。其他選項忽略關鍵限制或風險。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F146","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"保險需求與保障缺口","q":"學生騎機車撞傷路人又撞壞對方手機，只保強制險。應先辨認什麼？","options":["以投資收益取代所有必要保障","區分人身傷害給付與財物損失責任，評估不足的保障","只聽銷售口頭保證不看條款","把不同保險商品視為完全可互相替代"],"answer":1,"explain":"判斷關鍵：保險應先辨認事故風險、保障範圍、除外責任、限額與家庭負擔，不能僅看保費。 本題應採取「區分人身傷害給付與財物損失責任，評估不足的保障」。其他選項忽略關鍵限制或風險。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F147","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"保險需求與保障缺口","q":"家長想替孩子投保，但保費預算有限。應如何安排順序？","options":["只選保費最低而不看保障範圍","先盤點家庭主要風險及必要保障，再選適合的保單","認為有醫院收據就必然全額理賠","假設任何事故都不受除外責任限制"],"answer":1,"explain":"判斷關鍵：保險應先辨認事故風險、保障範圍、除外責任、限額與家庭負擔，不能僅看保費。 本題應採取「先盤點家庭主要風險及必要保障，再選適合的保單」。其他選項忽略關鍵限制或風險。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F148","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"保險需求與保障缺口","q":"被保險人住院使用自費醫材，以為實支實付保單全部會賠。應如何查證？","options":["只聽銷售口頭保證不看條款","把不同保險商品視為完全可互相替代","核對契約給付項目、限額、必要性及申 。其他選項忽略關鍵限制或風險。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F204","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"洗錢防制與客戶審查","q":"境外公司股權結構層層交叉，開戶時只提供最上層公司名稱。銀行應如何處理？","options":["把可疑交易訊息公開通知交易對手","追查實際控制與受益關係，確認必要身分資訊","認為老客戶永遠不用更新資料","以公司營業額代替實質受益人辨識"],"answer":1,"explain":"判斷關鍵：金融機構需辨識客戶及實質受益人、了解交易目的，對異常金流依規定審查處理。 本題應採取「追查實際控制與受益關係，確認必要身分資訊」。其他選項忽略關鍵限制或風險。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F205","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"洗錢防制與客戶審查","q":"客戶資料多年未更新，交易用途已由薪資轉為商業收款。應怎麼辦？","options":["只要出示名片就免除所有審查","要求行員替客戶編造交易用途","因為交易金額分散就一定合法","依規定更新客戶資料並重新評估交易風險"],"answer":3,"explain":"判斷關鍵：金融機構需辨識客戶及實質受益人、了解交易目的，對異常金流依規定審查處理。 本題應採取「依規定更新客戶資料並重新評估交易風險」。其他選項忽略關鍵限制或風險。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F206","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"洗錢防制與客戶審查","q":"新開戶者要求行員替他填寫不實職業以提高額度。行員應如何回應？","options":["認為老客戶永遠不用更新資料","以公司營業額代替實質受益人辨識","把可疑交易訊息公開通知交易對手","拒絕填報不實資料，依程序核實身分與職業資訊"],"answer":3,"explain":"判斷關鍵：金融機構需辨識客戶及實質受益人、了解交易目的，對異常金流依規定審查處理。 本題應採取「拒絕填報不實資料，依程序核實身分與職業資訊」。其他選項忽略關鍵限制或風險。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F207","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"洗錢防制與客戶審查","q":"有人要求銀行員告知自己是否被申報可疑交易。行員應如何處理？","options":["要求行員替客戶編造交易用途","因為交易金額分散就一定合法","遵循保密與法定程序，不任意揭露受限制資訊","只要出示名片就免除所有審查"],"answer":2,"explain":"判斷關鍵：金融機構需辨識客戶及實質受益人、了解交易目的，對異常金流依規定審查處理。 本題應採取「遵循保密與法定程序，不任意揭露受限制資訊」。其他選項忽略關鍵限制或風險。","source":"防制洗錢20261019；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F208","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"數位帳戶宣稱高利率，但只適用前五萬元。學生準備存二十萬元。應如何比較？","options":["只看優惠利率不看適用額度","依各級距利率計算實際可得利息及限制條件","把OTP傳給自稱客服的人","把所有支付餘額視為定期存款"],"answer":1,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「依各級距利率計算實際可得利息及限制條件」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F209","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"支付App突然出現陌生交易，持有人還能登入。應先做什麼？","options":["在不明連結直接輸入網銀密碼","忽略交易通知與扣款紀錄","立即鎖定支付工具、聯絡機構並保存交易紀錄","認為有銀行標誌的網站一定真實"],"answer":2,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「立即鎖定支付工具、聯絡機構並保存交易紀錄」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F210","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"學生收到銀行升級簡訊，短網址要求輸入帳密。應如何查證？","options":["改從官方App或自行輸入官方網址確認","把所有支付餘額視為定期存款","把OTP傳給自稱客服的人","只看優惠利率不看適用額度"],"answer":0,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「改從官方App或自行輸入官方網址確認」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F211","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"電子支付餘額與銀行活存被朋友視為完全相同。應如何判斷？","options":["忽略交易通知與扣款紀錄","認為有銀行標誌的網站一定真實","在不明連結直接輸入網銀密碼","查明不同資金法律性質與適用保管保障機制"],"answer":3,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「查明不同資金法律性質與適用保管保障機制」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F212","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"未成年人想開數位帳戶，網友說任何人都可不經法定程序開戶。應如何處理？","options":["只看優惠利率不看適用額度","向銀行確認未成年開戶資格、法定代理人及身分驗證要求","把所有支付餘額視為定期存款","把OTP傳給自稱客服的人"],"answer":1,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「向銀行確認未成年開戶資格、法定代理人及身分驗證要求」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F213","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"家長替孩子綁定多張卡到手機支付，卻未設定交易提醒。應如何改善？","options":["啟用即時通知與適當額度限制，定期核對交易","忽略交易通知與扣款紀錄","在不明連結直接輸入網銀密碼","認為有銀行標誌的網站一定真實"],"answer":0,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「啟用即時通知與適當額度限制，定期核對交易」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F214","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"手機遺失且已登入銀行App，持有人只想等找到手機。應如何降低損失？","options":["把所有支付餘額視為定期存款","把OTP傳給自稱客服的人","只看優惠利率不看適用額度","立即聯絡銀行採取帳戶或裝置安全措施並變更必要憑證"],"answer":3,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「立即聯絡銀行採取帳戶或裝置安全措施並變更必要憑證」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F215","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"學生在公共Wi-Fi登入網銀，網頁跳出憑證錯誤。應如何處理？","options":["認為有銀行標誌的網站一定真實","忽略交易通知與扣款紀錄","在不明連結直接輸入網銀密碼","停止輸入敏感資料，改用可信連線及官方入口"],"answer":3,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「停止輸入敏感資料，改用可信連線及官方入口」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F216","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"數位帳戶與支付安全","q":"支付平台推出先買後付，學生只看到零頭期款。應如何比較？","options":["只看優惠利率不看適用額度","把OTP傳給自稱客服的人","把所有支付餘額視為定期存款","確認總付款、遲繳費用、信用影響及還款能力"],"answer":3,"explain":"判斷關鍵：數位金融應查核身分、授權、費率與帳戶性質，妥善管理驗證碼與異常交易。 本題應採取「確認總付款、遲繳費用、信用影響及還款能力」。其他選項忽略關鍵限制或風險。","source":"金融一點通；金融科技筆記","review_status":"情境改寫，待官方法規及教師審核","id":"F217","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"金融科技與虛擬資產","q":"學生看到智能合約標榜自動執行，便認為程式絕不會有漏洞。應如何評估？","options":["把虛擬資產當作法定存款","因為有區塊鏈就認為一定保本","查核程式安全、權限設定與執行條件風險","只看社群推薦而不查資金去向"],"answer":2,"explain":"判斷關鍵：新科技可能降低部分交易摩擦，但不能消除市場、詐騙、技術、託管與法規風險。 本題應採取「查核程式安全、權限設定與執行條件風險」。其他選項忽略關鍵限制或風險。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F218","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"金融科技與虛擬資產","q":"某交易平台承諾固定高收益，要求轉幣至私人錢包。應如何判斷？","options":["只因使用人工智慧就免除風險管理","把智慧合約視為不可能出錯","警覺保證收益與資產轉移風險，查核平台及交易對象","認為交易不可逆等於可以自動退款"],"answer":2,"explain":"判斷關鍵：新科技可能降低部分交易摩擦，但不能消除市場、詐騙、技術、託管與法規風險。 本題應採取「警覺保證收益與資產轉移風險，查核平台及交易對象」。其他選項忽略關鍵限制或風險。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F219","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"金融科技與虛擬資產","q":"投資人遺失虛擬資產私鑰，認為客服必能幫忙找回。應注意什麼？","options":["把虛擬資產當作法定存款","只看社群推薦而不查資金去向","理解私鑰保管與不可逆轉移可能造成資產無法取回","因為有區塊鏈就認為一定保本"],"answer":2,"explain":"判斷關鍵：新科技可能降低部分交易摩擦，但不能消除市場、詐騙、技術、託管與法規風險。 本題應採取「理解私鑰保管與不可逆轉移可能造成資產無法取回」。其他選項忽略關鍵限制或風險。","source":"金融科技影片筆記；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F220","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"金融科技與虛擬資產","q":"銀行使用AI審核貸款，某族群長期遭異常拒絕。應關注什麼？","options":["檢視資料偏誤、公平性、可解釋性與申訴管道" ain":"現股當沖的優惠稅率不是所有同日交易自動適用。依臺灣證交所資料，符合規定的股票現股當沖賣出證交稅為0.15%，一般股票賣出為0.3%；須先確認適用標的、交易型態與優惠期限。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F294","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"兩檔基金報酬相近，但一檔有遞延銷售手續費。應如何比較？","options":["把所有商品交易稅率視為完全相同","把申購手續費視為每年經理費","認為所有ETF與股票費用完全相同","按預計持有與買回時間估算實際費用"],"answer":3,"explain":"判斷關鍵：比較商品應依適用交易類型與現行規定核算稅費、費率及實際淨報酬。 本題應採取「按預計持有與買回時間估算實際費用」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F295","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"學生以為基金經理費只在買入時支付一次。應如何查核？","options":["只比較稅前報酬","只看券商折扣而忽略交易次數","不查適用交易類型就套用稅率","確認經理費等持續性費用的計提方式與淨值反映"],"answer":3,"explain":"判斷關鍵：比較商品應依適用交易類型與現行規定核算稅費、費率及實際淨報酬。 本題應採取「確認經理費等持續性費用的計提方式與淨值反映」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F296","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"某人買進股票後隔日賣出，價差小於總交易費。應如何判斷？","options":["把所有商品交易稅率視為完全相同","扣除買賣手續費與適用交易稅後計算實際損益","認為所有ETF與股票費用完全相同","把申購手續費視為每年經理費"],"answer":1,"explain":"淨損益不是只看股價差額。股票買賣通常均有券商手續費，賣出另有適用證交稅；若價差不足支付全部成本，即使賣價高於買價，實際仍可能虧損。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F297","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"投資人比較債券ETF與直接買債券，卻只看票息。應如何改善？","options":["只比較稅前報酬","同時評估費用、流動性、信用及利率風險","只看券商折扣而忽略交易次數","不查適用交易類型就套用稅率"],"answer":1,"explain":"判斷關鍵：比較商品應依適用交易類型與現行規定核算稅費、費率及實際淨報酬。 本題應採取「同時評估費用、流動性、信用及利率風險」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F298","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"某基金配息高，但申購與買回費也高。應如何衡量？","options":["比較扣費後含息總報酬與投資期限","把申購手續費視為每年經理費","認為所有ETF與股票費用完全相同","把所有商品交易稅率視為完全相同"],"answer":0,"explain":"判斷關鍵：比較商品應依適用交易類型與現行規定核算稅費、費率及實際淨報酬。 本題應採取「比較扣費後含息總報酬與投資期限」。其他選項忽略關鍵限制或風險。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F299","quality_review":"待逐題強化干擾選項及官方核對"},{"topic":"稅費與金融商品比較","q":"學生在兩家券商交易同額股票，折扣不同但最低收費也不同。應如何選擇？","options":["只比較稅前報酬","只看券商折扣而忽略交易次數","依實際每筆金額估算應付手續費而非只看折扣比例","不查適用交易類型就套用稅率"],"answer":2,"explain":"券商手續費費率可依交易金額、折扣與最低收費而不同。應按「實際每筆交易金額 × 適用費率」並考量最低收費估算，不能僅憑宣傳折扣比較。一般股票賣出還須計入0.3%證交稅。","source":"金融商品費用20261021；金融商品分類整理20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F300","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F301","topic":"存保與資產配置","q":"父親在A銀行活存120萬、定存140萬、外幣存款折合80萬，另有A銀行銷售的基金60萬；B銀行存款50萬。假設均為國內要保機構且不計利息，何者正確？","options":["A銀行全部400萬都算存保","A銀行存款最高保障300萬，基金不計入；B銀行另計","A銀行因外幣存款而全部失去保障","A、B銀行合計最高保障300萬"],"answer":1,"explain":"正解：A銀行存款340萬，存保上限300萬；基金不是存款；B銀行50萬另計。\n其他選項：選項1把基金誤當存款；選項3誤認外幣不受存保；選項4把不同要保機構合併","source":"中央存保與金融商品分類","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","concept":"存保歸戶+商品辨識","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F302","topic":"存保與流動性","q":"小芳有三個月後須支付的手術費220萬元。她在同一銀行已有定存260萬元，打算將手術費也放入同銀行，且希望兼顧存保與隨時動用。最適合先做什麼？","options":["將全部轉為同銀行長期定存以提高利率","先核對要保機構、合計保額及提前解約條件，必要時分散並保留活存","改買同銀行推薦的基金，因銀行銷售即可受存保","將存款分成十個同銀行帳戶，各帳戶享300萬元"],"answer":1,"explain":"正解：存保以同一存款人、同一要保機構歸戶，手術費還有短期流動性需求。\n其他選項：選項1忽略到期時間；選項3混淆投資與存款；選項4誤以帳戶數增加保障","source":"中央存保與財務規劃","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","concept":"保障額度+流動性","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F303","topic":"金融消費爭議","q":"阿偉向銀行申訴基金銷售說明不實，銀行第18天回覆拒絕退款。他收到回覆後想申請金融消費評議，何者最合理？","options":["須等銀行申訴滿30天才可申請","可自收到處理結果起60日內提出評議並附證據","必須先打贏民事官司才能申請","評議中心可直接判定業務員犯罪"],"answer":1,"explain":"正解：不接受金融服務業申訴處理結果者，得於收到結果起60日內申請評議，不必再等到第30天。\n其他選項：選項1混淆回覆與逾期；選項3誤加前置條件；選項4混淆評議與刑事司法","source":"金融消費爭議處理","official":"https://law.fsc.gov.tw/LawContent.aspx?id=GL000331","concept":"申訴回覆+60日","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F304","topic":"金融消費爭議","q":"小林4月1日提出金融消費申訴，銀行至5月1日仍未回覆。小林已保存掛號收據及商品說明書。下一步何者較符合程序？","options":["向評議中心申請評議並提出未回覆證據","繼續無限期等待銀行","要求評議中心先凍結所有銀行帳戶","直接把申訴當成法院勝訴判決"],"answer":0,"explain":"正解：金融業者逾30日未處理時，可在期限屆滿日起60日內申請評議。\n其他選項：選項2忽略法定救濟期限；選項3超出評議權限；選項4混淆程序與判決","source":"金融消費爭議處理","official":"https://law.fsc.gov.tw/LawContent.aspx?id=GL000331","concept":"申訴逾期+證據","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F305","topic":"交易成本比較","q":"小儒同日分別賣出一般上市股票10萬元與一般股票型ETF 10萬元，不計手續費，依一般適用稅率，兩筆證交稅合計多少？","options":["300元","400元","200元","500元"],"answer":1,"explain":"正解：股票賣出0.3%為300元，股票型ETF賣出0.1%為100元，合計400元。\n其他選項：選項1漏算ETF；選項3將稅率混淆；選項4多計費用","source":"金融商品費用","official":"https://www.twse.com.tw/zh/about/company/guide.html","concept":"股票與ETF賣出稅","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F306","topic":"交易成本比較","q":"甲持有一般股票與債券ETF各20萬元，近期需變現10萬元，假設兩者市價波動與手續費相同，且符合現行債券ETF免徵證交稅規定。僅比較證交稅，哪項正確？","options":["賣一般股票與債券ETF的證交稅相同","賣債券ETF的證交稅較低，但仍應檢查優惠期限","債券ETF須按0.3%課稅","股票賣出免證交稅，債券ETF課0.1%"],"answer":1,"explain":"正解：一般股票賣出0.3%，符合規定的債券ETF在現行優惠期間免徵；優惠有期限，不可當永久規則。\n其他選項：選項1忽略商品差異；選項3套用股票稅率；選項4將稅率倒置","source":"金融商品費用","official":"https://www.twse.com.tw/zh/about/company/guide.html","concept":"ETF稅費+時效","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F307","topic":"投資組合與流動性","q":"高三學生預計八個月後繳交海外交換費12萬元，現有15萬元，另有長期投資部位。最合宜的規劃是？","options":["將12萬元全投入波動較高的單一產業ETF","先將近期確定支出留在低波動且可動用工具，餘額再評估投資","只要ETF長期平均報酬為正，八個月後就不會虧","借信用卡循環額度支付交換費以保留投資"],"answer":1,"explain":"正解：確定且短期的負債需優先匹配資金到期與流動性；長期投資資金才能承擔較高波動。\n其他選項：選項1資產期限錯配；選項3將長期統計誤當短期保證；選項4以高成本負債增加風險","source":"財務規劃與ETF","official":"","concept":"資產負債期限配對","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F308","topic":"ETF持股重疊","q":"小安同時買了台灣大型股ETF、科技產業ETF及高股息ETF，發現前三大成分股高度重疊。最需要修正的認知是？","options":["ETF檔數增加不一定代表分散效果同比增加","應查看底層持股及產業權重","可以評估跨產業及跨資產類別的風險來源","三檔ETF名稱不同，風險必然互不相關"],"answer":3,"explain":"正解：名稱與策略不同不代表底層曝險獨立；應穿透查看成分股與產業集中度。\n其他選項：選項1是正確風險認知；選項2是合理查核方式；選項3是合理分散方向","source":"投資與資產配置","official":"","concept":"底層曝險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F309","topic":"家庭負債與保險","q":"雙薪家庭每月可支配收入9萬元，房貸4萬元、托育2萬元、生活費2萬元，只有1個月預備金。業務員建議先加碼長期高保費儲蓄型保單。何者較合理？","options":["先檢視緊急預備金、必要保障及繳費持續能力","只比較保單宣告利率","只要保單可解約，便可當作等同活存","房貸與托育固定支出不影響保費負擔"],"answer":0,"explain":"正解：家庭每月剩餘現金流僅1萬元且預備金不足，應先確保必要保障與資金彈性。\n其他選項：選項2忽略費用與流動性；選項3忽略解約成本與風險；選項4忽略現金流約束","source":"保險與財務規劃","official":"","concept":"現金流+保費可負擔","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F310","topic":"保險理賠與舉證","q":"阿成手術前查詢醫療險，業務員口頭說「一定會賠」，但保單對特定手術有給付條件。事故後發生爭議，哪種作法最完整？","options":["僅以業務員口頭說明作為唯一依據","保存投保及說明紀錄，核對條款、診斷書與給付項目，再循申訴程序","在社群貼文後即視為保險公司同意理賠","只要有醫院收據，任何費用都能全額理賠"],"answer":1,"explain":"正解：理賠需依契約、實際醫療資料及適用給付條件判斷；銷售說明爭議也要保全證據。\n其他選項：選項1證據不完整；選項3社群發文無契約效果；選項4忽略保障範圍與限額","source":"保險完整講義與金融消費爭議","official":"","concept":"條款+證據+救濟","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F311","topic":"信託與照護","q":"獨居長者希望房租每月優先支付照護機構、其餘再給付生活費，且家人不得任意一次提領。哪個安排較能達成目的？","options":["在契約中明確約定信託財產、受益人、給付順位及監督機制","把所有租金現金交給最親近的親戚","直接指定銀行理專持有提款卡及密碼","以購買單一股票代替支付約定"],"answer":0,"explain":"正解：信託可用契約建立財產管理、受益給付與監督安排，但需評估費用及實務執行。\n其他選項：選項2欠缺可稽核機制；選項3有帳戶安全與倫理風險；選項4無法穩定匹配照護支出","source":"信託2.0與高齡金融","official":"","concept":"信託契約設計","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F312","topic":"以房養老","q":"退休者想申辦以房養老，每月領款用於生活，但擔心未來升息及到期清償。哪個問題最值得簽約前向銀行確認？","options":["貸款利率、利息累積、撥款方式及到期清償條件","銀行大廳是否有專屬櫃檯","房價過去十年漲幅能否保證未來","子女是否願意替銀行做廣告"],"answer":0,"explain":"正解：逆向抵押貸款仍是借款，須確認利息、契約期限、房屋擔保與清償安排。\n其他選項：選項2不影響主要財務風險；選項3過去房價不保證未來；選項4與契約無關","source":"以房養老講義","official":"","concept":"逆向抵押現金流","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F313","topic":"防詐與洗錢","q":"二手交易買家匯入比售價多3萬元，稱轉錯帳請賣家把差額轉至另一人帳戶。賣家尚未寄貨。何者風險控制較佳？","options":["確認入帳後立即依買家指定帳戶退款","保留交易紀錄，向銀行查證來源並循正式退款程序","先把款項換成虛擬通貨再返還","要求買家傳自拍照即可證明款項合法"],"answer":1,"explain":"正解：第三方帳戶退款可能被用於詐欺金流分層；應透過金融機構查核與處理。\n其他選項：選項1可能協助異常資金移轉；選項3加深資金追查困難；選項4身分照片無法確認資金來源","source":"防制洗錢與帳戶安全","official":"","concept":"第三方退款","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F314","topic":"防詐與家庭財務","q":"家長收到孩子通訊軟體訊息，要求立即匯款8萬元支付醫療費，並稱手機壞了不能通話。最適當的第一步是？","options":["透過既有電話或其他獨立管道核實身分與醫療資訊","依訊息附上的帳號先匯一半","要求對方再傳一張模糊病歷即可匯款","把網銀驗證碼傳給對方確認親屬關係"],"answer":0,"explain":"正解：急迫性與無法通話是常見社交工程警訊，應以原有可信管道獨立查證。\n其他選項：選項2仍可能受騙；選項3文件可偽造且未獨立驗證；選項4會暴露帳戶控制資訊","source":"金融詐騙與帳戶安全","official":"","concept":"獨立回撥驗證","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F315","topic":"數位支付與風險","q":"學生手機遺失，內有已登入的支付App及銀行App。學生能借到另一支手機，最優先的處置組合為何？","options":["只刪除社群媒體貼文","立即聯繫金融機構停用或限制相關服務、變更憑證並檢查交易","等月底帳單出來再處理","將密碼傳給同學請其代為登入測試"],"answer":1,"explain":"正解：應優先降低未授權交易風險並保全異常交易證據。\n其他選項：選項1未處理金融權限；選項3延誤止損；選項4增加憑證外洩","source":"數位金融與防詐","official":"","concept":"設備遺失應變","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F316","topic":"虛擬資產與資安","q":"投資人使用去中心化金融平台時，錢包跳出「無限額授權代幣支出」要求。何者判斷較周全？","options":["先查核合約與授權範圍，避免為小額交易給予不必要的無限授權","只要畫面有鎖頭圖示即可放心","授權不涉及資產控制，與安全無關","只要平台承諾高收益就不需查看交易內容"],"answer":0,"explain":"正解：智能合約授權可能讓合約在授權範圍內轉移資產，需審視地址、權限及可撤銷性。\n其他選項：選項2圖示不足以證明合約安全；選項3誤解授權效果；選項4把收益宣稱當安全證據","source":"金融科技與虛擬資產","official":"","concept":"智能合約授權","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F317","topic":"ESG與漂綠","q":"某企業宣稱「2050淨零」，但只公布辦公室節電成果，未揭露主要製程排放與減碳路徑。投資人最應要求哪項資訊？","options":["涵蓋重大排放來源的基準年、範疇、階段目標與查證資料","企業標誌是否改成綠色","廣告中出現多少棵樹","高階主管是否常參加環保活動"],"answer":0,"explain":"正解：減碳可信度取決於重大排放涵蓋、可衡量目標、執行進度及可驗證資訊。\n其他選項：選項2屬視覺宣傳；選項3無法代替排放數據；選項4不足以衡量減碳成果","source":"綠色金融與淨零轉型","official":"","concept":"重大性與可驗證性","r
