<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融決賽手機線上測驗｜300題建置版</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f2f5fa;color:#18283b;margin:0}.wrap{max-width:760px;margin:auto;padding:22px}header{background:#102c4b;color:white;padding:24px;border-radius:16px}h1{font-size:1.6rem;margin:0 0 8px}.panel{background:white;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 3px 18px #1232}.muted{color:#63758b}.opt{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:white;padding:15px;border-radius:10px;margin:10px 0;font-size:1rem;cursor:pointer;line-height:1.5}.opt:hover{border-color:#2366ac}.opt.selected{background:#dbeafe;border-color:#2563eb}.primary{background:#145ea8;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:1rem;cursor:pointer}button:disabled{opacity:.5}select{padding:10px;font-size:1rem}.hidden{display:none}.review{padding:14px;border-top:1px solid #ddd}.correct{color:#087341}.wrong{color:#ba2929}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}</style><meta name="description" content="金融知識競賽決賽手機測驗，20題隨機抽題，練習模式立即顯示正確答案與解析，決賽模式20秒限時。"></head><body><div class="wrap"><header><h1>金融知識競賽｜決賽應用題</h1><div>進階應用建置版 · 300 題題庫 · 每回隨機 20 題</div></header><section id="start" class="panel"><p>本版收錄30題進階原創情境題及270題參數化應用練習題，共300題。已核對部分官方制度；參數化題型仍需教師審題，尚非正式定稿或官方題庫。</p><p>模式：<select id="mode"><option value="practice">練習模式（不限時）</option><option value="timed">決賽模擬（每題20秒）</option></select></p><button class="primary" onclick="begin()">開始測驗</button></section><section id="quiz" class="panel hidden"><div class="meta"><span id="counter"></span><span id="timer"></span></div><h2 id="question"></h2><div id="options"></div><div class="meta"><button class="primary" onclick="prev()">上一題</button><button class="primary" onclick="next()">下一題</button><button class="primary" onclick="submitQuiz()">交卷／看成績</button></div></section><section id="result" class="panel hidden"><h2 id="score"></h2><p class="muted">以下列出每題答案、講義依據與解析。</p><div id="reviews"></div><button class="primary" onclick="location.reload()">重新抽題</button></section></div><script>const BANK=[{"topic":"貸款成本","q":"甲貸10萬元、1年後一次還本，年息3%、開辦費3000元；乙同條件年息4%、免開辦費。若不考慮其他費用，哪項判斷最合理？","options":["甲利率較低，必定較省","甲總成本6000元，比乙多2000元","乙利率較高，總成本一定較高","甲乙總成本相同"],"answer":1,"explain":"甲利息3000元加開辦費3000元＝6000元；乙利息4000元。這是簡化總成本比較，不等於正式APR。","source":"金融商品費用20261021","id":"F001"},{"topic":"房貸規劃","q":"家庭每月可支配收入6萬元，房貸前2年月付2萬元、第3年起預估2.8萬元，另每月管理與維修費5000元。下列哪個規劃最完整？","options":["只用前兩年月付金評估","以2.8萬元加5000元評估，並預留利率上升緩衝","以房價上漲預期支付未來月付","只要有頭期款即可忽略持有費"],"answer":1,"explain":"後續月付與持有成本合計約3.3萬元，占可支配收入55%；還應考量利率變動及緊急預備金。","source":"金融商品費用20261021","id":"F002"},{"topic":"投資成本","q":"小庭以每股50元買入1000股股票，之後以51元賣出。忽略券商折扣，買賣各收0.1425%手續費，賣出另課0.3%證交稅。最接近的損益為？","options":["賺1000元","賺約704元","賺約775元","虧約296元"],"answer":1,"explain":"價差1000元；買進手續費71.25、賣出72.675、證交稅153元，淨利約703元（實際收費依券商規定）。","source":"金融商品費用20261021","id":"F003"},{"topic":"基金費用","q":"兩檔基金投資相似資產，A申購手續費低但每年經理費較高，B申購費較高但每年經理費較低。若預計長期持有，最適當的比較是？","options":["只看申購當下費用","只看去年報酬","估計持有期間總費用及風險，並確認費用如何反映淨值","只看配息頻率"],"answer":2,"explain":"長期持有會累積經理費等持續費用，須與一次性費用合併評估；歷史績效不能保證未來。","source":"金融商品費用20261021","id":"F004"},{"topic":"存款保險","q":"阿杰在同一要保銀行有新臺幣活存180萬元、定存100萬元、外幣存款折合60萬元，另在另一家要保銀行存款80萬元。假設不計利息，哪項判斷正確？","options":["所有銀行合併最高只保300萬元","第一家340萬元全數受保障","第一家最高保障300萬元，第二家另依其額度保障","外幣存款完全不受存保保障"],"answer":2,"explain":"每一存款人在同一要保機構本金及利息合計最高保障新臺幣300萬元；不同要保機構分別計算，外幣存款也計入。","source":"金融商品分類整理20261021","id":"F005"},{"topic":"防詐與帳戶","q":"網拍賣家收到一筆「重複匯款」，買家要求將款項退到與原匯款人不同的帳戶，並催促立刻處理。最安全的做法？","options":["直接退到指定帳戶避免客訴","要求對方傳身分證照片就可退款","先與銀行核實交易並循銀行協助的退款程序","先提領現金交給買家"],"answer":2,"explain":"須防範利用錯誤匯款情境洗錢或詐騙；透過銀行查證並處理可降低風險。","source":"防制洗錢20261019","id":"F006"},{"topic":"KYC與防洗錢","q":"某公司開戶時，登記負責人表示自己只是掛名，真正決定資金用途的人不願揭露。銀行最應如何處理？","options":["只驗登記負責人即可","查明實質受益人與控制關係，未能完成審查時依規定處理","請公司提供營業額即可免查","由行員代填控制人資料"],"answer":1,"explain":"CDD需辨識實質受益人與實際控制人，不能只核對表面登記資訊。","source":"防制洗錢20261019","id":"F007"},{"topic":"理專十誡","q":"理專稱客戶長期出國，可替其保管存摺、印鑑與網銀密碼，並定期代為交易。何種判斷最適當？","options":["客戶書面同意即無風險","僅保管印鑑不違規","涉及代客保管敏感物品及代客操作，應拒絕並循正式授權管道","只要交易獲利即可接受"],"answer":2,"explain":"理專十誡限制代客保管及代客操作，避免挪用與未授權交易；不能以熟識或方便為由忽略。","source":"2026年最新版教學講義_理專十誡與警示帳戶(2)","id":"F008"},{"topic":"信託與照護","q":"高齡父親有房租收入，但擔心失能後親屬擅用資金；希望每月支付照護費並定期查核。哪個方案最切合需求？","options":["將全部現金交給照護者自行管理","設計安養信託，約定支付條件與受託人管理機制","購買高波動股票期待高報酬","把房屋無條件贈與親屬"],"answer":1,"explain":"安養信託可依契約規劃財產管理與照護給付；仍須評估費用、受益安排及受託人義務。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F009"},{"topic":"以房養老","q":"退休夫妻自有住房、現金流不足，希望繼續居住，子女擔心房屋立刻歸銀行所有。哪項說明最合理？","options":["申貸後銀行立即取得房屋所有權","以房養老通常以房屋抵押取得分期貸款，仍有利息與到期清償問題","撥款是政府無償年金","任何房屋都能貸到市價100%"],"answer":1,"explain":"逆向抵押貸款通常仍由屋主持有產權，以房屋設定抵押；核貸、利息、撥款及清償依契約。","source":"2026年最新版以房養老講議1027(1)","id":"F010"},{"topic":"退休現金流","q":"退休者每月生活費4萬元、固定退休收入2.6萬元，手上存款168萬元，忽略利息及通膨。若不改變支出，存款可填補缺口多久？","options":["約5年","約10年","約12年","約20年"],"answer":1,"explain":"每月缺口1.4萬元，168萬÷1.4萬＝120個月＝10年；實際還須納入通膨、醫療與投資風險。","source":"2026年最新版以房養老講議1027(1)","id":"F011"},{"topic":"保險保障","q":"學生出國前僅投保基本旅平險，旅途中因一般疾病住院。何項判斷最適當？","options":["旅平險一定賠所有疾病住院","須檢視是否附加海外突發疾病醫療及相關條款","只要有登機證就必定理賠","旅遊不便險必定支付住院費"],"answer":1,"explain":"基本旅平險以意外身故或失能為核心，海外突發疾病醫療需確認是否有相關保障與限制。","source":"2026年最新版保險完整教學講義(2)","id":"F012"},{"topic":"醫療險理賠","q":"阿芸持有兩張新制實支實付醫療保單，同一次住院自付醫療費8萬元。她認為可向兩家各領8萬元。何項說明最恰當？","options":["一定可領16萬元","新制強調損害填補，實際給付依條款及適用規範，不能假設雙倍領取","只要收據影本就能領雙倍","實支實付只理賠住院天數"],"answer":1,"explain":"2024年7月起新制重視損害填補及差額分攤，舊契約與個別條款另須判斷。","source":"2026年最新版保險完整教學講義(2)","id":"F013"},{"topic":"責任保險","q":"餐飲店同時發生兩件事：顧客因餐點污染受傷、店家自有冷藏設備故障。若投保適當公共意外責任險，何項較合理？","options":["兩者都是第三人責任損失","顧客損害可能涉及第三人責任，自有設備損壞通常非該責任險保障","自有設備損壞優先由責任險支付","沒有過失也一定全額賠償"],"answer":1,"explain":"責任保險重點在依法應負的第三人賠償責任，自有財產損失通常應另評估財產保險；仍依保單條款。","source":"2026年最新版保險完整教學講義(2)","id":"F014"},{"topic":"金融爭議","q":"小美發現銀行貸款收費與契約說明不一致，先向銀行申訴，但銀行30日內未妥善處理。下一步何者較符合制度？","options":["直接要求中央銀行退費","依適用期限向金融消費評議中心申請評議","只能在社群平台留言","立即要求銀行停業"],"answer":1,"explain":"金融消費爭議原則上先向金融服務業申訴，符合條件時可再向評議中心申請評議，應留意申請期限。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F015"},{"topic":"就學貸款","q":"阿宏想借學貸就讀大學，預估畢業後月薪3.2萬元、房租1萬元、生活費1.4萬元，另有學貸還款。何項評估最完整？","options":["只看能否取得貸款","只比較大學排名","估算畢業後可支配現金流、還款負擔及收入不確定性","認為寬限期代表免還款"],"answer":2,"explain":"學貸需結合就學成本、未來工作收入、必要支出與還款條件評估，寬限與緩繳並非免除債務。","source":"2026年最新版教學講義_就學貸款(2)","id":"F016"},{"topic":"就學貸款","q":"畢業生遇到短期失業，考慮申請「只繳息不還本」。哪項風險最值得提醒？","options":["只繳息期間本金通常不下降，總利息可能增加","申請後本金自動減半","只繳息代表銀行放棄債權","任何人都可永久不還本金"],"answer":0,"explain":"只繳息可暫時減輕現金流壓力，但本金未減少，需估計未來還款與累計利息。","source":"2026年最新版教學講義_就學貸款(2)","id":"F017"},{"topic":"綠色金融","q":"鋼鐵廠目前排放高，但提出逐年減排、設備投資、第三方驗證與明確里程碑；另一企業只宣稱「100%永續」卻無數據。哪個判斷合理？","options":["高排放企業永遠不能取得轉型融資","有可信減碳路徑的高排放企業可能符合轉型金融精神","只要寫永續就等於綠色金融","轉型金融不需追蹤成果"],"answer":1,"explain":"轉型金融重視高排放產業具可信、可衡量的減碳計畫；空泛宣稱則有漂綠疑慮。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F018"},{"topic":"碳排放範疇","q":"飲料公司自有鍋爐燃氣、購買台電電力，另委外運輸產品。依溫室氣體盤查概念，哪項配對正確？","options":["鍋爐範疇二、外購電範疇一","鍋爐範疇一、外購電範疇二、委外運輸通常範疇三","三者都是範疇一","委外運輸一定屬範疇二"],"answer":1,"explain":"直接燃燒排放屬範疇一，外購能源間接排放屬範疇二，價值鏈其他間接排放如委外運輸通常屬範疇三。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F019"},{"topic":"投資風險","q":"小恩投資三檔都追蹤台灣科技股的ETF，認為「買三檔就完全分散風險」。最適合的提醒？","options":["三檔必定消除市場風險","雖有多檔，持股可能高度重疊，仍受同產業與市場風險影響","ETF沒有管理費","只要長期持有就保證獲利"],"answer":1,"explain":"分散效果取決於實際資產與風險來源，數量多不等於風險充分分散。","source":"金融商品分類整理20261021","id":"F020"},{"topic":"利率與債券","q":"央行為抑制通膨而升息，投資人持有固定票面利率的既有債券。若其他條件不變，哪項影響較合理？","options":["市場利率上升，既有固定利率債券價格通常承壓","債券價格一定上漲","票面利率會自動變成新市場利率","升息可消除債券違約風險"],"answer":0,"explain":"市場利率上升時，舊債券固定票息相對不具吸引力，價格通常下跌；仍有信用與流動性風險。","source":"金融商品分類整理20261021","id":"F021"},{"topic":"實質報酬","q":"某基金一年由10萬元成長為10.6萬元，期間物價上漲4%。忽略費稅，投資人的實質報酬率最接近多少？","options":["約2%","約6%","約10%","約-4%"],"answer":0,"explain":"名目報酬6%；精確實質報酬=(1.06/1.04)-1≈1.92%，約2%，不是直接把6%當購買力增加。","source":"金融商品分類整理20261021","id":"F022"},{"topic":"緊急預備金","q":"小宇每月必要支出2.5萬元，已有活存5萬元，另持有高波動股票20萬元。他希望至少準備6個月緊急預備金。哪項規劃最合理？","options":["已持有股票20萬元，不需額外現金","將流動且低波動預備金提高至約15萬元，尚差約10萬元","全部買進高槓桿商品加速達標","以信用卡循環額度取代預備金"],"answer":1,"explain":"必要支出2.5萬元×6＝15萬元，現有活存5萬元，尚缺10萬元；高波動投資不宜完全取代緊急備用資金。","source":"全民金融通","id":"F023"},{"topic":"支付科技","q":"網購平台代收買方款項、確認收貨後撥給賣方；另一持牌業者可提供儲值與用戶間轉帳。何項比較較適當？","options":["兩者法律性質及業務範圍必定相同","前者偏第三方支付代收付，後者涉及電子支付業務，應依實際許可範圍判斷","只要有QR Code就是銀行","任何購物平台都可無限制吸收儲值款"],"answer":1,"explain":"第三方支付與電子支付業務監理及可提供的功能不同，須依業者許可與法規判斷。","source":"Cheap教你金融科技力","id":"F024"},{"topic":"數位安全","q":"銀行提供開放API整合個人資產，App要求授權讀取帳戶資料。使用者最應先確認什麼？","options":["只要App免費就可授權所有權限","服務提供者身分、授權範圍、撤銷方式與資料安全","把網銀密碼直接傳給客服","同意後資料永遠不可撤回"],"answer":1,"explain":"開放銀行應重視合法授權、最小必要範圍及資訊安全，避免向第三方交付敏感登入憑證。","source":"貿二潘伊靜金融影片筆記","id":"F025"},{"topic":"警示帳戶","q":"朋友說「借我帳戶收一筆貨款，會給你5000元」，並保證與詐騙無關。最適當的決策？","options":["只借一次就不會有法律風險","借帳戶前先收押金即可","拒絕出借帳戶與提款工具，避免成為詐欺或洗錢工具","只提供提款卡、不提供密碼就安全"],"answer":2,"explain":"帳戶提供他人使用可能衍生刑事、民事與帳戶管制風險，不能以對方保證或報酬取代審查。","source":"防制洗錢20261019","id":"F026"},{"topic":"資產配置","q":"即將一年後繳學費的學生，有10萬元學費預備金與5萬元長期投資資金。哪項配置原則最合理？","options":["把15萬元全部投入波動大的加密資產","學費預備金優先考量流動性與本金風險，長期資金再依風險承受度投資","只看最高預期報酬","借款增加投資本金"],"answer":1,"explain":"短期必要支出資金應優先確保可用性，投資期限與風險承受能力需匹配。","source":"全民金融通","id":"F027"},{"topic":"信託與保險","q":"單親家長擔心身故後未成年子女一次取得大筆保險金遭不當使用，希望分期支付教育費。哪項安排最切合需求？","options":["指定任何成年人直接領全部保險金即可","評估保險金信託，約定受益人與分期給付條件","將保單受益人設為保險業務員","把保費全數改投機性投資"],"answer":1,"explain":"保險金信託可依契約管理理賠金並分期支付教育、照護等費用；須注意契約、費用與受益權。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F028"},{"topic":"綜合財務決策","q":"夫妻準備退休，名下有自住房、每月固定收入3萬元、必要支出4.5萬元，子女無法固定支援。哪項做法最合理？","options":["立即以房養老且不比較條款","先計算每月1.5萬元缺口，評估節流、其他收入與房屋養老方案的成本及居住需求","把房屋無償過戶給子女換取口頭承諾","全部存款投入單一高股息股票"],"answer":1,"explain":"先量化現金流缺口，再比較以房養老、出租或其他安排的產權、成本、居住與風險。","source":"2026年最新版以房養老講議1027(1)","id":"F029"},{"topic":"金融爭議與保險","q":"保戶住院後遭拒賠，保險公司引用「等待期間」條款，但保戶認為業務員投保時未說明。哪項行動最有助於處理爭議？","options":["立即在社群公開業務員個資","保留要保文件、條款、醫療與招攬紀錄，先向保險公司申訴","要求醫師修改診斷日期","直接停止所有保費且不看契約"],"answer":1,"explain":"保留證據有助釐清契約保障、等待期間及招攬說明，並依申訴與評議程序處理。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F030"},{"topic":"貸款總成本","q":"小芳申請10萬元、1年後一次還本的短期借款，甲年利率2%且開辦費1,300元；乙年利率3%免開辦費。忽略其他費用及時間價值，何者正確？","options":["甲較省300元","僅看名目利率，甲必定較省","乙較省300元","兩方案成本完全相同"],"answer":2,"explain":"甲利息2,000元＋開辦費1,300元＝3,300元；乙利息3,000元，乙少300元。此為簡化成本比較，非正式APR。","source":"金融商品費用20261021","official":"","id":"F031"},{"topic":"緊急預備金","q":"阿威每月必要支出18,000元，預計保留3個月緊急預備金；目前活存18,000元，另有波動大的股票。若股票不計入低風險預備金，至少還須補足多少元？","options":["72,000元","18,000元","54,000元","36,000元"],"answer":3,"explain":"目標=18,000×3=54,000元；扣除活存18,000元，缺口36,000元。緊急資金重視流動性與本金風險。","source":"全民金融通","official":"","id":"F032"},{"topic":"退休現金流","q":"退休家庭每月固定收入22,000元、必要支出27,000元，持有可動用現金180,000元。若不考慮利息、物價與突發醫療支出，現金最多可彌補支出缺口幾年？","options":["3年","5年","6年","1年"],"answer":0,"explain":"每月缺口=27,000－22,000=5,000元；180,000÷5,000÷12=3年。真實退休規劃另須估計通膨及照護風險。","source":"2026年最新版以房養老講議1027(1)","official":"","id":"F033"},{"topic":"通膨與實質報酬","q":"小莉的投資一年名目報酬率5%，同期物價上漲1%。若忽略稅費，購買力實際增加的比率最接近多少？","options":["5.0%","1.0%","4.0%","6.0%"],"answer":2,"explain":"實質報酬率=(1+0.05)÷(1+0.01)－1≈4.0%。名目獲利不等於購買力增加。","source":"金融商品分類整理20261021","official":"","id":"F034"},{"topic":"存款保險與分散","q":"阿明在A要保銀行有活存100萬、定存80萬、外幣存款折合30萬元；B要保銀行另有存款40萬元。假設本息數字如上且無抵銷事項，兩家合計受存保保障的金額為多少？","options":["284萬元","40萬元","250萬元","267萬元"],"answer":2,"explain":"A銀行合計210萬元，最多保障210萬元；B銀行另保障40萬元，合計250萬元。每人每家要保機構本息合計最高300萬元，外幣亦計入。","source":"金融商品分類整理20261021","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","id":"F035"},{"topic":"複利與資金規劃","q":"小真將50,000元以年利率2%存放2年，比較「每年複利」與「每年單利」，均假設無稅費、利率固定且到期一次領回。複利到期金額比單利約多多少？","options":["2,000元","20元","2,020元","1,000元"],"answer":1,"explain":"單利本利和=50,000×(1+2%×2)≈52,000.00；複利=50,000×(1+2%)^2≈52,020.00，差額約20元。","source":"全民金融通","official":"","id":"F036"},{"topic":"債券與利率風險","q":"投資人持有固定利率債券基金，修正存續期間約2年。若市場殖利率突然上升0.25個百分點，假設其他條件不變，以存續期間近似法估計淨值變動方向與幅度，何者最合理？","options":["票息會自動上調，價格不變","約下跌0.25%","約下跌0.5%","約上漲0.5%"],"answer":2,"explain":"債券價格與殖利率通常反向；小幅變動可用價格變動率≈－修正存續期間×殖利率變動，約－2×0.25%＝－0.5%。此為近似值，未考慮凸性。","source":"金融商品分類整理20261021","o on next(){if(at<exam.length-1){at++;render()}}function prev(){if(!timed&&at>0){at--;render()}}function submitQuiz(auto=false){clearInterval(tick);if(!auto&&!confirm('確定交卷？未作答題目以錯誤計算。')){if(timed)render();return}let n=exam.reduce((s,x,i)=>s+(answers[i]===x.answer),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`成績：${n*5} 分（答對 ${n} / 20 題）`; $('reviews').innerHTML='';exam.forEach((x,i)=>{let d=document.createElement('div');d.className='review';let good=answers[i]===x.answer;let h=document.createElement('h3');h.textContent=`${i+1}. ${x.q}`;d.appendChild(h);let p=document.createElement('p');p.className=good?'correct':'wrong';p.textContent=`${good?'答對':'答錯'}｜你的答案：${answers[i]===null?'未作答':x.options[answers[i]]}｜正解：${x.options[x.answer]}`;d.appendChild(p);let e=document.createElement('p');e.textContent=`解析：${x.explain}`;d.appendChild(e);let s=document.createElement('small');s.className='muted';s.textContent=`參考講義：${x.source}${x.official?"｜官方參考："+x.official:""}`;d.appendChild(s);$('reviews').appendChild(d)})}</script></body></html>
