<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f99">
<title>金融知識即測即評 v2.0</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--muted:#667085;--line:#d7dce2;--accent:#1f5f99;--accent2:#164b7b;--ok:#e8f5e9;--bad:#ffebee;--warn:#fff7df}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);line-height:1.6}
header{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 5px #0000000b}
.wrap{max-width:1000px;margin:auto;padding:16px}
h1{font-size:24px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button{border:1px solid #b8c1cc;background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:15px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.primary:hover{background:var(--accent2)}
button.danger{color:#b42318;border-color:#f0b4ae}.mode{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.mode button{border:0;border-radius:0}.mode button.active{background:var(--accent);color:#fff}
input[type=text],input[type=password],select,textarea{border:1px solid #c7ced7;border-radius:8px;padding:9px 10px;font-size:15px;background:#fff}
.student-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.student-info label{font-size:13px;color:var(--muted)}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent);width:0;transition:.2s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat b{font-size:20px;display:block}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}.qtitle{font-weight:700;line-height:1.65;white-space:pre-wrap}.choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;background:#fff}.choice:hover{background:#f9fafb}.choice input{margin-top:5px}.choice.correct{background:var(--ok);border-color:#8abf8f}.choice.wrong{background:var(--bad);border-color:#d99}
.feedback{margin-top:9px;font-weight:700}.oktxt{color:#2e7d32}.badtxt{color:#c62828}.muted{color:var(--muted)}
.result{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:20px 0;display:none}.result h2{margin-top:0}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.result-item{background:#f8fafc;border-radius:9px;padding:10px;text-align:center}.result-item b{font-size:22px;display:block}
.miss{border-top:1px solid var(--line);padding:12px 0}.miss-title{font-weight:700}.answerline{margin-top:4px}
.analysis{margin-top:8px;padding:10px;background:#f8fafc;border-radius:8px;font-size:14px}.analysis textarea{width:100%;min-height:70px;margin-top:6px}
.teacher-panel{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}.teacher-panel.show{display:block}
.hidden{display:none!important}.mobile-nav{position:sticky;bottom:8px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffffee;border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0;box-shadow:0 3px 12px #0002}.mobile-nav button{flex:1}.notice{background:var(--warn);border:1px solid #efd58a;padding:10px;border-radius:9px;font-size:14px;margin:10px 0}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:28px 10px}
@media(max-width:700px){body{font-size:16px}.wrap{padding:10px}h1{font-size:20px}.sub{font-size:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar .mode{grid-column:1/-1;width:100%}.mode button{flex:1}.toolbar button{width:100%;min-height:46px}.toolbar label{grid-column:1/-1;padding:10px;background:#f8fafc;border-radius:8px}.student-info{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:8px}.qcard{padding:14px 11px;margin:10px 0;border-radius:10px}.qtitle{font-size:17px}.choices{gap:10px}.choice{padding:14px 11px;min-height:52px;align-items:center}.choice input{width:20px;height:20px;flex:none}.choice span{font-size:16px}.result-grid{grid-template-columns:repeat(2,1fr)}button{min-height:44px}.progress{height:10px}}
@media print{header,.toolbar,.teacher-panel,.student-info,.footer,.no-print{display:none!important}.result{display:block!important;box-shadow:none}.qcard{break-inside:avoid}}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>金融知識即測即評 v2.0</h1>
<div class="sub">每回隨機抽 40 題｜手機單題作答｜即時判定｜交卷成績單｜錯題解析</div><div class="notice">📱 手機請用 Chrome／Safari「開啟」此網頁，不要只用 LINE、Messenger 或檔案 App 的預覽功能。</div>
<div class="toolbar">
  <div class="mode">
    <button id="studentModeBtn" class="active" onclick="setMode('student')">學生模式</button>
    <button id="teacherModeBtn" onclick="setMode('teacher')">教師模式</button>
  </div>
  <button class="primary" onclick="newQuiz()">重新隨機抽 40 題</button>
  <button onclick="submitQuiz()">交卷／看成績</button>
  <button onclick="printResult()">列印成績單</button>
  <button class="danger" onclick="clearSaved()">清除本機紀錄</button>
  <label class="no-print"><input id="shuffleOpt" type="checkbox" checked onchange="newQuiz()"> 選項隨機</label>
</div>
<div class="student-info">
  <label>姓名<input id="studentName" type="text" placeholder="請輸入姓名"></label>
  <label>班級<input id="studentClass" type="text" placeholder="例如：商管二甲"></label>
  <label>座號<input id="studentNo" type="text" placeholder="例如：12"></label>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>
</header>

<main class="wrap">
<div id="teacherPanel" class="teacher-panel">
  <b>教師模式</b>
  <div class="notice">教師模式可查看本回正確答案，也可以為錯題補充解析。解析會儲存在目前瀏覽器，不會自動上傳學校網站。</div>
  <button onclick="toggleAllAnswers()">顯示／隱藏本回答案</button>
  <button onclick="exportQuestions()">匯出本回題目（CSV）</button>
</div>

<div class="stats">
<div class="stat"><b id="done">0</b>已作答</div>
<div class="stat"><b id="right">0</b>答對</div>
<div class="stat"><b id="wrong">0</b>答錯</div>
<div class="stat"><b>40</b>本回題數</div>
</div>

<div id="mobileNav" class="mobile-nav hidden"><button onclick="prevQ()">上一題</button><b id="qpos">1 / 40</b><button onclick="nextQ()">下一題</button></div><div id="quiz"></div>
<div id="result" class="result"></div>
</main>
<div class="footer">金融知識即測即評 v2.0｜單一 HTML 檔，可直接部署於一般學校網站／網頁伺服器</div>

<script>

2},{"id":181,"q":"小宏在申請信用卡時，發現申請被拒絕，但未收到銀行的任何解釋。他提出申訴後，銀行有什麼責任？","options":["銀行無需對消費者的申訴作出回應","銀行需向金融消費評議中心報告該申訴","銀行需在規定的時間內給出拒絕原因及合理解釋","銀行應該立即批准小明的申請"],"answer":2},{"id":182,"q":"小宏的父親是公務員，退休後每個月都會從社會保險得到一筆收入。這種收入類型是什麼？","options":["年金收入","工作收入","兼職收入","投資收入"],"answer":0},{"id":183,"q":"小李向A銀行申辦信用卡，之後因為沒有準時繳納卡費，遭到A銀行停用信用卡，導致小李只剩下償還欠款的義務，而沒有享受刷卡的權利。小李認為A銀行惡意停卡，向評議中心提出評議申請，並在評議申請書中記載請求標的「本金還剩下6萬元，希望減免1萬元，然後分5期償還，每個月償還1萬元」。請問這個案件下列敘述何者為是？","options":["銀行惡意停卡，所以是銀行的過錯","小李有誠意還款，銀行應該多體諒小李給予減免","請求標的請求，性質上屬於「債務協商」。依據法令的規定，評議中心應該不受理。","請求標的請求，性質上屬於「債務協商」。評議中心為了金融制度健全應該要受理。"],"answer":2},{"id":184,"q":"小孟在購物時遭遇詐騙，無法聯繫到賣家，他應該怎麼處理？","options":["直接放棄，並警告他人不要購買","自行再次嘗試聯繫賣家","向購物平台投訴，並報警處理","向朋友求助，希望能追回金額"],"answer":2},{"id":185,"q":"小宛計劃購買虛擬貨幣，但該貨幣的來源和技術背景不明，他應該怎麼做？","options":["查詢該虛擬貨幣的白皮書及技術支持","詢問其他投資者的經驗之後再決定是否要購買","投資少量資金，觀察其市場表現","聯繫該貨幣的開發者，瞭解更多細節"],"answer":0},{"id":186,"q":"小念的爸爸正在考慮是否要為外婆申請長照2.0的服務。他想知道如何收費及使用者需承擔之責任。在長照2.0政策下，使用者需要承擔什麼？","options":["使用者需要簽訂長期服務合同，並支付高額保險費","使用者完全不需要支付任何費用，所有服務都是免費的","使用者可能需要支付部分自費金額，依據服務項目和經濟狀況而定，並需配合評估和照護計畫","使用者需要參加政府舉辦的義工服務，以獲取服務資格"],"answer":2},{"id":187,"q":"小昆發現自己參與的投資計劃是龐氏騙局，他應該怎麼進行申訴？","options":["自己追蹤詐騙者並蒐集更多證據","聯繫詐騙者並要求退款","向金融監管機構報告並提交相關證據","在網路上公開揭露詐騙行為"],"answer":2},{"id":188,"q":"小明在失業期間遭遇突發醫療費用，應如何應對失業與醫療的雙重財務壓力？","options":["向銀行申請貸款以支付醫療費用","使用緊急預備金支付醫療費用，並重新評估生活開銷","立刻出售自身持有的股票","將所有儲蓄用於醫療費用"],"answer":1},{"id":189,"q":"小明在放學後，會去便利店做四小時的工讀，每小時獲得180元。這種收入類型是什麼？(選擇題)","options":["兼職收入","年金收入","投資收入","工作收入"],"answer":0},{"id":190,"q":"小明在學期間打工，他的雇主扣除了一部分的薪水作為所得稅，但小明的年收入低於稅額起徵點，他該怎麼做？","options":["不需要做任何事情","繼續讓雇主扣稅","向雇主要求不扣稅","向國稅局申請退稅"],"answer":3},{"id":191,"q":"小明的手機在進水後無法開機，必須立刻購買一台新手機。此種情境代表何種類型的支出？","options":["可變支出","投資支出","固定支出","突發支出"],"answer":3},{"id":192,"q":"小明的爸爸失業了，而小明的學費需要支付。在這種情況下，社會保險可以如何幫助小明的家庭？","options":["提供失業補助給小明的爸爸","給予小明的爸爸退休金","為小明的爸爸提供醫療保險","為小明提供無息貸款支付學費"],"answer":0},{"id":193,"q":"小明的爸媽擁有一家公司，他們計畫將公司賣給他人，這種情況下，他們需要繳交何種稅？","options":["所得稅","轉讓所得稅","營業稅","房屋稅"],"answer":0},{"id":194,"q":"小明花 3,000元買投資書籍、付了 1,000元手續費，最後賣股票賺了 20,000元價差並拿到 5,000現金股利。下列何者正確？","options":["5,000元現金股利也叫作資本利得","3,000元買書費用會直接算入股票的買進成本中","1,000元手續費是交易成本，會直接影響價差（資本利得）的計算","3,000元買書費用可以拿去扣抵綜合所得稅"],"answer":2},{"id":195,"q":"小明是一名身體殘疾的大學生，他可以申請何種社會救助？","options":["失業保險","兒童及少年生活扶助","勞工退休金","殘障者生活或就學補助"],"answer":3},{"id":196,"q":"小明讀了一些關於如何避免信用破產的文章，其中何者建議是最重要的？(選擇題)","options":["更換收入更高的工作，以提高償債能力","養成良好的還款習慣和財務管理","隨時準備逃離國家","買更多的保險來分散還款風險"],"answer":1},{"id":197,"q":"小杰的阿公在退休後購置其他不動產，現在每個月會有一定的租金收入。這種收入類型是什麼？","options":["工作收入","兼職收入","投資收入","年金收入"],"answer":2},{"id":198,"q":"小林的爸爸是一名公司員工，而他的阿公、阿嬤都是農夫。在他們退休時，他們可能從何種保險制度獲得退休金？","options":["小林的爸爸從勞工退休金獲得，阿公、阿嬤從國民年金獲得","小林的爸爸和阿公、阿嬤都從勞工退休金獲得","小林的爸爸和阿公、阿嬤都從國民年金獲得","小林的爸爸從國民年金獲得，阿公、阿嬤從勞工退休金獲得"],"answer":0},{"id":199,"q":"小花因為家庭經濟狀況不佳，正在考慮申請政策性貸款來支付大學學費。在經濟不景氣的情況下，他可以期望何者政策支持？","options":["政府幫忙求職媒合","展延還款","提供額外的現金補助","貸款全額免除"],"answer":1},{"id":200,"q":"小芳已投保駕駛人傷害險，於開車時車禍骨折，手術後於住院期間跌倒，讓原本骨折處錯位要再次手術住院，請問下列敘述何者正確？(選擇題)","options":["第二次的住院手術跟前次車禍有因果關係，保險公司須對兩次的手術住院進行理賠。","保險公司不須對小芳進行理賠。","保險公司只須對車禍造成的骨折手術住院進行理賠。","保險公司只須對跌倒造成的骨折手術住院進行理賠。"],"answer":0},{"id":201,"q":"小芸的爸爸是公務員，他的媽媽是教師，他的阿公是農夫。他們可能從何種保險制度獲得退休金？","options":["爸爸：公務員退休金，媽媽：教職員工退休金，阿公：國民年金","爸爸：公務員退休金，媽媽：教職員工退休金，阿公：勞工退休金","爸爸：公務員退休金，媽媽：教職員工退休金，阿公：農民退休金","爸爸：勞工退休金，媽媽：勞工退休金，阿公：國民年金"],"answer":2},{"id":202,"q":"小邱了解到職業退休金的收益通常比不上個人存退休金的投資收益，但他的父母仍然選擇依賴職業退休金。這是因為職業退休金具有什麼特點？(選擇題)","options":["需要自己完全負擔繳費","收益高於個人投資","沒有任何稅務優惠","承擔的風險較低"],"answer":3},{"id":203,"q":"小金目前正準備要結婚，並開始有比較多的儲蓄可規畫未來可能的家庭支出，這是表示他即將要邁入就業中期(轉業期)階段。","options":["O","X"],"answer":1},{"id":204,"q":"小金在網購平台上購買新的手機，之後接到平台客服來電告知，小金誤將付款設定成分期，要求小金到atm更改設定。當遇到這個狀況時，請問小金可撥打下列哪個電話求證？","options":["1966","113","1999","165"],"answer":3},{"id":205,"q":"小金藉由廣告得知一家知名保險公司推出了強調「低風險、高報酬」的保單，因此十分心動，若你是小金的朋友，請問你該建議他如何行動呢?","options":["相信廣告資訊，直接購買保單。","把好康訊息推薦給更多朋友。","撥打165反詐騙專線進行資訊確認。","不需進行額外調查，依據直覺行動。"],"answer":2},{"id":206,"q":"小亮的薪水足夠支付他的生活開銷，但他想要買一輛汽車。他該如何平衡他的工作和財務生活？","options":["降低其他生活開銷，來購買汽車","設立儲蓄計畫，將一部分薪水存下來購買汽車","使用信用卡或全額貸款購買汽車","只要賺更多的錢，就可以購買汽車"],"answer":1},{"id":207,"q":"小奕發現保險公司延遲支付他申請的理賠金，他提出申訴後，保險公司如何負責？","options":["保險公司可以不支付任何賠償金","保險公司需等待法院的判決再決定是否支付","保險公司需立即支付理賠金並賠償延遲造成的損失","保險公司只需支付理賠金，無需任何賠償"],"answer":2},{"id":208,"q":"小昱的爸爸在申貸時發現銀行未按約定條款執行，與銀行溝通未果，決定再申訴。依據金融消費申訴流程，他應向哪個機構提出，而該機構職能為何？","options":["銀行內部的客戶服務部門，進行內部協調","地方法院，直接進行法律訴訟並判決","金管會，直接監督金融機構的運作","金融消費評議中心，負責調解消費者與金融機構間的爭議並做出評議"],"answer":3},{"id":209,"q":"小洋向小齊借款10萬元，並約定月利率為3%。根據台灣的《民法》規定，這樣的利率是否合法？如果利率過高，債務人應如何處理？","options":["不合法，小洋可以直接拒絕支付利息部分，只還本金。","合法，只要雙方同意，任何利率都是被允許的。","不合法，因為月利率超過《民法》規定的利率上限，小洋可以向法院申請調降利率。","合法，因為雙方約定的利率就是法律依據。"],"answer":2},{"id":210,"q":"小玲有一筆大學學貸未還，他選擇延遲還款，這可能對他未來的財務規劃有什麼影響？","options":["他有更多金錢可以分配在支出","他的信用評分會被列無法評分","他有更多儲蓄可以先去投資","他的其他借貸條件可能會受限"],"answer":3},{"id":211,"q":"小珍的媽媽在銀行辦理的定存以下哪項描述最符合指數型基金的特徵？(選擇題)","options":["由基金經理挑選股票以追求超過市場成長的回報","追蹤特定市場指數的表現，並以此進行被動管理","投資於特定行業，如科技或醫療的發展","主要投資於短期債券，風險較低"],"answer":1},{"id":212,"q":"小珍的媽媽在銀行辦理的定存合約到期後，她發現利率並未按當初承諾的計算。若她要進行申訴，必須自己負擔所有的申訴費用。","options":["O","X"],"answer":1},{"id":213,"q":"小美今年30歲，雖然從爸媽那邊繼承了一間房子，但由於生意慘淡，因此急需周轉金。礙於年齡限制，小美最不可能申請哪一項貸款？","options":["商業型不動產逆向抵押貸款","臨時性週轉資金貸款","信用保證基金","微型創業鳳凰貸款"],"answer":0},{"id":214,"q":"小美向小明借時下最夯的奢侈品，電玩「PS6」，小明說：「平時家裡吃、住都不缺，可是我們家的經濟能力不足以負擔PS6！」。這段對話可以推測小明家的經濟狀況是「相對貧窮」。","options":["O","X"],"answer":1},{"id":215,"q":"小美考慮把20,000元全部拿去旅遊，或保留部分資金作為投資。她最需要考慮的是現在消費與未來目標之間的取捨。","options":["O","X"],"answer":0},{"id":216,"q":"小美投資一檔追蹤大型股指數的ETF。若市場整體下跌，ETF價格也可能下跌。這主要反映ETF仍承受市場風險。","options":["O","X"],"answer":0},{"id":219,"q":"小美決定每月放棄 500 元的娛樂享受，將錢存入銀行，預計一年後購買一台 6,000 元的腳踏車。關於小美這項「犧牲現在消費以換取未來目標」的財務行為，下列哪一項評估最符合經濟與投資原理？","options":["減少娛樂支出雖然降低了當下的享樂，但能直接提升小美未來的每月主動收入","把錢存入銀行完全沒有時間價值，因此無法影響小美未來的消費能力","小美當前放棄的娛樂體驗，即為她進行這項跨期價值交換所付出的機會成本","這屬於典型的延後消費行為，只要名目儲蓄金額達標，一年後就保證能獲得相同的實質消費效益"],"answer":2},{"id":220,"q":"小美剛出社會，想每個月強迫自己存20,000元，累積三年後就可以有筆創業資金，請問下列何種方式的定期儲蓄存款適合小美？(選擇題)","options":["零存整付","存本取息","存息領本","整存整付"],"answer":0},{"id":221,"q":"小美想開一家網路商店，需要創業資金。他研究了正式金融機構和非正式金融機構的貸款條件。何者較可能要求 0},{"id":1496,"q":"權益證明機制PoS以不消耗大量電力、能源來取得新的區塊，請問該制度是用何者來取代PoW礦工的運算力？(選擇題)","options":["比特幣ASIC礦機算力","加密貨幣的抵押數量","美元的抵押數量","挖礦用的顯示卡算力"],"answer":1}];
const N=40;
let quiz=[],answers={},teacher=false,submitted=false,showTeacherAnswers=false,currentQ=0;

function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function info(){return {name:document.getElementById('studentName').value.trim(),cls:document.getElementById('studentClass').value.trim(),no:document.getElementById('studentNo').value.trim()}}
function save(){try{localStorage.setItem('financeQuizV2',JSON.stringify({answers,info:info(),submitted}))}catch(e){}}
function restore(){try{const x=JSON.parse(localStorage.getItem('financeQuizV2')||'null');if(x?.info){studentName.value=x.info.name||'';studentClass.value=x.info.cls||'';studentNo.value=x.info.no||''}return x}catch(e){return null}}
function newQuiz(){
  answers={};submitted=false;showTeacherAnswers=false;currentQ=0;
  document.getElementById('result').style.display='none';
  quiz=sh(BANK).slice(0,N).map(x=>{let items=x.options.map((t,i)=>({t,correct:i===x.answer,orig:i}));if(document.getElementById('shuffleOpt').checked)items=sh(items);return {...x,items}});
  render();updateStats();save();window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  const q=document.getElementById('quiz');
  q.innerHTML=quiz.map((x,i)=>`<section class="qcard" id="q${i}">
    <div class="qtitle">第 ${i+1} 題　${esc(x.q)}</div>
    <div class="choices">${x.items.map((o,j)=>`<label class="choice" data-j="${j}">
      <input type="radio" name="q${i}" ${answers[i]===j?'checked':''} onchange="pick(${i},${j})">
      <span>${String.fromCharCode(65+j)}. ${esc(o.t)}</span>
    </label>`).join('')}</div>
    <div class="feedback" id="f${i}"></div>
    <div class="analysis ${teacher?'':'hidden'}" id="a${i}">
      <b>教師解析</b>
      <textarea id="note${i}" placeholder="可在此補充本題解析、觀念或提醒…">${esc(getNote(x.id))}</textarea>
      <button onclick="saveNote(${x.id},${i})">儲存解析</button>
    </div>
  </section>`).join('');
  Object.keys(answers).forEach(i=>paint(+i));
  if(teacher && showTeacherAnswers)quiz.forEach((_,i)=>paint(i,true));
  applyMobileView();
}
function applyMobileView(){
  const nav=document.getElementById('mobileNav');
  if(window.innerWidth<=700 && !submitted){
    nav.classList.remove('hidden');
    document.querySelectorAll('.qcard').forEach((el,i)=>el.style.display=i===currentQ?'block':'none');
    document.getElementById('qpos').textContent=(currentQ+1)+' / '+N;
    document.getElementById('bar').style.width=((currentQ+1)/N*100)+'%';
    window.scrollTo({top:0,behavior:'smooth'});
  }else{
    nav.classList.add('hidden');
    document.querySelectorAll('.qcard').forEach(el=>el.style.display='block');
  }
}
function nextQ(){if(currentQ<N-1){currentQ++;applyMobileView()}}
function prevQ(){if(currentQ>0){currentQ--;applyMobileView()}}
window.addEventListener('resize',applyMobileView);
function getNote(id){try{return localStorage.getItem('financeNote_'+id)||''}catch(e){return ''}}
function saveNote(id,i){try{localStorage.setItem('financeNote_'+id,document.getElementById('note'+i).value);alert('本題解析已儲存於此瀏覽器。')}catch(e){alert('此手機瀏覽模式不允許儲存教師解析，但不影響學生測驗。')}}
function pick(i,j){if(submitted)return;answers[i]=j;paint(i);updateStats();save()}
function paint(i,force=false){
  const card=document.getElementById('q'+i); if(!card)return;
  const x=quiz[i],sel=answers[i],labs=[...card.querySelectorAll('.choice')],fb=document.getElementById('f'+i);
  labs.forEach(l=>l.classList.remove('correct','wrong')); fb.innerHTML='';
  const ci=x.items.findIndex(o=>o.correct);
  if(sel!==undefined && submitted){
    labs[ci].classList.add('correct'); if(sel!==ci)labs[sel].classList.add('wrong');
    fb.innerHTML=sel===ci?'<span class="oktxt">✓ 答對</span>':`<span class="badtxt">✗ 答錯；正確答案：${String.fromCharCode(65+ci)}. ${esc(x.items[ci].t)}</span>`;
  }else if(force && showTeacherAnswers){
    labs[ci].classList.add('correct');
    fb.innerHTML=`<span class="oktxt">教師答案：${String.fromCharCode(65+ci)}. ${esc(x.items[ci].t)}</span>`;
  }
}
function updateStats(){
  let d=Object.keys(answers).length,r=0;
  for(const [i,j] of Object.entries(answers))if(quiz[i]?.items[j]?.correct)r++;
  done.textContent=d;right.textContent=r;wrong.textContent=d-r;bar.style.width=(d/N*100)+'%';
}
function submitQuiz(){
  if(!confirm('確定要交卷嗎？交卷後將顯示本回成績與錯題。'))return;
  submitted=true;let r=0,miss=[];
  quiz.forEach((x,i)=>{let ci=x.items.findIndex(o=>o.correct),sel=answers[i];if(sel!==undefined&&x.items[sel].correct)r++;else miss.push({i,x,ci,sel})});
  quiz.forEach((_,i)=>paint(i,true)); updateStats(); save();
  const score=Math.round(r/N*100), box=document.getElementById('result');
  box.style.display='block';
  box.innerHTML=`<h2>本回成績：${score} 分</h2>
  <div class="result-grid">
    <div class="result-item"><b>${r}</b>答對</div><div class="result-item"><b>${N-r}</b>答錯／未答</div>
    <div class="result-item"><b>${N}</b>總題數</div><div class="result-item"><b>${score}</b>百分制</div>
  </div>
  <p><b>學生：</b>${esc(info().name||'未填寫')}　<b>班級：</b>${esc(info().cls||'未填寫')}　<b>座號：</b>${esc(info().no||'未填寫')}</p>
  <h3>錯題解析</h3>
  ${miss.length?miss.map(m=>`<div class="miss"><div class="miss-title">第 ${m.i+1} 題　${esc(m.x.q)}</div>
  <div>你的答案：${m.sel===undefined?'未作答':esc(m.x.items[m.sel].t)}</div>
  <div class="answerline oktxt">正確答案：${String.fromCharCode(65+m.ci)}. ${esc(m.x.items[m.ci].t)}</div>
  <div class="analysis"><b>解析：</b>${esc(getNote(m.x.id)||'目前題庫檔案未提供逐題解析；教師可於教師模式補充本題解析。')}</div></div>`).join(''):'<p class="oktxt">全部答對！</p>'}`;
  document.getElementById('mobileNav').classList.add('hidden');
  document.querySelectorAll('.qcard').forEach(el=>el.style.display='block');
  box.scrollIntoView({behavior:'smooth'});
}
function setMode(mode){
  teacher=mode==='teacher';
  studentModeBtn.classList.toggle('active',!teacher);teacherModeBtn.classList.toggle('active',teacher);
  teacherPanel.classList.toggle('show',teacher);
  render();
}
function toggleAllAnswers(){showTeacherAnswers=!showTeacherAnswers;quiz.forEach((_,i)=>paint(i,true))}
function clearSaved(){if(!confirm('確定清除本機紀錄與教師解析嗎？'))return;Object.keys(localStorage).filter(k=>k.startsWith('financeNote_')||k==='financeQuizV2').forEach(k=>localStorage.removeItem(k));location.reload()}
function printResult(){if(!submitted){alert('請先交卷，再列印成績單。');return}window.print()}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportQuestions(){
  const rows=[['題號','題目','A','B','C','D','正確答案']];
  quiz.forEach((x,i)=>rows.push([i+1,x.q,...x.items.map(o=>o.t),String.fromCharCode(65+x.items.findIndex(o=>o.correct))]));
  const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='金融知識即測即評_本回題目.csv';a.click();URL.revokeObjectURL(a.href);
}
['studentName','studentClass','studentNo'].forEach(id=>document.getElementById(id).addEventListener('input',save));
restore();newQuiz();
</script>
