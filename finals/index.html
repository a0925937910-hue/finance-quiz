<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融知識競賽｜1,000題決賽模擬（擴充試行版）</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f2f5fa;color:#18283b;margin:0}.wrap{max-width:760px;margin:auto;padding:22px}header{background:#102c4b;color:white;padding:24px;border-radius:16px}h1{font-size:1.6rem;margin:0 0 8px}.panel{background:white;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 3px 18px #1232}.muted{color:#63758b}.opt{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:white;padding:15px;border-radius:10px;margin:10px 0;font-size:1rem;cursor:pointer;line-height:1.5}.opt:hover{border-color:#2366ac}.opt.selected{background:#dbeafe;border-color:#2563eb}.primary{background:#145ea8;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:1rem;cursor:pointer}button:disabled{opacity:.5}select{padding:10px;font-size:1rem}.hidden{display:none}.review{padding:14px;border-top:1px solid #ddd}.correct{color:#087341}.wrong{color:#ba2929}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}</style></head><body><div class="wrap"><header><h1>金融知識競賽｜決賽應用題</h1><div>1,000 題擴充試行版 · 每回隨機 20 題 · 決賽模擬滿分 100 分</div></header><section id="start" class="panel"><p>本版收錄1,000題，其中新增500題為待審草稿；含30類計算題型的多組數值變化，仍須逐題審核金融制度、答案及解析，並非官方題庫。</p><p>模式：<select id="mode"><option value="practice">練習模式（不限時）</option><option value="timed">決賽模擬（每題40秒｜正確80分＋速度20分）</option></select></p><p class="muted">決賽計分：20題，每題答對得正確分4分，並依該題答對速度另得0～1分；40秒內越快答對，速度分越高。答錯、未答或超時均為0分。練習模式維持每題5分，不計速度。</p><button class="primary" onclick="begin()">開始測驗</button></section><section id="quiz" class="panel hidden"><div class="meta"><span id="counter"></span><span id="timer"></span></div><h2 id="question"></h2><div id="options"></div><div class="meta"><button class="primary" onclick="prev()">上一題</button><button class="primary" onclick="next()">下一題</button><button class="primary" onclick="submitQuiz()">交卷／看成績</button></div></section><section id="result" class="panel hidden"><h2 id="score"></h2><p class="muted">以下列出每題答案、講義依據與解析。</p><div id="reviews"></div><button class="primary" onclick="location.reload()">重新抽題</button></section></div><script>const BANK=[{"topic":"貸款成本","q":"甲貸10萬元、1年後一次還本，年息3%、開辦費3000元；乙同條件年息4%、免開辦費。若不考慮其他費用，哪項判斷最合理？","options":["甲的名目利率較低，因此總費用較低","甲的總成本為6,000元，比乙多2,000元","乙的利息較高，因此總費用較高","兩方案總費用都是4,000元"],"answer":1,"explain":"逐選項解析：（1）甲利息3,000元，另有3,000元開辦費，合計6,000元；乙利息4,000元且無開辦費。名目利率不能取代費用比較。；（2）甲總費用＝100,000×3%＋3,000＝6,000元；乙＝100,000×4%＝4,000元，甲多2,000元。題目是一次還本的簡化比較，非正式APR。；（3）乙利息雖為4,000元，高於甲的3,000元，但甲另收3,000元開辦費，因此乙總費用反而較低。；（4）乙總費用是4,000元，但甲是6,000元；不能漏算開辦費。","source":"金融商品費用20261021","id":"F001","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"房貸規劃","q":"家庭每月可支配收入6萬元，房貸前2年月付2萬元、第3年起預估2.8萬元，另每月管理與維修費5000元。下列哪個規劃最完整？","options":["以最初兩年的月付與持有成本作主要壓力測試","以第3年2.8萬元月付加5,000元持有費，另測試升息及緊急預備金","以兩階段月付平均2.4萬元，當成固定長期負擔","以第3年月付2.8萬元評估，但將維修費視為可忽略"],"answer":1,"explain":"逐選項解析：（1）前兩年合計2.5萬元，低估第3年起的3.3萬元；只看優惠期容易誤判可負擔性。；（2）第3年起月付2.8萬元＋管理維修5,000元＝3.3萬元，占6萬元可支配收入55%；還需測試利率及突發支出。；（3）平均月付不能代表第3年起實際現金流壓力，且未反映持有費。；（4）第3年2.8萬元尚未加上每月5,000元持有成本，會低估總負擔。","source":"金融商品費用20261021","id":"F002","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"投資成本","q":"小庭以每股50元買入1000股股票，之後以51元賣出。忽略券商折扣，買賣各收0.1425%手續費，賣出另課0.3%證交稅。最接近的損益為？","options":["淨賺約1,000元","淨賺約703元","淨賺約847元","淨賺約775元"],"answer":1,"explain":"逐選項解析：（1）1,000元只是價差，尚未扣除買賣手續費及賣出證交稅。；（2）價差＝(51−50)×1,000＝1,000元；買入手續費71.25元、賣出72.675元、賣出證交稅153元；淨利＝703.075元，約703元，未計最低手續費及折扣。；（3）約847元僅接近扣除賣出證交稅的結果，漏掉兩次券商手續費。；（4）約775元不符合題目列明的買賣手續費與證交稅合計296.925元。","source":"金融商品費用20261021","id":"F003","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"基金費用","q":"兩檔基金投資相似資產，A申購手續費低但每年經理費較高，B申購費較高但每年經理費較低。若預計長期持有，最適當的比較是？","options":["比較申購費與最近一年績效，不必估計長期成本","比較兩檔歷年配息率，以配息高者優先","比較持有期間總費用、投資風險及經理費反映淨值的方式","比較單次申購手續費，忽略經理費因其已內扣"],"answer":2,"explain":"逐選項解析：（1）申購費是一次性費用，但長期經理費會持續影響淨值；最近一年績效也無法替代成本估計。；（2）配息率不是總報酬，也不能直接推導費用負擔或投資風險。；（3）長期投資須合併評估一次性申購費、持續性經理費與保管費及風險；內扣費用仍會影響投資成果。；（4）經理費即使從基金資產內扣，仍降低基金淨值及投資人報酬，不能視為零成本。","source":"金融商品費用20261021","id":"F004","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"存款保險","q":"阿杰在同一要保銀行有新臺幣活存180萬元、定存100萬元、外幣存款折合60萬元，另在另一家要保銀行存款80萬元。假設不計利息，哪項判斷正確？","options":["兩家銀行的420萬元存款合併只保障300萬元","第一家銀行的340萬元均受存保保障","第一家最高保障300萬元；第二家80萬元另計","第一家只計新臺幣280萬元，外幣60萬元另設上限"],"answer":2,"explain":"逐選項解析：（1）存保按同一存款人、同一家要保機構計算，不能將不同銀行存款合併套同一上限。；（2）第一家本外幣存款合計340萬元，超過每家要保機構300萬元的保障上限。；（3）第一家180＋100＋60＝340萬元，最高保障300萬元；第二家80萬元在另一家要保銀行另計。題目不計利息。；（4）同一家要保機構的本外幣存款本金及利息合併計算保障上限，不是外幣獨立再享300萬元。","source":"金融商品分類整理20261021","id":"F005","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"防詐與帳戶","q":"網拍賣家收到一筆「重複匯款」，買家要求將款項退到與原匯款人不同的帳戶，並催促立刻處理。最安全的做法？","options":["直接退到指定帳戶避免客訴","要求對方傳身分證照片就可退款","先與銀行核實交易並循銀行協助的退款程序","先提領現金交給買家"],"answer":2,"explain":"逐選項解析：（1）陌生人指定第三人帳戶可能讓賣家成為異常金流的轉匯節點。；（2）身分證照片可能被盜用，無法單獨證明款項來源或退款對象。；（3）先查證入帳與原匯款來源，並循銀行退款程序較能降低風險。；（4）現金交付會降低交易可追溯性，無法解決款項來源疑慮。。","source":"防制洗錢20261019","id":"F006","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"KYC與防洗錢","q":"某公司開戶時，登記負責人表示自己只是掛名，真正決定資金用途的人不願揭露。銀行最應如何處理？","options":["先核對登記負責人並暫緩辨識其他控制人","辨識實質受益人及控制關係，審查不足時依法處理","先完成開戶，之後再以交易監控代替身分審查","請登記負責人書面保證資金合法，免再查證"],"answer":1,"explain":"逐選項解析：（1）公司登記負責人不一定等於最終控制人；只核對表面身分不足以完成客戶審查。；（2）應採合理措施辨識及驗證實質受益人與控制關係，必要時了解資金來源與用途；無法完成必要審查須依規定處理。；（3）交易監控不能取代開戶前或建立業務關係時應完成的客戶審查。；（4）切結書可能是輔助資料，但不能取代金融機構對實質受益人及控制關係的查核。","source":"防制洗錢20261019","id":"F007","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"理專十誡","q":"理專稱客戶長期出國，可替其保管存摺、印鑑與網銀密碼，並定期代為交易。何種判斷最適當？","options":["客戶書面同意即無風險","僅保管印鑑不違規","涉及代客保管敏感物品及代客操作，應拒絕並循正式授權管道","只要交易獲利即可接受"],"answer":2,"explain":"逐選項解析：（1）書面同意也不會自動消除代客保管密碼及操作的法遵與資安風險。；（2）印鑑本身屬敏感金融物品，不能因只保管一項就推定安全。；（3）應依金融機構規範使用正式授權程序，避免理專私下保管與操作。；（4）交易是否獲利與有無違反內控規範是兩回事。。","source":"2026年最新版教學講義_理專十誡與警示帳戶(2)","id":"F008","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"信託與照護","q":"高齡父親有房租收入，但擔心失能後親屬擅用資金；希望每月支付照護費並定期查核。哪個方案最切合需求？","options":["由親屬擔任代收人，直接使用房租支付照護費","設計安養信託，約定給付、管理與監督機制","將租金改投入定期配息基金，按配息支付照護費","以共同帳戶讓照護者可直接提款支付費用"],"answer":1,"explain":"逐選項解析：（1）由親屬代收缺乏題目要求的契約化用途控制與定期查核，仍可能遭擅用。；（2）安養信託可依契約約定財產管理、照護給付條件、受託人責任及監督安排；仍須評估費用與契約限制。；（3）基金配息有市場及配息變動風險，不能直接達成限制他人擅用與定期查核的核心需求。；（4）共同帳戶可能便利支付，但不等於信託財產隔離及受託管理，未必能限制提款用途。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F009","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"以房養老","q":"退休夫妻自有住房、現金流不足，希望繼續居住，子女擔心房屋立刻歸銀行所有。哪項說明最合理？","options":["借款後銀行取得所有權，屋主保有居住權","以自宅設定抵押取得分期貸款，須評估利息及清償","由政府按房屋鑑價定期無償支付養老金","以房屋出售給銀行後，再用租約維持居住"],"answer":1,"explain":"逐選項解析：（1）一般商業型以房養老屬逆向抵押貸款，設定抵押權不等於立即移轉所有權。；（2）屋主通常保有房屋所有權，以房屋設定抵押取得撥款；利息累積、清償時點及繼承影響依契約。；（3）商業型以房養老不是政府無償年金，撥款通常形成借款債務。；（4）賣屋後回租是不同安排，與題目所述的逆向抵押貸款結構不同。","source":"2026年最新版以房養老講議1027(1)","id":"F010","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"退休現金流","q":"退休者每月生活費4萬元、固定退休收入2.6萬元，手上存款168萬元，忽略利息及通膨。若不改變支出，存款可填補缺口多久？","options":["約8年","約10年","約12年","約14年"],"answer":1,"explain":"逐選項解析：（1）每月缺口1.4萬元，168萬元約可支應120個月，不是96個月。；（2）每月缺口＝4萬−2.6萬＝1.4萬元；168萬÷1.4萬＝120個月＝10年。未計利息、通膨及突發支出。；（3）12年相當於144個月，需201.6萬元填補缺口，超過現有168萬元。；（4）14年相當於168個月，需235.2萬元，超過現有168萬元。","source":"2026年最新版以房養老講議1027(1)","id":"F011","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"保險保障","q":"學生出國前僅投保基本旅平險，旅途中因一般疾病住院。何項判斷最適當？","options":["確認旅平險是否含傷害醫療給付即可","檢查是否附加海外突發疾病醫療及其等待、除外條款","以旅遊不便險的班機延誤保障支應疾病醫療","確認意外身故保額足夠即可涵蓋疾病住院"],"answer":1,"explain":"逐選項解析：（1）傷害醫療通常以意外事故為基礎，一般疾病住院不必然屬於保障範圍。；（2）應檢視是否有海外突發疾病醫療保障及相關除外、等待或既往症限制，依個別保單條款判斷。；（3）旅遊不便險主要保障約定旅行不便事故，不等於疾病住院醫療保險。；（4）意外身故保額與一般疾病住院醫療是不同保障項目，不能相互取代。","source":"2026年最新版保險完整教學講義(2)","id":"F012","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"醫療險理賠","q":"阿芸持有兩張新制實支實付醫療保單，同一次住院自付醫療費8萬元。她認為可向兩家各領8萬元。何項說明最恰當？","options":["一定可領16萬元","新制強調損害填補，實際給付依條款及適用規範，不能假設雙倍領取","只要收據影本就能領雙倍","實支實付只理賠住院天數"],"answer":1,"explain":"逐選項解析：（1）新制實支實付並非可不受損害填補原則限制而領取雙倍。；（2）理賠應按適用新舊契約、條款及損害填補等規範判斷。；（3）收據影本不代表可重複領取同一筆損失的雙倍金額。；（4）實支實付可涵蓋符合條款的醫療費用，並非只按住院天數計付。。","source":"2026年最新版保險完整教學講義(2)","id":"F013","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"責任保險","q":"餐飲店同時發生兩件事：顧客因餐點污染受傷、店家自有冷藏設備故障。若投保適當公共意外責任險，何項較合理？","options":["兩者都是第三人責任損失","顧客損害可能涉及第三人責任，自有設備損壞通常非該責任險保障","自有設備損壞優先由責任險支付","沒有過失也一定全額賠償"],"answer":1,"explain":"逐選項解析：（1）店家自有冷藏設備損壞不屬第三人受損，兩件事故性質不同。；（2）顧客因餐點污染受傷可能涉及第三人賠償責任，自有設備通常需另評估財產險。；（3）公共意外責任險一般不以賠償被保險人自有設備為主要目的。；（4）責任成立與給付仍需看法律責任、事故原因與保單條款。。","source":"2026年最新版保險完整教學講義(2)","id":"F014","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"金融爭議","q":"小美發現銀行貸款收費與契約說明不一致，先向銀行申訴，但銀行30日內未妥善處理。下一步何者較符合制度？","options":["直接向主管機關要求判定銀行退費","保存申訴資料，於法定期限內向評議中心申請評議","因銀行30日未解決，改向其他銀行申請退費","先向評議中心申請刑事調查再處理契約爭議"],"answer":1,"explain":"逐選項解析：（1）主管機關監理與個別金融消費評議程序不同，不能把主管機關當成直接退費機構。；（2）原則上先向金融服務業申訴；未於30日內處理或不接受結果者，應注意自處理期限屆滿或收到結果起60日內申請評議。；（3）其他銀行不是原爭議契約當事人，無從直接承擔原銀行的退款義務。；（4）評議中心處理金融消費民事爭議，不是刑事偵查機關。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F015","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"就學貸款","q":"阿宏想借學貸就讀大學，預估畢業後月薪3.2萬元、房租1萬元、生活費1.4萬元，另有學貸還款。何項評估最完整？","options":["只看能否取得貸款","只比較大學排名","估算畢業後可支配現金流、還款負擔及收入不確定性","認為寬限期代表免還款"],"answer":2,"explain":"逐選項解析：（1）能借到錢不等於畢業後有足夠現金流償還。；（2）學校排名可能影響選校，但無法直接衡量貸款還款能力。；（3）月薪3.2萬扣房租1萬與生活費1.4萬僅餘8千元，仍須評估還款額及收入波動。；（4）寬限或緩繳可能延後還款，不代表本金自動免除。。","source":"2026年最新版教學講義_就學貸款(2)","id":"F016","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"就學貸款","q":"畢業生遇到短期失業，考慮申請「只繳息不還本」。哪項風險最值得提醒？","options":["短期減輕月付，但本金未減少且累計利息可能增加","本金依原還款期數持續攤還，只是延後收款","只繳息期間視同本金已清償，不影響後續期數","只繳息能鎖定總利息，與正常攤還成本相同"],"answer":0,"explain":"逐選項解析：（1）只繳息不還本可降低短期現金流壓力，但本金通常不下降；延長或調整還款期可能增加總利息，須依契約試算。；（2）只繳息的重點就是暫不攤還本金，不能視為原本本金攤還仍持續。；（3）利息支付不等於本金清償；後續仍須依調整後條件還本。；（4）本金較晚下降會影響計息期間及總成本，不能直接認定與正常攤還相同。","source":"2026年最新版教學講義_就學貸款(2)","id":"F017","quality_review":"干擾選項重寫＋逐選項解析；待教師及官方法規終審"},{"topic":"綠色金融","q":"鋼鐵廠目前排放高，但提出逐年減排、設備投資、第三方驗證與明確里程碑；另一企業只宣稱「100%永續」卻無數據。哪個判斷合理？","options":["高排放企業永遠不能取得轉型融資","有可信減碳路徑的高排放企業可能符合轉型金融精神","只要寫永續就等於綠色金融","轉型金融不需追蹤成果"],"answer":1,"explain":"逐選項解析：（1）轉型金融可能支持高排放產業的可信減碳轉型，不能一概排除。；（2）有量化目標、資本支出與外部查證的路徑較符合轉型金融評估精神。；（3）單純使用永續字樣缺乏可驗證的環境績效。；（4）轉型融資需要追蹤目標與執行情形，否則難以辨識漂綠。。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F018","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"碳排放範疇","q":"飲料公司自有鍋爐燃氣、購買台電電力，另委外運輸產品。依溫室氣體盤查概念，哪項配對正確？","options":["鍋爐範疇一、外購電範疇三、委外運輸範疇二","鍋爐範疇一、外購電範疇二、委外運輸通常範疇三","鍋爐範疇二、外購電範疇一、委外運輸範疇三","鍋爐範疇一、外購電範疇二、委外運輸範疇一"],"answer":1,"explain":"逐選項解析：（1）外購電力是購買能源的間接排放，應列範疇二；委外運輸一般屬價值鏈其他間接排放。；（2）自有鍋爐直接燃燒為範疇一；購電為範疇二；外包運輸通常為範疇三，仍須按盤查邊界確認。；（3）鍋爐由企業自有設備燃燒，不是外購能源所生間接排放；購電也不是直接排放。；（4）委外運輸並非企業自行控制車輛的直接排放，通常應納入範疇三。","source":"2026年最新版教學講義_綠色金融與轉型金融(1)","id":"F019","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"投資風險","q":"小恩投資三檔都追蹤台灣科技股的ETF，認為「買三檔就完全分散風險」。最適合的提醒？","options":["三檔ETF追蹤不同指數，就代表個股風險與產業風險都已分散","雖有多檔，持股可能高度重疊，仍受同產業與市場風險影響","三檔ETF持股數量多，便可忽略共同產業曝險","三檔ETF的費率不同，就代表報酬來源相互獨立"],"answer":1,"explain":"逐選項解析：（1）指數名稱不同不代表成分股、產業或風格沒有重疊；仍須看實際持股。；（2）三檔皆追蹤台灣科技股，可能高度重疊，市場及產業風險仍共同存在。；（3）持股數量是分散度的一部分，但共同科技產業因子仍可能主導報酬。；（4）費率差異是成本差異，不代表底層資產或風險來源獨立。","source":"金融商品分類整理20261021","id":"F020","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"利率與債券","q":"央行為抑制通膨而升息，投資人持有固定票面利率的既有債券。若其他條件不變，哪項影響較合理？","options":["市場利率上升，既有固定票息債券價格通常下跌","債券到期還本額不變，因此目前市場成交價不受利率影響","新發行債券殖利率提高，會使舊債票息同步調高","升息只影響新債，不影響舊債投資人提前出售的價格"],"answer":0,"explain":"逐選項解析：（1）市場要求殖利率提高時，固定現金流折現值下降，舊債市價通常下跌。；（2）到期還本額固定與中途交易價格不同；折現率變動會影響現值。；（3）固定票息債券的票息依發行條件決定，不會隨市場利率自動調高。；（4）若到期前出售，舊債須按當時市場殖利率定價，仍有利率風險。","source":"金融商品分類整理20261021","id":"F021","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"實質報酬","q":"某基金一年由10萬元成長為10.6萬元，期間物價上漲4%。忽略費稅，投資人的實質報酬率最接近多少？","options":["約2%","約6%","約1%","約4%"],"answer":0,"explain":"逐選項解析：（1）精確實質報酬率＝1.06／1.04－1≈1.923%，四捨五入約2%。；（2）6%是名目報酬率，未扣除物價上漲造成的購買力減損。；（3）實質報酬率約1.923%，若取整數百分點應為2%，不是1%。；（4）4%是物價漲幅，不是扣除通膨後的投資報酬率。","source":"金融商品分類整理20261021","id":"F022","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"緊急預備金","q":"小宇每月必要支出2.5萬元，已有活存5萬元，另持有高波動股票20萬元。他希望至少準備6個月緊急預備金。哪項規劃最合理？","options":["把股票20萬元全數列入預備金，但另外留2萬元活存緩衝","將流動、低波動預備金提高至15萬元，尚需補足10萬元","保留5萬元活存，另以10萬元股票市值作為主要預備金","用可隨時申請的信用額度作為6個月預備金"],"answer":1,"explain":"逐選項解析：（1）股票可變現但市價波動大，無法取代需要時可確定動用的低波動資金。；（2）2.5萬×6＝15萬元，現有低波動活存5萬元，仍需補足10萬元。；（3）股票可能在失業或急用時同步下跌，不宜視為等值的緊急現金。；（4）信用額度可能被調整且借款產生利息，不能等同自有預備金。","source":"全民金融通","id":"F023","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"支付科技","q":"網購平台代收買方款項、確認收貨後撥給賣方；另一持牌業者可提供儲值與用戶間轉帳。何項比較較適當？","options":["兩種業者均可代收付，因而其儲值與轉帳權限相同","前者偏第三方支付代收付，後者涉及電子支付業務，應依實際許可範圍判斷","有第三方支付服務的平台就可直接經營使用者間轉帳","電子支付業者與一般購物平台只在交易介面不同"],"answer":1,"explain":"逐選項解析：（1）代收付功能相似，不代表經營儲值及使用者間轉帳的法定資格相同。；（2）代收付與儲值、使用者間轉帳涉及不同監理規範，應核對業者許可範圍。；（3）用戶間轉帳可能涉及電子支付相關法規，不能由代收付服務推論可經營。；（4）差別涉及資金保管、許可及監理，不只是畫面或技術。","source":"Cheap教你金融科技力","id":"F024","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"數位安全","q":"銀行提供開放API整合個人資產，App要求授權讀取帳戶資料。使用者最應先確認什麼？","options":["只要App採用加密傳輸，便不需檢視授權資料種類","服務提供者身分、授權範圍、撤銷方式與資料安全","只要銀行合作，就應永久授權所有帳戶讀取權限","只核對App下載次數即可判斷資料使用安全"],"answer":1,"explain":"逐選項解析：（1）傳輸加密只能降低傳輸風險，不能代替目的、權限與資料保存的評估。；（2）確認誰讀取、讀取哪些資料、用途與撤銷方式，是知情授權的核心。；（3）合作關係不代表所有資料都必須長期授權，仍應遵循最小必要原則。；（4）下載次數不能證明資料蒐集範圍、處理方式及撤銷機制。","source":"貿二潘伊靜金融影片筆記","id":"F025","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"警示帳戶","q":"朋友說「借我帳戶收一筆貨款，會給你5000元」，並保證與詐騙無關。最適當的決策？","options":["只要對方提供身分證影本，就可短期借帳戶收款","先要求朋友簽借用契約，再提供提款卡","拒絕出借帳戶與提款工具，避免成為詐欺或洗錢工具","由自己代收款後立即轉出，便可避免帳戶風險"],"answer":2,"explain":"逐選項解析：（1）身分證影本無法排除不明金流風險，借帳戶仍可能涉及違法。；（2）契約不能把不明金流及帳戶被利用的法律風險消除。；（3）收款用途不明且有報酬誘因，應拒絕並透過正當交易管道處理。；（4）親自轉出也可能形成可疑資金移轉，並非安全替代方式。","source":"防制洗錢20261019","id":"F026","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"資產配置","q":"即將一年後繳學費的學生，有10萬元學費預備金與5萬元長期投資資金。哪項配置原則最合理？","options":["學費與長期資金合併投資，可提高資產配置效率","學費資金優先保留流動性與本金安全，長期資金再投資","學費先買中長天期債券基金，以利率較高換取穩定收益","學費先投入股票型ETF，一年後賣出即可支付"],"answer":1,"explain":"逐選項解析：（1）兩筆資金用途及時間不同，合併可能讓短期學費暴露於市場波動。；（2）一年後確定要用的10萬元應重視流動性及低波動，5萬元才適合依長期目標配置。；（3）中長天期債券基金有利率風險，價格可能在繳費前下跌。；（4）股票型ETF可分散個股風險，但一年內仍可能出現顯著跌幅。","source":"全民金融通","id":"F027","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"信託與保險","q":"單親家長擔心身故後未成年子女一次取得大筆保險金遭不當使用，希望分期支付教育費。哪項安排最切合需求？","options":["將保險金一次交給指定監護人，並以口頭約定分期支付","評估保險金信託，約定受益人與分期給付條件","改由未成年子女直接一次領取保險金，日後自行管理","指定受益人後不另約定管理條件，由親屬自行協調"],"answer":1,"explain":"逐選項解析：（1）一次交付且只靠口頭承諾，難以確保教育費按期專款使用。；（2）可依實際契約設計保險金進入信託後的受益人、用途及分期給付。；（3）一次領取無法直接滿足避免資金被不當動用及定期支付的目標。；（4）指定受益人與後續資金管理是不同問題，缺少管理條款仍有風險。","source":"2026年最新版教學講義_信託制度與信託2.0整合版(1)","id":"F028","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"綜合財務決策","q":"夫妻準備退休，名下有自住房、每月固定收入3萬元、必要支出4.5萬元，子女無法固定支援。哪項做法最合理？","options":["先申請以房養老，等銀行核貸後再估算生活費缺口","先計算每月1.5萬元缺口，評估節流、其他收入與房屋養老方案的成本及居住需求","先賣掉自住房，因為持有房產不會產生現金流","優先投入高配息股票補足1.5萬元缺口，不必調整支出"],"answer":1,"explain":"逐選項解析：（1）尚未確認缺口及貸款成本就申請，可能取得不適合的撥款方案。；（2）每月4.5萬－3萬＝1.5萬元，先量化缺口，再比較節流、收入與房屋融資選項。；（3）出售自宅可能改善資金卻改變居住安排，需與其他方案一起評估。；（4）配息不保證且本金會波動，不能取代對必要支出及現金流的評估。","source":"2026年最新版以房養老講議1027(1)","id":"F029","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融爭議與保險","q":"保戶住院後遭拒賠，保險公司引用「等待期間」條款，但保戶認為業務員投保時未說明。哪項行動最有助於處理爭議？","options":["直接向評議中心申請評議，保單資料可於開庭時再補","保存保單、招攬及醫療紀錄，先向保險公司申訴","先請業務員重新口頭解釋，不必留下書面紀錄","先停繳保費以保留爭議權利，待評議後再恢復"],"answer":1,"explain":"逐選項解析：（1）金融消費爭議原則上應先向金融服務業申訴，且保留證據有助釐清。；（2）保單條款、招攬說明及醫療時點可釐清等待期爭點，先申訴符合程序。；（3）只有口頭溝通難以證明招攬說明與處理時程，應保留紀錄。；（4）擅自停繳可能影響契約效力，與爭議救濟並非同一程序。","source":"2026年最新版金融消費爭議處理流程教學講義(1)","id":"F030","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融消費爭議","q":"阿哲發現銀行推銷的投資型保單與原先告知的風險不符。他已向銀行正式申訴，銀行回覆仍未解決爭議。下列後續做法何者較符合金融消費爭議處理程序？","options":["已收到銀行回覆，應先向主管機關請求直接核定損害金額","保留銷售紀錄與申訴回覆，依規定期限向金融消費評議中心申請評議","改向同業公會要求其直接撤銷投資型保單契約","既已申訴，就可不受期限限制隨時申請評議"],"answer":1,"explain":"逐選項解析：（1）主管機關監理與個案評議救濟不同，不能直接視為核定賠償機制。；（2）保留招攬與申訴證據，依規定期間向評議中心申請，是金融消費爭議管道。；（3）同業公會未必具有個案契約撤銷的法定裁決權。；（4）評議申請有法定期間，不能因曾申訴便認為期限無限制。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F031","official":"https://www.foi.org.tw/Article.aspx?Arti=358&Lang=1","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融消費爭議","q":"小美向銀行借款時，被要求同時購買她不需要的金融商品。銀行說「不買就不受理」，但沒有說明兩者關係。她要評估是否有不當銷售，最重要的查核方向是？","options":["只要附加商品有優惠價格，就可視為借款必要條件","確認是否存在不當搭售、資訊揭露不足，以及該要求是否具有合法合理依據","只要借款人已簽名，就不需要再檢視銷售適合度","先比較附加商品預期報酬，報酬高就能合理搭售"],"answer":1,"explain":"逐選項解析：（1）價格優惠與強制搭售是否合理合法是不同問題。；（2）應查明銀行要求購買的依據、是否充分揭露及是否違反公平待客。；（3）簽名不當然消除不當招攬、資訊不對稱或適合度疑義。；（4）商品報酬高低不能代替審查貸款與附加商品是否存在不當連結。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F032","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"金融消費爭議","q":"投資人發現帳戶遭不明交易，客服先表示系統異常，後來又稱是本人授權。若準備申訴，哪一組資料最能協助釐清爭議？","options":["交易時間與紀錄、授權證據、通知訊息、客服往來紀錄","先向銀行索取交易明細，但刪除手機通知以避免資料外洩","只蒐集交易前後的帳戶餘額，不保留登入與授權紀錄","僅記錄客服電話時間，其他交易紀錄由銀行自行提供"],"answer":0,"explain":"逐選項解析：（1）交易軌跡、授權紀錄與客服回覆可交叉核對是否為本人操作。；（2）刪除通知會流失可核對的時間與授權證據，應安全保存。；（3）餘額能顯示結果，卻不足以辨識授權、設備及交易指令來源。；（4）客服時間有幫助，但仍需交易與授權資料才能釐清爭議。","source":"金融消費爭議處理流程教學講義","review_status":"待教師逐題確認","id":"F033","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"小芳已有足額住院醫療保障，卻因家中主要收入由她負擔，擔心意外身故後家人無法償還房貸。新增保險時應優先評估什麼？","options":["優先增加住院日額險，以增加每次住院的現金補貼","家庭收入中斷風險、負債及扶養責任，再估算適當身故保障缺口","以既有醫療險保額作為身故保障，減少重複保費","先以投資型保單預估收益取代身故保障需求估算"],"answer":1,"explain":"逐選項解析：（1）住院日額主要補貼住院期間支出，不能直接替代身故後家庭長期財務缺口。；（2）應從房貸、扶養責任及收入中斷估算身故保障，再檢視既有保障。；（3）醫療給付與身故給付的保險事故不同，不能將額度直接相加替代。；（4）投資收益不確定，保障缺口應先按家庭責任估算。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F034","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"父親買了實支實付醫療險，住院時使用病房升等與自費醫材，卻以為所有自費支出都能全額理賠。正確的檢核方式是？","options":["先以醫院收據總額申請，再假定保險公司按全額理賠","確認醫療必要性、條款列舉或約定的給付項目、限額及收據等申請條件","只檢查是否住院，病房差額與自費醫材應同一限額處理","先比較兩張保單的總保額，較高者必能理賠全部自費支出"],"answer":1,"explain":"逐選項解析：（1）收據證明支出，不等於每一筆都在承保範圍與限額內。；（2）病房費、醫材及其他醫療費用可能有不同條款、限額與申請要求。；（3）住院事實是必要資訊之一，但不同費用項目與限額須分別核對。；（4）保額高低不能取代條款、除外責任與理賠單據審核。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F035","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"小杰車禍造成對方受傷，也撞壞對方高價攝影器材。他只投保強制汽車責任保險。哪個風險最需要另外評估？","options":["對方財物損失與超出強制險保障範圍的賠償責任","對方攝影器材價值較高，應先向強制險申請財物賠償","只要對方受傷已由強制險處理，其他民事責任也一併終結","可用強制險直接支付自己車輛修理費，無須其他保障"],"answer":0,"explain":"逐選項解析：（1）強制汽車責任保險主要保障交通事故受害人的傷害或死亡，第三人財物損失須另評估。；（2）強制險並非第三人財物損失保險，攝影器材損壞需看其他責任保障。；（3）強制險給付不代表全部民事損害責任必然消失。；（4）自己車輛損失通常不是強制險給付項目，須另看車體險等。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F036","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"保險保障","q":"學生在投保時隱瞞曾接受的重要治療，認為只要按時繳費，保險公司日後一定要理賠。最適當的提醒是？","options":["若業務員代填告知書，要保人就不必核對內容","只要首期保費已繳，保險人便不得審查投保告知","對要保書詢問事項應據實告知；重要不實告知可能影響契約及理賠","只要隱瞞事項與這次住院無關，任何不實告知都不影響契約"],"answer":2,"explain":"逐選項解析：（1）即使由業務員協助填寫，要保人仍應確認告知內容正確。；（2）保費繳納不代表免除依法告知義務，也不當然排除後續爭議。；（3）對書面詢問的重要事項應據實告知；不實告知的法律效果須依具體法定要件判斷。；（4）不實告知是否影響契約涉及重要性、因果及法定期間等要件，不能一概而論。","source":"保險完整教學講義","review_status":"待教師逐題確認","id":"F037","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"信託與高齡金融","q":"獨居長者擔心失智後遭人盜領，想保留房租收入作為長期照護費，並希望有定期報告。何種安排最切合目標？","options":["評估安養信託，約定受託管理、給付條件與監督機制","將房租直接匯給家人管理，並以口頭約定每月照護費","以共同帳戶讓親屬自行提領房租，作為長期照護備用金","把所有房租改投入高股息基金，依配息支付照護費"],"answer":0,"explain":"逐選項解析：（1）信託可依契約約定專款用途、給付與管理報告，較符合照護及監督需求。；（2）親屬代管可行性需評估，但單靠口頭約定缺少明確給付及監督制度。；（3）共同帳戶可能方便提領，卻難保證專款專用及定期監督。；（4）配息與本金都可能波動，無法取代有明確給付與監督條件的管理機制。","source":"信託制度與信託2.0整合版","review_status":"待教師逐題確認","id":"F038","quality_review":"第二批：重寫干擾選項及逐選項解析；待官方法規及教師終審"},{"topic":"信託與高齡金融","q":"母親想為成年身障子女保留生活費，擔心一次交付遺產被不當使用。下列何種設計最符合需求？","options":["透過適當信託契約設定分期給付、用途及受益人保障","直接把全部財產換成高槓桿衍生商品","所有款項一次支付給任何聲稱可代管的人","把財產登記在遠親名下，僅以口頭承諾管理"],"answer":0,"explain":"逐選項解析：（1）適當信託可設計受益人、用途與分期給付機制，仍需評估費用及契約。；（2）高槓桿衍生商品可能大幅波動，不適合作為保障固定生活費的替代方案。；（3）未經審核的私人代管缺乏可靠的受託義務及監督機制。；（4）僅靠遠親口頭承諾，無法確保資金按受益人需要使用。。","source":"信託制度與信託2.0整合版","review_status":"待教師逐題確認","id":"F039","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"信託與高齡金融","q":"退休夫妻考慮以房養老：希望繼續住在自宅，但子女擔心未來繼承與清償。決策前哪組資訊最關鍵？","options":["認為貸款核准就代表房屋立即由銀行取得所有權","只比較銀行廣告中每月最高可領金額","因為房價可能上漲，所以不用閱讀契約","撥款方式、利息累積、抵押權、到期或身故清償條件及繼承影響"],"answer":3,"explain":"逐選項解析：（1）以房養老通常涉及以不動產設定擔保取得貸款，非核貸即移轉所有權。；（2）最高撥款額不足以反映利息累積、還款條件與繼承影響。；（3）房價可能變動，仍須理解擔保及清償契約。；（4）應完整比較撥款、計息、抵押、到期清償及繼承安排。。","source":"以房養老教學講義","review_status":"待教師逐題確認","id":"F040","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"防制洗錢","q":"公司開戶時，登記負責人說真正出資及決策者在海外，但拒絕提供控制關係文件。銀行應如何處理？","options":["請登記負責人簽切結書即可完全免除審查","把公司帳戶先開好，之後永遠不必更新客戶資料","要求釐清實質受益人及資金用途，未能完成審查時依規定處理","只看公司有沒有營業登記即可開戶"],"answer":2,"explain":"逐選項解析：（1）切結書不能取代必要的實質受益人辨識。；（2）客戶審查包含持續更新，不能開戶後永久免除。；（3）應釐清實際控制與資金用途，無法完成必要審查時依規範處理。；（4）營業登記不一定揭露真正控制人及資金來源。。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F041","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"防制洗錢","q":"學生把自己的帳戶借給網友收取「代購款」，對方承諾每天支付報酬，還要求提款交付現金。最應注意什麼？","options":["只要有報酬，出借帳戶就一定合法","因為沒有親自詐騙，所以絕對不會涉及任何責任","可能成為詐欺或洗錢金流工具，應拒絕並保存聯繫紀錄","只要對方提供暱稱，就能證明款項合法"],"answer":2,"explain":"逐選項解析：（1）收取報酬不代表出借帳戶的行為合法。；（2）是否涉及責任須看具體行為與法律，不能因未直接接觸被害人就一概排除。；（3）帳戶可能被用來收受或移轉不法款項，應拒絕並保存證據。；（4）網路暱稱無法證明真實身分與款項合法性。。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F042","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"防制洗錢","q":"賣家收到疑似誤匯款，對方急著要求退到第三人帳戶。哪個處理流程最能降低風險？","options":["把款項換成虛擬資產轉出，讓對方更快收到","只要對方傳身分證照片，就不必確認款項來源","先匯到對方指定帳戶再說，避免客訴","透過銀行查證原始款項與退款方式，不依陌生指示轉至第三人帳戶"],"answer":3,"explain":"逐選項解析：（1）換成虛擬資產轉出會增加追查與追回難度。；（2）證件照片可能遭冒用，無法單獨證明交易合法。；（3）先轉第三人帳戶可能形成可疑金流並造成損失。；（4）透過銀行核對原交易並依正式程序處理較安全。。","source":"防制洗錢與帳戶安全講義","review_status":"待教師逐題確認","id":"F043","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"數位金融安全","q":"小華收到自稱銀行客服的電話，要求提供一次性驗證碼以解除「異常交易」。他此時最合適的行動是？","options":["停止通話，從銀行官方網站或卡片背面電話自行聯絡查證","將驗證碼提供給對方，因為客服已說出姓名","請對方先匯一元驗證，就可以交出驗證碼","把驗證碼傳到對方提供的社群帳號以留存紀錄"],"answer":0,"explain":"逐選項解析：（1）應中止通話，從獨立取得的官方電話查證，不透露驗證碼。；（2）詐騙者可能掌握姓名等資料，不能因此交付一次性驗證碼。；（3）小額匯款不證明對方為銀行客服。；（4）傳到社群帳號仍是交付敏感驗證碼，風險相同。。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F044","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"數位金融安全","q":"學生在咖啡廳公共 Wi-Fi 登入網銀，瀏覽器出現憑證警告，網站網址也與官方不同。最合理的做法？","options":["停止輸入資料，改用可信網路與官方入口，必要時變更憑證並通報銀行","忽略警告，因為公共 Wi-Fi 一定安全","只要畫面有銀行標誌，就能視為官方網站","把網銀密碼傳給店員協助確認"],"answer":0,"explain":"逐選項解析：（1）憑證警告與網址異常都是高風險訊號，應停止操作並查證。；（2）公共Wi-Fi不保證安全，不能忽略瀏覽器警示。；（3）銀行標誌容易被偽造，應核對網址與憑證。；（4）網銀密碼不應交給店員或其他第三人。。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F045","quality_review":"第四批：四個選項與既有正解逐一檢視，已改寫解析；待教師與官方資料終審"},{"topic":"數位金融安全","q":"家長發現孩子手機的支付 App 不明扣款，且帳戶已綁定多張卡片。最優先的處理組合是？","options":["先確認孩子是否曾授權付款，確認前暫不處理綁定卡片","僅解除手機上的App登入，保留原綁定卡片與支付權限","立即鎖定支付工具並聯絡支付業者及發卡機構，保存交易紀錄","先對所有扣款申請退貨，不必確認是否為未授權交易"],"answer":2,"explain":"逐選項解析：（1）查證交易來源重要，但疑似未授權扣款應同時先阻止後續交易。；（2）移除本機登入不一定能停止遠端支付權限或已綁定的付款工具。；（3）兼顧止損、向適當機構通報及保全證據，並依交易性質辦理爭議處理。；（4）退貨與未授權交易爭議的程序不同，仍需確認交易及付款管道。。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F046","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"綠色金融","q":"某企業宣稱產品「零碳排」，但只計算自家工廠用電，未揭露原料運輸及供應鏈排放。投資人最應質疑什麼？","options":["只要企業購買碳權，便可將未盤查的供應鏈排放一律視為零","可先接受工廠用電盤查，但應要求清楚標示宣稱僅涵蓋的範圍","即使產品排放邊界不完整，第三方查證工廠用電便足以支持整體零碳排","要求揭露產品生命週期的盤查邊界、重大排放來源及查證依據"],"answer":3,"explain":"逐選項解析：（1）碳權抵換不能代替界定與盤查實際排放，且抵換品質須另評估。；（2）限定範圍的資訊可以有參考價值，但不能直接支持未限定的『產品零碳排』宣稱。；（3）查證部分數據不代表產品全生命週期排放已經獲得查證。；（4）產品零碳宣稱應核對邊界、重大間接排放及減量／抵換方法，避免誤導。。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F047","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"綠色金融","q":"高排放鋼鐵公司計畫以貸款汰換設備，提出可量測減碳路徑及年度驗證指標。金融機構應如何評估？","options":["因企業目前屬高排放產業，應直接視所有改善投資為漂綠","核對基準排放、減量里程碑、資金用途與第三方追蹤機制","只要公司承諾未來淨零，銀行就可免除信用風險評估","只評估汰換設備的採購價格，不需確認設備實際減排成效"],"answer":1,"explain":"逐選項解析：（1）轉型金融可支持高排放產業的可信減碳計畫，不能僅以現況否定。；（2）可驗證基準、路徑、用途與追蹤結果，有助同時評估轉型可信度與違約風險。；（3）環境目標與借款人的償債能力仍須分別審查。；（4）設備支出不等於減碳成果，須檢視實際排放改善。。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F048","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"綠色金融","q":"基金廣告稱「投資綠色產業，因此保證獲利且沒有市場風險」。投資人應如何理解？","options":["永續主題基金可降低部分轉型風險，因此不必再查持股集中度","基金若符合ESG標準，政府便承擔投資本金損失","應比較基金的投資組合、費用、風險揭露與宣傳承諾是否合理","只要基金每月配息，便能證明沒有市場價格風險"],"answer":2,"explain":"逐選項解析：（1）永續選股不能排除產業集中、估值或流動性風險。；（2）ESG分類不代表政府提供本金保證。；（3）投資永續產業仍承受市場波動，『保證獲利』應要求具體契約依據。；（4）配息可能伴隨淨值變化，不能當作保本證明。。","source":"綠色金融與轉型金融講義","review_status":"待教師逐題確認","id":"F049","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"投資與風險","q":"兩名同學都預計一年後繳交學費；甲把全部資金放進高波動股票，乙把必要學費留在低波動高流動性工具。哪個判斷較合理？","options":["甲的股票可望有較高報酬，故短期學費也應全部投資","乙保留必要學費的流動性，較能避免繳費前被迫低價賣股","只要甲持有三檔不同股票，一年內的學費風險就與現金相同","甲乙同為一年期，因此兩人的資金安排應完全一致"],"answer":1,"explain":"逐選項解析：（1）較高預期報酬通常伴隨波動，不能保證短期支付需求。；（2）短期確定支出優先考慮可用性與價格穩定，其他資金再依風險承受度配置。；（3）分散個股仍有整體市場風險，無法取代短期必要現金。；（4）同樣期限不代表財務緩衝與承受損失能力相同。。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F050","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"投資與風險","q":"投資人買入追蹤同一產業的三檔 ETF，認為「買三檔就是高度分散」。哪個分析較正確？","options":["三檔ETF由不同投信發行，因此產業集中風險已消失","三檔ETF管理費不同，因此持股報酬的相關性會降低","三檔ETF若追蹤不同指數名稱，就不需比對實際成分股","即使有三檔，仍應比對成分股重疊與產業權重"],"answer":3,"explain":"逐選項解析：（1）發行人不同不等於投資標的不同，仍可能持有同一批股票。；（2）管理費影響成本，不會直接改變標的之間的報酬相關性。；（3）指數名稱不同仍可能有高度重疊持股。；（4）分散效果取決於實際曝險與相關性，而非基金檔數。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F051","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"投資與風險","q":"某人借錢投資高槓桿商品，帳面報酬率看似高於借款利率，卻沒有預留追繳保證金的現金。最大盲點是？","options":["以預期年報酬減借款年利率即可衡量全部風險","只要初始保證金足夠，就不用考慮日後追繳","需評估槓桿放大虧損及保證金追繳時的現金需求","借款投資的最大風險僅在於手續費"],"answer":2,"explain":"逐選項解析：（1）平均報酬無法呈現中途大幅回撤及追繳保證金風險。；（2）保證金要求會隨行情變動，初始充足不代表後續不需補繳。；（3）槓桿與強制平倉風險會使資金不足時被迫在不利價格賣出。；（4）交易費用是成本之一，但不足以涵蓋槓桿與流動性風險。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F052","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"利率與債券","q":"小明持有固定票息長期債券，市場利率突然上升。他想立即賣出，應注意什麼？","options":["發行人未違約，提前賣出通常可取得票面本金","市場利率上升時，固定票息債券的市價通常也上升","固定票息債券市價通常下降，長存續期間更敏感","固定票息債券的票息會隨市場殖利率即時調整"],"answer":2,"explain":"逐選項解析：（1）到期償還與提前市價賣出不同，提前出售可能有資本損失。；（2）新發債券提供較高殖利率時，舊券價格通常需要下調才具競爭力。；（3）殖利率與固定票息債券價格通常反向變動，長存續期間敏感度較高。；（4）固定票息通常依契約不變，變動的是市場價格與到期殖利率。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F053","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"利率與債券","q":"投資人認為「債券基金有配息，所以本金完全不會跌」。最適當的反駁是？","options":["配息率高代表該基金持有債券的信用評等較高","應同時看配息與淨值變化，並評估利率及信用風險","配息可以直接視為投資人額外增加的總資產","月配息能降低基金持有債券的違約機率"],"answer":1,"explain":"逐選項解析：（1）配息率無法直接推論持債信用品質。；（2）總報酬須把配息與淨值漲跌合併評估，債券基金仍承擔風險。；（3）除息後淨值通常會相應調整，配息不等於憑空增加財富。；（4）配息頻率不會改變發行人的償債能力。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F054","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"利率與債券","q":"兩檔債券基金信用評等相近，但 A 存續期間約 2 年，B 約 10 年。若預期市場殖利率可能快速上升，哪個判斷較合理？","options":["信用評等相近時，兩基金的利率敏感度也必然相同","存續期間較短的A，在升息時通常承受較大的價格波動","B存續期間較長，因此殖利率上升時較容易有資本利得","其他條件相近時，B對殖利率上升的價格跌幅通常較大"],"answer":3,"explain":"逐選項解析：（1）信用風險與利率風險是不同構面。；（2）較短存續期間通常意味利率敏感度較低。；（3）較長存續期間通常放大升息帶來的價格跌幅，而非利得。；（4）存續期間衡量價格對殖利率變動的敏感度，B約10年高於A約2年。","source":"金融商品分類整理講義","review_status":"待教師逐題確認","id":"F055","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"就學貸款","q":"學生畢業後尚未找到穩定工作，擔心就學貸款開始還款。他最合理的處理方式是？","options":["向代辦繳費，以取得免還款保證","等銀行主動通知違約後，再討論還款計畫","將貸款轉成循環信用，以延後所有成本","主動查詢承貸銀行的緩繳、展延與申請資格"],"answer":3,"explain":"逐選項解析：（1）私人代辦無法保證依法免除就學貸款。；（2）拖延可能增加逾期與信用風險，應在期限前確認。；（3）以高成本循環信用替代學貸，可能使負擔惡化。；（4）應依實際制度與個人條件確認可申請措施，並注意期限。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F056","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"就學貸款","q":"同學收到「教育部補助結清就學貸款」簡訊，要求點擊短網址、輸入銀行密碼與簡訊驗證碼。哪個處理最妥當？","options":["不點連結，改由銀行或主管機關官方網站與電話核實","先登入簡訊連結，若畫面正常再輸入驗證碼","回覆簡訊要求對方出示公文照片後即可提供密碼","把簡訊轉給同學請他先測試連結是否安全"],"answer":0,"explain":"逐選項解析：（1）短網址與索取密碼、OTP是警訊，應走獨立官方管道查證。；（2）偽造網站也可能外觀正常，輸入驗證碼可能授權交易。；（3）公文圖片可能偽造，不能據此交付密碼。；（4）轉傳可疑連結讓他人測試，反而擴大風險。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F057","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"就學貸款","q":"家長想替學生支付學費，考慮就學貸款或刷卡分期。哪個比較方式最完整？","options":["比較適用利率、費用、還款期限與家庭每月現金流","以兩方案每月最低付款額直接判斷總成本","先比較刷卡回饋，將其他費用留待簽約後確認","只比較借款名目利率，忽略分期手續費與提前清償條件"],"answer":0,"explain":"逐選項解析：（1）完整比較須涵蓋總成本、付款時點、資格與家庭承受能力。；（2）低月付可能來自拉長年限，總費用反而增加。；（3）回饋未必抵得過分期費用及違約成本。；（4）名目利率不含所有費用，可能誤判實際負擔。","source":"就學貸款教學講義","review_status":"待教師逐題確認","id":"F058","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"理專倫理","q":"理專建議高齡客戶將全部退休存款換成高風險商品，理由是「近期漲很多」。最重要的缺失是？","options":["高齡者應完全避免任何具有價格波動的商品","過去一年績效最佳者通常最適合退休族","應先確認風險承受度、流動性與退休現金流需求","只要商品風險揭露文件很長，就代表已完成適合度評估"],"answer":2,"explain":"逐選項解析：（1）是否適合須看個人財務與需求，不能僅以年齡一概排除。；（2）短期績效不能代替對風險與資金需求的評估。；（3）將全部退休金集中高風險商品，忽略生活支出與風險承受能力。；（4）形式上的揭露不等於已了解客戶並確認商品適合。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F059","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"理專倫理","q":"客戶長期旅居海外，要求理專保管印鑑、密碼並代下單。哪個做法較符合內控原則？","options":["口頭同意即可由理專長期保管客戶密碼","可交給另一名員工保管，以降低理專個人責任","可用客戶私人通訊軟體傳送密碼，留下紀錄即可","應拒絕私下保管密碼或代操，改走合規授權程序"],"answer":3,"explain":"逐選項解析：（1）客戶口頭同意不能取代內控與資安要求。；（2）將密碼交其他員工同樣增加憑證外洩風險。；（3）通訊留痕不等於可合法或安全傳送密碼。；（4）正式授權與身分驗證程序可降低未授權交易及利益衝突。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F060","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"理專倫理","q":"銀行推出複雜結構型商品，理專只展示最高可能報酬，沒有說明最差情境及提前贖回限制。何者最值得關注？","options":["只揭露最高可能報酬，客戶可自行推測最差情境","應完整揭露可能損失、提前退出限制及適合度資訊","只要商品通過銀行內部審查，便可略過個別風險說明","提前贖回條件僅影響流動性，不影響投資決策"],"answer":1,"explain":"逐選項解析：（1）僅呈現最好情境，無法讓投資人理解下檔風險。；（2）報酬、損失情境及退出限制都可能影響決策，需充分說明。；（3）商品內部審查不能取代對客戶的適當揭露。；（4）流動性與可能的提前退出損失是重要投資條件。","source":"理專十誡與警示帳戶講義","review_status":"待教師逐題確認","id":"F061","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合財務規劃","q":"家庭每月收入 8 萬元，必要支出 5 萬元，信用卡循環利息負擔高，卻打算先借錢投入高波動商品。最合理的財務優先順序是？","options":["先借款投資，再用預期獲利處理循環信用","維持循環信用，只需把投資分散到多檔ETF","優先處理高成本負債與預備金，再規劃風險投資","先降低每月必要支出到零，再決定是否還款"],"answer":2,"explain":"逐選項解析：（1）投資報酬不確定，不能當作償還高息債的保證。；（2）分散投資不會消除信用卡循環利息負擔。；（3）優先處理確定的高利息成本與流動性需求，通常更穩健。；（4）必要支出不可能任意歸零，應做可行的收支調整。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F062","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合財務規劃","q":"學生存下 6 萬元，半年後要繳 4 萬元學費，另有 2 萬元可長期投資。哪個配置最符合用途？","options":["將學費與長期投資資金平均配置於高波動基金","先確保半年後學費可動用，再評估剩餘資金長期投資","將六萬元全部放入有提前解約費的長期商品","因有半年時間，學費資金可承受與退休金相同風險"],"answer":1,"explain":"逐選項解析：（1）短期確定支出不宜以高波動投資承擔資金缺口風險。；（2）四萬元有明確半年用途，應重視本金穩定及流動性。；（3）提前解約成本可能妨礙按期繳費。；（4）半年與長期投資期限不同，承受波動能力也不同。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F063","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合財務規劃","q":"退休者持有大量單一公司股票，每月靠賣股支付生活費。若股市連續下跌，最值得事前處理的問題是？","options":["分散單一公司風險，並預留可支付生活費的流動資金","提高單一股票比重，以避免下跌時賣出太多股數","只需估計股票長期平均報酬，不必安排短期現金流","改用股票質押支付所有生活費，即可消除市場風險"],"answer":0,"explain":"逐選項解析：（1）集中持股及下跌時被迫賣股，可能形成退休提領順序風險。；（2）加重集中可能放大公司特有風險。；（3）平均報酬無法保證每月支出時點有足夠資金。；（4）股票質押仍有利息與擔保品追繳風險。","source":"簡單財務規劃筆記","review_status":"待教師逐題確認","id":"F064","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"金融科技","q":"兩家銀行數位帳戶提供不同活存優惠：甲僅在指定額度內有高利率，乙利率略低但限制較少。學生要存緊急預備金，最適合怎麼比較？","options":["按實際存款額度計算利息，並比較期限、限制及提領便利","以廣告最高利率直接乘全部存款，忽略優惠額度上限","只比較銀行名稱，因同一類數位帳戶利率相同","只看開戶贈品，緊急提領條件可等需要時再查"],"answer":0,"explain":"逐選項解析：（1）緊急預備金應兼顧實得利息、優惠條件及可即時使用性。；（2）超過優惠上限的部分可能適用較低利率。；（3）各銀行數位帳戶的優惠與條件不同。；（4）贈品不能取代對流動性與提領限制的評估。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F065","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"金融科技","q":"小王把錢從銀行帳戶轉到電子支付帳戶，誤以為所有電子支付餘額都與銀行存款享有完全相同的存款保險。應如何判斷？","options":["區分銀行存款與電子支付款項，查明各自保管與保障制度","電子支付業者若與銀行合作，餘額即全部轉為個人銀行存款","電子支付款項可轉帳，所以與定存享有相同保障","只要支付業者受監理，就等同適用存款保險上限"],"answer":0,"explain":"逐選項解析：（1）法律性質與保障制度應分別確認，不可直接把支付餘額視為存款。；（2）合作銀行與使用者對支付業者的債權性質不一定相同。；（3）能否轉帳不是判斷存款保險適用的標準。；（4）受監理不代表該款項必然是存保承保的存款。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F066","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"金融科技","q":"有人在社群宣稱「去中心化金融商品由智慧合約執行，因此完全沒有風險」。哪個判斷最合理？","options":["智慧合約可自動執行，因此不必檢查資產價格風險","區塊鏈記錄可追溯，因此能保證每筆交易可撤銷","去中心化降低部分中介依賴，也同步排除治理風險","仍須評估程式漏洞、價格波動、預言機與治理風險"],"answer":3,"explain":"逐選項解析：（1）自動執行不會消除標的價格波動。；（2）鏈上可追溯與交易可撤銷是不同概念。；（3）沒有傳統中介不代表沒有協議治理或權限風險。；（4）智慧合約與外部資料、治理及資產本身都可能帶來損失。","source":"金融科技與數位帳戶筆記","review_status":"待教師逐題確認","id":"F067","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"家庭同時面臨房貸寬限期結束、長輩照護費增加及投資虧損。若只能先做一項財務檢視，哪個最能幫助後續決策？","options":["先估算房屋市價，再假設所有支出可以延後","先增加投資槓桿，以彌補帳面虧損","先辦新信用貸款，暫不盤點原有每月負債","先編列未來12個月收支與還款表，再判斷缺口"],"answer":3,"explain":"逐選項解析：（1）房屋價值不能直接顯示每月能否負擔房貸與照護費。；（2）加槓桿可能擴大虧損，未釐清現金流前不宜先做。；（3）新增貸款可能使負擔增加，應先掌握現金流。；（4）同時盤點寬限期後月付與照護費，才能判斷資金缺口及處置順序。","source":"財務規劃、以房養老、信託講義","review_status":"待教師逐題確認","id":"F068","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"學生打算投資一檔標榜 ESG 的海外債券基金，需兩年後支付留學費用。基金以外幣計價且有提前買回費。哪個評估最完整？","options":["因標榜ESG，基金可視為沒有匯率風險","配息率高於學費成長率，便可確保兩年後本金足夠","應同時檢查匯率、債券風險、買回成本及兩年期限","基金以外幣計價，因此可直接鎖定兩年後台幣學費金額"],"answer":2,"explain":"逐選項解析：（1）ESG標示不代表免除外幣與市場風險。；（2）配息率不是保證報酬，也無法排除淨值下跌。；（3）短期確定用途須綜合衡量價格、匯率與退出費用。；（4）外幣基金的台幣價值仍受匯率波動影響。","source":"綠色金融、金融商品分類與費用講義","review_status":"待教師逐題確認","id":"F069","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"退休者想以房養老補充生活費，同時設安養信託管理撥款。子女認為兩者只能擇一。哪個分析較合理？","options":["設立安養信託後，以房養老借款利息即可免除","以房養老與安養信託都只能提供一次性現金","信託管理人必須無償承擔以房養老所有還款責任","可分別評估以房養老現金流與安養信託的資金管理功能"],"answer":3,"explain":"逐選項解析：（1）信託安排不會自動消除貸款利息或其他成本。；（2）以房養老可能分期撥款，信託則重在財產管理與給付安排。；（3）信託契約不代表受託人無條件承擔借款人債務。；（4）兩者目的不同，是否搭配需依契約、費用與家庭需求評估。","source":"以房養老、信託制度講義","review_status":"待教師逐題確認","id":"F070","quality_review":"第三批：人工逐選項重寫；待官方法規與教師終審"},{"topic":"綜合決賽題","q":"公司推出「保本高收益」虛擬資產商品，要求投資人匯款到個人帳戶，還宣稱有國際金融專家背書。最合理的處置？","options":["先核對交易機構、商品監理狀態及收款帳戶，再決定是否接觸","先小額試投，若順利出金就代表商品已受合法監理","要求業者出示專家推薦影片，影片真實即可視為保本","先把款項轉至指定個人帳戶，之後再向主管機關確認"],"answer":0,"explain":"逐選項解析：（1）高收益保本宣稱與個人收款帳戶均是風險警訊，應使用獨立官方管道查證。；（2）詐騙也可能讓早期小額出金以取得信任，不能據此推定安全。；（3）專家推薦與投資商品的合法性及保證責任是不同問題。；（4）匯款後可能難以追回，應先確認身分及資金流向。。","source":"防詐、金融科技與理專倫理講義","review_status":"待教師逐題確認","id":"F071","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"綜合決賽題","q":"家長希望為未成年子女存教育基金，卻同時接到假冒銀行的高利優惠簡訊。哪個決策最符合金融安全與資產規劃？","options":["先以簡訊內連結登入，確認是銀行網站後再決定是否存款","透過自行開啟的銀行官方管道核實，再依教育支出時程安排資金","只要優惠利率高於通膨，就可忽略教育金的使用期限","將教育金全數轉為優惠存款，因銀行廣告不會有額度限制"],"answer":1,"explain":"逐選項解析：（1）外觀相似的登入頁面可能是釣魚網站，應避開訊息中的可疑連結。；（2）先辨別真偽，再比較利率適用條件、流動性及教育支出時程。；（3）利率與通膨比較不能取代安全查證及短期資金管理。；（4）優惠常有額度與任務限制，不能假設所有資金均適用。。","source":"數位安全、財務規劃講義","review_status":"待教師逐題確認","id":"F072","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"綜合決賽題","q":"投資人看到基金今年報酬率 8%，但支付一次性申購費，基金另有持續費用；同年物價上漲 3%。要判斷購買力是否增加，應採用什麼順序？","options":["先將8%直接減去3%，便得到已扣除所有費用的實質報酬","先估計申購及持續費用對實際淨報酬的影響，再換算購買力","先看基金當年度現金配息率，配息超過3%即可判定實質獲利","只要物價上漲3%，任何基金都必然出現實質損失"],"answer":1,"explain":"逐選項解析：（1）8%可能尚未完整反映個人負擔的申購費；且實質報酬須以價格水準調整。；（2）先取得實際投資淨結果，再用(1+淨報酬)/(1+通膨)-1估計實質報酬。；（3）配息不是完整總報酬，還須看淨值變化與費用。；（4）若扣費後報酬高於通膨，實質購買力仍可能增加。。","source":"金融商品費用與財務規劃講義","review_status":"待教師逐題確認","id":"F073","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"貸款成本與借款決策","q":"大學生想買電腦，A方案零利率卻有一次性帳管費，B方案收利息但免帳管費；兩者期數相同。應如何選擇？","options":["只比較兩方案每月應繳金額，較低者成本必然較低","以相同期數比較利息、帳管費與總付款額，並檢查每月負擔","將帳管費當作購買商品的必要成本，卻不計入融資比較","以標示零利率作為選擇A方案的充分理由"],"answer":1,"explain":"逐選項解析：（1）月付較低可能是費用結構不同，應比較總付款。；（2）同期間將所有必要融資費用納入比較，才能辨識實際成本。；（3）即使費用名為帳管費，仍影響取得分期資金的總成本。；（4）零利率不等於零融資成本，須檢查其他費用。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F074","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"家庭考慮信貸整合卡債，銀行提出較低月付但還款期限延長一倍。應先查什麼？","options":["只比較整合後每月最低還款額","估算整合前後總利息、費用與清償期限，再評估月付能力","以較長還款期間判斷信用風險必然下降","因整合後利率較低，就認定總支付金額必較少"],"answer":1,"explain":"逐選項解析：（1）月付下降可能只是期限拉長，總支出未必降低。；（2）應同時比較總成本與每月現金流，避免以低月付掩蓋長期利息。；（3）期限拉長不代表總債務負擔及風險必然降低。；（4）利率較低但期限加倍，累積利息仍可能較高。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F075","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"某銀行宣稱首三個月超低利率，之後恢復機動利率。借款人最應評估什麼？","options":["以首三個月優惠利率計算整期利息","把優惠結束後的利率、調整機制及升息情境納入還款測試","認為利率恢復機動後，每月還款金額仍固定不變","只比較優惠期間的總利息，忽略其後的本金餘額"],"answer":1,"explain":"逐選項解析：（1）短期優惠不能代表整段借款成本。；（2）應評估後續利率與月付變化，並保留現金流緩衝。；（3）機動利率可能調整，實際月付須依契約確認。；（4）後續未清償本金仍會產生利息，是總成本的重要部分。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F076","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"甲銀行核貸快但收提前清償違約金，乙銀行利率略高卻可隨時還款。準備半年後獲獎金的上班族怎麼選？","options":["優先選核貸速度快的甲，因為獎金與違約金無關","選乙，因為任何提前清償限制都代表甲必較貴","只比較兩銀行第一個月應繳利息","依半年後預計還款金額，計入提前清償費用比較兩方案"],"answer":3,"explain":"逐選項解析：（1）核貸速度不會消除提前還款可能產生的費用。；（2）乙可能較合適，但仍須比較利率、違約金及實際還款時點。；（3）只看首月利息無法反映預計提前清償的成本。；（4）依預計持有期限估算總利息與違約金，較能比較實際成本。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F077","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"小店主借營運週轉金，貸款月付雖低，卻要求旺季結束時一次還大筆本金。應先確認什麼？","options":["以全年平均營收判定到期一定能償還本金","只計算每月利息，不計入到期一次清償本金","編列逐月現金流及淡季情境，預先確認大筆本金來源","認為銀行願意核貸就表示營運現金流足以還款"],"answer":2,"explain":"逐選項解析：（1）平均營收可能掩蓋淡旺季及資金回收時點。；（2）到期本金仍是契約義務，不能只計利息。；（3）應核對還款日與應收帳款、存貨及現金流入時點。；（4）核貸不等於未來現金流必然充足。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F078","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"學生以分期購買手機，業者把服務費拆到每月帳單，標示利率為零。應如何判斷？","options":["只看標示年利率0%，認為分期成本一定為零","把每月服務費當作商品售後費用，不納入付款比較","加總各期服務費與其他必要支出，比較現金購買及分期總價","以分期金額較小，推定總支付額一定低於現金價"],"answer":2,"explain":"逐選項解析：（1）零名目利率仍可能有必要附加費用。；（2）若服務費為取得分期所需，應納入融資成本評估。；（3）應比較同一商品、同一期間的總支付額及還款能力。；（4）每期金額小不代表累計付款少。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F079","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"家長替子女貸款，銀行要求連帶保證。家長最需要評估哪個後果？","options":["只要子女按時繳款，家長就沒有任何保證風險","連帶保證只影響信用評分，不會形成金錢責任","查明保證範圍、主債務人違約後的請求風險與自身負擔能力","只需比較貸款利率，不必閱讀保證契約"],"answer":2,"explain":"逐選項解析：（1）未來是否違約存在不確定性，仍應事前評估。；（2）保證契約可能形成實際代償義務，不僅是信用評分問題。；（3）應理解保證責任與可被請求的範圍，必要時諮詢專業意見。；（4）保證條款是獨立且重要的法律與財務風險來源。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F080","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"新創公司向兩家銀行詢價，一家利率較低但要求抵押設備，另一家無擔保利率較高。應如何比較？","options":["只選利率較低的擔保貸款，因抵押品不會影響營運","比較總融資成本、設備抵押限制與違約時的營運衝擊","只選無擔保貸款，因為較高利率必然帶來較高獲利","依核貸速度決定，不考慮設備是否為核心生產資產"],"answer":1,"explain":"逐選項解析：（1）抵押設備可能限制處分，違約時也可能影響營運。；（2）需同時評估融資費用、擔保品價值與資金風險。；（3）無擔保不等於資金用途的報酬或風險較佳。；（4）核心設備受限制可能造成重大營運風險。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F081","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"貸款成本與借款決策","q":"某人已有房貸，又想借信貸投資。即使預期投資報酬高於利率，應先檢查什麼？","options":["只比較投資預期報酬率與信貸名目利率","以房屋現值高於貸款餘額，認定可承受任何投資損失","以過去股市平均報酬，假設未來每月均可償還貸款","測試投資大跌與收入中斷時，是否仍能負擔房貸及信貸"],"answer":3,"explain":"逐選項解析：（1）預期報酬不保證實現，且借款成本及還款日期固定。；（2）房產價值不等於可隨時動用的還款現金。；（3）平均報酬不能代表每月現金流，也無法排除市場下跌。；（4）槓桿投資應優先檢查債務負擔、流動性與壓力情境。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F082","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"新婚夫妻準備買房，寬限期內可輕鬆付息，但第三年本金攤還後月付提高。應先做什麼？","options":["依寬限期後本息攤還金額編列長期預算，並留緩衝","用前兩年的利息支出推算第三年以後的月付金","將寬限期視為本金已攤還一部分，因此不必重新試算","以未來房價上漲金額取代每月還款現金流"],"answer":0,"explain":"逐選項解析：（1）本金開始攤還後月付可能明顯增加，須提早試算。；（2）寬限期只繳利息時，月付通常低於後續本息攤還。；（3）只繳利息一般不會減少本金。；（4）房價變動不會自動產生支付每月房貸的現金。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F083","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"家庭預期孩子兩年後上幼兒園，房貸寬限期也同時結束。應優先評估什麼？","options":["只估計托育費，因為房貸已在兩年前核准","合併托育費與寬限期後新月付，測試家庭現金流","將孩子上幼兒園的費用視為一次性支出，不必編入月預算","假設寬限期後仍只繳利息，以避免高估支出"],"answer":1,"explain":"逐選項解析：（1）同時增加的房貸支出不能忽略。；（2）多項固定支出在同一時點增加，應整體評估。；（3）托育費可能為持續性支出，須依實際情況預算。；（4）本金攤還開始後月付可能上升。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F084","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"房貸採機動利率，借款人只看目前利率估算未來二十年付款。最適當的修正是？","options":["以目前利率乘以20年本金，當作固定總利息","只測試利率下降情境，以估計最低可能月付","加入利率上升情境並計算月付變動及預備金需求","只要目前月付可負擔，就認為未來收入與利率不會改變"],"answer":2,"explain":"逐選項解析：（1）機動利率可能改變，簡單乘法也無法代表攤還現金流。；（2）只看有利情境不足以管理升息風險。；（3）壓力測試有助評估不同利率下的償還能力。；（4）未來收入與利率均有不確定性。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F085","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"買房時仲介說管理費、房屋稅及修繕費都可等入住再考慮。購屋者應如何處理？","options":["只比較頭期款與房貸利率，持有費等入住後再說","把管理費、稅費與修繕準備納入年度住房預算","把修繕費視為房屋升值時必然可回收的投資","因管理費每月固定，推定其他住房成本也都固定"],"answer":1,"explain":"逐選項解析：（1）持有成本會影響購屋後的現金流。；（2）住房總成本包含定期與不定期費用。；（3）修繕費可能只是維持房屋使用狀態，未必能回收。；（4）稅費與修繕等支出不一定固定。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F086","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"家庭把全部存款用作頭期款，交屋後完全沒有預備金。哪個調整最合理？","options":["保留生活費及緊急預備金，再重新評估可負擔頭期款","先將存款全數投入頭期款，再用信用卡支應突發支出","以未來房價上漲作為緊急預備金的替代品","只要月付低於薪資一半，就不必保留現金"],"answer":0,"explain":"逐選項解析：（1）購屋後仍可能有失業、修繕及醫療等緊急支出。；（2）高成本短期借款可能加重財務壓力。；（3）房屋不易即時變現且價格可能波動。；（4）月付比例不能取代流動性準備。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F087","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"甲物件總價較低但通勤成本高，乙物件總價較高且近工作地。如何比較？","options":["只比較成交總價，因為通勤時間不會影響生活成本","同時評估房貸、交通支出、通勤時間及長期生活品質","以離工作地較近，認定乙房屋未來一定漲價","以甲總價較低，推定甲每年總支出必較少"],"answer":1,"explain":"逐選項解析：（1）通勤會產生金錢與時間成本。；（2）購屋決策須結合持有成本與實際生活需求。；（3）地點較近不保證房價漲幅。；（4）較低購屋價不必然帶來較低總生活成本。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F088","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"家長打算用房貸增貸支付高風險投資，房屋是全家唯一住處。應注意什麼？","options":["只比較增貸利率與投資商品預期年報酬","以房屋目前有增值，推定投資損失不影響居住","評估投資虧損、增貸月付與家庭唯一住處可能面臨的風險","只要增貸有抵押品，借款人就不必償還本金"],"answer":2,"explain":"逐選項解析：（1）預期報酬不是保證，且未涵蓋家庭居住風險。；（2）房價上漲不等於投資不會虧損或月付無壓力。；（3）以唯一住處支應高風險投資，可能使居住安全暴露於槓桿風險。；（4）抵押品不會免除借款人的償還義務。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F089","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"購屋人預計五年後搬家，貸款合約有提前清償限制。應先確認什麼？","options":["查明提前清償費用、出售交易成本及剩餘本金，估算五年總成本","只看首年房貸利率，因五年後賣房與契約費用無關","以房屋未來售價必高於買價，忽略交易成本","因預計五年後搬家，認定所有房貸都可免費提前清償"],"answer":0,"explain":"逐選項解析：（1）短期持有與提前清償可能產生額外成本。；（2）貸款契約可能對提前清償有約定。；（3）房價及交易成本均有不確定性。；（4）能否免費提前清償須依契約條款判斷。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F090","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"房貸寬限期與家庭負擔","q":"夫妻一方為接案工作者，收入季節波動大。決定月付能力時哪個基準較適合？","options":["以最近一個旺季的月收入作為未來每月固定收入","以保守收入情境和必要支出測試，而非只用旺季收入","僅以銀行核准的最高貸款額度判定負擔能力","以寬限期內月付額推估整段房貸還款能力"],"answer":1,"explain":"逐選項解析：（1）旺季收入可能無法代表淡季的可持續現金流。；（2）將淡旺季波動與必要支出納入壓力測試，較能評估還款韌性。；（3）核貸額度反映銀行審核，不等於家庭在收入波動下的舒適負擔。；（4）寬限期後開始攤還本金，月付可能顯著增加。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F091","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"股票交易與實際報酬","q":"小明頻繁買賣低價股票，每筆價差很小，卻以為只要賣價高於買價就獲利。應如何核算？","options":["計算買賣雙邊手續費與適用證交稅後的淨損益","只要賣出價高於買入價，就認定交易必然獲利","只扣賣出手續費，因買進時沒有任何交易成本","用成交股數乘每股價差，不必考慮券商最低手續費"],"answer":0,"explain":"逐選項解析：（1）小價差交易可能被交易費用與稅負侵蝕。；（2）價差為正不代表扣除成本後仍獲利。；（3）買進股票一般也有券商手續費。；（4）最低收費及折扣可能使小額交易實際費率不同。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F092","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"股票交易與實際報酬","q":"投資人同一天買進賣出股票，聽說當沖可能有不同交易稅率。應如何計算？","options":["只要當日買進與賣出，就一定適用所有證券相同的優惠稅率","先核對標的與交易是否符合現股當沖稅制，再計入雙邊手續費及賣出證交稅","當沖不需計算買進手續費，只需看賣出時的稅","用帳面最高價計算賣出收入，因當沖可以隨時成交在最高價"],"answer":1,"explain":"逐選項解析：（1）是否適用優惠稅率有標的及交易條件，不能一概而論。；（2）應依實際交易種類、適用稅率及券商費率估算稅費後損益。；（3）買進與賣出均可能有券商手續費。；（4）實際成交價格取決於市場與委託，不保證能以最高價成交。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F093","official":"https://www.twse.com.tw/zh/about/company/guide.html","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"股票交易與實際報酬","q":"學生每月定額買少量股票，券商有最低手續費。最值得比較的是？","options":["只比較兩家券商宣傳的手續費折扣百分比","假設所有交易均無最低手續費，直接使用標準費率","按預計每筆金額及最低手續費計算實際費用占比","將券商手續費視為固定月費，不隨交易金額變動"],"answer":2,"explain":"逐選項解析：（1）折扣率無法單獨反映最低收費的影響。；（2）小額交易可能受最低收費影響。；（3）應以實際每筆費用除以成交金額評估成本。；（4）券商手續費通常依交易金額與券商規則計算。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F094","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"股票交易與實際報酬","q":"某股票配發現金股利後股價下跌，投資人宣稱股利全是額外賺到的錢。應如何評估？","options":["以股價變動與實際股利合併計算總報酬","只比較股利入帳金額，因除息不影響股票價值","把現金股利視為銀行支付的保證利息","以宣告股利金額直接加到除息前市值，當作無風險收益"],"answer":0,"explain":"逐選項解析：（1）總報酬需考慮股價、股利及成本。；（2）除息可能影響參考價格，市場價格也會波動。；（3）股票股利與存款利息的性質及風險不同。；（4）股利並非在原市值之外無條件增加的財富。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F095","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"股票交易與實際報酬","q":"投資人只比較兩家券商的手續費折扣，卻忽略交易頻率。應如何修正？","options":["只比較折扣率，因交易次數不影響總費用","只估算單筆大額交易的成本，忽略日常交易規模","把交易稅當成券商手續費折扣的一部分","按預計交易次數、每筆金額及最低費用估算全年總成本"],"answer":3,"explain":"逐選項解析：（1）交易越頻繁，累積成本可能越高。；（2）實際交易金額不同，費用占比可能不同。；（3）交易稅與券商手續費屬不同項目。；（4）年度總費用更能反映交易策略與券商收費差異。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F096","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"股票交易與實際報酬","q":"公司宣布高額股利，投資人想借錢買股領息。最需要警覺什麼？","options":["同時計算借款利息、股價下跌及除息後價格調整的風險","以股利率高於借款利率，認定策略保證獲利","假設股利發放後股價必回到除息前水準","只要公司宣布配息，認定借款本金不可能受損"],"answer":0,"explain":"逐選項解析：（1）借款成本固定而股價與股利有不確定性。；（2）股利率不是保證總報酬。；（3）填息沒有保證期限或結果。；（4）股利不消除股價下跌造成的本金損失。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F097","quality_review":"第四批：重寫四個選項及逐選項解析；待教師終審"},{"topic":"股票交易與實際報酬","q":"學生買股票準備三個月後繳學費，卻遭遇市場下跌。事前最合理的資金安排是？","options":["若預期三個月後會上漲，可將全部學費投入股票以提高報酬","只要買入高股息股票，就能確保三個月後足額繳學費","必要學費宜留在流動性高、波動低的資金工具，股票配置限於可承擔損失部分","用融資買股提高報酬，以抵銷學費可能不足的風險"],"answer":2,"explain":"逐選項解析：（1）三個月是短期確定支出，股價可能在期限前下跌。；（2）配息及股價皆有不確定性，高股息不等於短期保本。；（3）資金用途與期限應先決定風險配置，而非由市場預測決定。；（4）槓桿會放大虧損與還款壓力，不適合補足必要學費。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F098","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"股票交易與實際報酬","q":"某人把手續費折扣當作交易策略的主要依據，每天大量進出。應優先評估什麼？","options":["手續費折扣能降低單次交易成本，但仍應估算累積稅費與策略勝率","只要每次手續費打折，頻繁交易就能穩定增加淨報酬","當沖交易只需計算買入手續費，不必估計賣出成本","交易次數增加會自動分散風險，不需設停損或部位限制"],"answer":0,"explain":"逐選項解析：（1）總成本還包括賣出稅、價差與頻率；策略本身也須有風險管理。；（2）折扣不代表交易成本為零，也不能保證交易勝率。；（3）賣出可能有手續費與證交稅，不能忽略。；（4）頻繁交易可能放大波動及操作失誤，並非自動分散風險。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F099","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"股票交易與實際報酬","q":"投資人看到帳面獲利卻未賣出，認為這筆錢已可支付下週房租。應如何看待？","options":["帳面獲利已經是可動用現金，可直接安排下週付款","只要今天有掛賣單，下週房租就一定能以預期價格支付","應先確認可成交價格、交割時程及扣費後金額，勿把未實現獲利當現金","股票未賣出也能以目前市價無成本直接提領作房租"],"answer":2,"explain":"逐選項解析：（1）未實現獲利仍隨價格波動，且不是已入帳可用現金。；（2）委託不保證成交，成交價格與交割時間仍有不確定性。；（3）房租是確定付款，須確認實際可用現金及時間。；（4）持有股票與可提領現金不同，變現通常需交易及交割。。","source":"金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F100","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"ETF與基金費用","q":"兩檔ETF追蹤同一指數，但內扣費用不同，預計持有十年。應如何選擇？","options":["優先選最近一個月漲幅較大的ETF","只看配息率較高的一檔，因為費用已反映在配息中","比較長期總費用、追蹤差異與交易便利性","選每單位市價較低的ETF，因其持有成本一定較低"],"answer":2,"explain":"逐選項解析：（1）短期績效不代表長期追蹤效率與持有成本。；（2）配息率不等於總報酬，亦不能替代費用比較。；（3）同指數產品仍有費用率、追蹤差異、買賣價差及流動性差異。；（4）每單位價格與費用率及追蹤品質沒有必然關係。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F101","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"ETF與基金費用","q":"學生買三檔科技ETF，發現前十大持股高度重疊。應如何調整風險判斷？","options":["三檔ETF由不同公司發行，持股重疊也能視為完全分散","應檢查共同成分股與產業權重，衡量實際集中曝險","只要ETF追蹤不同名稱的指數，就不存在相同股票曝險","科技股在三檔ETF都有持有，代表同一公司風險被分散為三份"],"answer":1,"explain":"逐選項解析：（1）發行商不同不代表底層持股不同。；（2）應穿透ETF名稱，觀察共同持股、產業及市場因子。；（3）指數名稱不同仍可能高度持有相同大型科技股。；（4）重複持有同一股票會增加該股票權重，不會分散其個別風險。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F102","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"ETF與基金費用","q":"某高股息ETF配息增加但淨值下降，廣告只展示配息率。投資人應看什麼？","options":["配息率增加就代表含息總報酬一定增加","只比較配息頻率，因月配息必定優於季配息","應合併評估配息、淨值變化及配息來源，才能判斷總報酬","若配息來自收益平準金，便可直接視為額外投資獲利"],"answer":2,"explain":"逐選項解析：（1）淨值下跌可能抵銷配息，不能單看配息率。；（2）配息頻率不決定總報酬，還要看價格及成本。；（3）含息總報酬同時考量持有期間的價格變動與現金分配。；（4）收益平準金屬分配機制，不能單獨證明基金額外創造報酬。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F103","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"ETF與基金費用","q":"兩檔基金，一檔申購費高而經理費低，另一檔相反。長期投資者應如何比較？","options":["只看申購費率，因持有超過一年就不會再產生費用","只看經理費率，因申購費不會影響實際投入本金","依預計持有年限，估計申購費及持續費用對最終淨值的累積影響","只要基金淨值上漲，費用率高低就不會影響投資成果"],"answer":2,"explain":"逐選項解析：（1）經理費及其他持續費用可能逐年影響淨報酬。；（2）申購費可能降低實際投入金額或增加初始成本。；（3）一次性與持續性費用的相對重要性取決於持有期間。；（4）即使投資獲利，費用仍會降低相對於無費用情境的淨報酬。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F104","quality_review":"第五批：實質改寫干擾選項與逐選項解析；待官方來源及教師終審"},{"topic":"ETF與基金費用","q":"投資人買海外ETF，原幣報酬為正，但換回新臺幣後虧損。應如何理解？","options":["只看ETF原幣報酬，因為匯率不影響台灣投資人的結果","計入匯率變動及換匯費用，計算新臺幣實際報酬","以ETF的美元配息率替代新臺幣總報酬","只要持有超過一年，匯兌損失就會自動消失"],"answer":1,"explain":"逐選項解析：（1）以新臺幣衡量的投資人仍承擔匯率風險。；（2）原幣獲利可能被外幣貶值及換匯成本抵銷。；（3）配息率不含全部價格與匯率變化。；（4）持有時間不保證匯率回到有利水準。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F105","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"ETF與基金費用","q":"市場大跌時ETF折溢價突然擴大，學生想立即市價買入。應先確認什麼？","options":["改用市價單大量買入，避免錯過盤中反彈","只參考昨天的基金淨值，忽略今天的成交報價","同時觀察參考淨值、折溢價、買賣價差及限價委託","將折價視為確定套利，因為淨值會立即回升"],"answer":2,"explain":"逐選項解析：（1）波動劇烈時市價單可能以不利價格成交。；（2）昨日淨值無法反映盤中市場變化。；（3）參考淨值與成交價差可協助評估價格風險。；（4）折價可能持續，套利受流動性及市場機制限制。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F106","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"ETF與基金費用","q":"一檔債券ETF每月配息，投資人認為沒有利率風險。應如何判斷？","options":["查看存續期間、債券信用風險與淨值波動","以每月配息紀錄推定基金本金受保障","因持有多檔債券，認定升息時淨值不會下降","將每月配息率視為每月確定投資報酬率"],"answer":0,"explain":"逐選項解析：（1）債券ETF仍受利率及信用利差等因素影響。；（2）配息紀錄不代表本金保證。；（3）分散信用風險不會消除整體利率風險。；（4）配息可能伴隨淨值變動，不能等同總報酬。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F107","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"ETF與基金費用","q":"投資人追逐去年報酬最高的主題基金，未查看投資組合。最重要的補充分析是？","options":["以去年績效排名直接推估未來三年的報酬","只比較基金名稱中的產業關鍵字","只看配息頻率，避免檢視持股集中度","評估持股集中、策略、費用與個人承受波動能力"],"answer":3,"explain":"逐選項解析：（1）過去一年績效可能反映短期行情。；（2）基金名稱不充分揭露實際持股及策略。；（3）配息頻率無法反映集中風險。；（4）主題基金可能集中少數產業，須連同費用及適合度評估。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F108","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"ETF與基金費用","q":"學生準備每月小額投資，某基金設有最低申購金額與贖回費。應先做什麼？","options":["先選短期績效最高者，再決定每月可投入金額","把贖回費視為只在獲利時才會發生","確認最低申購額、贖回費及資金使用期限","只比較基金經理人任期，不考慮流動性"],"answer":2,"explain":"逐選項解析：（1）投資預算及資金期限應先於績效追逐。；（2）贖回費依契約條件計收，不一定取決於獲利。；（3）小額定期投入需符合門檻，短期用錢需注意退出成本。；（4）經理人資歷不能替代交易條件與流動性評估。。","source":"金融商品分類整理20261021；金融商品費用20261021","review_status":"情境改寫，待官方法規及教師審核","id":"F109","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"阿姨在同一家要保銀行有活存與定存，合計超過保障上限。最合理的管理方式是？","options":["活存與定存分別有完整保障上限，因此不用合併","將銀行銷售的基金也加入同一存款保險額度","只要分開開戶，存款就不會超過保障額度","核對同一存款人於同一要保機構的存款合計及保障上限"],"answer":3,"explain":"逐選項解析：（1）同一人同一要保機構的適用存款原則上合併計算。；（2）基金不是一般受存款保險保障的存款。；（3）帳戶數不等於獨立的保障額度。；（4）必要時可考慮在不同要保機構分散並保留流動性。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F110","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"家庭把緊急預備金全部買入銀行銷售的基金，以為等同銀行存款。應如何修正認知？","options":["區分基金與存款的法律性質及保障機制","以基金由銀行銷售為由，將它計入存款保險額度","因基金可每日申贖，認為它等同活期存款","將基金配息視為銀行保證支付的存款利息"],"answer":0,"explain":"逐選項解析：（1）銀行銷售基金不會使基金變成受存款保險保障的存款。；（2）基金受益權不是銀行存款，不能直接納入存款保險額度。；（3）申贖機制不等於本金不波動或即時到帳。；（4）基金配息來源與銀行存款利息的法律及風險性質不同。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F111","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"存款保險與資金安全","q":"學生收到高利存款廣告，網站卻無法確認是否為要保機構。應先做什麼？","options":["先匯小額測試，若能提領便可確認受到存保保障","以廣告上印有銀行標誌作為唯一查證依據","從官方名錄核實機構是否為要保機構及商品性質","只比較利率，不需了解資金實際匯入的機構"],"answer":2,"explain":"逐選項解析：（1）短期可提領不代表機構合法或受存保保障。；（2）標誌可能被仿冒，應獨立查證。；（3）存保資格與商品是否屬存款需分別確認。；（4）高利率不應取代金融機構身分核實。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F112","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"小店主將營業週轉金放入長天期定存，提前解約會影響利息。應如何規劃？","options":["把全部週轉金投入最高利率的三年定存","按貨款、薪資等付款日分層配置活存與不同期限定存","遇到短缺時以信用卡循環取代流動資金規劃","只看定存利率，不需估計提前解約的利息損失"],"answer":1,"explain":"逐選項解析：（1）長期鎖定可能與營業現金流不匹配。；（2）期限配置可兼顧收益與預定支付需求。；（3）循環信用可能增加融資成本與還款壓力。；（4）提前解約條件會影響實得收益。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F113","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"父親在同一家銀行以本人名義開多個帳戶，認為每戶都各有一份最高存保額度。應如何說明？","options":["每張存摺都各享有最高保障額度","同一人在同一家要保銀行的適用存款合併計算","定存不計入保障額度，因此可以無限額配置","只有網路帳戶才需合併計算，臨櫃帳戶不必"],"answer":1,"explain":"逐選項解析：（1）保障額度不是依存摺數量累加。；（2）應按存款人與要保機構辨識，並留意法定保障範圍。；（3）定存通常也屬適用存款類型。；（4）開戶通路不改變同一存款人的合併原則。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F114","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"某家庭有新臺幣與外幣存款，將來要支付新臺幣醫療費。最需要同時評估什麼？","options":["外幣定存到期後一定能換得預期的新臺幣金額","同時評估存保範圍、外匯波動及醫療付款時點","只要外幣利率較高，就不必預留新臺幣醫療費","將外幣帳戶分成數個子帳戶即可排除匯率風險"],"answer":1,"explain":"逐選項解析：（1）換匯金額取決於當時匯率及成本。；（2）醫療支出以新臺幣支付，須兼顧流動性與幣別匹配。；（3）較高名目利率未必補足匯兌損失。；（4）拆帳戶不會改變匯率風險。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F115","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"學生把錢放進支付App儲值餘額，認為與銀行定存保障完全相同。應先辨認什麼？","options":["只要支付App能綁定銀行帳戶，就等同銀行定存","將所有儲值金額視為銀行以自己名義吸收的存款","以支付業者的廣告收益率認定本金受存保保障","辨認電子支付餘額的法律性質、資金保管及保障機制"],"answer":3,"explain":"逐選項解析：（1）連結銀行帳戶不代表支付餘額變成定存。；（2）電子支付資金的法律安排須依實際產品判斷。；（3）廣告或優惠不等於存款保險資格。；（4）應區分電子支付業者與要保銀行的不同責任及制度。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F116","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"一名退休者只追求最高定存利率，把全部存款放入單一機構。應如何評估？","options":["只要定存利率最高，單一機構集中就不會有問題","核對要保資格、保障額度、到期日及生活資金需求","因為是退休金，就自動享有高於一般人的存保額度","把所有存款改成五年期，便能消除流動性風險"],"answer":1,"explain":"逐選項解析：（1）利率以外仍須評估機構與資金集中。；（2）退休者重視資金可動用性及保障範圍。；（3）保障上限依制度而定，非單憑退休身分增加。；（4）長天期配置可能反而增加提前解約需求。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F117","official":"https://www.cdic.gov.tw/main_ch/faq.aspx?faq=17","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"存款保險與資金安全","q":"家庭準備半年後支付手術費，銀行推薦有提前退出限制的投資商品。應如何選擇？","options":["保留半年內必須使用的醫療費於低波動且易動用工具","因銀行推薦，提前退出限制可視為不存在","先投入全部手術費，屆時用信用卡循環支付醫院費用","將手術費全部轉為長天期外幣商品，以提高收益"],"answer":0,"explain":"逐選項解析：（1）已知短期必要支出應優先保障流動性。；（2）產品退出限制不因推薦而消失。；（3）信用卡循環可能增加財務負擔。；（4）外幣及期限風險可能影響到期可用資金。。","source":"淨零轉型基金費用與中央存保；存款業務與開戶審查20261020","review_status":"情境改寫，待官方法規及教師審核","id":"F118","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"退休者每月領固定年金，物價連續上升。最需要重新評估什麼？","options":["以名目年金固定為由，認定每年生活品質不變","只調整娛樂預算，不需檢視醫療與食品支出","用年金帳面金額直接推估未來可購買的商品數量","估算通膨對固定年金購買力及必要支出的影響"],"answer":3,"explain":"逐選項解析：（1）固定名目收入遇到物價上漲會失去購買力。；（2）必要支出也可能受通膨影響。；（3）帳面金額無法直接反映實際購買力。；（4）應以退休生活消費結構推估實質缺口。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F119","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"學生存下五萬元，兩年後要買筆電，預估售價可能上漲。應如何設定儲蓄目標？","options":["以現在五萬元為固定目標，忽略筆電價格變化","以去年某月的最高定存利率保證兩年後可買到","依預估購買時價格、儲蓄利息與安全餘額設定目標","只要將五萬元投資股票，兩年後必定足夠"],"answer":2,"explain":"逐選項解析：（1）商品價格可能上漲，固定目標未必足夠。；（2）未來利率與商品價格都不保證。；（3）短期目標宜估算未來支出並保留彈性。；（4）股票價格可能下跌，不宜把短期必要購買建立在保證獲利上。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F120","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"投資帳面報酬率為正，但同期物價漲幅更高。應如何判斷？","options":["以帳面名目報酬率作為購買力增加的唯一證據","計算扣除通膨影響後的實質購買力變化","只扣交易手續費，不考慮物價上漲","只比較投資期初與期末的帳戶餘額"],"answer":1,"explain":"逐選項解析：（1）名目報酬為正仍可能低於物價漲幅。；（2）實質報酬可近似以名目報酬減通膨，精確比較用(1+名目報酬)/(1+通膨)-1。；（3）費用與通膨都是影響最終購買力的不同因素。；（4）帳戶金額增加不代表能買到更多商品與服務。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F121","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"通膨與購買力","q":"家庭薪資調漲百分之二，生活必要支出卻增加更多。最合理的財務分析是？","options":["比較收入增幅與必要支出增幅，估算實質可支配所得","因薪資增加2%，認定購買力必然增加2%","只比較年度獎金，不需考慮每月支出","把物價上漲全當成一次性支出，不納入預算"],"answer":0,"explain":"逐選項解析：（1）收入漲幅低於支出增幅，家庭可支配資源可能縮水。；（2）名目薪資增加不等於實質購買力等幅增加。；（3）年度獎金無法替代經常性收支分析。；（4）持續性價格上升應反映在預算。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F122","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"某銀行提供固定利率定存，投資人想知道五年後能買多少商品。應如何評估？","options":["只用五年累計利息衡量能買多少商品","以到期本利和與預估物價變動比較實質購買力","因為定存利率固定，五年後商品價格也固定","以銀行牌告利率直接當成實質報酬率"],"answer":1,"explain":"逐選項解析：（1）名目利息不反映商品價格變化。；（2）到期資金需以當時物價衡量實質購買力。；（3）利率固定不代表通膨固定。；（4）實質報酬須考慮通膨及相關費用稅負。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F123","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"學生想以股票長期抗通膨，卻把三個月後要用的學費也投入。應如何調整？","options":["保留三個月內學費於流動性高的工具，長期資金另行投資","把學費投入高股息股票，因配息可完全抵銷跌價","只要分散成三檔股票，就能保證三個月內不虧損","改買槓桿ETF，縮短賺到學費所需時間"],"answer":0,"explain":"逐選項解析：（1）短期確定支出不宜承擔無法承受的價格波動。；（2）配息不保證總報酬或本金安全。；（3）分散持股不能消除整體市場下跌風險。；（4）槓桿產品通常放大波動，與短期必要支出不匹配。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F124","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"某企業營收成長，但原物料與薪資成本上漲更快。分析獲利能力應看什麼？","options":["只看營收年增率，因為成本變化會自動反映在營收中","以售價漲幅推估獲利，不需檢查銷量與成本","以公司市值成長當作營業利益成長的替代指標","比較營收、原料及人事成本變動後的營業利益與利潤率"],"answer":3,"explain":"逐選項解析：（1）營收增加不保證利潤增加。；（2）售價上漲可能被成本與銷量變化抵銷。；（3）市值變化不等於當期營業獲利。；（4）應檢視成本上漲是否侵蝕毛利及營業利益。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F125","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"家庭規劃十年後退休，直接以今天每月生活費乘以退休年數。最需要補充什麼？","options":["以退休當年的生活費乘以預期年數，忽略後續漲價","依預期通膨率估算退休各年支出並考慮長壽風險","把目前月薪視為退休後每月可領的固定收入","只估算退休第一年支出，不必推估後續年份"],"answer":1,"explain":"逐選項解析：（1）各年物價與支出可能不同。；（2）逐年現金流推估較能呈現通膨與長壽風險。；（3）退休收入結構不一定等於工作薪資。；（4）只看第一年會低估長期資金需求。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F126","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"通膨與購買力","q":"有人認為黃金或虛擬資產一定能在每次通膨期間保值。應如何判斷？","options":["比較不同通膨情境下價格波動與持有成本，不做保證推論","以某一次通膨期間的上漲推定每次都能抗通膨","因資產供給有限，就認定短期購買力不可能下降","只比較名目價格是否創新高，不檢查通膨後報酬"],"answer":0,"explain":"逐選項解析：（1）黃金及虛擬資產價格仍受市場供需及波動影響。；（2）單一歷史期間無法保證未來結果。；（3）供給限制不排除價格下跌。；（4）名目上漲不一定代表實質保值。。","source":"財務規劃筆記；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F127","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"退休現金流與長壽風險","q":"退休夫妻預估生活費可負擔二十年，但其中一人家族長壽。應如何補強計畫？","options":["只以夫妻平均餘命計算，不必估算其中一人更長壽","提高投資報酬假設，就能取代長壽風險準備","只比較退休第一年的支出，因為後續可自行縮減","加入更長退休年期、醫療照護與保守報酬情境"],"answer":3,"explain":"逐選項解析：（1）平均值無法代表較長壽的尾端風險。；（2）提高預期報酬不會消除資金不足風險。；（3）後續醫療與照護支出未必可任意縮減。；（4）延長試算期間並做壓力測試較能評估資金韌性。。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F128","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"退休現金流與長壽風險","q":"退休者每月固定提款，第一年市場大跌。最需要管理什麼？","options":["市場大跌時固定賣出同樣股數，不需考慮資產比例","把全部退休資金投入單一股票等待反彈","以長期平均報酬推定第一年虧損不影響提款計畫","建立短期現金緩衝並檢視低點提款造成的順序風險"],"answer":3,"explain":"逐選項解析：（1）固定賣出股數可能無法支應固定生活費。；（2）集中投資會增加市場與個別公司風險。；（3）相同平均報酬在不同發生順序下，提款結果可能不同。；（4）市場低迷時可減少被迫賣出風險資產的需要。。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F129","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"退休現金流與長壽風險","q":"家庭退休金主要來自單一出租房屋，遇到空租就沒有收入。應如何改善？","options":["將租金收入視為永續固定，因過去三年都正常出租","把房屋估值當作每月可直接支領的現金","只比較出租房屋的租金投報率，不需留修繕費","預留空租與修繕資金，並評估其他穩定收入來源"],"answer":3,"explain":"逐選項解析：（1）歷史出租率不保證未來沒有空租。；（2）房屋估值不是每月現金流。；（3）修繕、稅費及空租會影響淨租金。；（4）收入來源與備用資金分散有助管理現金流中斷。。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F130","quality_review":"第六批：實質改寫干擾選項及四選項解析；待官方資料及教師終審"},{"topic":"退休現金流與長壽風險","q":"父母即將退休，但仍有房貸餘額。決定退休日期前應先做什麼？","options":["僅以目前退休金帳戶總額決定，不考慮每月還款","將退休後收入、房貸月付及必要支出整合成現金流試算","將房屋市價全額當作隨時可支付房貸的現金","以退休前薪資水準估算退休後可支配收入"],"answer":1,"explain":"逐選項解析：（1）資產總額不等於每月可動用現金流。；（2）退休後收入下降時，固定房貸支出與生活支出須一起估算。；（3）房產變現有時間、交易成本及居住安排限制。；（4）退休後收入結構通常與工作期間不同。。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F131","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"退休現金流與長壽風險","q":"退休者想提高收益，準備將全部存款換成高配息基金。應先確認什麼？","options":["只比較最近三個月配息率，不檢視基金淨值","用過去一年配息率推估未來每月固定收入","把配息視為額外收益而非可能來自本金","先比較配息來源、淨值波動與退休必要現金需求"],"answer":3,"explain":"逐選項解析：（1）配息率不能保證未來現金流。；（2）歷史配息不代表保證收益。；（3）部分配息可能來自本金，需檢視淨值。；（4）兼顧流動性與本金波動，避免把全部存款集中投資。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F132","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"退休現金流與長壽風險","q":"長輩需要居家照護，原退休預算未包含照護費。最合理的調整是？","options":["先以投資報酬率提高2%抵銷全部照護費","假設家人一定免費提供長期照護","只調整娛樂支出而不評估照護期間","將照護支出納入情境預算並盤點保障與資源"],"answer":3,"explain":"逐選項解析：（1）市場報酬無法保證抵銷確定費用。；（2）家人照護也有時間與收入成本。；（3）照護費可能長期且變動，單項刪減未必足夠。；（4）建立照護支出情境與可用資源較完整。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F133","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"退休現金流與長壽風險","q":"退休夫妻有房產但現金很少，想繼續自住。應評估哪類工具與風險？","options":["立即賣屋並將所得全投入股票","評估以房養老等工具的撥款、利息與繼承風險","把房屋估價當成每月可直接提領的現金","只比較每月撥款，忽略借款餘額累積"],"answer":1,"explain":"逐選項解析：（1）賣屋不符合希望繼續自住的前提。；（2）應比較居住安排、借款成本、撥款期間及繼承影響。；（3）房產估值不等於可動用現金。；（4）只看撥款可能低估累積負債與到期處理風險。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F134","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"退休現金流與長壽風險","q":"一位退休者在市場上漲時提高生活支出，忽略未來下跌。應如何制定提款規則？","options":["每年按前一年股市漲幅同比增加支出","以固定高報酬率作為提款保證","依必要支出、資產餘額與市場風險設定可調整提款規則","遇市場下跌就立即賣光所有資產"],"answer":2,"explain":"逐選項解析：（1）順勢增加支出可能放大未來缺口。；（2）投資報酬不保證固定。；（3）依情境調整提款率有助管理長壽與報酬順序風險。；（4）全部賣出可能失去長期資產配置。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F135","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"退休現金流與長壽風險","q":"子女承諾負擔父母全部生活費，但自己也有學貸。最合理的家庭討論是？","options":["要求子女立即承擔父母全部支出","只計父母需求，不列子女貸款還款","以父母房價估算子女每月可支援額","共同盤點雙方現金流、債務與可持續支持額度"],"answer":3,"explain":"逐選項解析：（1）承諾可能超出子女負擔能力。；（2）學貸還款會排擠可用現金流。；（3）房價不是子女可支配收入。；（4）以實際收入與負債討論較可持續。","source":"簡單財務規劃筆記；以房養老教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F136","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"投資人買入十年期固定票息債券，半年後市場利率大升，急需賣出。應預期什麼？","options":["持有到期一定損失全部本金","若提前賣出，市場利率上升可能使債券市價下跌","固定票息債券市價不受利率變動影響","只要發行人未違約，提前賣出必能取回面額"],"answer":1,"explain":"逐選項解析：（1）價格下跌不等於全部本金歸零。；（2）利率上升通常壓低既有固定票息債券價格。；（3）固定票息不等於固定二級市場價格。；（4）提前出售價格可能高於或低於面額。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F137","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"甲債券剩餘期限兩年，乙債券十年，信用條件相近。升息風險應如何比較？","options":["乙期限較長，通常對利率上升更敏感","甲到期較快，必然比乙跌得更多","兩者信用相近，價格敏感度必相同","乙票息較高就能完全抵銷升息風險"],"answer":0,"explain":"逐選項解析：（1）長天期通常較具利率敏感度，仍需考慮存續期間。；（2）期限較短通常較低敏感度。；（3）信用風險相近不代表利率風險相同。；（4）票息高低無法保證抵銷價格下跌。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F138","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"某公司債殖利率明顯高於公債，學生認為一定是套利機會。應先查什麼？","options":["高殖利率本身已證明無風險套利","只比較票面利率，不看償債能力","查核信用評等、財務狀況、流動性與債券條款","因公債利率較低，所有公司債都較適合退休者"],"answer":2,"explain":"逐選項解析：（1）高殖利率可能是風險溢酬。；（2）票息不能取代信用評估。；（3）信用、流動性與條款可能解釋較高殖利率。；（4）適合度還需考慮風險承受與資金期限。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F139","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"退休者需要明年支付醫療費，卻買入長天期債券基金。應如何評估？","options":["先比對明年醫療支出與債券基金淨值波動、贖回時間","只要是債券基金，明年本金就有保證","用基金近月配息率估算醫療費，不管淨值","將明年全部醫療費投入存續期間最長的基金"],"answer":0,"explain":"逐選項解析：（1）短期確定支出應重視資金安全與流動性。；（2）債券基金不是保本定存。；（3）配息不保證本金及到期可用金額。；（4）長存續期間基金對利率變化可能更敏感。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F140","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"某債券以折價買入，票面利率較低，但到期收益率可能較高。應看哪個指標？","options":["同時考慮買價、票息與到期現金流，不只看票面利率","僅比較票面利率，因折價買入不影響持有報酬","僅比較每年收到的現金票息，忽略到期償還金額","只看債券到期日，不考慮購入價格"],"answer":0,"explain":"逐選項解析：（1）到期收益率須綜合價格、票息與到期現金流，並考慮信用風險。；（2）折價買入會影響實際到期收益率。；（3）折價債券的到期價差可能構成報酬來源。；（4）相同到期日但買價不同，收益率可能不同。。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F141","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"債券與利率變動","q":"學生持有債券基金，看到每月配息便認為本金不變。應如何檢視？","options":["基金有配息就代表持有單位的淨值不會下降","只需比較每月配息金額，不看總報酬","同時觀察配息來源、含息總報酬與淨值走勢","配息入帳後就可忽略投資標的信用風險"],"answer":2,"explain":"逐選項解析：（1）配息可能伴隨淨值調整。；（2）只看配息可能忽略本金減損。；（3）配息來源與含息總報酬才有助評估實際成果。；（4）基金仍可能承擔信用與市場風險。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F142","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"企業發行浮動利率債券，投資人把它與固定票息債券視為完全相同。應如何比較？","options":["兩種債券都會固定每期支付相同金額利息","浮動利率債券完全沒有信用風險","固定利率債券遇升息一定不受影響","比較利率重設機制、價格敏感度與信用風險"],"answer":3,"explain":"逐選項解析：（1）浮動票息可能依參考利率調整。；（2）票息機制不消除信用風險。；（3）固定票息債券仍有利率價格風險。；（4）重設頻率與條款會影響現金流和價格。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F143","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"市場傳出降息預期，投資人認為長債一定會立即上漲。最重要的提醒是？","options":["只要市場談論降息，長債當天必上漲","市場價格可能已反映降息預期，仍須看實際利率與風險","長債價格只受信用評等影響，不受市場利率影響","降息預期會使所有期限債券價格同幅上漲"],"answer":1,"explain":"逐選項解析：（1）預期不等於確定且可能已反映價格。；（2）市場實際變動與預期落差才影響價格。；（3）長債通常對利率敏感。；（4）不同存續期間的價格反應不會必然相同。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F144","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"債券與利率變動","q":"兩檔債券基金存續期間相近，但一檔持有低評等公司債。應注意什麼？","options":["存續期間相近就代表信用損失機率相同","應額外比較信用評等、違約風險及信用利差","只比較基金名稱中的「債券」二字","低評等債券票息高，因此淨值不會下跌"],"answer":1,"explain":"逐選項解析：（1）存續期間主要衡量利率敏感度。；（2）低評等公司債另有較高信用與利差風險。；（3）基金名稱不足以判斷投資組合風險。；（4）高票息不能消除違約與價格風險。","source":"金融商品分類整理20261021；中央銀行貨幣政策","review_status":"情境改寫，待官方法規及教師審核","id":"F145","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"單親家長是家庭唯一收入來源，已有醫療險卻無身故保障。應優先評估什麼？","options":["優先加買與現有保障重複的住院日額","先計算家庭扶養、債務與現有資產保障缺口","只考慮主要收入者自己的醫療費","以去年股票報酬率取代身故保障規劃"],"answer":3,"explain":"逐選項解析：（1）重複保障不一定補足身故收入缺口。；（2）扶養與負債需求是估算壽險額度的基礎。；（3）家庭收入中斷與本人醫療費屬不同風險。；（4）市場報酬不能保證身故後家人現金流。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F146","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"學生騎機車撞傷路人又撞壞對方手機，只保強制險。應先辨認什麼？","options":["強制汽車責任險會支付所有手機財物損失","區分強制險的人身傷害保障與第三人財損責任","只要駕駛人有駕照，對方財損自動免責","手機價值低於醫療費就無須理會財損責任"],"answer":1,"explain":"逐選項解析：（1）強制險主要保障事故受害人的人身傷害，不含一般財物損失。；（2）人傷與財損需辨認不同保障及責任。；（3）駕照不免除民事損害賠償責任。；（4）財物損害仍可能構成應負責任。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F147","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"家長想替孩子投保，但保費預算有限。應如何安排順序？","options":["優先購買高保費儲蓄商品，其他保障以後再說","先盤點重大風險與預算，安排必要保障再考慮儲蓄型商品","只按業務員推薦的保費高低決定","所有預算集中在小額理賠的附加險"],"answer":1,"explain":"逐選項解析：（1）高保費可能排擠必要保障。；（2）保障缺口、風險程度與可負擔保費應先評估。；（3）保費高低不等於保障適合。；（4）集中附加險可能忽略重大事故缺口。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F148","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"被保險人住院使用自費醫材，以為實支實付保單全部會賠。應如何查證？","options":["只要醫院開收據，保險公司應全額理賠","保單名稱含實支實付就沒有理賠上限","核對自費醫材是否屬承保項目、限額與除外責任","醫材未列保單給付項目也一定有給付"],"answer":2,"explain":"逐選項解析：（1）收據是支出證明，不代表全部承保。；（2）實支實付仍受契約條款與限額約束。；（3）應依條款確認可賠項目與金額。；（4）未承保項目不因實際支付而自動納入。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F149","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"業務員稱投保當天起任何疾病都會理賠，保單卻列有等待期。應怎麼辦？","options":["要求說明等待期與保障起算日，核對保單約定","業務員口頭承諾足以讓等待期自動消失","因已繳保費，所有疾病都必須立即理賠","只需確認保費折扣，不必查等待期"],"answer":0,"explain":"逐選項解析：（1）疾病等待期可能影響承保起算，應以契約及適用規定核對。；（2）口頭說明不會當然變更契約。；（3）繳費不代表所有事故都立即符合給付。；（4）等待期與理賠資格直接相關。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F150","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"家庭已有多張相似保單，保費占收入過高。最合理的整理方式是？","options":["只依各保單保費高低決定取消順序","只保留理賠金額最高的一張，不比較保障範圍","先計算保單已繳保費，避免任何調整","盤點重複保障與實際缺口，兼顧保費可負擔性"],"answer":3,"explain":"逐選項解析：（1）保費低不一定符合家庭保障需求。；（2）理賠上限高不代表事故種類、除外責任與缺口都適合。；（3）沉沒成本不應取代未來保障與保費負擔的評估。；（4）盤點保障缺口與重疊範圍，可降低過度保費負擔。。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F151","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"保險需求與保障缺口","q":"長者有慢性病史，投保時業務員建議不填就醫紀錄。應如何處理？","options":["如實回答書面詢問事項並保存告知紀錄","聽從業務員省略就醫史，以免提高保費","先投保成功，理賠時再補充過去病史","僅告知最近一次門診，其他問項自行刪除"],"answer":0,"explain":"逐選項解析：（1）依詢問事項據實告知，避免未來契約爭議。；（2）刻意隱瞞可能影響契約與理賠。；（3）事後補充不能當然補正投保時不實告知。；（4）應按實際詢問範圍完整作答。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F152","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"車主常借車給親友使用，想知道事故時責任保障。應先查什麼？","options":["只看車輛有無定期保養，不看保險條款","以為借車給親友後所有事故都由親友保單承擔","確認被保險人、許可駕駛人與各項責任險條款","認為強制險必然包含車體損失及第三人財損"],"answer":2,"explain":"逐選項解析：（1）保養與責任險承保範圍不同。；（2）不能推定借用人自己的保單會涵蓋事故。；（3）需核對駕駛資格、使用情況及承保條款。；（4）強制險不等於車體險或第三人財損險。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F153","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"保險需求與保障缺口","q":"公司提供員工團保，員工準備離職卻以為保障永久有效。應如何確認？","options":["以公司團保曾理賠過，推定離職後永久有效","只看公司曾繳過保費，不查保險期間","將團保保障當成不受任職關係影響的個人保單","查核團保終止條件及可否轉換或另行投保"],"answer":3,"explain":"逐選項解析：（1）過去理賠不代表離職後持續承保。；（2）繳費紀錄不取代保障期間與資格。；（3）團保可能與員工身分連動。；（4）應確認離職後保障銜接與轉換條件。","source":"保險完整教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F154","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"金融消費爭議與公平待客","q":"銀行推銷商品時只展示最高報酬，未說明可能虧損。消費者應如何處理？","options":["只用最高報酬情境估算退休可領金額","要求揭露可能虧損、費用與不利情境後再評估適合度","因銀行銷售便認定商品本金由銀行保證","將宣傳的最高報酬視為法定最低報酬"],"answer":1,"explain":"逐選項解析：（1）最高情境不是合理的唯一決策基礎。；（2）完整風險、成本與適合度資訊是決策前提。；（3）銀行通路不等於投資本金保證。；（4）最高報酬不代表保證或最低報酬。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F155","official":"https://www.foi.org.tw/Article.aspx?Arti=358&Lang=1","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"金融消費爭議與公平待客","q":"高齡客戶聽不懂複雜商品，理專仍催促立即簽約。最重要的公平待客檢核是？","options":["請客戶先簽名，回家再閱讀複雜條款","放慢說明並確認理解與商品適合度，不施加不當壓力","只讓家屬代簽，無須核實本人意願","因客戶年長而拒絕提供任何金融服務"],"answer":1,"explain":"逐選項解析：（1）先簽後讀難以確保知情決策。；（2）合理溝通與理解確認符合公平待客精神。；（3）代簽涉及合法授權及本人意思。；（4）年齡本身不代表應全面拒絕服務。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F156","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"金融消費爭議與公平待客","q":"消費者向銀行申訴不明扣款，客服口頭否認卻不提供紀錄。應如何進一步準備？","options":["只在社群平台公開指控銀行即可完成正式申訴","放棄追查，因客服已口頭否認","保存扣款明細、通知與申訴紀錄並要求正式回覆","自行刪除手機交易通知以避免爭議"],"answer":2,"explain":"逐選項解析：（1）社群發文不取代正式爭議處理。；（2）口頭否認不等於交易已查明。；（3）可追溯證據與書面紀錄有助後續查證。；（4）刪除紀錄會使事實難以釐清。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F157","official":"https://www.foi.org.tw/Article.aspx?Arti=358&Lang=1","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"金融消費爭議與公平待客","q":"銀行要求貸款客戶購買額外商品，卻未解釋必要性。應先檢視什麼？","options":["只看額外商品的回饋金，不必看貸款條件","把所有搭售視為當然合法，無須檢查","確認是否有不當搭售、揭露不足及客戶選擇權","只要貸款利率較低，就不需知道附加商品成本"],"answer":2,"explain":"逐選項解析：（1）回饋不能取代對強制性及成本的審查。；（2）貸款搭售須依適用規範與實際行為判斷。；（3）需檢視是否充分告知與是否存在不當強制。；（4）附加商品成本可能抵銷貸款優惠。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F158","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"金融消費爭議與公平待客","q":"保險業務員替客戶填寫風險問卷，答案與客戶真實情況不同。應如何處理？","options":["先簽名確認，以免錯過商品申購期限","要求更正問卷並依真實財務狀況及風險承受度評估","只要理專有執照，填寫內容就不必核對","先買入商品，日後再更改問卷日期"],"answer":1,"explain":"逐選項解析：（1）錯誤問卷可能造成不適合商品推薦。；（2）客戶資料與適合度評估須真實。；（3）專業資格不保證每份資料正確。；（4）事後倒填無法取代交易前適合度程序。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F159","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"金融消費爭議與公平待客","q":"消費者已向金融機構申訴但不滿處理結果。應如何尋求下一步救濟？","options":["先自行將交易紀錄全部刪除","只向社群網友求助，不使用正式救濟程序","保存申訴與回覆資料，評估依法申請金融消費評議","因銀行已回覆就不能再尋求任何救濟"],"answer":2,"explain":"逐選項解析：（1）刪除資料不利於爭議處理。；（2）非正式討論不能取代法定程序。；（3）符合條件可循金融消費爭議處理機制，並注意期限。；（4）對處理結果不滿不代表救濟途徑完全終止。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F160","official":"https://www.foi.org.tw/Article.aspx?Arti=358&Lang=1","verification":"已對照指定官方來源（仍建議教師複核題目）","quality_review":"第七批：選項與解析實質改寫；待官方來源與教師終審"},{"topic":"金融消費爭議與公平待客","q":"投資人透過電話購買商品，事後發現關鍵費用未告知。應保存什麼？","options":["只保存投資商品的近期市場價格走勢","僅要求理專提供最新宣傳文宣，無須保留原契約","蒐集錄音、契約、費用表與交易紀錄以重建銷售過程","只保留最終損益報表，不需追查銷售說明"],"answer":2,"explain":"逐選項解析：（1）市場走勢不能直接證明當時是否充分揭露費用。；（2）後續文宣未必反映交易當時的告知內容。；（3）同時保存契約、告知與交易證據，較能釐清資訊揭露爭議。；（4）損益數字無法單獨證明銷售過程與費用告知。。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F161","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"金融消費爭議與公平待客","q":"身障客戶無法使用銀行既有數位介面，銀行直接拒絕協助。應檢視什麼？","options":["僅提供紙本申請書，要求客戶自行尋找可操作的設備","以服務一致性為由，拒絕調整溝通或操作方式","先確認客戶需求，提供可及的替代管道與必要協助","直接由行員代替客戶作所有交易決策"],"answer":2,"explain":"逐選項解析：（1）形式上提供紙本，不代表對該客戶實際可使用。；（2）一致服務仍須考量合理可及性，不能逕行拒絕協助。；（3）應檢視服務可及性、替代管道及合理協助措施。；（4）協助操作不等於取代客戶的授權與交易決策。。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F162","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"金融消費爭議與公平待客","q":"某商品說明書文字艱深，客戶簽名卻無法理解重大風險。應如何改善程序？","options":["保留簽名程序，同時以清楚例子說明最差情境並確認理解","只把風險揭露文字加粗，無須確認是否理解","要求客戶簽署更多份相同的制式聲明","把重要風險放在附件，僅口頭說明收益"],"answer":0,"explain":"逐選項解析：（1）簽名與實質理解應並重，需說明重大風險與費用。；（2）字體變化不必然改善複雜內容的理解。；（3）重複簽名無法取代清楚的適當說明。；（4）收益與風險應完整揭露，不宜偏重有利資訊。。","source":"金融消費爭議處理流程教學講義","review_status":"情境改寫，待官方法規及教師審核","id":"F163","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"理專向即將退休的客戶推銷高槓桿商品，理由是近期報酬很高。應先做什麼？","options":["以客戶退休年齡為由，直接拒絕所有投資商品","先評估資金用途、投資期限、損失承受能力及商品風險","只比較近期報酬排名，再推薦最高的一檔","先讓客戶簽風險聲明，之後才確認商品適合度"],"answer":1,"explain":"逐選項解析：（1）年齡是評估因素之一，不能直接代替個別需求分析。；（2）適合度應結合客戶狀況與商品特性，而非追逐短期績效。；（3）短期績效不能反映槓桿可能造成的重大損失。；（4）程序先後及實質評估不能由簽名取代。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F164","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"客戶出國要求理專代管存摺、印鑑與網銀密碼。理專應如何處理？","options":["收下存摺但拒收網銀密碼，便可完全避免風險","要求客戶將憑證交由另一位理專共同保管","讓客戶把網銀密碼寫在授權書背面","拒絕私下保管憑證，改依金融機構正式授權與代理程序"],"answer":3,"explain":"逐選項解析：（1）私下保管存摺等敏感資料仍有管理與濫用風險。；（2）換成其他員工不會使私下保管變成合規授權。；（3）將密碼記載於文件增加外洩風險。；（4）應保護憑證並以正式程序處理授權需求。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F165","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"理專因商品佣金較高，隱瞞另一個更適合客戶的方案。應檢視什麼？","options":["以客戶有簽名為由，不必揭露理專報酬誘因","揭露可能的利益衝突，並比較符合客戶需求的替代方案","只告知佣金最高商品的歷史最高報酬","請客戶自行搜尋其他商品，理專不必做適合度評估"],"answer":1,"explain":"逐選項解析：（1）客戶簽名不代表利益衝突可以隱匿。；（2）銷售誘因與適合度均需納入評估及適當揭露。；（3）選擇性呈現績效可能使風險認知失真。；（4）理專仍應履行應有的說明及適合度程序。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F166","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"銀行客戶不熟悉衍生商品，理專只說「很安全」。應如何改善？","options":["只列出商品到期可能獲得的最高收益","以客戶資產充足為由，免除風險說明","以情境試算說明可能損失、提前退出成本及流動性","將所有風險歸類為市場短期波動，不談槓桿或信用風險"],"answer":2,"explain":"逐選項解析：（1）只呈現最佳情境無法反映風險。；（2）資產充足不代表理解商品結構及可能損失。；（3）具體不利情境有助客戶評估風險承受度。；（4）複雜商品可能涉及多種風險，不能簡化成單一波動。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F167","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"客戶要求理專把未經核准的交易先做，隔天補簽名。應如何處理？","options":["先完成交易，再請客戶補簽授權以符合時效","以過去委託紀錄作為本次交易的永久授權","讓客戶用私人通訊軟體傳一句「可以」，取代必要程序","確認本次有效授權及正式委託程序後才執行交易"],"answer":3,"explain":"逐選項解析：（1）事後補簽不能當作先行交易的充分依據。；（2）既有交易不當然授權所有未來交易。；（3）非正式訊息是否符合規定須視機構程序，不可逕行替代。；（4）應在交易前依正式規範確認委託與授權。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F168","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"理專用自己的帳戶暫收客戶投資款，聲稱可加速成交。客戶應怎麼做？","options":["先小額匯入理專私人帳戶測試，再匯入餘額","請理專出具私人收據，便可視為銀行入金","拒絕私人帳戶收款，核對金融機構指定入金資訊","要求理專口頭保證資金安全即可"],"answer":2,"explain":"逐選項解析：（1）測試匯款仍可能造成損失與後續詐騙。；（2）私人收據不等於金融機構正式交易紀錄。；（3）資金應依正式指定管道進出，並核對受款資訊。；（4）口頭承諾不能取代合法入金流程。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F169","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"銀行員發現同事替客戶填寫不實風險問卷。應如何處理？","options":["要求同事自行修改紀錄，無須留下查核軌跡","保存必要證據並依內控、稽核或通報機制反映","因客戶最後沒有虧損，便不必處理問卷不實","只私下提醒同事，不需評估客戶是否受到影響"],"answer":1,"explain":"逐選項解析：（1）私下改寫紀錄可能掩蓋原始事實。；（2）不實適合度資料涉及銷售與內控風險，應依規定處理。；（3）程序不當與是否產生損失是不同問題。；（4）仍須評估已受影響的客戶與交易。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F170","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"理專倫理與商品適合度","q":"客戶因聽力障礙需要較慢說明，理專為趕業績催促簽約。應如何改善？","options":["提供可理解的說明方式與充分決策時間","以客戶聽力狀況為由，直接略過適合度問卷","只提供書面契約，不確認客戶是否理解風險","要求客戶家屬代簽，無須確認本人授權"],"answer":0,"explain":"逐選項解析：（1）適當溝通方式與合理時間有助客戶理解商品並自主決策。；（2）聽力障礙不免除了解客戶與商品適合度評估。；（3）文件交付不等於充分說明與理解。；（4）代理簽署涉及授權及程序要求，不能自行推定。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F171","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"理專倫理與商品適合度","q":"理專保證投資商品不會虧損，契約卻明列本金風險。應如何判斷？","options":["口頭保證優先於契約，客戶可以忽略本金風險","以理專服務年資長為由，視為已取得保證","要求釐清保證性宣稱與契約不符，保留銷售證據","只要商品曾獲利，未來就可視為本金保障"],"answer":2,"explain":"逐選項解析：（1）口頭保證與契約明列風險相矛盾，不可直接採信。；（2）年資不會改變商品的風險或契約內容。；（3）應核對契約、風險揭露及銷售說明並保存證據。；（4）歷史績效不能保證未來本金安全。。","source":"理專十誡與警示帳戶講義","review_status":"情境改寫，待官方法規及教師審核","id":"F172","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"父親擔心失智後租金遭人挪用，希望按月支付照護費。應評估什麼？","options":["僅指定親友每月收租，其他支出由其自行決定","規劃照護信託的資金管理、按月給付及監督報告","把房屋直接過戶給照護機構，免除後續管理","只在口頭上約定租金用途，不保留紀錄"],"answer":1,"explain":"逐選項解析：（1）親友代收不一定有可查核的用途與給付約束。；（2）信託可設計依契約給付與監督，但須評估設立成本。；（3）過戶與信託管理的法律效果不同，且可能失去所有權。；（4）口頭安排難以確保長期給付與查核。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F173","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"家長想為身心障礙子女保留長期生活費，避免遺產一次花完。應如何安排？","options":["由受益人一次取得全部資產，事後再請親友協助管理","只指定受益人，不必約定給付方式與管理責任","將全部資金集中投資單一高配息股票支付生活費","評估信託的分期給付、照護需求、受託管理與監督"],"answer":3,"explain":"逐選項解析：（1）一次給付可能不符合長期照護與管理需求。；（2）給付條件及管理責任是此情境的核心。；（3）單一股票波動及配息不確定，可能影響生活費。；（4）依受益人需求設計給付及監督，較能落實長期安排。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F174","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"企業主希望捐助獎學金，但要求資金只能用於特定教育目的。應如何規劃？","options":["只在捐款時口頭告知用途，之後不需追蹤","由企業主每年自行決定資金可否挪作其他支出","評估公益目的、適當信託架構及用途查核機制","只將資金放入一般帳戶，便等同成立信託"],"answer":2,"explain":"逐選項解析：（1）口頭指定較難建立持續可執行的用途限制。；（2）與指定公益用途不符的任意變更可能違背安排目的。；（3）須依法評估適當架構，並訂定給付、管理及監督條件。；（4）一般存款帳戶不會自動成立信託關係。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F175","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"高齡者想設信託，卻不知道受託銀行會收取哪些費用。應先查什麼？","options":["比較設立與管理費、給付手續費及服務範圍","只問預估投資報酬率，其他契約成本可忽略","選費用最低的機構，無須比較服務與給付限制","將信託費用視為銀行存款利息，不影響資產"],"answer":0,"explain":"逐選項解析：（1）總成本與給付服務範圍均應在設立前比較。；（2）報酬預估不能取代對費用與契約條件的理解。；（3）最低費用未必符合所需照護給付與管理服務。；（4）費用會減少可運用的信託財產。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F176","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"長者有房產及現金，想同時安排醫療與生活支出。信託契約應重視什麼？","options":["將全部現金長期鎖定，避免任何提前動用","只指定投資報酬率，不需安排醫療支出","依醫療與生活用途設計支付條件、流動性及定期報告","將房產估值直接當作每月可立即支出的現金"],"answer":2,"explain":"逐選項解析：（1）醫療支出可能具有急迫性，須保留適當流動性。；（2）契約應涵蓋支出需求與可動用資金安排。；（3）分用途給付與報告可協助管理與查核。；（4）不動產估值不等於即時可動用資金。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F177","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"家長打算把財產交給親友口頭保管，卻擔心將來發生爭議。應如何降低風險？","options":["只請親友簽一般收據，不約定用途及管理責任","建立正式書面管理安排，明確約定權責、給付及查核","把資產全部交付親友後，才要求補訂契約","以親友關係親密為由，免除帳務紀錄"],"answer":1,"explain":"逐選項解析：（1）收據無法完整處理長期管理與用途約束。；（2）正式安排可降低日後責任不清與給付爭議。；（3）先無條件交付可能造成控制與追索困難。；（4）親密關係不等於不需要財務透明。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F178","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"受託人未按契約給付受益人生活費，家屬不知如何查證。事前應安排什麼？","options":["只約定年度投資報酬率，無須留存給付紀錄","僅要求受益人自行記帳，受託人不提供資料","在契約中安排給付紀錄、定期報告與適當監督","以信託名義排除任何受託人管理責任"],"answer":2,"explain":"逐選項解析：（1）投資報酬與是否按約給付是不同事項。；（2）給付查核應有可核對的受託管理資料。；（3）報告與監督機制有助辨識未按約給付問題。；（4）受託人仍須依信託契約及法令履行義務。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F179","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"家庭想把高波動投資商品放進安養信託，照護費每月固定支出。應如何評估？","options":["為追求報酬，將每月照護費全數投入高波動資產","將照護資金分層，保留近期支出的流動性並管理投資風險","只要信託由銀行承作，就不必評估投資波動","將每月固定支出視為可隨市場價格自由延後"],"answer":1,"explain":"逐選項解析：（1）短期必要支出不宜完全暴露於高波動風險。；（2）支出期限與風險承受度應決定資產安排。；（3）信託管理不代表投資本金保證。；（4）必要照護費通常不能依市場波動任意延後。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F180","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"信託與財產管理","q":"父親想在自己仍有能力時決定未來失能後的支付規則。應何時規劃？","options":["待失能後再由任何親屬口頭決定全部給付條件","只保留一般銀行帳戶，認為與信託管理功能完全相同","在意思能力與安排條件明確時及早諮詢並設計契約","先把資產無條件移轉給親友，再考慮監督機制"],"answer":2,"explain":"逐選項解析：（1）失能後可能涉及意思能力與代理權限問題，宜及早規劃。；（2）一般帳戶與依契約設定受託管理及給付條件的信託不同。；（3）及早規劃有助明確指定受益、給付條件及監督。；（4）無條件移轉可能失去控制與監督安排。。","source":"信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F181","quality_review":"本批重寫干擾選項與四選項解析；待教師及官方資料終審"},{"topic":"以房養老與高齡照護","q":"退休夫妻自有住房但現金不足，希望繼續居住。應先了解哪種安排？","options":["優先比較逆向抵押貸款的撥款方式、利息及居住安排","只比較可借最高金額，其他契約條件等退休後再看","先將房屋過戶給銀行，再詢問是否可繼續居住","將每月撥款視為無須清償的政府年金"],"answer":0,"explain":"逐選項解析：（1）以房養老須評估擔保、撥款、利息與清償等條件。；（2）最高額度不等於適合長期生活的方案。；（3）一般逆向抵押貸款與立即移轉所有權是不同法律安排。；（4）貸款撥款不是無償補助。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F182","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"子女認為父親申請以房養老就立刻失去房屋所有權。應如何釐清？","options":["查明設定抵押權與房屋所有權移轉的差別及清償條款","認為一旦抵押，銀行就立即成為房屋所有權人","以貸款名稱相同為由，推定各銀行契約完全一致","只看每月撥款，不需確認契約到期後的處理"],"answer":0,"explain":"逐選項解析：（1）設定抵押擔保不等於當下直接過戶，仍須看契約。；（2）抵押權與所有權是不同權利。；（3）不同銀行可能有不同條件。；（4）到期、清償及繼承處理是重要風險。。","source":"以房養老教學講義；信託制度與信託2.0整合版","review_status":"情境改寫，待官方法規及教師審核","id":"F183","quality_review":"第八批：干擾選項及四選項解析已重寫；待官方資料及教師終審"},{"topic":"以房養老與高齡照護","q":"長輩預計領取以房養老撥款二十年，但擔心高齡後仍需生活費。應如何評估？","options":["只估算前五年的每月撥款，長期需求不用納入","以房價持續上漲作為二十年後仍有現金的保證","測試撥款終止後的生活費來源及長壽風險","只要目前有房屋，就不用考慮醫療與照護支出"],"answer":2,"explain":"逐選項解析：（1）只看前期現金流可能忽略後期缺口。；（2）房價不保證上漲，且不直接提供生活現金。；（3）長壽可能超過約定撥款期間，需另規劃資金。；（4）醫療與照護支出可能隨年齡改變。。","source":"以房養老教學
