1.92%，不能只看名目報酬。\n其他選項：選項2把報酬與通膨相加；選項3忽略名目成長；選項4公式與單位錯誤","source":"貨幣與通膨講義","official":"","concept":"費雪方程近似","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F323","topic":"退休現金流","q":"退休夫妻每月基本支出4.8萬元，固定年金合計3萬元，另有基金每年配息20萬元但配息可能變動。評估退休安全性時，最合理的作法是？","options":["將基金配息視為保證且永遠不變","先估計每月缺口、預留流動資金，並對配息下降與長壽情境壓力測試","只看基金去年殖利率","因有自住房就不需估算醫療費"],"answer":1,"explain":"正解：固定收入與支出差額1.8萬元/月，配息有波動與本金變化風險，須做壓力測試。\n其他選項：選項1把不確定收入當保證；選項3忽略總報酬與風險；選項4忽略醫療及照護","source":"退休規劃與投資","official":"","concept":"現金流缺口+壓力測試","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F324","topic":"理專適合度與風險","q":"75歲客戶需兩年內支付長照費，理專推薦六年期且提前解約成本高的商品，理由是「預期報酬較高」。最關鍵的評估為何？","options":["是否符合客戶資金用途、流動性需求及風險承受能力","理專的銷售排名","商品廣告色彩是否吸引人","只要預期報酬高就可忽略到期限制"],"answer":0,"explain":"正解：適合度評估須對應客戶目標與資金使用期限，不能僅依預期報酬推薦。\n其他選項：選項2是銷售者指標；選項3與適合度無關；選項4忽略提前解約成本","source":"理專十誡與公平待客","official":"","concept":"高齡客戶適合度","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F325","topic":"跨主題決策","q":"一名自由工作者有20萬元預備金、信用卡循環欠款8萬元、下月確定稅款6萬元，朋友推薦高波動加密資產投資。何者最合理？","options":["先保留稅款與必要預備金，評估優先償還高成本債務後再考慮投資","先把20萬元全部投入加密資產以爭取高報酬","稅款可以等投資獲利後再支付","信用卡循環欠款只要按最低應繳就沒有成本"],"answer":0,"explain":"正解：確定義務與高成本債務優先於投機性資產，且自由工作收入不穩更需流動性。\n其他選項：選項2放大短期資金風險；選項3忽略法定支付期限；選項4忽略循環利息","source":"財務規劃與金融科技","official":"","concept":"流動性+高息債+投資風險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F326","topic":"投資與匯率","q":"學生一年後需付美元學費，現有新臺幣存款，考慮把全部換成美元高波動股票基金。哪項分析較周全？","options":["美元資產就一定與美元學費金額同步","區分匯率曝險與股票市場曝險，學費資金宜優先降低到期金額不確定性","股票基金名稱有美元就不會虧損","只看基金配息率即可判斷足夠繳學費"],"answer":1,"explain":"正解：美元計價基金仍有淨值波動；資產幣別匹配不等於消除市場風險。\n其他選項：選項1忽略淨值波動；選項3混淆計價幣別與本金保障；選項4配息不等於總報酬","source":"金融商品分類與投資風險","official":"","concept":"幣別匹配+市場風險","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F327","topic":"防詐與數位帳戶","q":"詐騙集團假冒銀行發簡訊稱「帳戶即將凍結」，附網址要求輸入帳密及簡訊驗證碼。學生已點入網址但尚未輸入。哪項最適當？","options":["關閉頁面，改由銀行官方App或自行查得的客服管道確認","在簡訊網址輸入帳密但不輸入驗證碼","轉傳給同學請大家一起測試網址","回覆簡訊要求詐騙者提供工作證"],"answer":0,"explain":"正解：釣魚連結可能仿冒官方網站，應由獨立可信管道核實，不應在可疑頁面輸入憑證。\n其他選項：選項2仍暴露帳密；選項3擴散風險；選項4無法建立可信身分","source":"防詐與數位金融","official":"","concept":"釣魚連結應變","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F328","topic":"資產配置與相關性","q":"市場大跌時，甲組合有三檔同產業股票基金；乙組合含不同資產類別，且各資產風險來源不完全相同。哪個推論最合理？","options":["乙的分散效果可能較佳，但仍不能保證不虧損","甲持有三檔基金必定比乙分散","乙因資產不同而保證正報酬","基金檔數就是風險分散的唯一指標"],"answer":0,"explain":"正解：分散效果取決於資產風險來源與相關性，而非商品數量；市場系統性風險仍存在。\n其他選項：選項2只看數量；選項3把分散誤當保本；選項4忽略相關性","source":"金融商品分類與風險管理","official":"","concept":"相關性與分散","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F329","topic":"保險與退休","q":"退休者已有醫療實支實付保單，但照護機構每月生活照護費不一定屬於住院醫療費用。最適合的評估是？","options":["檢查醫療險理賠範圍，另估算長期照護現金流與相關保障缺口","認定實支實付會支付所有照護費","因已有醫療險就無需準備任何現金","只看保單名稱有「醫療」即可確認理賠"],"answer":0,"explain":"正解：醫療費用補償與長照日常支出性質不同，須以契約條款與實際需求核對。\n其他選項：選項2混淆保障事故與費用；選項3忽略現金需求；選項4忽略條款細節","source":"保險與高齡照護","official":"","concept":"醫療險與長照缺口","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F330","topic":"信託與受益安排","q":"家長為身心障礙成年子女設立信託，希望按月支付生活費並避免一次領走。哪個條款最值得明確約定？","options":["受益給付的金額、用途、條件及受託人報告方式","只寫「將來再討論」而不訂給付原則","由理專個人持有所有金融密碼","完全不指定受益人與財產範圍"],"answer":0,"explain":"正解：明確契約條款才能讓財產管理與受益目的可執行、可查核。\n其他選項：選項2不利執行；選項3增加挪用與安全風險；選項4缺乏必要安排","source":"信託2.0講義","official":"","concept":"受益給付條款","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"F331","topic":"貨幣政策與債券","q":"中央銀行升息後，學生觀察到定存新利率上升、手中長天期固定票息債券市價下跌。何者最能同時解釋？","options":["新存款利率與既有債券市價受市場利率變化影響，但方向可能不同","升息必然讓所有金融資產價格同時上漲","債券票息固定表示市價固定","定存利率與債券價格都與利率無關"],"answer":0,"explain":"正解：市場利率上升時新存款條件可能提高；既有固定票息債券折現價值通常下降。\n其他選項：選項2忽略不同資產特性；選項3混淆票息與交易價格；選項4否認利率傳導","source":"中央銀行與金融市場","official":"","concept":"利率傳導","review_status":"新增題：已核對邏輯；法規題對照官方網站，待教師終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP001","topic":"貨幣政策與總體金融","q":"景氣連續低迷、失業率升高且物價漲幅溫和。央行希望增加市場流動性，哪個政策組合較一致？","options":["提高存款準備率並賣出債券","降低重貼率並公開市場買入債券","提高重貼率但買入債券","降低重貼率並提高存款準備率"],"answer":1,"explain":"正解：降低重貼率與買入債券均偏向擴張性貨幣政策，有助增加流動性。\n錯誤選項解析：（1）兩者均偏緊縮，方向相反；（3）重貼率與公開市場操作方向互相抵銷；（4）降低重貼率偏寬鬆，但提高準備率偏緊縮。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP002","topic":"貨幣政策與總體金融","q":"物價持續快速上漲，央行決定公開市場賣出政府債券。某銀行財務主管應先預期哪種直接效果？","options":["銀行體系準備金可能減少，短期資金趨緊","銀行準備金因買入債券而增加","銀行放款能力不受任何影響","民眾持有債券的票面利率會自動改寫"],"answer":0,"explain":"正解：央行賣出債券，買方支付資金，銀行體系流動性通常收縮。\n錯誤選項解析：（2）這是央行買入債券時較可能的方向；（3）流動性變動可能影響銀行放款能力；（4）既有債券票面利率不會因交易自動更改。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP003","topic":"貨幣政策與總體金融","q":"小芳持有固定利率、距到期尚久的政府公債，市場預期政策利率上升。她想在到期前賣出，主要須評估什麼？","options":["債券票息將隨市場利率同步上升","既有債券價格可能下跌，且長天期價格較敏感","公債本金必因升息而增加","到期殖利率提高代表她現在賣出一定獲利"],"answer":1,"explain":"正解：固定票息債券與市場利率通常反向變動；存續期間越長通常越敏感。\n錯誤選項解析：（1）固定利率票息依發行條件，不自動上調；（3）市場價格可能跌，非本金自動增加；（4）殖利率上升可能伴隨現價下跌。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP004","topic":"貨幣政策與總體金融","q":"央行降息後，企業想投資擴廠，但經理提醒「降息不等於股價必漲」。哪項理由最完整？","options":["折現率下降一定抵銷營收下滑","股價只取決於政策利率，不受獲利影響","降息可能降低資金成本，但市場也可能反映衰退風險","央行降息後所有企業都能以相同利率借款"],"answer":2,"explain":"正解：股價同時受折現率、企業現金流與市場預期影響。\n錯誤選項解析：（1）營收與獲利下滑仍可能壓低估值；（2）企業獲利及風險溢酬同樣重要；（4）信用風險不同，借款條件也不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP005","topic":"貨幣政策與總體金融","q":"某家庭的房貸採浮動利率，央行啟動緊縮政策。家庭財務規劃最適合採取何種做法？","options":["先檢視利率重訂條款並試算月付金增加幅度","假設每家銀行明天同步調高同一幅度","立即把緊急預備金全數投入股票","認為政策升息只影響新貸款"],"answer":0,"explain":"正解：浮動利率房貸可能依契約與指標利率調整，應做現金流壓力測試。\n錯誤選項解析：（2）調整時點與幅度取決於契約及銀行指標；（3）緊縮時保留緊急預備金更重要；（4）既有浮動利率貸款也可能受影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP006","topic":"貨幣政策與總體金融","q":"出口商報價美元、主要成本以新臺幣支付。若其他因素不變，新臺幣升值，哪項風險最值得優先管理？","options":["同額美元收入換回新臺幣可能減少","同額美元收入換回新臺幣一定增加","出口商原料成本必定全面上升","匯率變動不會影響跨幣別收入"],"answer":0,"explain":"正解：新臺幣升值時，每美元可換得的新臺幣減少，影響未避險的外幣收入。\n錯誤選項解析：（2）方向相反；（3）進口原料成本未必上升，可能下降；（4）不同幣別收支存在換算風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP007","topic":"貨幣政策與總體金融","q":"進口商需三個月後支付美元貨款，央行升息可能支持本幣，但公司不願賭匯率。哪項決策較合理？","options":["只憑升息訊號取消所有避險","依付款時點評估遠期外匯或自然避險","假設匯率只受本國利率決定","借更多美元且不評估匯率曝險"],"answer":1,"explain":"正解：匯率受多種因素影響，企業應依實際幣別現金流管理曝險。\n錯誤選項解析：（1）升息不保證本幣升值；（3）資本流動、外國利率等也影響匯率；（4）擴大外幣負債可能增加曝險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP008","topic":"貨幣政策與總體金融","q":"央行調降存款準備率後，銀行主管說「可放款資金增加，因此信用風險不重要」。應如何評價？","options":["完全正確，準備率可取代徵信","錯誤，準備金約束可能放鬆，但仍須審核還款能力","錯誤，降低準備率必使所有貸款利率上升","完全正確，銀行可無限創造貸款"],"answer":1,"explain":"正解：準備率變動影響流動性約束，不免除授信、資本與風險管理要求。\n錯誤選項解析：（1）準備率不是信用審查替代品；（3）利率變化不具此必然方向；（4）放款仍受資本、流動性與信用風險限制。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP009","topic":"貨幣政策與總體金融","q":"央行擬提高重貼率，某學生主張「這與公開市場賣出債券一樣，都是偏緊縮工具」。哪項判斷最佳？","options":["方向一致，但傳導管道與效果不完全相同","兩者必然使貨幣供給增加","提高重貼率屬擴張，賣債屬緊縮","只有賣債影響利率，重貼率完全無關"],"answer":0,"explain":"正解：提高重貼率與賣債均偏緊縮，但分別經由央行融通成本與市場流動性傳導。\n錯誤選項解析：（2）兩者皆非增加流動性的典型作法；（3）提高重貼率偏緊縮；（4）重貼率變動可能影響資金成本與利率預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP010","topic":"貨幣政策與總體金融","q":"通膨下降但仍高於目標，經濟成長放緩。央行是否應立刻大幅降息？哪種分析最符合決策思維？","options":["只看失業率就能決定","只看最近一個月股價就能決定","同時評估通膨持續性、成長、就業與預期，再權衡風險","通膨只要比上月低就代表物價已下跌"],"answer":2,"explain":"正解：貨幣政策需權衡物價穩定與經濟情勢，通膨下降不等於物價水準下降。\n錯誤選項解析：（1）忽略物價風險；（2）股價不是唯一政策依據；（4）通膨率降低通常是價格漲得較慢。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP011","topic":"貨幣政策與總體金融","q":"某公司持有短期存款與長期固定利率債券。市場利率上升時，哪項比較較合理？","options":["兩者市場價值都會等幅上升","長期固定利率債券通常承受較大的價格波動風險","短期存款必產生與長債相同的資本損失","長債因票息固定所以市價不會改變"],"answer":1,"explain":"正解：長期固定利率債券通常利率敏感度較高；短期存款重訂價及流動性特性不同。\n錯誤選項解析：（1）利率上升通常不利既有固定利率債券市價；（3）存款與債券的價格機制不同；（4）固定票息不代表固定市場價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP012","topic":"貨幣政策與總體金融","q":"政府擴大支出刺激景氣，同期央行升息抑制通膨。學生要分析總體效果，哪個說法較好？","options":["兩種政策方向可能互相拉扯，須看力度與時點","財政政策與貨幣政策一定同向","只要央行升息，政府支出就失去所有效果","政府支出增加代表央行必須同步降息"],"answer":0,"explain":"正解：擴張性財政與緊縮性貨幣政策可能對總需求產生不同方向的影響。\n錯誤選項解析：（2）兩者可採不同方向；（3）影響不會機械式完全抵銷；（4）政策協調不等於必須同步降息。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP013","topic":"貨幣政策與總體金融","q":"銀行調升新臺幣定存利率，退休族想把所有資產改放一年期定存。哪個提醒最適當？","options":["定存名目利率較高就必定超越通膨","應比較稅後實質報酬、流動性與存保額度","利率上升後所有股票都不值得持有","銀行定存與長期債券價格波動完全相同"],"answer":1,"explain":"正解：資產配置須同時考量實質購買力、流動性、分散及存款保障。\n錯誤選項解析：（1）名目利率不等於實質報酬；（3）股票風險報酬不能單憑升息判定；（4）定存與債券的風險特性不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP014","topic":"貨幣政策與總體金融","q":"央行買入公債後，有人說「市場資金增加，企業融資成本必立即下降」。哪個修正較精確？","options":["資金供給可能增加，但貸款利率仍受風險與傳導時滯影響","買債會立即減少銀行準備金","所有企業借款利率依法必相同","公開市場買債只改變票面利率，不影響流動性"],"answer":0,"explain":"正解：公開市場買入債券通常增加流動性，但政策傳導非即時或一致。\n錯誤選項解析：（2）買債一般增加而非減少流動性；（3）信用條件及風險差異造成利率不同；（4）交易影響市場資金與債券價格。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP015","topic":"貨幣政策與總體金融","q":"臺灣進口能源價格大漲引發物價上升，央行考慮升息。哪個判斷較完整？","options":["升息能立即增加全球能源供給","升息可能抑制需求及通膨預期，但無法直接消除供給衝擊","升息一定讓能源進口量歸零","只要是成本推動通膨，貨幣政策就沒有任何影響"],"answer":1,"explain":"正解：貨幣政策主要影響需求與預期，對供給衝擊本身的處理有限。\n錯誤選項解析：（1）利率工具無法直接創造能源；（3）能源需求不會機械式歸零；（4）政策仍可能影響次輪通膨及預期。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP016","topic":"貨幣政策與總體金融","q":"某出口公司同時借美元貸款並收美元貨款。新臺幣貶值時，哪項風險判斷最合理？","options":["美元收入與美元負債可能部分自然抵銷匯率曝險","只有美元收入受匯率影響，美元負債不受影響","新臺幣貶值會使美元負債折算新臺幣必然下降","自然避險表示收付款時間差完全不重要"],"answer":0,"explain":"正解：相同幣別的收支可能形成自然避險，但金額與到期日須匹配。\n錯誤選項解析：（2）美元負債折算也受匯率影響；（3）貶值時美元負債折算成本通常增加；（4）期限錯配仍有現金流與匯率風險。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP017","topic":"貨幣政策與總體金融","q":"升息後，一家高負債企業與一家現金充裕企業的股價反應不同。哪個分析最有說服力？","options":["兩家企業必須同幅下跌","負債結構、利息保障倍數與獲利前景會造成不同影響","企業股價只由央行利率決定","現金多的企業永遠不受景氣衰退影響"],"answer":1,"explain":"正解：利率對企業的影響取決於財務結構、現金流及市場預期。\n錯誤選項解析：（1）不同企業曝險不同；（3）股價同時反映獲利與風險；（4）景氣下滑仍可能影響現金充裕企業。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP018","topic":"貨幣政策與總體金融","q":"央行宣布維持利率不變，市場債券殖利率卻上升。哪項解釋較合理？","options":["市場利率只能與政策利率完全同步","債券殖利率還受未來政策預期、通膨與期限溢酬影響","殖利率上升代表央行一定偷偷升息","政策利率不變，債券價格就不能變動"],"answer":1,"explain":"正解：市場殖利率反映預期與風險溢酬，並非只由當期政策利率決定。\n錯誤選項解析：（1）兩者非完全同步；（3）市場變動不等於央行改變政策利率；（4）市場價格會隨預期與供需變動。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP019","topic":"貨幣政策與總體金融","q":"央行緊縮時，學生想用「本幣一定升值、出口一定減少」預測貿易順差。老師應如何修正？","options":["保留方向性推論，但強調外國景氣、供應鏈與匯率預期也會影響結果","只要升息，順差一定歸零","緊縮政策不可能影響匯率","貿易收支只看進口，不必看出口"],"answer":0,"explain":"正解：講義提供典型傳導方向，但匯率與貿易收支結果取決於多重因素。\n錯誤選項解析：（2）順差不會機械式歸零；（3）利差可能影響資金流動與匯率；（4）貿易收支同時受出口與進口影響。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"MP020","topic":"貨幣政策與總體金融","q":"家庭同時持有房貸、債券ETF與緊急預備金。預期進入升息循環，哪個綜合行動最合理？","options":["評估房貸重訂價風險、債券存續期間並維持足夠現金","因債券ETF有配息，就忽略淨值波動","將全部緊急預備金用來加碼長天期債券ETF","認為升息對浮動房貸與債券ETF影響必相同"],"answer":0,"explain":"正解：升息對負債現金流與固定收益資產價格的影響不同，應分別衡量。\n錯誤選項解析：（2）配息不等於沒有價格風險；（3）動用全部備用金會提高流動性風險；（4）兩種商品的利率傳導與風險不同。","source":"新增講義《貨幣政策.docx》；延伸決策情境為命題設計","status":"新增情境題，待教師與官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX001","topic":"貸款與信用","q":"阿翰要借20萬元，甲銀行名目利率3.2%但收開辦費，乙銀行利率3.6%免開辦費；兩者還款期間相同。應優先取得哪項資料才能公平比較？","options":["兩案的總費用年百分率與還款明細","兩案的廣告名目利率排名","兩案的核貸速度與分行數","兩案的銀行資本額"],"answer":0,"explain":"選項（1）：APR將利息與相關費用按規定納入比較，並須核對還款條件。\n選項（2）：名目利率忽略開辦費，可能低估實際成本。\n選項（3）：核貸速度是便利性，不是完整借貸成本。\n選項（4）：銀行資本額不直接決定這兩筆貸款的總成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX002","topic":"貸款與信用","q":"小恩有兩張循環信用卡，利率較高的卡片欠款8萬元、利率較低的欠款3萬元，且兩卡均未逾期。若有額外1萬元可還款，何者較能減少後續利息？","options":["先平均分給兩張卡","優先償還利率較高的卡片本金","優先還餘額較小的卡片不看利率","只繳兩張卡最低應繳金額"],"answer":1,"explain":"選項（1）：平均分配可能讓高利率餘額保留較久。\n選項（2）：在其他條件相同時，優先降低高利率本金通常節省較多利息。\n選項（3）：餘額大小與節省利息不必然一致。\n選項（4）：最低應繳通常無法有效減少循環利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX003","topic":"貸款與信用","q":"一筆浮動利率房貸約定每季重訂價，央行今天宣布升息，但借款人下週才收到帳單。哪個判斷最恰當？","options":["下一期帳單一定立刻增加相同幅度","央行升息後房貸契約自動變固定利率","應確認指標利率、加碼與重訂價日","只要銀行未通知就不會改變"],"answer":2,"explain":"選項（1）：是否立即調整取決於契約與重訂價日。\n選項（2）：升息不會自動改變貸款的固定或浮動性質。\n選項（3）：契約指標及調整時點才是判斷實際月付變動的關鍵。\n選項（4）：通知義務與實際計息條件須依契約和法規判斷。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX004","topic":"貸款與信用","q":"一位學生取得低利就學貸款，同時手上有僅供生活緊急支出的3萬元。畢業前想提前還款，哪個思考最完整？","options":["先查是否有提前還款限制，再比較利息節省與緊急預備金需求","只要利率低就永遠不應提前還款","把全部生活預備金一次還清","先用信用卡預借現金償還就學貸款"],"answer":0,"explain":"選項（1）：需同時衡量契約、利息與現金流風險。\n選項（2）：低利率不代表提前還款在任何情境都不適合。\n選項（3）：清空緊急預備金可能導致更高成本的臨時借款。\n選項（4）：預借現金常伴隨較高費用與利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX005","topic":"貸款與信用","q":"房貸寬限期剩兩個月，小婷每月收入固定，卻把目前只繳利息的金額當作未來月付。最該先做什麼？","options":["等寬限期結束再看銀行帳單","假設本金會自動減少","只用目前利息支出編列未來預算","試算開始攤還本金後的月付並預留現金流"],"answer":3,"explain":"選項（1）：延後評估可能錯失調整支出的時間。\n選項（2）：只繳利息時本金通常不會因時間經過而減少。\n選項（3）：目前月付低估未來本息攤還負擔。\n選項（4）：寬限期後本息攤還通常增加月付，應先試算。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX006","topic":"貸款與信用","q":"小豪信用卡額度10萬元，刷卡7萬元後決定只繳最低應繳；下個月又要申請車貸。哪項風險評估較完整？","options":["只要沒遲繳，負債就不影響任何審核","循環餘額與負債比可能影響授信評估","信用卡額度高代表收入一定高","最低應繳金額就是全部借款成本"],"answer":1,"explain":"選項（1）：未逾期不代表授信機構不考量既有負債。\n選項（2）：既有負債及還款能力可能列入信用審核。\n選項（3）：額度由多種因素決定，不能直接等同收入。\n選項（4）：最低應繳不等於剩餘本金與全部利息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX007","topic":"貸款與信用","q":"某分期購物標榜「零利率」，但必須支付不可退還的服務費1,500元。購物者如何判斷是否划算？","options":["只比較每月分期金額","把服務費當成商品折扣","比較含服務費的總支付與其他付款方式","只看是否有銀行合作"],"answer":2,"explain":"選項（1）：月付低不代表總支付較低。\n選項（2）：服務費是成本而非折扣。\n選項（3）：零名目利率仍可能存在費用，須比較總成本。\n選項（4）：合作銀行並不保證該方案最便宜。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX008","topic":"投資與風險","q":"同樣投資10萬元，甲ETF集中單一科技產業，乙ETF涵蓋多個產業。小君已有大量科技公司股票，哪項配置考量較合理？","options":["只比較哪檔去年漲幅高","因甲持股數多就一定較分散","乙ETF名稱有大盤就不需看持股","檢查與既有部位的產業重疊及集中風險"],"answer":3,"explain":"選項（1）：歷史漲幅無法反映整體資產重疊。\n選項（2）：多檔同產業股票仍可能高度相關。\n選項（3）：ETF名稱不替代實際持股分析。\n選項（4）：應從整體投資組合檢查集中度。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX009","topic":"投資與風險","q":"債券基金配息率5%，但今年淨值下跌8%。投資人想知道是否真的賺錢，應如何評估？","options":["將配息與淨值變動一起納入總報酬","配息率5%即表示全年報酬5%","只看收到的現金不看本金","因債券基金配息就排除價格風險"],"answer":0,"explain":"選項（1）：總報酬需同時計入價格變化與現金分配。\n選項（2）：配息率不等於總報酬率。\n選項（3）：忽略淨值可能高估收益。\n選項（4）：債券基金仍受利率與信用風險影響。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX010","topic":"投資與風險","q":"甲股票報酬率預估12%但可能大幅虧損；乙定存利率2%且有適用的存保保障。半年後必須支付學費的資金應如何安排？","options":["全押甲股票以提高期望報酬","以保本與到期流動性為主要考量","把學費借出去換更高利息","只看預期報酬率不看用途"],"answer":1,"explain":"選項（1）：短期必需支出不宜承擔無法承受的價格波動。\n選項（2）：資金用途與使用期限優先於追求高報酬。\n選項（3）：私人借貸可能增加違約與流動性風險。\n選項（4）：預期報酬不能取代期限與風險評估。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX011","topic":"投資與風險","q":"一檔海外債券ETF以美元計價，債券價格上漲3%，但新臺幣同期明顯升值。以新臺幣計價的報酬可能如何？","options":["必然至少上漲3%","只與美國政策利率有關","可能因匯率換算而低於3%甚至虧損","只要有配息就不受匯率影響"],"answer":2,"explain":"選項（1）：本幣升值會影響外幣資產換算價值。\n選項（2）：利率只是債券報酬的其中一項因素。\n選項（3）：外幣報酬須加計匯率變動，可能抵銷價格收益。\n選項（4）：配息不會消除匯率風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX012","topic":"投資與風險","q":"某股票價格100元，投資人買入後漲到105元，想計算實際獲利。最完整的計算應考慮什麼？","options":["只用5元乘股數","買進手續費即可","賣出證交稅即可","買賣手續費、賣出證交稅及其他適用成本"],"answer":3,"explain":"選項（1）：價差尚未扣除交易成本。\n選項（2）：賣出時仍可能有手續費與稅。\n選項（3）：買進也有手續費等成本。\n選項（4）：完整損益應扣除買賣相關成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX013","topic":"投資與風險","q":"小琪將退休金全部買入長天期公債ETF，理由是「公債違約風險低」。她忽略了哪個主要風險？","options":["利率上升可能使長天期債券價格波動較大","公債ETF一定沒有任何現金流","長天期債券一定比短天期流動性差","公債不可能受到市場價格影響"],"answer":0,"explain":"選項（1）：低信用風險不等於低利率風險，存續期間愈長通常愈敏感。\n選項（2）：ETF可能有配息或資本利得。\n選項（3）：流動性需看實際市場條件，非單由天期決定。\n選項（4）：債券市場價格會隨利率等因素變動。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX014","topic":"投資與風險","q":"同一檔基金有A類型前收手續費與B類型遞延銷售費，投資人預計持有時間不確定。如何比較較合理？","options":["只比較申購當天扣款","估算不同持有期間的總費用與贖回條件","只看基金經理人照片","只看哪類型配息頻率高"],"answer":1,"explain":"選項（1）：前端費用無法代表整段期間成本。\n選項（2）：持有期間與贖回時點會影響總成本。\n選項（3）：經理人照片與費用比較無關。\n選項（4）：配息頻率不能替代費用結構。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX015","topic":"保險與保障","q":"小瑄已有住院實支實付醫療險，想替家人再買同類商品。她最應先核對什麼？","options":["保險公司廣告代言人","只比較每年保費","理賠限額、除外責任、給付方式及重複投保規範","只看保單封面保障名稱"],"answer":2,"explain":"選項（1）：代言資訊不代表保障內容。\n選項（2）：保費須與條款及保障內容一起比較。\n選項（3）：實際可理賠範圍與多張保單給付規則最重要。\n選項（4）：商品名稱不足以確認給付細節。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX016","topic":"保險與保障","q":"阿志購買重大疾病險後一個月發現健康異常，想確認是否符合給付。哪個處理最恰當？","options":["直接認定保險公司一定要賠","只詢問親友經驗","只看業務員口頭保證","檢視疾病定義、等待期、告知義務及保單生效條件"],"answer":3,"explain":"選項（1）：是否給付須依契約與事實判斷。\n選項（2）：他人個案不一定適用同一條款。\n選項（3）：口頭說明不應取代正式保單條款。\n選項（4）：等待期與承保條件可能影響給付。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX017","topic":"保險與保障","q":"家庭主要收入者有房貸、扶養子女與年邁父母，預算有限。評估壽險保額時應優先採何種方法？","options":["估算家庭未來支出、負債及現有資產保障缺口","直接買同事相同保額","只以年齡決定保額","將保額等同每月保費的十倍"],"answer":0,"explain":"選項（1）：需求分析可將扶養責任與負債納入。\n選項（2）：同事家庭責任可能不同。\n選項（3）：年齡不能單獨反映保障需求。\n選項（4）：保費與保額並無固定十倍關係。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX018","topic":"保險與保障","q":"車禍造成對方車輛損壞及對方受傷，車主只投保強制汽車責任保險。哪項理解最恰當？","options":["強制險會賠償全部車損","強制險主要提供法定人身傷害保障，財物損失須另評估","強制險只賠自己的車損","有強制險就不用考慮民事責任"],"answer":1,"explain":"選項（1）：強制險不涵蓋一般車輛財損賠償。\n選項（2）：強制險著重事故受害人法定人身給付。\n選項（3）：自己的車損通常非強制險保障項目。\n選項（4）：保險給付不必然免除全部民事責任。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX019","topic":"保險與保障","q":"小玲投保醫療險時曾有醫師診斷紀錄，但覺得已痊癒而不填要保書相關問題。最大風險是什麼？","options":["投保後所有疾病都不理賠","保險費會自動變兩倍","未依書面詢問據實告知可能衍生契約爭議","只要有醫療紀錄就無法投保"],"answer":2,"explain":"選項（1）：保障範圍須依具體契約與法律判斷。\n選項（2）：保費不會因隱匿資訊自動按固定倍數變動。\n選項（3）：告知義務應依要保書詢問及法律規定履行。\n選項（4）：有醫療紀錄不等於必然無法承保。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX020","topic":"保險與保障","q":"一位退休者考慮利率變動型年金保險，業務員展示較高宣告利率。哪個判斷較妥當？","options":["宣告利率可保證整個退休期間","宣告利率等同銀行定存利率","只比較當月宣告利率","確認保證條件、宣告利率調整機制及費用"],"answer":3,"explain":"選項（1）：宣告利率可能隨契約機制調整。\n選項（2）：年金保險與存款的保障及成本不同。\n選項（3）：單期利率不能代表長期收益。\n選項（4）：須區分保證與非保證部分及相關費用。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX021","topic":"保險與保障","q":"家長替孩子投保儲蓄型保險，但三年後可能要用錢繳學費。評估商品時最需要什麼資訊？","options":["前三年的解約金及現金流需求","保單封面的圖案","公司廣告曝光量","其他家庭是否也買同商品"],"answer":0,"explain":"選項（1）：提前解約可能造成損失，須與用錢時點比較。\n選項（2）：封面不反映解約成本。\n選項（3）：曝光量不代表流動性。\n選項（4）：他人投保不等於適合自身資金期限。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX022","topic":"防詐與洗錢防制","q":"小明收到自稱銀行的簡訊，要求點連結更新網銀密碼，否則帳戶將凍結。何者較安全？","options":["直接依簡訊操作但不要告訴家人","自行開啟銀行官方App或撥官方電話確認","先把簡訊轉傳同學請他代登","回傳一次性驗證碼確認身分"],"answer":1,"explain":"選項（1）：簡訊連結可能導向偽冒網站。\n選項（2）：透過獨立官方管道查證可降低釣魚風險。\n選項（3）：轉傳並代登會增加帳號資訊外洩風險。\n選項（4）：OTP是重要驗證資訊，不應回傳陌生訊息。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX023","topic":"防詐與洗錢防制","q":"朋友借用你的銀行帳戶收取網拍貨款，說每筆給你500元報酬。你不清楚實際交易內容，最適合怎麼做？","options":["借帳戶但只收少量款項","只要朋友有身分證就可放心","拒絕提供帳戶並確認交易是否涉及不法","改用數位帳戶即可排除風險"],"answer":2,"explain":"選項（1）：金額小也可能涉及洗錢或詐欺。\n選項（2）：對方身分證不代表資金來源合法。\n選項（3）：出借帳戶可能涉及刑事與帳戶風險。\n選項（4）：帳戶類型不改變提供他人收款的風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX024","topic":"防詐與洗錢防制","q":"長者接到假檢警電話，對方聲稱帳戶涉案要求轉入「監管帳戶」。家人應如何協助？","options":["先轉一半以證明配合","要求對方傳來正式公文就轉帳","請長者不要掛電話以免失禮","中止通話並透過165或正式機關管道查證"],"answer":3,"explain":"選項（1）：轉帳可能造成直接損失。\n選項（2）：詐騙者也可能偽造公文。\n選項（3）：持續通話容易受話術操控。\n選項（4）：獨立查證與停止轉帳是重要防線。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX025","topic":"防詐與洗錢防制","q":"小店營業額增加，銀行詢問大額現金交易的資金來源。店主最適合的回應是什麼？","options":["提供交易發票、帳簿與合理資金來源說明","拒絕提供任何資訊並要求銀行不得詢問","改成多人分批存入以避免紀錄","宣稱營業收入不可能被查核"],"answer":0,"explain":"選項（1）：合法交易可用客觀紀錄說明來源。\n選項（2）：金融機構依法負有客戶審查義務。\n選項（3）：刻意拆分交易可能提高可疑交易風險。\n選項（4）：營業收入仍可能需要合理佐證。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX026","topic":"防詐與洗錢防制","q":"投資群組宣稱「每月固定獲利8%，本金保證，拉朋友再加碼」。哪項查核最重要？","options":["先看群組成員人數","查證業者資格、資金流向與保證獲利的合理性","只看群組中的獲利截圖","先投入少量金額就不必查核"],"answer":1,"explain":"選項（1）：群組人數可能造假，無法驗證合法性。\n選項（2）：不合理保證獲利及招攬結構是重要風險訊號。\n選項（3）：截圖可能經過編輯或偽造。\n選項（4）：小額投入也可能造成個資與資金風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX027","topic":"防詐與洗錢防制","q":"學生收到「帳戶異常」電話，對方能說出部分個資並要求提供OTP。哪個判斷最合理？","options":["能說出生日就一定是銀行","只要來電顯示銀行電話就可信","個資可能外洩或遭冒用，OTP不可交付","提供OTP後再改密碼即可免除風險"],"answer":2,"explain":"選項（1）：部分個資可從外洩資料取得。\n選項（2）：來電顯示可能被偽冒。\n選項（3）：OTP是驗證憑證，應獨立聯繫官方查證。\n選項（4）：事後改密碼不一定能追回已完成交易。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX028","topic":"防詐與洗錢防制","q":"一家企業接獲國外供應商郵件要求更換收款銀行帳號，金額較大且時間緊迫。哪個程序最能降低風險？","options":["依新郵件帳號立即匯款","只要郵件有公司Logo即可","先匯小額測試，成功就匯全額","以既有聯絡方式雙重確認收款帳號變更"],"answer":3,"explain":"選項（1）：電子郵件可能遭入侵或偽冒。\n選項（2）：Logo容易複製。\n選項（3）：小額匯款成功無法證明收款人身分。\n選項（4）：獨立管道核對可降低商務電子郵件詐騙。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX029","topic":"退休與信託","q":"退休者有每月固定生活費需求，卻將所有資產放在波動大的股票。哪項規劃較能改善風險？","options":["按生活費期限建立現金與較穩健資產緩衝","只買配息率最高的股票","把每月生活費都當作投資獲利","因退休後不再工作就不需資產配置"],"answer":0,"explain":"選項（1）：依支出期限安排流動性，可降低被迫低價賣出風險。\n選項（2）：高配息不保證價格與現金流穩定。\n選項（3）：配息可能伴隨本金價值變動。\n選項（4）：退休更需管理提領與市場風險。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX030","topic":"退休與信託","q":"長者擔心失能後財產被不當挪用，想安排專款支付照護費用。哪項規劃最貼近需求？","options":["只把提款卡交給鄰居","與專業人員討論安養信託的受託管理及給付條件","把全部財產改成現金藏在家中","只訂口頭約定請親友每月匯款"],"answer":1,"explain":"選項（1）：交付提款卡缺乏清楚的管理與監督安排。\n選項（2）：信託可依契約約定管理用途與給付方式。\n選項（3）：大量現金可能有保管與失竊風險。\n選項（4）：口頭約定的執行與監督較不明確。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX031","topic":"退休與信託","q":"父母想設立教育信託，但希望孩子成年後仍依學費支出分期領取。應優先確認什麼？","options":["銀行分行裝潢","受益人是否喜歡銀行品牌","信託契約中的給付條件、受益權與終止安排","存摺顏色是否方便辨識"],"answer":2,"explain":"選項（1）：裝潢與信託給付條件無關。\n選項（2）：品牌偏好不能取代法律契約設計。\n選項（3）：受益權與給付時點須以合法契約約定。\n選項（4）：存摺外觀不影響信託管理。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX032","topic":"退休與信託","q":"退休家庭評估以房養老，現有房屋是主要居所且仍有其他繼承人。哪項資訊最需要事先釐清？","options":["只看銀行廣告最高可貸成數","認為房價一定持續上漲","只比較每月可領金額","貸款計息、撥款期間、清償及繼承安排"],"answer":3,"explain":"選項（1）：最高成數未反映個案條件。\n選項（2）：房價存在波動風險。\n選項（3）：月領金額不是完整成本。\n選項（4）：以房養老涉及長期利息、房屋處分及繼承問題。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX033","topic":"退休與信託","q":"一位退休者預計十年後才動用部分資金，另一筆半年後就要付醫療費。哪項安排最合理？","options":["分別依資金使用期限規劃流動性與風險","把兩筆資金都放入同一高波動商品","只比較哪個商品宣傳報酬較高","把醫療費全部投入長期閉鎖商品"],"answer":0,"explain":"選項（1）：不同支出期限應有不同風險承受能力。\n選項（2）：高波動商品可能在短期需求時被迫賣出。\n選項（3）：宣傳報酬不能替代風險與期限評估。\n選項（4）：閉鎖商品可能無法及時支應醫療支出。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX034","topic":"退休與信託","q":"家庭規劃退休提領時只以去年投資報酬率推估未來每年收入。哪個問題最值得注意？","options":["去年報酬率足以保證未來收益","報酬順序風險可能使退休初期虧損加速資產耗損","退休後資產價格不再波動","只要平均報酬為正就不需控制提領率"],"answer":1,"explain":"選項（1）：單一年份不能代表長期報酬。\n選項（2）：提領期間遭遇早期大跌，可能對資產續航力造成較大影響。\n選項（3）：退休不會消除市場風險。\n選項（4）：平均報酬無法完整反映提領時點。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX035","topic":"退休與信託","q":"受託人依信託契約管理財產，委託人要求將原本指定教育用途的資金挪作高風險投機。哪項處理較妥當？","options":["立即照做，因委託人永遠可口頭變更","先挪用再補寫紀錄","依信託契約及法令確認變更權限與程序","只要投資可能賺錢就可改變用途"],"answer":2,"explain":"選項（1）：信託權利義務須依契約與法律，不可一概認定可口頭更改。\n選項（2）：事後補記不能取代合法程序。\n選項（3）：信託目的與變更權限是判斷核心。\n選項（4）：預期報酬不等於可違反信託目的。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX036","topic":"貨幣政策與總體金融","q":"央行在公開市場買進公債，其他條件不變。某銀行財務主管應如何評估初步影響？","options":["銀行準備金一定下降","央行直接提高所有銀行放款利率","銀行持有的所有公債價格必跌","市場流動性通常增加，短期利率可能承受下行壓力"],"answer":3,"explain":"選項（1）：買進公債通常向市場注入資金。\n選項（2）：公開市場買入不是直接規定各銀行放款利率。\n選項（3）：債券價格仍受多重因素影響。\n選項（4）：買入操作通常具有增加流動性的方向性效果。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX037","topic":"貨幣政策與總體金融","q":"本國升息，但同時出口衰退、國際資金避險流向美元。企業想預估匯率，最合理的做法是什麼？","options":["將升息視為可能因素之一，並評估其他匯率驅動因素","認定本國貨幣必然升值","只依出口商的單一報價判斷","只看去年同月匯率"],"answer":0,"explain":"選項（1）：匯率受利差、預期、風險情緒及貿易等因素共同影響。\n選項（2）：升息不保證匯率一定升值。\n選項（3）：單一報價不足以預測市場。\n選項（4）：歷史同月價格不代表未來。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX038","topic":"貨幣政策與總體金融","q":"進口商三個月後要支付100萬美元貨款，擔心新臺幣貶值增加成本。哪個風險管理方向較符合需求？","options":["先把所有新臺幣資金投入股票","評估遠期外匯等避險工具及其成本","等待匯率波動後再決定是否付款","認為本國升息就不需匯率避險"],"answer":1,"explain":"選項（1）：股票投資可能增加市場風險，不能直接鎖定匯率。\n選項（2）：遠期外匯可用來管理未來付款匯率，但需評估契約及成本。\n選項（3）：被動等待會暴露匯率變動風險。\n選項（4）：政策利率不能保證匯率方向。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX039","topic":"貨幣政策與總體金融","q":"通膨率下降但仍為正值，學生說「物價已經比去年便宜」。哪個回應最準確？","options":["通膨率下降代表所有商品價格下降","通膨率為正時物價一定不變","物價整體仍可能上漲，只是上漲速度放慢","通膨率只影響股票不影響生活費"],"answer":2,"explain":"選項（1）：通膨率下降不等於價格水準下降。\n選項（2）：正通膨表示整體價格水準仍上升。\n選項（3）：須區分通膨減速與通貨緊縮。\n選項（4）：通膨會影響生活購買力。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX040","topic":"貨幣政策與總體金融","q":"市場預期央行將降息，長天期公債殖利率卻因財政與風險溢酬上升。投資人應如何理解？","options":["只要降息，長債價格一定上漲","殖利率上升代表債券價格也上漲","短期政策利率與長期殖利率必然同步","長債價格可能下跌，因其殖利率受多種因素影響"],"answer":3,"explain":"選項（1）：市場預期已可能提前反映，長債殖利率亦受其他因素影響。\n選項（2）：殖利率與既有固定票息債券價格通常反向變動。\n選項（3）：長短期利率由不同因素共同決定。\n選項（4）：長債殖利率上升通常壓低既有債券價格。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX041","topic":"貨幣政策與總體金融","q":"景氣疲弱且物價仍高，企業主管想判斷央行下一步政策。何種分析最合適？","options":["同時觀察通膨、就業、金融穩定與政策取捨","只要失業上升央行就必然降息","只要物價上漲央行就必然升息","直接用股價漲跌推定央行決策"],"answer":0,"explain":"選項（1）：政策決策涉及多重目標與權衡。\n選項（2）：就業壓力不代表一定降息。\n選項（3）：通膨壓力也須考量其他條件。\n選項（4）：股價僅是眾多經濟資訊之一。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX042","topic":"貨幣政策與總體金融","q":"存款利率從1%升到2%，但同期通膨率為3%。學生想衡量購買力變化，應採何種比較？","options":["只看存款名目利率提高一倍","比較存款報酬與物價上漲率，評估實質購買力","只看銀行公告利率不看通膨","以股票指數漲跌取代物價資料"],"answer":1,"explain":"選項（1）：名目利率上升不代表實質報酬轉正。\n選項（2）：名目存款報酬低於通膨時購買力仍可能下降。\n選項（3）：忽略通膨會高估實質收益。\n選項（4）：股票指數不是衡量一般物價的指標。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX043","topic":"金融消費保護與永續金融","q":"消費者對保險理賠有爭議，已向金融機構提出申訴，對方回覆仍不滿意。下一步最適合做什麼？","options":["直接在社群公開所有病歷資料","自行停止履行所有保單義務","確認是否符合向金融消費評議中心申請評議的期限與程序","向陌生代辦支付高額保證勝訴費"],"answer":2,"explain":"選項（1）：公開病歷可能造成個資外洩。\n選項（2）：停止履約可能衍生其他契約風險。\n選項（3）：金融消費爭議有法定申訴與評議程序。\n選項（4）：代辦保證結果不可信且可能增加成本。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX044","topic":"金融消費保護與永續金融","q":"銀行推薦複雜結構型商品給首次投資的退休長者，長者無法說明最壞情況損失。理專最適當的做法是什麼？","options":["強調其他客戶都已購買","只提供過去最好報酬","把風險揭露放在簽約後","重新確認適合度並以可理解方式揭露風險"],"answer":3,"explain":"選項（1）：其他人購買不代表商品適合該客戶。\n選項（2）：只揭露最佳績效會忽略損失風險。\n選項（3）：風險應在交易決定前充分揭露。\n選項（4）：適合度與理解能力是公平待客的重要考量。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX045","topic":"金融消費保護與永續金融","q":"一家企業發行「綠色債券」，但資金實際用途不明。投資人要評估是否符合永續投資目的，最應查什麼？","options":["募集資金用途、管理機制與後續資訊揭露","公司Logo是否使用綠色","發行公司員工制服顏色","債券是否一定提供高於市場的報酬"],"answer":0,"explain":"選項（1）：綠色債券重視募集資金用途及透明揭露。\n選項（2）：品牌顏色不是永續績效證據。\n選項（3）：制服顏色與資金用途無關。\n選項（4）：綠色標籤不保證較高報酬。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX046","topic":"金融消費保護與永續金融","q":"兩檔永續基金都標榜ESG，但甲排除高碳產業，乙投資轉型中的高碳企業。學生如何比較較合理？","options":["認定投資高碳企業就一定不屬永續策略","檢視各自投資策略、轉型指標與揭露方法","只看基金名稱有沒有ESG","以配息率高低判斷永續程度"],"answer":1,"explain":"選項（1）：轉型投資可能以改善企業表現為目標，不能單憑產業排除。\n選項（2）：不同ESG策略須依目標、指標與執行證據比較。\n選項（3）：名稱不能替代投資組合與揭露。\n選項（4）：配息率不衡量環境與社會成果。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX047","topic":"金融消費保護與永續金融","q":"學生使用先買後付服務，商家宣稱不收利息，但逾期可能有費用。哪項決策最合理？","options":["把BNPL當成收入增加","只看每期付款金額","確認總費用、逾期條件與個人還款能力","同時申請多個平台就能降低總負債"],"answer":2,"explain":"選項（1）：分期付款不會增加可支配收入。\n選項（2）：每期付款不代表總費用與違約成本。\n選項（3）：需評估到期現金流及契約責任。\n選項（4）：多平台可能使債務更難管理。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX048","topic":"金融消費保護與永續金融","q":"一家工廠申請轉型融資，承諾五年內降低排放，但缺乏可驗證的中期目標。銀行最應要求什麼？","options":["只要求企業發表環保口號","只看公司股價表現","只要求廠房外觀改善","具體減排路徑、衡量指標與定期查核機制"],"answer":3,"explain":"選項（1）：口號不能驗證實際減排成果。\n選項（2）：股價與減排成效不必然一致。\n選項（3）：外觀改善不代表碳排下降。\n選項（4）：可衡量的轉型目標與驗證是風險評估核心。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"EX049","topic":"金融消費保護與永續金融","q":"消費者發現信用報告有疑似錯誤的逾期紀錄，正準備申請房貸。何者最適當？","options":["向資料提供機構或聯徵中心依程序申請查明與更正","先向陌生業者付費刪除信用紀錄","直接重新申請十家銀行讓資料自行消失","認為信用報告不能查詢也不能申請更正"],"answer":0,"explain":"選項（1）：可依相關程序確認紀錄及提出更正申請。\n選項（2）：陌生付費刪除服務可能涉及詐騙。\n選項（3）：大量申請不能解決錯誤資料來源。\n選項（4）：信用資料有查詢與爭議處理管道。","source":"決賽進階應用延伸命題；以既有金融講義觀念設計，待官方來源逐題核對","status":"新增題目：待教師及官方資料終審","quality_review":"待逐題強化干擾選項及官方核對"},{"id":"NX001","topic":"信用與貸款","q":"甲信用卡循環年利率15%，尚欠20,000元；乙定存年利率2%，有20,000元可動用，但需保留緊急預備金。最合理的第一步是？","options":["先確認緊急預備金缺口，再評估用可動用資金減少高利循環債","因定存利率為正，所有資金都應繼續存定存","只要每月繳最低應繳額，就不必考慮循環利息","先把循環餘額轉為現金預借，以降低總成本"],"answer":0,"explain":"逐選項解析：（1）高利負債成本通常高於定存收益，但應先保留必要流動性。；（2）定存2%收益通常難抵15%循環成本，不能只看利率正負。；（3）最低應繳額不等於清償本金，可能持續計息。；（4）預借現金可能另有費用及利息，不能推定更便宜。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX002","topic":"信用與貸款","q":"學生比較兩筆同額貸款：A利率較低但收開辦費；B利率較高且免開辦費。若還款期數與攤還方式相同，應優先比較什麼？","options":["總費用年百分率及完整還款現金流","廣告標示的最低名目利率","首月帳單金額而忽略後續期數","銀行分行數量作為成本高低的唯一依據"],"answer":0,"explain":"逐選項解析：（1）總費用年百分率納入適用的相關費用，可搭配總還款額比較。；（2）名目利率未必反映開辦費等成本。；（3）首月金額不能代表整期總成本。；（4）分行數與實際借款成本沒有必然對應。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX003","topic":"信用與貸款","q":"家庭月收入固定，房貸採前兩年只繳息的寬限期。寬限期結束時，最應預先評估哪項風險？","options":["剩餘本金在較短期間攤還，月付金可能明顯增加","寬限期內繳的利息會自動轉成房屋權益","寬限期結束後銀行必須無條件降低利率","只要房價上漲，每月現金流就不會受影響"],"answer":0,"explain":"逐選項解析：（1）本金尚未明顯下降，剩餘攤還期縮短可能推高月付金。；（2）利息支出不會自動償還本金。；（3）利率依契約及市場條件，不因寬限期結束必降。；（4）房價與家庭每月還款現金流是不同問題。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX004","topic":"投資與風險","q":"投資人同時買進三檔不同名稱的臺股大型股ETF，想降低集中風險。應先檢查什麼？","options":["三檔ETF成分股及權重是否高度重疊","三檔ETF的名稱是否由不同文字組成","每檔ETF的單位淨值是否相同","交易畫面是否使用不同顏色"],"answer":0,"explain":"逐選項解析：（1）持股重疊會讓表面上的多檔投資仍集中於相同公司。；（2）基金名稱不同不保證曝險不同。；（3）淨值高低不能衡量成分股集中程度。；（4）畫面顏色與投資風險無關。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX005","topic":"投資與風險","q":"一檔債券基金持有長天期固定利率債券，市場殖利率突然上升。其他條件不變，最可能的短期影響是？","options":["基金持有債券市價下跌，且利率敏感度可能較高","因票面利息固定，基金淨值不受市場利率影響","長天期債券一定比短天期債券更抗利率上升","殖利率上升代表債券持有人立刻獲得資本利得"],"answer":0,"explain":"逐選項解析：（1）市場利率上升通常壓低既有固定利率債券價格，長存續期間更敏感。；（2）票息固定不等於市價固定。；（3）長存續期間通常承受較大價格波動。；（4）殖利率上升通常伴隨既有債券價格下跌。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX006","topic":"投資與風險","q":"投資人持有海外美元債券基金，美元資產報酬為正，但新臺幣升值。若未避險，臺幣計價報酬可能如何？","options":["換匯損失抵銷部分美元資產報酬","只要美元資產報酬為正，臺幣報酬必然相同","新臺幣升值會提高每美元可換得的臺幣","匯率只影響海外股票，不影響海外債券基金"],"answer":0,"explain":"逐選項解析：（1）美元換回臺幣時若可換得臺幣減少，可能抵銷投資收益。；（2）跨幣別投資還有匯率風險。；（3）新臺幣升值時每美元通常可換得較少臺幣。；（4）任何未避險外幣資產都可能受匯率影響。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX007","topic":"投資與風險","q":"甲基金年化報酬率8%、年化波動20%；乙報酬6%、波動7%。若投資人將風險承受度列為重要條件，最適當的說法是？","options":["不能只比報酬，還應比較波動、最大回撤與投資期限","甲報酬較高，因此必然適合所有投資人","乙波動較低，表示本金受到政府保證","只要投資期超過一年，兩檔基金風險就相同"],"answer":0,"explain":"逐選項解析：（1）風險承受度涉及損失能力、波動與投資期間等多面向。；（2）較高報酬不代表適合所有人。；（3）波動較低不等於保本或政府保證。；（4）投資期間不能消除商品本身風險差異。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX008","topic":"保險與保障","q":"家庭主要收入者有房貸與扶養責任，預算有限。評估壽險保障額度時最適合納入哪組因素？","options":["剩餘負債、扶養生活費、現有資產及既有保障","只看朋友投保的保額，避免自己買太少","只看保單首年保費，保額不必計算","只看投保人的年齡，忽略家庭負擔"],"answer":0,"explain":"逐選項解析：（1）保障需求應扣合家庭財務責任與可運用資源。；（2）他人家庭條件不同，不能直接照抄。；（3）保費負擔重要，但不足以決定保障缺口。；（4）年齡只是因素之一，無法替代家庭需求分析。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX009","topic":"保險與保障","q":"投保住院醫療實支實付保險後，因住院購買非必要的昂貴用品。是否能理賠，最合理的判斷依據是？","options":["檢視保單條款、必要性、費用項目及理賠文件","只要有醫院收據，所有消費必定全額理賠","只要住院超過一天，任何用品都算醫療費","醫療險與費用項目無關，完全依保戶自行認定"],"answer":0,"explain":"逐選項解析：（1）理賠依契約承保範圍、限額與相關證明認定。；（2）收據存在不代表屬於承保費用。；（3）住院天數不會使所有消費自動成為醫療費。；（4）理賠依契約與事實，非單方認定。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX010","topic":"保險與保障","q":"一位投保人收到保險公司要求補充健康告知資料的通知，最適當的處理方式是？","options":["依實際情況完整說明，並留存往來紀錄","為避免加費，只提供對自己有利的部分","請業務員代為填寫不確定的病史而不確認","認為健康告知與日後理賠完全無關"],"answer":0,"explain":"逐選項解析：（1）如實告知有助於契約風險評估並降低爭議。；（2）選擇性隱瞞可能產生告知義務爭議。；（3）本人仍應確認申報內容真實正確。；（4）重要告知事項可能影響契約效力及理賠。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX011","topic":"金融防詐","q":"學生收到「金融監管單位」簡訊，要求點擊短網址輸入網銀密碼以免帳戶凍結。最適當的處理是？","options":["不點連結，改用金融機構官方管道查證","先輸入帳號密碼，再致電客服確認","將簡訊轉給朋友，請朋友也登入測試","因簡訊提及監管單位，直接視為官方通知"],"answer":0,"explain":"逐選項解析：（1）可疑短網址及索取密碼屬高度警訊，應使用獨立官方管道。；（2）先輸入憑證可能造成帳戶遭盜用。；（3）轉傳可疑連結可能擴大風險。；（4）冒用官方名義是常見詐騙手法。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX012","topic":"金融防詐","q":"朋友要求借用帳戶收取「代購款」，並答應每筆給佣金。最應注意的風險是？","options":["可能成為詐騙金流或洗錢的中介帳戶","只要佣金金額不高，就不存在任何法律風險","款項由朋友匯入，帳戶持有人不必查明用途","有轉帳紀錄就能證明所有資金均合法"],"answer":0,"explain":"逐選項解析：（1）借用帳戶收款可能涉入不法金流，應拒絕不明用途。；（2）風險不以佣金多寡作為唯一判斷。；（3）帳戶使用與資金來源仍需謹慎。；（4）有交易紀錄不等於交易合法。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX013","topic":"金融防詐","q":"投資群組宣稱「保證每月獲利3%，虧損由老師賠」，並要求匯入私人帳戶。何者最合理？","options":["先停止匯款並查核業者資格、商品與金流去向","因承諾賠損，等同銀行存款保障","只要群組有人貼獲利截圖，就可確認績效真實","先小額匯款測試，若獲利再加碼即可排除詐騙"],"answer":0,"explain":"逐選項解析：（1）保證高報酬與私人帳戶收款是重要警訊。；（2）口頭賠損承諾不是存款保險。；（3）截圖容易偽造，無法驗證真實績效。；（4）小額試投仍可能造成個資與資金風險。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX014","topic":"洗錢防制","q":"銀行對長期小額交易客戶發現突然有多筆來源不明的大額匯款。最適當的風險管理方式是？","options":["依風險基礎方法進一步了解交易目的及資金來源","因客戶已有帳戶，後續交易均無需監控","只要匯款分成多筆，就不需要進一步了解","立即向所有其他客戶公開其交易資料"],"answer":0,"explain":"逐選項解析：（1）持續審查需留意交易與客戶既有輪廓是否相符。；（2）開戶完成不代表停止持續監控。；（3）分拆交易可能反而是異常指標。；（4）客戶資料應依法保密，不得任意公開。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX015","topic":"金融消費保護","q":"理專向保守型高齡客戶推介高波動複雜商品，僅強調過往高報酬。最重要的改善是？","options":["確認適合度、充分揭露風險並讓客戶理解","只要客戶簽名，無須再解釋風險","用過往最高報酬取代可能損失的說明","將商品改稱「退休專案」即可降低風險"],"answer":0,"explain":"逐選項解析：（1）商品適合度及充分說明是重要金融消費保護要求。；（2）簽名不代表可以省略適當說明。；（3）歷史最高績效無法代表未來及下跌風險。；（4）名稱改變不會改變商品風險特性。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX016","topic":"金融消費保護","q":"消費者與銀行對信用卡費用有爭議，已向銀行申訴但未獲滿意處理。下一步最適當的是？","options":["保存帳單與申訴紀錄，依適用程序尋求金融消費爭議處理","直接在社群公開銀行員個資迫使處理","認為金融消費爭議只能由銀行單方面決定","立即停止所有信用卡付款而不處理爭議款項"],"answer":0,"explain":"逐選項解析：（1）應保存證據並依金融消費爭議處理機制辦理。；（2）公開個資可能侵害他人權益且不利爭議解決。；（3）金融消費者有法定申訴與爭議處理途徑。；（4）任意停止付款可能產生額外費用與信用影響。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX017","topic":"數位金融","q":"使用者發現手機遺失且內有已登入的行動銀行App。最適當的優先措施是？","options":["立即透過官方管道停用或保護帳戶並變更相關憑證","等待一週觀察有無異常交易再處理","因手機設有螢幕鎖，就無須通報銀行","在社群發布網銀帳號請網友協助查詢"],"answer":0,"explain":"逐選項解析：（1）應及時採取帳戶保護、裝置停用與密碼更新措施。；（2）延後處理可能增加未授權交易風險。；（3）螢幕鎖不能取代帳戶保護措施。；（4）公開帳號與個資會增加風險。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX018","topic":"數位金融","q":"兩步驟驗證已啟用，卻收到非本人發起的登入核准通知。何者最適當？","options":["拒絕核准並檢查帳戶安全設定與登入紀錄","按下同意，避免帳戶被暫停","把一次性驗證碼告訴來電的自稱客服人員","因已啟用雙重驗證，就不可能有任何風險"],"answer":0,"explain":"逐選項解析：（1）未授權請求應拒絕，並檢查是否有密碼外洩。；（2）核准陌生請求可能讓攻擊者登入。；（3）驗證碼不應提供給不明來電者。；（4）雙重驗證降低風險但非絕對保證。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX019","topic":"退休規劃","q":"退休者每月支出固定，但退休金大多放在高波動股票。為降低短期被迫賣出的風險，何者較合理？","options":["配置可支付近期生活費的低波動流動資產","因長期股票報酬可能較高，完全不留現金","退休後所有資產都應轉為單一長天期債券","將每月生活費改用信用卡循環支應"],"answer":0,"explain":"逐選項解析：（1）預留短期支出資金可降低市場下跌時被迫出售風險。；（2）沒有流動資金會提高順序報酬風險。；（3）單一長天期債券仍有利率及集中風險。；（4）循環信用可能增加利息負擔。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX020","topic":"退休規劃","q":"65歲退休者希望每月有穩定現金流，但也擔心長壽與通膨。評估年金商品時應同時注意什麼？","options":["給付期間、通膨侵蝕、費用及流動性限制","只比較第一個月領到的金額","只看商品名稱是否包含「終身」二字","認為固定金額給付能完全消除購買力下降風險"],"answer":0,"explain":"逐選項解析：（1）年金規劃應同時考慮給付條件、實質購買力與可動用性。；（2）首月金額不足以比較長期利益。；（3）商品名稱不能替代契約條款。；（4）固定名目給付可能遭通膨侵蝕。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX021","topic":"信託與高齡金融","q":"長者希望保留財產所有權安排，並依條件定期支付照護費用。評估信託方案時最重要的是？","options":["明確約定信託目的、受益人、給付條件與管理權限","只要設立信託，就能保證所有投資永不虧損","將所有財產交給任何熟人保管即可視為正式信託","信託成立後不必再檢視照護需求與給付安排"],"answer":0,"explain":"逐選項解析：（1）信託功能仰賴契約設計與受託管理安排。；（2）信託不等於投資保本。；（3）非正式保管與法律上信託安排不同。；（4）照護需求可能變化，應依契約及情況檢視。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX022","topic":"信託與高齡金融","q":"長者考慮以房養老，想比較可貸金額及未來遺產安排。何者最適當？","options":["檢視利率、給付方式、房屋估值及到期清償條件","只看廣告每月最高可領金額","認為房價不會變動，因此不必評估抵押風險","只要簽約，所有繼承人一定不受影響"],"answer":0,"explain":"逐選項解析：（1）應評估契約現金流、成本、抵押及繼承影響。；（2）最高給付額未必適用個人條件。；（3）房價及利率可能變動。；（4）抵押權與債務清償可能影響遺產。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX023","topic":"永續金融","q":"企業發行標榜「綠色」的債券，但募集資金用途說明模糊。投資人應優先查核什麼？","options":["募集資金用途、評估標準與後續揭露機制","只要債券名稱有綠色字樣就視為符合標準","只看發行企業的商標是否為綠色","只看票面利率，永續用途不必驗證"],"answer":0,"explain":"逐選項解析：（1）永續債券需查核用途、標準及資訊揭露以降低漂綠風險。；（2）名稱不能取代實質驗證。；（3）視覺識別與永續績效無關。；（4）若投資目的包含永續性，應核對資金用途。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX024","topic":"貨幣政策","q":"中央銀行升息後，某企業仍需大量借新債，且營收成長放緩。最值得優先評估哪個風險？","options":["融資成本上升及償債現金流壓力","升息會讓所有企業的借款利率立即歸零","只要企業營收成長放緩，負債本金會自動減少","央行升息只影響家庭存款，與企業融資無關"],"answer":0,"explain":"逐選項解析：（1）利率上升可能提高新借款成本，需評估現金流覆蓋。；（2）升息通常不會使借款利率歸零。；（3）營收變化不會自動減少負債本金。；（4）企業借款成本也可能受政策與市場利率影響。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX025","topic":"貨幣政策","q":"國際油價上漲引發物價上升，但國內需求疲弱。判斷貨幣政策時，何者較合理？","options":["同時衡量通膨來源、預期、就業與成長風險","因物價上漲，升息一定能直接增加原油供給","因需求疲弱，降息必定讓進口能源價格下跌","只看單月物價數字即可確定最適政策"],"answer":0,"explain":"逐選項解析：（1）供給衝擊下政策需權衡通膨與經濟活動。；（2）升息不能直接增加全球原油供給。；（3）降息不保證能源進口價格下跌。；（4）單月數據不足以全面判斷政策。","source":"2026金融決賽延伸情境命題；依通用金融原理撰寫，待逐題核對主管機關資料","status":"新增題目：待官方資料與教師終審","quality_review":"已撰寫四選項個別解析；待法規與時效性檢核"},{"id":"NX026","topic":"金融計算","q":"學生將12萬元分別存入A銀行年利率1.8%按單利計算，或B銀行年利率1.7%按年複利計算，均存2年且不計稅費。哪項比較正確？","options":["A期末124,320元，B約124,115元，A較高","B採複利，因此2年後必定超過A","A期末124,320元，B期末124,320元","兩者期末本金都不會增加"],"answer":0,"explain":"逐選項解析：（1）A單利利息120,000×1.8%×2＝4,320元；B為120,000×1.017²＝124,114.68元。；（2）複利並不保證勝過較高利率；應比較實際期間及利率。；（3）B期末約124,115元，不等於A的124,320元。；（4）兩者利率皆為正且假設正常給息，期末金額會增加。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX027","topic":"貸款成本","q":"兩筆10萬元、1年期一次還本貸款：甲年利率5%、開辦費500元；乙年利率4.5%、開辦費1,500元。忽略其他費用，哪項正確？","options":["乙名目利率低，總成本一定低","甲總費用5,500元，低於乙6,000元","甲利息5,000元，因此總成本5,000元","乙總成本4,500元，因開辦費不算借款成本"],"answer":1,"explain":"逐選項解析：（1）乙利息4,500元加費用1,500元，共6,000元，高於甲。；（2）甲5,000＋500＝5,500元；乙4,500＋1,500＝6,000元。；（3）甲還有500元開辦費，不能只計利息。；（4）乙開辦費屬取得貸款的成本，不能忽略。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX028","topic":"債券投資","q":"甲乙兩債券信用評等及殖利率相近，但甲存續期間2年、乙存續期間8年。若市場殖利率同時上升0.5個百分點，其他條件不變，哪項較合理？","options":["乙價格通常較敏感、跌幅可能較大","甲存續期間短，價格跌幅必然較大","兩債券信用評等相同，價格變動必相同","殖利率上升時兩者價格必同幅上漲"],"answer":0,"explain":"逐選項解析：（1）存續期間較長通常對利率變動更敏感；這是近似比較，仍受凸性等因素影響。；（2）較短存續期間一般代表較低利率敏感度。；（3）信用評等反映信用風險，不決定利率敏感度相同。；（4）固定收益債券市場殖利率上升，既有債券價格一般下降。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX029","topic":"資產配置","q":"小芸明年要繳20萬元學費，手上有25萬元，且尚未建立緊急預備金。她想全部買入高波動股票。哪項做法較適當？","options":["先將確定用途的學費保留在低波動且可動用工具，再規劃其餘資金","只要股票長期向上，一年內繳費就沒有風險","改買單一熱門科技股，可降低學費不足風險","用信用卡預借現金補足學費，再持續持有股票"],"answer":0,"explain":"逐選項解析：（1）短期確定支出重視本金波動與流動性，剩餘資金才評估風險承受度。；（2）股票短期可能下跌，長期報酬預期不能保證一年內資金足夠。；（3）集中單一股票增加非系統性風險。；（4）預借現金增加利息與還款壓力，不是降低風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX030","topic":"基金費用","q":"兩檔同類型基金預期投資內容相近：甲申購費0%、年費用率1.6%；乙申購費1%、年費用率0.6%。預計持有10年，何者較合理？","options":["只比較申購費，甲必定划算","比較長期持有的累積費用及投資差異，乙可能較省","只要基金配息高，費用率不影響報酬","乙申購費較高，任何持有期間都較貴"],"answer":1,"explain":"逐選項解析：（1）長期費用率可能累積成顯著差距，不能只看一次性申購費。；（2）長期持有時較低的持續費用可能抵銷初始費用，但仍應比較績效及其他條件。；（3）費用會減少淨報酬，配息並不消除費用。；（4）持有期間不同，總成本比較可能改變。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX031","topic":"外匯風險","q":"台灣進口商3個月後須支付10萬美元貨款，擔心新臺幣貶值增加成本。哪項管理方式較切合需求？","options":["評估遠期外匯或其他適當避險工具鎖定部分匯率","將美元應付款全部視為新臺幣固定成本","新臺幣貶值時美元貨款的新臺幣成本會下降","不需預測現金流，只要等付款日再決定"],"answer":0,"explain":"逐選項解析：（1）進口商有美元支付需求，適當避險可降低未來換匯成本的不確定性。；（2）外幣應付款以新臺幣衡量的成本會隨匯率變動。；（3）新臺幣貶值通常意味每美元需要更多新臺幣。；（4）預先盤點支付日期與金額有助管理風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX032","topic":"金融防詐","q":"有人假冒銀行發送『帳戶異常』訊息，要求點短網址輸入網銀密碼與一次性驗證碼。哪項做法較妥當？","options":["先在訊息頁面登入，若失敗再聯絡銀行","不點連結，改用官方App或自行查得的客服管道查證","將驗證碼傳給對方，但不要提供身分證號","請對方先傳員工證照片，便可安全交付密碼"],"answer":1,"explain":"逐選項解析：（1）釣魚頁面可能在第一次輸入時即竊取憑證。；（2）透過獨立取得的官方管道查證可避免被偽冒連結導向。；（3）一次性驗證碼同樣屬敏感認證資訊。；（4）員工證影像可被偽造，不構成提供密碼的理由。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX033","topic":"洗錢防制","q":"新開戶公司由甲持股60%，甲聲稱僅代海外人士乙持股且乙實際控制資金，卻拒絕提供乙資料。銀行最合理的處理是？","options":["只登記甲，因股權文件已足夠","確認實質受益人及控制關係，無法完成審查時依規定處理","讓甲口頭承諾無違法用途即可","因公司有營業登記，直接跳過身分審查"],"answer":1,"explain":"逐選項解析：（1）股權登記人不一定就是實質控制者。；（2）金融機構應辨識實質受益人並依風險及法規執行審查。；（3）口頭保證不能取代必要的身分及控制關係查核。；（4）公司登記不免除客戶審查義務。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX034","topic":"保險規劃","q":"家庭主要收入者有兩名未成年子女、房貸餘額600萬元，已有醫療險但壽險保障不足。哪項優先順序較合理？","options":["先估算身故後家庭生活及債務缺口，再評估定期壽險等保障","因已有醫療險，身故後家人收入缺口也已保障","先買高保費儲蓄型商品，不需評估保障額度","只要房屋有市價，家人就不會有現金流風險"],"answer":0,"explain":"逐選項解析：（1）壽險需求應由負債、扶養與現有資產及保障缺口估算。；（2）醫療險主要處理符合條款的醫療風險，與身故保障不同。；（3）未先盤點缺口可能使保費排擠必要保障。；（4）房產不等於可即時支應生活的現金。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX035","topic":"實支實付","q":"保戶住院花費12萬元，其中部分醫材不在保單給付範圍，且每次住院雜費上限8萬元。哪項說法正確？","options":["只要拿到12萬元收據，就一定能理賠12萬元","應按條款確認給付項目、限額、自負額及其他約定","保單有『實支實付』四字就不受限額影響","醫院開立收據後，保險公司不得審核條款"],"answer":1,"explain":"逐選項解析：（1）實際支出不等於全部都屬承保項目，也可能超過限額。；（2）給付須依保單約定及必要文件核定。；（3）實支實付仍有承保範圍與金額限制。；（4）保險公司仍須依契約審查理賠。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX036","topic":"金融消費爭議","q":"消費者主張銀行未充分揭露複雜商品風險，已向銀行正式申訴並保留契約與錄音資料。若對處理結果不滿，下一步何者較合理？","options":["保存往來紀錄並依適用制度向金融消費評議中心申請評議","直接刪除交易紀錄，避免影響申訴","只在社群留言即可取代正式程序","因已簽名，任何爭議均無法再提出"],"answer":0,"explain":"逐選項解析：（1）符合受理條件時可循金融消費爭議處理程序，證據有助釐清。；（2）刪除紀錄會降低可供查核的證據。；（3）社群留言不等於正式爭議處理程序。；（4）簽名不排除針對說明義務或交易爭議提出主張。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX037","topic":"信託規劃","q":"家長希望在身故後讓未成年子女按月取得生活費、學費依需要撥付，避免一次領取大筆資產。哪項安排較切合？","options":["評估設定具有給付條件與管理機制的信託","把所有資產直接交給任何一位親友且不設限制","將資金全部改買單一股票，便可按月穩定給付","只在口頭上交代子女節省支出即可"],"answer":0,"explain":"逐選項解析：（1）信託可依契約設計管理、給付對象及條件，仍須評估成本與適法性。；（2）未設定正式管理機制，較難落實指定用途與監督。；（3）單一股票存在價格波動，無法保證固定生活費。；（4）口頭交代通常不足以形成可執行的財產管理安排。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX038","topic":"退休規劃","q":"退休者每月必要支出5萬元、穩定退休收入3.2萬元，另有現金216萬元。忽略通膨與利息，現金可補足收支缺口多久？","options":["約8年","約10年","約12年","約15年"],"answer":1,"explain":"逐選項解析：（1）每月缺口1.8萬元，216萬元可支應120個月，即10年。；（2）216萬÷(5萬－3.2萬)＝120個月，等於10年。；（3）12年需約259.2萬元，超過現有216萬元。；（4）15年需約324萬元，超過現有216萬元。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX039","topic":"房貸風險","q":"房貸前兩年只繳利息，寬限期後開始攤還本金。借款人收入未增加，哪項風險最需事前評估？","options":["寬限期後月付金可能上升，應以完整還款期做壓力測試","只繳利息代表本金已逐月減少","寬限期結束後利率必然降至零","只要房價上漲，月付金就不會增加"],"answer":0,"explain":"逐選項解析：（1）本金未於寬限期攤還，後續攤還期較短，月付可能明顯增加。；（2）只繳息通常不會降低本金餘額。；（3）寬限期與市場利率變動是不同事項。；（4）房價變動不直接消除契約還款義務。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX040","topic":"股票交易","q":"小方以每股80元買入1,000股股票，再以81元賣出。買賣手續費各0.1425%，賣出證交稅0.3%，忽略最低收費及折扣。最接近的稅費後損益？","options":["約賺529元","約賺1,000元","約賺757元","約賺-243元"],"answer":0,"explain":"逐選項解析：（1）價差1,000元，手續費約114＋115.425元，賣出稅243元，淨利約527.575元，最接近529元。；（2）1,000元是未扣稅費價差。；（3）757元僅扣證交稅，未扣雙邊手續費。；（4）約243元是證交稅額，不是淨損益。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX041","topic":"數位帳戶","q":"數位帳戶廣告年利率3%，但只適用前5萬元且需每月完成指定任務；超額部分利率0.5%。學生存入15萬元時，何項判斷最合理？","options":["全部15萬元都適用3%，因廣告標示最高利率","應分別計算適用額度、任務條件與超額利率","只要是數位帳戶，就免除所有存款風險","利率愈高，資金流動性一定愈好"],"answer":1,"explain":"逐選項解析：（1）高利率可能僅適用特定額度與條件。；（2）分段計息與條件是否達成決定實際利息。；（3）數位化不代表所有金融風險消失。；（4）利率高低不直接代表提領限制或流動性優劣。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX042","topic":"貨幣政策","q":"中央銀行升息後，某家庭持有機動利率房貸，另有長期固定票息債券基金。若其他條件不變，哪項組合風險較合理？","options":["房貸利息負擔可能增加，債券基金淨值可能承壓","房貸利息必降，債券價格必漲","房貸本金立即歸零，債券基金無波動","升息只影響股票，與貸款及債券無關"],"answer":0,"explain":"逐選項解析：（1）機動房貸可能隨參考利率調整；市場殖利率上升通常壓抑既有固定票息債券價格。；（2）方向通常相反，但仍視契約與市場而定。；（3）升息不會自動免除本金，也不會消除基金價格風險。；（4）利率變動可透過貸款及債券市場傳導。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX043","topic":"通膨與儲蓄","q":"定存年利率2%，同年物價上漲3%。忽略稅費，實質購買力變化最接近何者？","options":["約增加1%","約減少1%","約增加5%","完全不變"],"answer":1,"explain":"逐選項解析：（1）名目收益2%低於通膨3%，購買力不會增加。；（2）實質報酬約1.02／1.03－1＝−0.97%，接近減少1%。；（3）不能把名目利率與通膨率直接相加當實質報酬。；（4）名目本金增加不代表實質購買力不變。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX044","topic":"永續金融","q":"甲企業公開完整排放基準、減碳路徑與第三方查證；乙只宣稱『碳中和』，未說明邊界與抵換方式。投資人應優先採取何種判斷？","options":["比較揭露範圍、減量績效與查證品質，警惕漂綠","乙口號較簡潔，因此風險一定較低","只看企業商標是否有綠色即可判斷","甲有查證就代表投資報酬必然為正"],"answer":0,"explain":"逐選項解析：（1）可查核的排放邊界、基準與績效較能支持永續主張。；（2）缺乏資訊不能因口號而推定較低風險。；（3）視覺設計無法取代永續資訊揭露。；（4）環境資訊較完整不代表沒有市場或信用風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX045","topic":"支付安全","q":"學生手機遺失，內有已登入的支付App及綁定信用卡。哪組行動最能降低損失？","options":["立即遠端鎖定裝置、通知支付業者及發卡機構，檢查交易紀錄","等到下一期帳單出現再處理","只更換社群網站密碼，不需處理支付工具","直接在公開社群貼出卡號請大家幫忙尋找"],"answer":0,"explain":"逐選項解析：（1）快速阻斷裝置與支付權限並檢查交易，有助降低後續未授權使用風險。；（2）等待可能延誤停用及爭議處理。；（3）社群密碼與支付工具權限不同。；（4）公開卡號反而增加資訊外洩風險。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX046","topic":"保險等待期","q":"投保某醫療險後第10天因一般疾病住院，保單約定該疾病等待期30天且無例外。何項判斷較適當？","options":["只要住院就必然理賠，不必看生效日","應依契約等待期及除外約定判斷，可能不符給付條件","等待期只影響保費，不影響理賠","業務員口頭承諾可自動取代保單所有條款"],"answer":1,"explain":"逐選項解析：（1）理賠需檢視契約承保及等待期條件。；（2）題設疾病發生於30天等待期內，依約可能不符給付條件。；（3）等待期與特定事故是否可理賠有關。；（4）口頭說明與契約不一致時仍須釐清證據及適用規範。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX047","topic":"投資槓桿","q":"學生以自有資金10萬元，再借10萬元買入20萬元股票。股價下跌20%且不計費用，股票市值及淨資產各約多少？","options":["市值16萬元，扣借款後淨資產6萬元","市值18萬元，淨資產8萬元","市值16萬元，淨資產16萬元","市值20萬元，淨資產10萬元"],"answer":0,"explain":"逐選項解析：（1）20萬×80%＝16萬，扣借款10萬後淨資產6萬，原10萬自有資金損失40%。；（2）跌20%後市值為16萬，不是18萬。；（3）仍須償還10萬借款，不能把全部市值當淨資產。；（4）股價下跌使持股市值減少，不會維持20萬。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX048","topic":"信用卡循環","q":"持卡人只繳最低應繳金額，剩餘帳款持續循環計息。哪項決策最有助降低長期負擔？","options":["評估利率及費用，優先減少高成本循環餘額","持續只繳最低金額，總利息一定最低","增加信用卡張數即可抵銷循環利息","只要每月刷卡回饋高，循環利息可忽略"],"answer":0,"explain":"逐選項解析：（1）高利率循環餘額長期累積可能使總成本增加，應盤點現金流及還款。；（2）最低應繳不代表最小總利息支出。；（3）卡片數量增加不會直接抵銷既有債務利息。；（4）回饋通常不能合理化持續支付高額循環利息。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX049","topic":"投資型保單","q":"理專推薦投資型保單，僅強調『預估年報酬8%』，未說明保險成本、投資風險及提前解約費用。消費者最應要求什麼？","options":["提供完整費用、保障內容、投資風險與不利情境說明","將預估報酬視為保證收益，直接簽約","只比較首期保費，不必考慮後續扣費","認為有壽險名稱便可排除市場風險"],"answer":0,"explain":"逐選項解析：（1）投資型保單同時涉及保障與投資，應了解扣費、保障及可能損失。；（2）預估報酬不等於契約保證。；（3）後續扣費與解約成本可能影響保單價值。；（4）投資帳戶價值仍可能受市場波動影響。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"id":"NX050","topic":"就學貸款","q":"大學生畢業後暫無固定收入，收到就學貸款還款通知。哪項處理較適當？","options":["主動向承貸銀行查詢適用的緩繳、展延或其他協助條件","忽略通知，因為學生貸款不需償還","直接向不明網路代辦提供網銀密碼求協助","只要申請過就學貸款，利息及本金永遠免繳"],"answer":0,"explain":"逐選項解析：（1）應依個別資格、契約與當時制度向正式承貸機構確認可用協助。；（2）就學貸款通常仍有契約還款義務。；（3）不明代辦索取認證資訊可能涉及詐騙。；（4）補助及緩繳均有條件，不能推定永久免還。。","source":"金融決賽進階情境自編；待依官方資料逐題核對","status":"新增題目：待官方資料與教師終審","quality_review":"四選項逐一分析；待正式核對"},{"topic":"實質利率","q":"銀行一年定存名目利率4%，同期間物價上漲6%。若不計稅費，10萬元的期末實質購買力變化約為何？","options":["增加2%","減少1.89%","減少6%","增加4%"],"answer":1,"explain":"逐選項解析：（1）名目利率低於通膨，購買力不是增加。；（2）實質報酬=1.04/1.06−1≈−1.89%。；（3）6%是通膨率，未扣除4%的名目收益。；（4）4%是名目利率，非實質報酬。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX051"},{"topic":"機會成本","q":"學生已有足夠生活費，想花3萬元買平板；同額資金也可用於必修證照課程。評估購買平板的機會成本應如何理解？","options":["平板的售價加上證照課程費用","放棄的最佳替代方案所帶來的淨效益","所有沒選的方案價值總和","只計算購物當天的交通費"],"answer":1,"explain":"逐選項解析：（1）機會成本不是把兩個互斥支出加總。；（2）機會成本是放棄的最佳替代選擇價值。；（3）不會將所有未選方案全部加總。；（4）交通費可能是顯性成本，但不代表機會成本。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX052"},{"topic":"信用風險","q":"甲公司債殖利率5%，乙同期限公債3%，兩者幣別相同。哪項說明最審慎？","options":["甲多2%代表保證多賺2%","甲可能含信用與流動性風險溢酬","甲債券價格不會波動","乙公債必定完全沒有任何風險"],"answer":1,"explain":"逐選項解析：（1）殖利率較高可能伴隨違約或價格風險。；（2）信用及流動性差異可能反映在利差。；（3）公司債同樣會隨利率及信用評估波動。；（4）公債仍可能有利率及通膨風險。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX053"},{"topic":"股利與除息","q":"某股票除息前收盤100元，每股現金股利5元，假設除息參考價為95元且不考慮其他變動。投資人持有1股時，哪項判斷合理？","options":["收到5元就必然新增5元財富","參考價調整後股票價值加現金約仍為100元","除息參考價應為105元","現金股利是公司額外憑空創造的資產"],"answer":1,"explain":"逐選項解析：（1）股利發放同時伴隨公司資產流出及參考價調整。；（2）95元股票加5元現金，簡化下約100元。；（3）現金除息參考價一般扣除股利。；（4）股利來自公司資產分配，並非憑空創造。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX054"},{"topic":"ETF追蹤誤差","q":"兩檔ETF追蹤同一指數，甲年度報酬8.0%，乙7.2%，指數8.1%，忽略配息差異。單看該年度追蹤差距，何者較小？","options":["甲差0.1個百分點","乙差0.1個百分點","兩者都差0.9個百分點","乙報酬較低，因此一定有較小追蹤差距"],"answer":0,"explain":"逐選項解析：（1）甲與指數差|8.0−8.1|=0.1個百分點。；（2）乙與指數差0.9個百分點。；（3）甲差0.1、乙差0.9，並非相同。；（4）報酬低不代表更貼近指數。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX055"},{"topic":"交易成本","q":"股票買進金額20萬元、賣出21萬元，買賣手續費各按成交額0.1%，賣出證交稅0.3%。忽略其他成本，淨獲利為何？","options":["10,000元","8,960元","9,370元","8,750元"],"answer":1,"explain":"逐選項解析：（1）10,000元是未扣成本價差。；（2）成本=200+210+630=1,040，淨利=8,960元。；（3）9,370元只扣賣出證交稅，漏雙邊手續費。；（4）8,750元與題設費率計算不符。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX056"},{"topic":"分散風險","q":"甲投資人持有台灣大型科技股ETF與另一檔同樣高度集中科技股的ETF。哪項判斷最合理？","options":["ETF數量變多就必然分散產業風險","應檢視持股重疊與產業集中度","兩檔不同投信ETF不可能持有相同股票","只要一檔有配息即可抵銷另一檔跌幅"],"answer":1,"explain":"逐選項解析：（1）標的高度重疊時，分散效果有限。；（2）應檢視實際持股、產業及風險因子。；（3）不同發行人可能追蹤類似指數。；（4）配息不等於風險對沖。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX057"},{"topic":"存款保險","q":"某人將500萬元全部放在同一家銀行的兩個不同分行，並認為可按分行分別計算存保額度。哪項說法較正確？","options":["按每個分行各自計算保障上限","通常按同一存款人在同一家要保機構的存款合併計算","同一家銀行開越多帳戶保障額度越高","只要是銀行銷售的基金也計入存款保險"],"answer":1,"explain":"逐選項解析：（1）分行不是獨立要保機構。；（2）存款保險一般以同一存款人在同一要保機構合併計算，並受法定上限約束。；（3）帳戶數不會改變同一機構的合併原則。；（4）基金不屬受保障的存款。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX058"},{"topic":"APR","q":"A信用貸款名目利率4%，另收開辦費；B名目利率4.3%，免開辦費。比較同額同期間的借款，最應看哪項？","options":["只看名目利率，A一定便宜","比較總費用年百分率及還款現金流","只看每月最低應繳金額","只比較銀行廣告的最低利率"],"answer":1,"explain":"逐選項解析：（1）名目利率未包含開辦費等借款成本。；（2）總費用年百分率有助在相同假設下比較費用。；（3）最低月付可能隱藏還款期間及總成本差異。；（4）廣告最低利率不一定適用每位借款人。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX059"},{"topic":"循環信用","q":"持卡人欠款6萬元，年循環利率15%，簡化按單利計算，若整筆餘額持續30天且以365天計息，利息約多少？","options":["約740元","約123元","約9,000元","約2,500元"],"answer":0,"explain":"逐選項解析：（1）60,000×15%×30/365≈739.73元。；（2）約123元是過低估計，與30天利息不符。；（3）9,000元是整年利息，非30天。；（4）2,500元超出題設簡化計息結果。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX060"},{"topic":"房貸寬限期","q":"兩筆同額房貸利率相同，甲一開始本息攤還，乙前3年只繳息且總貸款年限相同。哪項較可能發生？","options":["乙寬限期後每月本金攤還壓力較高","乙在寬限期內本金下降得更快","甲的本金在前3年完全不減少","乙的總利息必定比甲少"],"answer":0,"explain":"逐選項解析：（1）乙剩餘攤還年限較短且本金未減，後續月付可能較高。；（2）只繳息通常不會降低本金。；（3）本息攤還包含本金。；（4）延後償還本金一般不會降低總利息。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX061"},{"topic":"債券價格","q":"一張固定票息債券面額10萬元、票息2%，市場新發同風險債券殖利率升至4%。既有債券價格通常如何？","options":["高於面額，因舊票息較低","低於面額，以反映較低票息","必恰好等於面額","與市場殖利率完全無關"],"answer":1,"explain":"逐選項解析：（1）較低舊票息通常需折價而非溢價。；（2）市場要求較高收益率，既有低票息債券價格通常下跌。；（3）票息與市場殖利率不一致時不必等於面額。；（4）債券價格與市場利率通常反向。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX062"},{"topic":"匯率換算","q":"學生計畫赴美留學，需支付2萬美元學費。新臺幣兌美元從每美元30元變為32元，學費的新臺幣成本變化為何？","options":["減少4萬元","增加4萬元","增加2萬元","不變，因美元學費固定"],"answer":1,"explain":"逐選項解析：（1）美元變貴，新臺幣成本不會下降。；（2）20,000×(32−30)=40,000元。；（3）每美元增加2元，乘以2萬美元為4萬元。；（4）美元金額不變，但新臺幣換匯成本會變。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX063"},{"topic":"通膨風險","q":"退休者持有固定年金，每月領2萬元且不隨物價調整。若未來物價持續上漲，最主要風險是？","options":["名目給付下降","實質購買力下降","年金契約自動增加給付","固定給付不受任何經濟環境影響"],"answer":1,"explain":"逐選項解析：（1）名目金額仍為2萬元。；（2）固定名目收入在物價上漲時可購買的商品減少。；（3）題目已假設不隨物價調整。；（4）實質購買力仍受通膨影響。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX064"},{"topic":"退休提領","q":"退休者年初資產100萬元，第一年市場下跌20%且年底提領10萬元。年底資產多少？","options":["70萬元","80萬元","90萬元","72萬元"],"answer":0,"explain":"逐選項解析：（1）100萬×0.8−10萬=70萬元。；（2）80萬元尚未扣除提領。；（3）90萬元忽略市場下跌。；（4）72萬元不是題設的先跌後領計算。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX065"},{"topic":"保險免責額","q":"醫療險每次事故自負額2萬元，符合條款的醫療費用7萬元且無其他限制。保險公司給付額為何？","options":["7萬元","5萬元","2萬元","9萬元"],"answer":1,"explain":"逐選項解析：（1）自負額需由被保險人自行負擔。；（2）7萬−2萬=5萬元。；（3）2萬元是自負額，不是保險給付。；（4）理賠不會因自負額而高於符合條款的費用。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX066"},{"topic":"保險保障缺口","q":"家中主要收入者身故後，估計未來生活及教育支出700萬元、房貸300萬元，現有可用資產250萬元及壽險保額200萬元。簡化估算保障缺口多少？","options":["550萬元","750萬元","1,000萬元","250萬元"],"answer":0,"explain":"逐選項解析：（1）需求1,000萬−資產250萬−現有壽險200萬=550萬元。；（2）750萬元漏扣現有壽險保障。；（3）1,000萬元是總需求未扣資源。；（4）250萬元是現有可用資產，不是缺口。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX067"},{"topic":"投資型保單","q":"某投資型保單年初帳戶價值10萬元，投資報酬率5%，年末扣除保險成本及相關費用共3,000元，忽略其他現金流。年末帳戶價值為何？","options":["105,000元","102,000元","97,000元","108,000元"],"answer":1,"explain":"逐選項解析：（1）105,000元是扣費前價值。；（2）100,000×1.05−3,000=102,000元。；（3）97,000元忽略投資收益。；（4）108,000元把費用當成增加資產。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX068"},{"topic":"實支實付","q":"醫療保險條款規定符合條款的雜費最高給付8萬元，實際符合條款支出10萬元，且無自負額或其他限制。最多可給付多少？","options":["10萬元","8萬元","18萬元","2萬元"],"answer":1,"explain":"逐選項解析：（1）符合條款支出仍受每次限額約束。；（2）限額8萬元，因此最多8萬元。；（3）理賠不會把支出與限額相加。；（4）2萬元是超過限額的部分，非給付額。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX069"},{"topic":"風險揭露","q":"高齡客戶購買結構型商品，銀行僅口頭說明「本金可能損失」，未解釋觸發條件與流動性。哪項改善最適當？","options":["提供具體不利情境、費用與適合度說明","只加大字體即可取代所有風險說明","因客戶有存款，就免除適合度評估","只展示過去最高報酬，避免造成疑慮"],"answer":0,"explain":"逐選項解析：（1）須讓客戶理解具體損失機制及商品適合性。；（2）字體改善有助閱讀，但不能取代內容。；（3）有存款不代表適合高風險商品。；（4）最高報酬不代表可能損失範圍。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX070"},{"topic":"金融爭議","q":"消費者收到銀行對正式申訴的回覆，但對於商品風險告知仍有爭議。哪項做法較適當？","options":["保存證據並查詢金融消費評議適用程序","直接刪除契約以免洩漏個資","要求銀行先保證投資獲利再申訴","在網路匿名留言即可取代正式爭議程序"],"answer":0,"explain":"逐選項解析：（1）保存文件並循正式申訴及評議制度有助處理爭議。；（2）刪除契約會減少證據。；（3）申訴處理不等於保證投資獲利。；（4）留言不構成正式評議申請。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX071"},{"topic":"防詐辨識","q":"有人假冒檢警要求將存款轉入「監管帳戶」，並強調不得告訴家人。最適當行動為何？","options":["立即轉帳，避免帳戶遭凍結","停止操作並透過165或正式機關管道查證","先匯小額測試帳戶是否安全","提供網銀驗證碼以證明清白"],"answer":1,"explain":"逐選項解析：（1）所謂監管帳戶要求轉帳是常見詐騙話術。；（2）應中止交易並使用獨立可信管道查證。；（3）小額匯款同樣可能造成損失並暴露資訊。；（4）驗證碼不可交付不明人士。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX072"},{"topic":"帳戶安全","q":"使用者收到未申請的網銀登入驗證碼，且帳戶顯示異地登入警示。哪項處理最適當？","options":["忽略訊息，因未輸入驗證碼就必然安全","透過官方管道變更憑證、檢查交易並通報銀行","將驗證碼回覆給發送訊息的陌生人","立即把所有存款轉入訊息提供的保管帳戶"],"answer":1,"explain":"逐選項解析：（1）異常驗證與登入警示可能表示憑證遭嘗試使用。；（2）應以官方管道採取帳戶保護措施。；（3）回覆驗證碼可能讓他人完成認證。；（4）不明保管帳戶可能是詐騙收款工具。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX073"},{"topic":"洗錢防制","q":"某客戶頻繁以多筆接近申報門檻的現金交易，且交易目的與其業務規模不符。金融機構最應做什麼？","options":["只要每筆低於門檻就完全不需關注","依風險及規範審視交易模式並採取必要措施","立即向客戶保證絕不申報任何資訊","將所有款項視為正常營業收入，不需核實"],"answer":1,"explain":"逐選項解析：（1）分拆交易仍可能涉及異常交易風險。；（2）應綜合交易目的、頻率及客戶背景執行監控。；（3）金融機構不能承諾不履行法定義務。；（4）未查核前不能推定所有交易均正常。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX074"},{"topic":"實質受益人","q":"公司股權分散，但乙透過契約控制董事任免及重大決策。銀行進行客戶審查時，哪項較合理？","options":["只看最大股東，忽略其他控制方式","評估乙是否為透過其他方式控制公司的實質受益人","只查詢公司登記地址即可","公司已上市便完全免除所有審查"],"answer":1,"explain":"逐選項解析：（1）實質控制不只透過持股比例。；（2）控制權可能來自契約及其他安排，應依法辨識。；（3）登記地址不足以辨識控制關係。；（4）是否上市不代表全部客戶審查義務自動消失。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX075"},{"topic":"金融科技","q":"某支付平台宣稱用戶餘額可獲高額收益，卻未清楚說明資金保管及法律性質。消費者應優先確認什麼？","options":["平台名稱是否含「銀行」二字","業者牌照、資金性質、保障及風險揭露","App下載量是否超過百萬","宣傳影片是否由知名人士代言"],"answer":1,"explain":"逐選項解析：（1）名稱不能代替法律資格與資金保障判斷。；（2）應確認資金法律性質、監理及風險。；（3）下載量不是存款保障或獲利保證。；（4）代言不能取代正式資訊揭露。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX076"},{"topic":"個資保護","q":"學生在網路申請貸款，網站要求上傳身分證、存摺及網銀密碼。哪項判斷較合理？","options":["可先提供全部資料再確認業者身分","應先核實合法業者及必要資料範圍，拒絕交付網銀密碼","有HTTPS就保證不是詐騙","只要承諾低利率即可提供驗證碼"],"answer":1,"explain":"逐選項解析：（1）敏感憑證一旦外洩可能立即被濫用。；（2）合法申辦仍須辨識業者與最小必要資料，網銀密碼不應交付。；（3）HTTPS僅表示傳輸加密，不能保證業者可信。；（4）利率宣傳不構成索取驗證碼的正當理由。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX077"},{"topic":"資產負債","q":"小店月營收40萬元、進貨與營運支出30萬元、貸款本息支出7萬元。若下月營收下降20%，其他不變，現金流為何？","options":["盈餘3萬元","短缺5萬元","盈餘10萬元","短缺7萬元"],"answer":1,"explain":"逐選項解析：（1）原本盈餘3萬元，但營收下降後不同。；（2）營收32萬−支出30萬−還款7萬=−5萬元。；（3）10萬元未扣貸款本息且未反映營收下降。；（4）7萬元是還款額，不是現金流短缺。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX078"},{"topic":"流動性風險","q":"企業帳上持有高評等長天期債券，但兩週後需支付大筆貨款。哪項風險管理較合理？","options":["債券信用評等高就等於隨時能無損變現","評估到期日、買賣價差及出售價格波動","以票面利率推估兩週後必然售價","將債券全部改成無成交量的商品"],"answer":1,"explain":"逐選項解析：（1）高評等不保證短期出售價格穩定。；（2）短期資金需求須考量市場流動性與利率波動。；（3）票息不能決定短期市場售價。；（4）無成交量可能增加變現難度。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX079"},{"topic":"存續期間","q":"甲債券修正存續期間約5年，市場殖利率上升1個百分點，忽略凸性等因素。價格變動近似為何？","options":["上漲約5%","下跌約5%","下跌約1%","上漲約1%"],"answer":1,"explain":"逐選項解析：（1）利率上升時既有固定收益債券通常下跌。；（2）近似價格變動≈−存續期間×殖利率變動=−5%。；（3）1%是殖利率變動，非價格變動幅度。；（4）方向與幅度都不符近似關係。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX080"},{"topic":"匯率避險","q":"出口商半年後可收50萬美元，擔心新臺幣升值。若目標是降低收款換回新臺幣的不確定性，哪項工具較切合？","options":["評估賣出美元遠期契約鎖定換匯匯率","向銀行買入更多美元現貨以增加美元曝險","以新臺幣升值會增加美元收入作為假設","不確認收款日期，任意選擇遠期到期日"],"answer":0,"explain":"逐選項解析：（1）出口商未來收美元，賣出美元遠期可管理匯率風險。；（2）增加美元部位可能放大同方向曝險。；（3）新臺幣升值會使美元換回新臺幣金額減少。；（4）避險工具到期日須匹配預期現金流。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX081"},{"topic":"利率傳導","q":"中央銀行調高政策利率，但銀行某定期固定利率房貸尚未到重訂日。哪項判斷較準確？","options":["房貸利率必在當日立即提高","實際調整依契約利率型態與重訂條件","固定利率房貸本金會因此自動增加","政策利率調整不可能影響任何借款成本"],"answer":1,"explain":"逐選項解析：（1）不同契約有固定及機動利率、重訂日差異。；（2）應依貸款契約判斷利率調整時點。；（3）利率變動不等於本金自動增加。；（4）政策利率可能經市場與銀行定價傳導。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX082"},{"topic":"通貨緊縮","q":"企業因需求下降而削價，民眾預期未來價格更低而延後購買。若此預期擴大，哪項風險值得注意？","options":["可能加劇需求疲弱與債務實質負擔","所有企業獲利必定上升","名目負債金額自動減少","通縮必然立即帶來充分就業"],"answer":0,"explain":"逐選項解析：（1）延後消費可能使需求更弱，固定名目債務的實質負擔可能上升。；（2）需求疲弱及降價可能壓抑利潤。；（3）物價下降不會自動減少契約名目債務。；（4）通縮可能伴隨經濟疲弱，非充分就業保證。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX083"},{"topic":"金融政策","q":"政府發放一次性消費補助，同期中央銀行調高利率。哪項分析較合理？","options":["兩項政策都一定同方向刺激消費","財政補助可能支撐需求，升息可能抑制部分借貸與支出","升息是財政政策，補助是貨幣政策","兩項政策對不同家庭必然影響完全相同"],"answer":1,"explain":"逐選項解析：（1）補助與升息的作用方向及傳導對象可能不同。；（2）財政與貨幣政策可能產生不同方向的需求效果。；（3）升息屬貨幣政策工具，補助屬財政政策。；（4）借貸狀況及消費傾向不同，效果也可能不同。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX084"},{"topic":"綠色債券","q":"企業發行標榜「綠色」的債券，募集資金用途與後續成效卻不公開。投資人最應確認什麼？","options":["只看債券名稱是否有「綠色」","查核募集資金用途、追蹤報告及相關驗證","因為是綠色債券就免除信用風險","只看票面利率，不必看發行人財務"],"answer":1,"explain":"逐選項解析：（1）標籤不能替代用途與成效證據。；（2）用途揭露及持續報告有助評估綠色主張。；（3）綠色用途不消除違約可能。；（4）發行人償債能力仍重要。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX085"},{"topic":"轉型金融","q":"水泥廠申請轉型融資，承諾2030年排放強度降低30%，但沒有基準年及查證機制。哪項改善最關鍵？","options":["建立基準年、衡量方法、階段目標與第三方驗證","將宣傳文案改成更鮮豔的綠色","只宣稱產業很難減碳即可獲得信任","不再公開排放數據以避免外界誤解"],"answer":0,"explain":"逐選項解析：（1）可衡量且可查核的目標較有助判斷轉型可信度。；（2）設計顏色不能取代排放數據。；（3）產業困難不能取代可行的減碳路徑。；（4）不揭露會降低透明度。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX086"},{"topic":"ESG風險","q":"企業ESG評分高，但營運現金流連續兩年為負且負債快速上升。哪項投資判斷較完整？","options":["ESG評分高就可以忽略財務風險","同時評估永續表現、財務及估值風險","只看社群聲量決定是否買進","因為ESG評分高，債務不可能違約"],"answer":1,"explain":"逐選項解析：（1）永續表現不能取代財務分析。；（2）投資仍須考慮現金流、負債、估值與永續風險。；（3）聲量不是財務償債能力。；（4）ESG評分不保證無信用風險。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX087"},{"topic":"保險契約","q":"保單條款約定特定疾病等待期90天，投保後第30天確診，且沒有例外規定。何項較符合契約判斷？","options":["疾病確診就一定給付","應依等待期及條款判斷，可能不符給付條件","等待期只影響續保保費","業務員宣傳文宣可以直接取代條款"],"answer":1,"explain":"逐選項解析：（1）仍需檢視等待期與承保範圍。；（2）在題設無例外下，第30天尚未滿90天。；（3）等待期可能直接影響事故是否給付。；（4）契約及相關法規才是重要依據。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX088"},{"topic":"長照規劃","q":"家庭預估長照每月支出5萬元，已有穩定可用收入2萬元，計畫先準備3年缺口且忽略通膨。需準備多少？","options":["108萬元","180萬元","72萬元","36萬元"],"answer":0,"explain":"逐選項解析：（1）每月缺口3萬元，3年36個月，共108萬元。；（2）180萬元是全額支出，未扣可用收入。；（3）72萬元不是3萬元×36個月。；（4）36萬元僅相當於每月1萬元×36個月。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX089"},{"topic":"信託財產","q":"委託人將房屋交付適當信託管理，契約約定租金用於長者生活費。哪項理解較合理？","options":["房屋及其收益管理應依信託契約與法令處理","信託成立後受託人可不受限制任意挪用租金","信託可保證房屋價格不下跌","信託必然免除所有稅費與管理成本"],"answer":0,"explain":"逐選項解析：（1）受託人須依信託本旨及契約履行管理義務。；（2）受託人仍有法定義務，不可任意挪用。；（3）信託不消除市場價格風險。；（4）信託可能涉及稅費與管理成本。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX090"},{"topic":"繼承規劃","q":"父母希望指定子女在成年後分階段領取教育與生活資金。哪項安排較有利於落實條件？","options":["事前評估信託條款與給付條件","將全部資產交付陌生代管人且不簽契約","只在家族聚會口頭宣布即可確保執行","把全部資金投入高槓桿商品保證增值"],"answer":0,"explain":"逐選項解析：（1）可透過合適信託契約設定受益與給付安排。；（2）缺乏正式契約及監督風險較高。；（3）口頭安排可能無法有效落實財產管理。；（4）槓桿商品無法保證增值且有損失風險。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX091"},{"topic":"金融消費適合度","q":"退休者需要每月穩定現金流，卻被推薦流動性低、可能大幅損失本金的複雜商品。哪項評估最重要？","options":["只比較宣傳的最高預期收益","檢視風險承受度、資金用途與商品適合度","只因理專服務年資長就直接購買","只要商品名稱有「收益」就視為固定收入"],"answer":1,"explain":"逐選項解析：（1）最高收益不能反映可能損失與流動性。；（2）資金用途及風險承受度應與商品特性匹配。；（3）服務年資不能取代適合度審查。；（4）商品名稱不等於契約保證。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX092"},{"topic":"學生理財","q":"高中生每月收入8,000元、必要支出5,500元，希望一年存下24,000元。每月可自由運用金額還剩多少？","options":["500元","2,000元","2,500元","0元"],"answer":0,"explain":"逐選項解析：（1）每月可存2,500元，目標月存2,000元，餘500元。；（2）2,000元是每月儲蓄目標，不是剩餘自由支配額。；（3）2,500元是扣必要支出後餘額，尚未扣儲蓄。；（4）扣除儲蓄後仍有500元。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX093"},{"topic":"複利","q":"本金10萬元，年報酬率5%，按年複利兩年且無其他現金流，期末約多少？","options":["110,000元","110,250元","105,000元","115,000元"],"answer":1,"explain":"逐選項解析：（1）110,000元為兩年單利近似。；（2）100,000×1.05²=110,250元。；（3）105,000元只有一年複利。；（4）115,000元高於題設兩年複利結果。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX094"},{"topic":"年化報酬","q":"投資6個月報酬率4%，若單純以相同半年報酬複利推算全年有效報酬，約為何？","options":["8%","8.16%","4%","16%"],"answer":1,"explain":"逐選項解析：（1）8%是單純相加，未考慮第二期複利。；（2）1.04²−1=8.16%。；（3）4%是半年報酬。；（4）16%並非兩期4%複利。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX095"},{"topic":"投資風險","q":"某投資組合一年報酬率可能為+30%或−20%，兩種情況機率各50%。期望報酬率為何？","options":["5%","10%","25%","−5%"],"answer":0,"explain":"逐選項解析：（1）0.5×30%+0.5×(−20%)=5%。；（2）10%不是等機率加權平均。；（3）25%是兩報酬絕對值的平均，忽略負號。；（4）−5%與加權計算不符。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX096"},{"topic":"基金贖回","q":"基金贖回金額20萬元，契約約定贖回費率0.5%，且不計其他費用。實際入帳金額為何？","options":["200,000元","199,000元","190,000元","201,000元"],"answer":1,"explain":"逐選項解析：（1）未扣贖回費。；（2）200,000×(1−0.005)=199,000元。；（3）10,000元費用相當於5%，非0.5%。；（4）費用應扣除，不會增加入帳金額。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX097"},{"topic":"債券基金","q":"投資人認為債券基金有「固定收益」四字，因此基金淨值永遠不會下降。哪項說明較正確？","options":["基金持有債券仍受利率、信用及流動性風險影響","固定收益代表淨值每日固定","只要債券有票息，基金一定保本","債券基金與定期存款有相同存保保障"],"answer":0,"explain":"逐選項解析：（1）債券基金淨值可能隨市場殖利率及信用利差波動。；（2）票息固定不等於市價固定。；（3）票息收入不能保證基金不虧損。；（4）基金不等於受存款保險保障的存款。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX098"},{"topic":"現金流管理","q":"學生為明年畢業旅行準備6萬元，目前已有2.4萬元，剩12個月且不計利息。每月最少應再存多少？","options":["2,000元","3,000元","5,000元","3,600元"],"answer":1,"explain":"逐選項解析：（1）2,000×12只增加2.4萬元，不足目標。；（2）(60,000−24,000)/12=3,000元。；（3）5,000×12會超過所需金額。；（4）3,600元是總缺口除以10個月，非12個月。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX099"},{"topic":"企業營運資金","q":"公司應收帳款30天後收回、應付帳款15天後到期，且無其他現金。哪項資金安排最重要？","options":["確認15天資金缺口並安排短期流動性","因應收帳款金額足夠，15天內完全沒有風險","直接停止支付所有合法債務","只看損益表淨利，不必看收付款時點"],"answer":0,"explain":"逐選項解析：（1）收付款時間差可能造成短期資金缺口。；（2）應收款未入帳前仍可能有流動性壓力。；（3）不當停付可能造成違約及信用損失。；（4）獲利與現金流時點不同。。","source":"決賽延伸情境題（自編；待依官方資料核對）","quality_review":"已撰寫四選項解析；待教師及法規終審","id":"NX100"}];let exam=[],answers=[],at=0,remaining=40,tick=null,timed=false,locked=[];const $=id=>document.getElementById(id);function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function begin(){timed=$('mode').value==='timed';exam=shuffle(BANK).slice(0,20).map(x=>{let opts=shuffle(x.options.map((v,i)=>({v,i})));return {...x,options:opts.map(y=>y.v),answer:opts.findIndex(y=>y.i===x.answer)}});answers=Array(20).fill(null);locked=Array(20).fill(false);$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){clearInterval(tick);let x=exam[at];$('counter').textContent=`第 ${at+1} / ${exam.length} 題 · ${x.topic}`;$('question').textContent=x.q;document.querySelector('button[onclick="prev()"]').disabled=timed;$('options').innerHTML='';x.options.forEach((s,i)=>{let b=document.createElement('button');b.className='opt'+(answers[at]===i?' selected':'');b.textContent=`(${i+1}) ${s}`;b.disabled=locked[at];b.onclick=()=>{if(locked[at])return;answers[at]=i;locked[at]=true;renderOptions();if(!timed){let fb=document.createElement('div');fb.style.cssText='background:#eff8f1;color:#123c25;padding:14px;border-radius:12px;margin:10px 0;font-size:16px;line-height:1.6';fb.textContent=(i===x.answer?'✓ 答對！':'✗ 答錯。正確答案：'+x.options[x.answer])+'　解析：'+x.explain;$('options').appendChild(fb)}setTimeout(()=>{if(at<exam.length-1)next();else submitQuiz(true)},timed?350:4200)};$('options').appendChild(b)});if(timed){remaining=40;$('timer').textContent=`剩餘 ${remaining} 秒`;tick=setInterval(()=>{remaining--;$('timer').textContent=`剩餘 ${remaining} 秒`;if(remaining<=0){if(at<exam.length-1){locked[at]=true;next()}else submitQuiz(true)}},1000)}else $('timer').textContent='不限時'}function renderOptions(){[...$('options').children].forEach((b,i)=>b.classList.toggle('selected',answers[at]===i))}function next(){if(at<exam.length-1){at++;render()}}function prev(){if(!timed&&at>0){at--;render()}}function submitQuiz(auto=false){clearInterval(tick);if(!auto&&!confirm('確定交卷？未作答題目以錯誤計算。')){if(timed)render();return}let n=exam.reduce((s,x,i)=>s+(answers[i]===x.answer),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`成績：${n*5} 分（答對 ${n} / 20 題）`; $('reviews').innerHTML='';exam.forEach((x,i)=>{let d=document.createElement('div');d.className='review';let good=answers[i]===x.answer;let h=document.createElement('h3');h.textContent=`${i+1}. ${x.q}`;d.appendChild(h);let p=document.createElement('p');p.className=good?'correct':'wrong';p.textContent=`${good?'答對':'答錯'}｜你的答案：${answers[i]===null?'未作答':x.options[answers[i]]}｜正解：${x.options[x.answer]}`;d.appendChild(p);let e=document.createElement('p');e.textContent=`解析：${x.explain}`;d.appendChild(e);let s=document.createElement('small');s.className='muted';s.textContent=`參考講義：${x.source}${x.official?"｜官方參考："+x.official:""}`;d.appendChild(s);$('reviews').appendChild(d)})}</script></body></html>
